<style>

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  color:#263238;
  min-height:100vh;
  background:#f4f7fb;
}

/* =========================
   HEADER
========================= */

.header{

  background:
    linear-gradient(
      135deg,
      #d81b60,
      #ad1457,
      #880e4f
    );

  color:white;

  padding:12px 15px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:12px;

  box-shadow:
    0 4px 15px rgba(0,0,0,.20);

  position:sticky;

  top:0;

  z-index:1000;
}

.header-left{

  display:flex;

  align-items:center;

  gap:12px;

  min-width:0;
}

.logo{

  width:52px;

  height:52px;

  border-radius:50%;

  object-fit:cover;

  background:white;

  border:3px solid rgba(255,255,255,.8);

  flex-shrink:0;
}

.title-box{

  min-width:0;
}

.title-box h1{

  margin:0;

  font-size:19px;

  font-weight:700;
}

.title-box p{

  margin:3px 0 0;

  font-size:12px;

  opacity:.9;
}

.profile-button{

  border:0;

  background:
    rgba(255,255,255,.15);

  color:white;

  border-radius:25px;

  padding:8px 12px;

  cursor:pointer;

  display:flex;

  align-items:center;

  gap:7px;

  white-space:nowrap;
}

/* =========================
   NAV
========================= */

.top-nav{

  display:flex;

  gap:8px;

  padding:10px;

  background:white;

  box-shadow:
    0 2px 8px rgba(0,0,0,.08);

  position:sticky;

  top:76px;

  z-index:900;

  overflow-x:auto;
}

.nav-btn{

  border:0;

  padding:9px 13px;

  border-radius:20px;

  background:#f1f5f9;

  color:#37474f;

  cursor:pointer;

  white-space:nowrap;

  font-weight:600;
}

.nav-btn:hover{

  background:#fce4ec;

  color:#ad1457;
}

/* =========================
   CONTAINER
========================= */

.container{

  width:min(1200px,94%);

  margin:20px auto;

}

/* =========================
   MENU
========================= */

.menu-grid{

  display:grid;

  grid-template-columns:
    repeat(auto-fit,minmax(145px,1fr));

  gap:12px;

  margin-bottom:18px;
}

.menu-card{

  border:0;

  min-height:100px;

  border-radius:22px;

  background:white;

  box-shadow:
    0 5px 18px rgba(0,0,0,.09);

  cursor:pointer;

  padding:15px;

  transition:.2s;

  font-weight:700;

  color:#37474f;
}

.menu-card:hover{

  transform:translateY(-3px);

  box-shadow:
    0 8px 22px rgba(0,0,0,.14);
}

.menu-icon{

  width:48px;

  height:48px;

  border-radius:50%;

  display:flex;

  align-items:center;

  justify-content:center;

  margin:auto auto 8px;

  background:#fce4ec;

  color:#ad1457;

  font-size:23px;
}

/* =========================
   SUMMARY
========================= */

.summary-grid{

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:12px;

  margin-bottom:18px;
}

.summary-card{

  background:white;

  border-radius:16px;

  padding:16px;

  box-shadow:
    0 4px 15px rgba(0,0,0,.08);

  text-align:center;
}

.summary-card .number{

  font-size:28px;

  font-weight:800;

  color:#ad1457;
}

.summary-card .label{

  font-size:13px;

  color:#607d8b;

  margin-top:4px;
}

/* =========================
   TOOLBAR
========================= */

.toolbar{

  padding:14px;

  border-radius:16px;

  box-shadow:
    0 4px 15px rgba(0,0,0,.08);

  display:flex;

  gap:10px;

  flex-wrap:wrap;

  margin-bottom:18px;
}

.search-box{

  flex:1;

  min-width:220px;

  padding:12px 14px;

  border:1px solid #cfd8dc;

  border-radius:12px;

  outline:none;

  font-size:14px;
}

.search-box:focus{

  border-color:#d81b60;

  box-shadow:

}

.btn{

  border-radius:12px;

  padding:11px 15px;

  cursor:pointer;

  font-weight:700;
}

.btn-primary{

  background:#d81b60;

  color:white;
}

.btn-secondary{

  background:#eceff1;

  color:#37474f;
}

.btn-success{

  background:#2e7d32;

  color:white;
}

.btn-danger{

  background:#c62828;

  color:white;
}

/* =========================
   CARD
========================= */

.card{

  background:white;

  border-radius:18px;

  padding:18px;

  box-shadow:
    0 4px 18px rgba(0,0,0,.08);

  margin-bottom:18px;
}

.card h2,

/* =========================

========================= */

.household-line{

/* =========================

========================= */

.form-grid{

    repeat(2,minmax(0,1fr));

  gap:12px;
}

.form-group{

}

.form-group.full{

}

label{

  font-weight:700;

}

input,

textarea{

.row-actions{

/* =========================

.modal{

.modal-header{

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://sslabegtsxlkafuygmar.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_G3Nv_yg4LaCiMtJMiadMxQ_f2fNHg5x";

const REST_URL =
  SUPABASE_URL + "/rest/v1";

const RELIEF_DOCUMENT_BUCKET =
  "relief-images";


/* =====================================================
   USER / BRANCH
===================================================== */

const branchId =
  localStorage.getItem("selected_branch_uuid") ||
  localStorage.getItem("selected_branch_id") ||
  "";

const branchCode =
  localStorage.getItem("selected_branch_code") ||
  localStorage.getItem("branch_code") ||
  "";

const branchName =
  localStorage.getItem("selected_branch_name") ||
  localStorage.getItem("branch_name") ||
  "";

const userName =
  localStorage.getItem("login_user") ||
  localStorage.getItem("username") ||
  localStorage.getItem("user_name") ||
  localStorage.getItem("email") ||
  "User";

const userRole =
  localStorage.getItem("user_role") ||
  localStorage.getItem("role") ||
  "";


/* =====================================================
   CACHE
===================================================== */

let householdsCache = [];

let memberSearchCache = [];


/* =====================================================
   BRANCH CHECK
===================================================== */

function requireBranch(){

  if(!branchId){

    throw new Error(
      "Branch is not selected. Please login again."
    );

  }

}


/* =====================================================
   API
===================================================== */

async function apiRequest(
  url,
  options={}
){

  const headers = {

    "apikey":
      SUPABASE_KEY,

    "Authorization":
      "Bearer " + SUPABASE_KEY,

    "Content-Type":
      "application/json",

    ...(options.headers || {})

  };


  const response =
    await fetch(
      url,
      {
        ...options,
        headers
      }
    );


  const text =
    await response.text();


  let data = null;


  try{

    data =
      text
        ? JSON.parse(text)
        : null;

  }catch{

    data = text;

  }


  if(!response.ok){

    let message =
      data?.message ||
      data?.error_description ||
      data?.hint ||
      data?.details ||
      data?.error ||
      text ||
      response.statusText;


    throw new Error(
      String(message)
    );

  }


  return data;

}


async function getTable(
  table,
  query=""
){

  return await apiRequest(
    REST_URL +
    "/" +
    table +
    query
  );

}


async function insertTable(
  table,
  payload
){

}

/* =====================================================
   UPLOAD DOCUMENT
===================================================== */

async function uploadDocument(
  file,
  householdId
){

  if(!file){

    return null;

  }


  const safeName =
    file.name
      .replace(
        /[^a-zA-Z0-9._-]/g,
        "_"
      );


  const uniqueName =
    Date.now() +
    "_" +
    Math.random()
      .toString(36)
      .slice(2,8) +
    "_" +
    safeName;


  const path =
    branchId +
    "/" +
    householdId +
    "/" +
    uniqueName;


  const uploadUrl =
    SUPABASE_URL +
    "/storage/v1/object/" +
    RELIEF_DOCUMENT_BUCKET +
    "/" +
    path;


  const response =
    await fetch(
      uploadUrl,
      {
        method:"POST",

        headers:{
          "apikey":
            SUPABASE_KEY,

          "Authorization":
            "Bearer " +
            SUPABASE_KEY,

          "Content-Type":
            file.type ||
            "application/octet-stream",

          "x-upsert":
            "false"
        },

        body:file
      }
    );


  const text =
    await response.text();


  if(!response.ok){

    throw new Error(
      "Document upload failed: " +
      text
    );

  }


  const publicUrl =
    SUPABASE_URL +
    "/storage/v1/object/public/" +
    RELIEF_DOCUMENT_BUCKET +
    "/" +
    path;


  return {

    file_name:
      file.name,

    file_path:
      path,

    file_url:
      publicUrl,

    file_type:
      file.type || null,

    file_size:
      file.size || null

  };

}


/* =====================================================
   SAVE HOUSEHOLD
===================================================== */

async function saveHousehold(){

  try{

    requireBranch();

    clearStatus();


    const householdName =
      document.getElementById(
        "householdName"
      ).value.trim();


    const disasterType =
      document.getElementById(
        "disasterType"
      ).value;


    const disasterDate =
      document.getElementById(
        "disasterDate"
      ).value;


    if(!householdName){

      throw new Error(
        "Representative / Household Name is required."
      );

    }


    if(!disasterType){

      throw new Error(
        "Disaster Type is required."
      );

    }


    if(!disasterDate){

      throw new Error(
        "Disaster Date is required."
      );

    }


    /* ================================================
       MEMBERS
    ================================================= */

    const memberRows =
      Array.from(
        document.querySelectorAll(
          ".member-row"
        )
      );


    if(!memberRows.length){

      throw new Error(
        "At least one member is required."
      );

    }


    const members = [];


    for(
      const row of memberRows
    ){

      const fullName =
        row.querySelector(
          ".member-name"
        ).value.trim();


      const relationship =
        row.querySelector(
          ".member-relationship"
        ).value;


      const sex =
        row.querySelector(
          ".member-sex"
        ).value;


      const ageValue =
        row.querySelector(
          ".member-age"
        ).value;


      const fan =
        row.querySelector(
          ".member-fan"
        ).value
          .replace(
            /\s/g,
            ""
          );


      const other =
        row.querySelector(
          ".member-other"
        ).value.trim()
        || null;


      if(!fullName){

        throw new Error(
          "Member full name is required."
        );

      }


      if(!relationship){

        throw new Error(
          "Member relationship is required."
        );

      }


      if(!sex){

        throw new Error(
          "Member sex is required."
        );

      }


      if(
        ageValue === "" ||
        Number(ageValue) < 0
      ){

        throw new Error(
          "Valid member age is required."
        );

      }


      if(!/^\d{16}$/.test(fan)){

        throw new Error(
          "Member FAN Number must be exactly 16 digits: " +
          fan
        );

      }


      members.push({

        full_name:
          fullName,

        relationship:
          relationship,

        sex:
          sex,

        age:
          Number(ageValue),

        fan_number:
          fan,

        other_information:
          other

      });

    }


    /* ================================================
       DUPLICATE FAN INSIDE FORM
    ================================================= */

    const fanSet =
      new Set();


    for(
      const member of members
    ){

      if(
        fanSet.has(
          member.fan_number
        )
      ){

        throw new Error(
          "Duplicate FAN Number in this household: " +
          member.fan_number
        );

      }


      fanSet.add(
        member.fan_number
      );

    }


    /* ================================================
       DUPLICATE FAN IN DATABASE
    ================================================= */

    for(
      const fan of fanSet
    ){

      const existing =
        await getTable(
          "emergency_members",
          "?select=id,full_name,household_id" +
          "&fan_number=eq." +
          encodeURIComponent(fan) +
          "&limit=1"
        );


      if(
        existing &&
        existing.length
      ){

        throw new Error(

          "FAN Number " +
          fan +
          " is already registered for member: " +
          (
            existing[0].full_name ||
            "Unknown member"
          )

        );

      }

    }


    /* ================================================
       HOUSEHOLD PAYLOAD
       IMPORTANT:
       NO household FAN
    ================================================= */

    const householdPayload = {

      branch_id:
        branchId,

      branch_code:
        branchCode || null,

      representative_name:
        householdName,

      household_name:
        householdName,

      disaster_type:
        disasterType,

      disaster_date:
        disasterDate,

      city:
        document.getElementById(
          "city"
        ).value.trim() || null,

      sub_city:
        document.getElementById(
          "subCity"
        ).value.trim() || null,

      woreda:
        document.getElementById(
          "woreda"
        ).value.trim() || null,

      specific_location:
        document.getElementById(
          "specificLocation"
        ).value.trim() || null,

      house_number:
        document.getElementById(
          "houseNumber"
        ).value.trim() || null,

      other_information:
        document.getElementById(
          "householdOther"
        ).value.trim() || null,

      created_at:
        new Date().toISOString()

    };


    /* ================================================
       INSERT HOUSEHOLD
    ================================================= */

    const householdRows =
      await insertTable(
        "emergency_households",
        householdPayload
      );


    if(
      !householdRows ||
      !householdRows.length
    ){

      throw new Error(
        "Household was not created."
      );

    }


    const household =
      householdRows[0];


    const householdId =
      household.id;


    /* ================================================
       INSERT MEMBERS
    ================================================= */

    const memberPayload =
      members.map(
        member => ({

          household_id:
            householdId,

          full_name:
            member.full_name,

          relationship:
            member.relationship,

          sex:
            member.sex,

          age:
            member.age,

          fan_number:
            member.fan_number,

          other_information:
            member.other_information,

          created_at:
            new Date().toISOString()

        })
      );


    await insertTable(
      "emergency_members",
      memberPayload
    );


    /* ================================================
       DOCUMENTS
    ================================================= */

    const documentRows =
      Array.from(
        document.querySelectorAll(
          ".document-row"
        )
      );


    for(
      const row of documentRows
    ){

      const number =
        row.querySelector(
          ".document-number"
        ).value.trim()
        || null;


      const date =
        row.querySelector(
          ".document-date"
        ).value
        || null;


      const name =
        row.querySelector(
          ".document-name"
        ).value.trim()
        || null;


      const other =
        row.querySelector(
          ".document-other"
        ).value.trim()
        || null;


      const fileInput =
        row.querySelector(
          ".document-file"
        );


      let uploaded =
        null;


      if(
        fileInput &&
        fileInput.files &&
        fileInput.files.length
      ){

        uploaded =
          await uploadDocument(
            fileInput.files[0],
            householdId
          );

      }


      const documentPayload = {

        household_id:
          householdId,

        document_number:
          number,

        document_date:
          date,

        document_name:
          name,

        file_name:
          uploaded?.file_name ||
          null,

        file_path:
          uploaded?.file_path ||
          null,

        file_url:
          uploaded?.file_url ||
          null,

        file_type:
          uploaded?.file_type ||
          null,

        file_size:
          uploaded?.file_size ||
          null,

        other_information:
          other,

        created_at:
          new Date().toISOString()

      };


      await insertTable(
        "emergency_documents",
        documentPayload
      );

    }


    showStatus(
      "Household saved successfully.",
      "success"
    );


    closeHouseholdForm();


    await refreshAll();


    setTimeout(
      () => {

        openHousehold(
          householdId
        );

      },
      300
    );


  }catch(error){

    console.error(
      "SAVE HOUSEHOLD ERROR:",
      error
    );


    showStatus(
      error.message ||
      "Failed to save household.",
      "error"
    );

  }

}

===================================================== */

async function loadMemberSearchCache(){

  const data =
    await getTable(
      "emergency_members",
      "?select=household_id,full_name,fan_number"
    );


  memberSearchCache =
    data || [];

}


/* =====================================================
   FILTER
===================================================== */

function filterHouseholds(){

  const search =
    document.getElementById(
      "searchInput"
    ).value
      .trim()
      .toLowerCase();


  if(!search){

    renderHouseholds(
      householdsCache
    );

    return;

  }


  const filtered =
    householdsCache.filter(
      household => {

        const name =
          String(
            household.household_name ||
            household.representative_name ||
            ""
          ).toLowerCase();


        const disaster =
          String(
            household.disaster_type ||
            ""
          ).toLowerCase();


        const date =
          String(
            household.disaster_date ||
            ""
          ).toLowerCase();


        const members =
          memberSearchCache.filter(
            member =>
              String(
                member.household_id
              ) ===
              String(
                household.id
              )
          );


        const memberMatch =
          members.some(
            member => {

              const memberName =
                String(
                  member.full_name ||
                  ""
                ).toLowerCase();


              const memberFan =
                String(
                  member.fan_number ||
                  ""
                ).toLowerCase();


              return (
                memberName.includes(search) ||
                memberFan.includes(search)
              );

            }
          );


        return (

          name.includes(search) ||

          disaster.includes(search) ||

          date.includes(search) ||

          memberMatch

        );

      }
    );


  renderHouseholds(
    filtered
  );

}

          `;

        }
      );

    }


    html += `

      </div>

    `;


    /* ================================================
       DOCUMENTS
    ================================================= */

    html += `

      <div class="info-card">

        <h3>
          Documents / Ragaa (${documents.length})
        </h3>

    `;


    if(!documents.length){

      html += `

        <div class="empty">
          No documents found.
        </div>

      `;

    }else{

      documents.forEach(
        documentRow => {

          let fileHtml =
            "";


          if(
            documentRow.file_url
          ){

            const fileUrl =
              escapeHtml(
                documentRow.file_url
              );


            const fileType =
              String(
                documentRow.file_type ||
                ""
              ).toLowerCase();


            if(
              fileType.includes(
                "image"
              )
            ){

              fileHtml = `

                <div style="margin-top:10px">

                  <img
                    src="${fileUrl}"
                    alt="Document"
                    style="
                      max-width:100%;
                      max-height:300px;
                      border-radius:10px;
                      border:1px solid #ddd;
                    "
                  >

                </div>

              `;

            }else{

              fileHtml = `

                <div style="margin-top:10px">

                  <a
                    href="${fileUrl}"
                    target="_blank"
                    rel="noopener"
                    class="btn btn-secondary"
                    style="
                      display:inline-block;
                      text-decoration:none;
                    "
                  >
                    📄 Open Document
                  </a>

                </div>

              `;

            }

          }


          html += `

            <div
              class="info-card"
              style="margin-bottom:10px"
            >

              <div class="info-grid">

                ${info(
                  "Document Number",
                  documentRow.document_number
                )}

                ${info(
                  "Document Date",
                  documentRow.document_date
                )}

                ${info(
                  "Document Name",
                  documentRow.document_name
                )}

                ${info(
                  "File Name",
                  documentRow.file_name
                )}

                ${info(
                  "Other Information",
                  documentRow.other_information
                )}

              </div>

              ${fileHtml}

            </div>

          `;

        }
      );

    }


    html += `

      </div>

    `;


    document.getElementById(
      "householdProfileContent"
    ).innerHTML =
      html;


    document.getElementById(
      "householdModal"
    ).style.display =
      "block";


  }catch(error){

    console.error(
      "OPEN HOUSEHOLD ERROR:",
      error
    );


    alert(
      error.message ||
      "Unable to open household."
    );

  }

}


/* =====================================================
   INFO HELPER
===================================================== */

function info(
  label,
  value
){

  return `

    <div class="info-item">

      <div class="info-label">
        ${escapeHtml(label)}
      </div>

      <div class="info-value">

        ${escapeHtml(
          value === null ||
          value === undefined ||
          value === ""
            ? "-"
            : String(value)
        )}

      </div>

    </div>

  `;

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(
  value
){

  return String(
    value ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* =====================================================
   CLOSE HOUSEHOLD MODAL
===================================================== */

function closeHouseholdModal(){

  document.getElementById(
    "householdModal"
  ).style.display =
    "none";

}


/* =====================================================
   OUTSIDE CLICK
===================================================== */

window.addEventListener(
  "click",
  function(event){

    const profile =
      document.getElementById(
        "profileModal"
      );

    const household =
      document.getElementById(
        "householdModal"
      );


    if(
      event.target === profile
    ){

      closeProfile();

    }


    if(
      event.target === household
    ){

      closeHouseholdModal();

    }

  }
);


/* =====================================================
   INITIALIZE
===================================================== */

document.addEventListener(
  "DOMContentLoaded",
  async function(){

    loadProfile();

    await refreshAll();

  }
);

</script>
