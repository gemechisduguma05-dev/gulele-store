<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AAFDRMC - Dashboard</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f1f5f9;
  color:#1e293b;
}

header{
  background:#1e3a8a;
  color:white;
  padding:25px 15px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:26px;
}

.branch{
  margin-top:10px;
  font-size:18px;
  font-weight:bold;
}

.container{
  width:94%;
  max-width:1200px;
  margin:25px auto;
}

.card{
  background:white;
  border-radius:15px;
  padding:22px;
  margin-bottom:20px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.title{
  color:#1e3a8a;
  font-size:24px;
  font-weight:bold;
  margin-bottom:20px;
}

.menu-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.btn{
  width:100%;
  border:0;
  border-radius:10px;
  padding:17px 12px;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
  text-decoration:none;
  text-align:center;
  display:block;
}

.items{
  background:#15803d;
}

.stock{
  background:#dc2626;
}

.report{
  background:#ea580c;
}

.category{
  background:#7c3aed;
}

.settings{
  background:#475569;
}

.refresh{
  background:#1e3a8a;
}

.menu{
  background:#64748b;
}

.logout{
  background:#991b1b;
}

.summary{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
}

.summary-card{
  background:white;
  border-radius:12px;
  padding:20px;
  box-shadow:0 3px 10px rgba(0,0,0,.07);
}

.summary-card span{
  display:block;
  color:#64748b;
  font-weight:bold;
}

.summary-card strong{
  display:block;
  margin-top:8px;
  color:#1e3a8a;
  font-size:30px;
}

.message{
  display:none;
  padding:15px;
  border-radius:10px;
  margin-bottom:20px;
  font-weight:bold;
  line-height:1.5;
  white-space:pre-wrap;
}

.message.show{
  display:block;
}

.error{
  background:#fee2e2;
  color:#991b1b;
}

.success{
  background:#dcfce7;
  color:#166534;
}

.info{
  background:#eff6ff;
  color:#1e40af;
  border:1px solid #bfdbfe;
  padding:15px;
  border-radius:10px;
  margin-bottom:20px;
  font-weight:bold;
}

@media(max-width:700px){

  .menu-grid{
    grid-template-columns:1fr;
  }

  .summary{
    grid-template-columns:repeat(2,1fr);
  }

}

@media(max-width:450px){

  header h1{
    font-size:21px;
  }

  .branch{
    font-size:16px;
  }

  .summary{
    grid-template-columns:1fr;
  }

  .btn{
    font-size:16px;
  }

}

</style>
</head>


<body>


<header>

<h1>
AAFDRMC - STOCK MANAGEMENT
</h1>

<div
id="branchName"
class="branch">

Loading Branch...

</div>

</header>


<div class="container">


<div
id="message"
class="message">
</div>


<!-- =====================================================
     BRANCH INFORMATION
===================================================== -->

<div class="card">

<div class="info">

🏢 Current Branch:

<strong id="currentBranch">
Loading...
</strong>

<br><br>

Branch Code:

<strong id="currentCode">
—
</strong>

</div>

</div>


<!-- =====================================================
     MAIN MENU
===================================================== -->

<div class="card">

<div class="title">
📊 Dashboard Menu
</div>


<div class="menu-grid">


<a
href="items.html"
class="btn items">

📦 Items

</a>


<a
href="stock.html"
class="btn stock">

📥 Stock IN / OUT

</a>


<a
href="reports.html"
class="btn report">

📊 Stock Report

</a>


<a
href="category.html"
class="btn category">

🗂️ Categories

</a>


<a
href="settings.html"
class="btn settings">

⚙️ Settings

</a>


<button
type="button"
class="btn refresh"
onclick="loadDashboard()">

🔄 Refresh

</button>


<a
href="index.html"
class="btn menu">

⬅️ Main Menu

</a>


<button
type="button"
class="btn logout"
onclick="logout()">

🚪 Logout

</button>


</div>

</div>


<!-- =====================================================
     SUMMARY
===================================================== -->

<div class="summary">


<div class="summary-card">

<span>
📦 Total Items
</span>

<strong id="totalItems">
0
</strong>

</div>


<div class="summary-card">

<span>
🟢 Stock IN
</span>

<strong id="totalIn">
0
</strong>

</div>


<div class="summary-card">

<span>
🔴 Stock OUT
</span>

<strong id="totalOut">
0
</strong>

</div>


<div class="summary-card">

<span>
📊 Current Balance
</span>

<strong id="balance">
0
</strong>

</div>


</div>


</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://sslabegtsxlkafuygmar.supabase.co";

const SUPABASE_KEY =
"sb_publishable_M6oxZjm6xF5NbrXkSO9JqA_7JGSucXq";


/* =====================================================
   BRANCH
===================================================== */

let branchName =
localStorage.getItem(
  "selected_branch_name"
) || "";

let branchCode =
localStorage.getItem(
  "selected_branch_code"
) || "";


/*
IMPORTANT:

Index.html haaraa irraa
selected_branch_id hin kaa'amu.

Kanaaf dashboard branch maqaa
fi code irratti hundaa'a.

branches.name hin barbaadu.
*/


/* =====================================================
   HEADERS
===================================================== */

function getHeaders(){

  return {

    "apikey":
      SUPABASE_KEY,

    "Authorization":
      "Bearer " + SUPABASE_KEY,

    "Content-Type":
      "application/json",

    "Accept":
      "application/json"

  };

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
  text,
  type
){

  const box =
    document.getElementById(
      "message"
    );

  box.textContent =
    text;

  box.className =
    "message show " +
    type;

}


/* =====================================================
   SHOW BRANCH
===================================================== */

function showBranch(){

  if(!branchName){

    document.getElementById(
      "branchName"
    ).textContent =
      "⚠️ Branch hin filatamne";


    document.getElementById(
      "currentBranch"
    ).textContent =
      "Unknown";


    document.getElementById(
      "currentCode"
    ).textContent =
      "—";


    showMessage(

      "❌ Branch hin filatamne.\n\n" +
      "Mee gara Main Menu deebi'ii Branch filadhu.",

      "error"

    );

    return false;

  }


  document.getElementById(
    "branchName"
  ).textContent =
    "🏢 Branch: " +
    branchName;


  document.getElementById(
    "currentBranch"
  ).textContent =
    branchName;


  document.getElementById(
    "currentCode"
  ).textContent =
    branchCode || "—";


  return true;

}


/* =====================================================
   LOAD ITEMS
===================================================== */

async function loadItems(){

  /*
  Current index version branch_id
  hin kaa'u.

  Kanaaf summary yeroo ammaa
  Items guutuu irraa load godha.

  Yoo database keessatti branch_code
  jiraate, code irratti filter godha.
  */


  try{

    let url =
      SUPABASE_URL +
      "/rest/v1/items" +
      "?select=*";


    /*
    Branch code yoo jiraate
    filter godhuuf yaala.
    */

    if(branchCode){

      url +=
        "&branch_code=eq." +
        encodeURIComponent(
          branchCode
        );

    }


    url +=
      "&order=id.asc";


    const response =
      await fetch(
        url,
        {
          method:"GET",
          headers:getHeaders()
        }
      );


    const text =
      await response.text();


    if(!response.ok){

      console.warn(
        "Items loading warning:",
        text
      );

      return [];

    }


    const data =
      JSON.parse(text);


    return Array.isArray(data)
      ? data
      : [];

  }
  catch(error){

    console.warn(
      "Items error:",
      error
    );

    return [];

  }

}


/* =====================================================
   LOAD TRANSACTIONS
===================================================== */

async function loadTransactions(){

  try{

    let url =
      SUPABASE_URL +
      "/rest/v1/stock_transactions" +
      "?select=*";


    /*
    Branch code column yoo jiraate
    itti fayyadama.

    branches.name hin fayyadamu.
    */

    if(branchCode){

      url +=
        "&branch_code=eq." +
        encodeURIComponent(
          branchCode
        );

    }


    url +=
      "&order=id.desc";


    const response =
      await fetch(
        url,
        {
          method:"GET",
          headers:getHeaders()
        }
      );


    const text =
      await response.text();


    if(!response.ok){

      console.warn(
        "Transactions loading warning:",
        text
      );

      return [];

    }


    const data =
      JSON.parse(text);


    return Array.isArray(data)
      ? data
      : [];

  }
  catch(error){

    console.warn(
      "Transaction error:",
      error
    );

    return [];

  }

}


/* =====================================================
   TRANSACTION TYPE
===================================================== */

function getTransactionType(t){

  /*
  Database keessatti maqaan column
  transaction_type dha.

  Dogoggora spelling duraan ture:
  transction_type / trasctin
  hin fayyadamnu.
  */


  return String(
    t.transaction_type || ""
  )
  .trim()
  .toUpperCase();

}


/* =====================================================
   LOAD DASHBOARD
===================================================== */

async function loadDashboard(){

  if(!showBranch()){

    return;

  }


  document.getElementById(
    "totalItems"
  ).textContent =
    "...";


  document.getElementById(
    "totalIn"
  ).textContent =
    "...";


  document.getElementById(
    "totalOut"
  ).textContent =
    "...";


  document.getElementById(
    "balance"
  ).textContent =
    "...";


  const items =
    await loadItems();


  const transactions =
    await loadTransactions();


  let totalIn =
    0;

  let totalOut =
    0;


  transactions.forEach(
    function(t){

      const quantity =
        Number(
          t.quantity || 0
        );


      const type =
        getTransactionType(t);


      if(type === "IN"){

        totalIn +=
          quantity;

      }


      if(type === "OUT"){

        totalOut +=
          quantity;

      }

    }
  );


  /*
  Opening stock = 0

  Items table keessatti quantity
  hin lakkaa'amu.

  Current Balance:

  Stock IN - Stock OUT
  */


  const balance =
    totalIn -
    totalOut;


  document.getElementById(
    "totalItems"
  ).textContent =
    items.length.toLocaleString();


  document.getElementById(
    "totalIn"
  ).textContent =
    totalIn.toLocaleString();


  document.getElementById(
    "totalOut"
  ).textContent =
    totalOut.toLocaleString();


  document.getElementById(
    "balance"
  ).textContent =
    balance.toLocaleString();

}


/* =====================================================
   LOGOUT
===================================================== */

function logout(){

  localStorage.removeItem(
    "access_token"
  );

  localStorage.removeItem(
    "selected_branch_id"
  );

  localStorage.removeItem(
    "selected_branch_name"
  );

  localStorage.removeItem(
    "selected_branch_code"
  );


  window.location.href =
    "index.html";

}


/* =====================================================
   START
===================================================== */

window.addEventListener(
  "DOMContentLoaded",
  function(){

    showBranch();

    loadDashboard();

  }
);

</script>

</body>
</html>
