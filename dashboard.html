*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  color:#263238;
  background:
    radial-gradient(
      circle at top left,
      rgba(33,150,243,.12),
      transparent 30%

    linear-gradient(
      135deg,
      #eef5ff,
      #f7f9fc
    );

}

/* =====================================================
   HEADER
===================================================== */

header{
  background:
    linear-gradient(
      135deg,
      rgba(5,34,82,.98),
      rgba(13,71,161,.96)
    );
  color:white;
  padding:14px 12px;
  text-align:center;
  box-shadow:0 7px 22px rgba(0,0,0,.38);
  backdrop-filter:blur(8px);
}

header h1{
  margin:0;
  font-size:21px;
  font-weight:800;
  letter-spacing:.4px;
}

.branch{
  margin-top:5px;
  font-size:15px;
  font-weight:700;
}

.profile-area{
  margin-top:8px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.profile-picture{
  width:48px;
  height:48px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid #fff;
  background:#fff;
}

.profile-name{
  margin-top:4px;
  font-size:14px;
  font-weight:bold;
}

.mode-badge{
  display:inline-block;
  padding:5px 11px;
  font-size:11px;
  font-weight:bold;
  border-radius:20px;
  margin-top:6px;
  background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.45);
}

/* =====================================================
   PAGE
===================================================== */

.container{
  width:min(1100px,94%);
  margin:18px auto 100px;
}

/* =====================================================
   HIDDEN BRANCH CARD
===================================================== */

.hidden{
  display:none !important;
}

.card{
  background:#fff;
  border-radius:18px;
  padding:16px;
  margin-bottom:16px;
  box-shadow:0 7px 20px rgba(0,0,0,.10);
}

.info{
  text-align:center;
  line-height:1.5;
}

.info strong{
  color:#0d47a1;
}

/* =====================================================
   STATUS
===================================================== */

.status-bar{
  background:#fff;
  border-radius:14px;
  padding:10px 14px;
  margin-bottom:18px;
  text-align:center;
  font-size:13px;
  font-weight:bold;
  box-shadow:0 4px 14px rgba(0,0,0,.08);
}

.status-bar.success{
  color:#1b5e20;
}

.status-bar.error{
  color:#b71c1c;
}

.status-bar.loading{
  color:#0d47a1;
}

/* =====================================================
   MENU GRID
===================================================== */

.menu-grid{
  display:grid;
  grid-template-columns:
    repeat(
      auto-fit,
      minmax(120px,1fr)
    );
  gap:14px;
  align-items:stretch;
}

/* =====================================================
   MENU BUTTON
===================================================== */

.menu-button{
  min-height:120px;
  border:none;
  border-radius:22px;
  padding:12px 8px;
  color:#fff;
  cursor:pointer;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  text-decoration:none;

  box-shadow:
    0 8px 18px rgba(0,0,0,.18);

  transition:
    transform .18s ease,
    box-shadow .18s ease,
    filter .18s ease;

  position:relative;
  overflow:hidden;
}

.menu-button::before{
  content:"";
  position:absolute;
  width:90px;
  height:90px;
  border-radius:50%;
  background:rgba(255,255,255,.08);
  top:-42px;
  right:-35px;
  pointer-events:none;
}

.menu-button::after{
  content:"";
  position:absolute;
  width:70px;
  height:70px;
  border-radius:50%;
  background:rgba(255,255,255,.05);
  bottom:-35px;
  left:-30px;
  pointer-events:none;
}

.menu-button:hover{
  transform:translateY(-3px);
  box-shadow:
    0 12px 25px rgba(0,0,0,.25);
  filter:brightness(1.05);
}

.menu-button:active{
  transform:scale(.96);
}

/* =====================================================
   THREE-COLOR BUTTONS
===================================================== */

.items{
  background:
    linear-gradient(
      145deg,
      #8e2457 0%,
      #c2185b 45%,
      #1565c0 100%
    );
}

.stock{
  background:
    linear-gradient(
      145deg,
      #0d47a1 0%,
      #1976d2 48%,
      #c2185b 100%
    );
}

.report{
  background:
    linear-gradient(
      145deg,
      #c2185b 0%,
      #e91e63 48%,
      #1565c0 100%
    );
}

.relief{
  background:
    linear-gradient(
      145deg,
      #1565c0 0%,
      #1976d2 48%,
      #ad1457 100%
    );
}

.settings{
  background:
    linear-gradient(
      145deg,
      #ad1457 0%,
      #c2185b 48%,
      #0d47a1 100%
    );
}

.menu{

      145deg,
      #062b6f 0%,
      #1565c0 48%,
      #e91e63 100%

/* =====================================================
   ICON
===================================================== */

.menu-icon{

  height:34px;

  font-size:17px;

  margin-bottom:6px;

  overflow:hidden;
  flex-shrink:0;

  position:relative;
  z-index:2;
}

/* =====================================================
   LABEL
===================================================== */

.menu-label{

  font-size:13px;
  font-weight:800;
  line-height:1.2;
  text-align:center;
  position:relative;
  z-index:2;

/* =====================================================

===================================================== */

.section-title{

  color:#0d47a1;

}

.branch-grid{

  grid-template-columns:

}

.branch-card{

  padding:15px;

  border:1px solid rgba(13,71,161,.08);
}

.branch-card h3{
  margin:0 0 6px;
  color:#0d47a1;
  font-size:15px;
}

.branch-card p{
  margin:3px 0;
  font-size:12px;
  color:#607d8b;
}

.branch-open{

  margin-top:10px;
  padding:9px 10px;

  border-radius:12px;
  color:#fff;
  background:

      135deg,
      #1565c0,
      #c2185b

  font-weight:bold;
  cursor:pointer;

/* =====================================================
   BOTTOM CONTROLS
===================================================== */

.bottom-controls{
  position:fixed;
  left:0;
  right:0;
  bottom:0;

  padding:9px 10px;

  display:flex;
  justify-content:center;
  gap:8px;

  box-shadow:

.bottom-button{

  background:#1565c0;

  font-size:11px;

/* =====================================================

.empty-text{

  padding:20px;

/* =====================================================

  "Non-Food Hygiene Items",
  "Non-Food Kitchen Items",
  "Non-Food Building/Construction Items"

];


/* =====================================================

===================================================== */

let currentLanguage =

const TRANSLATIONS = {

    report:"Stock Report",
    relief:"Relief Report",
    settings:"Settings",

    refresh:"↻ አድስ",

function t(key){

  return (
    TRANSLATIONS[currentLanguage] &&
    TRANSLATIONS[currentLanguage][key]
  )
  ||
  TRANSLATIONS.en[key]
  ||
  key;

}


/* =====================================================
   SUPABASE FETCH
===================================================== */

async function supabaseFetch(
  table,
  params={}
){

  const query =
    new URLSearchParams(params);

  const url =
    REST_URL +
    "/" +
    table +
    "?" +
    query.toString();

  const response =
    await fetch(
      url,
      {
        method:"GET",
        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":
            "Bearer " + SUPABASE_KEY,
          "Content-Type":
            "application/json"
        }
      }
    );

  if(!response.ok){

    const text =
      await response.text();

    throw new Error(
      table +
      " : " +
      response.status +
      " " +
      text
    );

  }

  return response.json();

}


/* =====================================================
   AUTH / LOCAL STORAGE
===================================================== */

const isLoggedIn =
  localStorage.getItem(
    "is_logged_in"
  );

const userRole =
  localStorage.getItem(
    "user_role"
  ) || "branch";

const loginUser =
  localStorage.getItem(
    "login_user"
  ) || "User";


let selectedBranchUuid =
  localStorage.getItem(
    "selected_branch_uuid"
  );

let selectedBranchCode =
  localStorage.getItem(
    "selected_branch_code"
  );

let selectedBranchName =
  localStorage.getItem(
    "selected_branch_name"
  );


if(!selectedBranchUuid){

  selectedBranchUuid =
    localStorage.getItem(
      "selected_branch_id"
    );

}

if(!selectedBranchCode){

  selectedBranchCode =
    localStorage.getItem(
      "branch_code"
    );

}

if(!selectedBranchName){

  selectedBranchName =
    localStorage.getItem(
      "branch_name"
    );

}


/* =====================================================
   LOGIN CHECK
===================================================== */

if(
  !isLoggedIn ||
  isLoggedIn !== "true"
){

  window.location.href =
    "index.html";

}


/* =====================================================
   USER DISPLAY
===================================================== */

document.getElementById(
  "loginUserDisplay"
).textContent =
  loginUser;


/* =====================================================
   MAIN USER CHECK
===================================================== */

const isMain =
  userRole === "main" ||
  selectedBranchUuid === MAIN_BRANCH_ID ||
  String(
    selectedBranchCode || ""
  ).toUpperCase() === "MAIN";


/* =====================================================
   BRANCH FIND
===================================================== */

function findBranch(){

  if(isMain){

    return {
      id:MAIN_BRANCH_ID,
      name:"Main",
      code:"MAIN"
    };

  }

  let branch =
    BRANCHES.find(
      b =>
        b.id === selectedBranchUuid
    );

  if(!branch){

    branch =
      BRANCHES.find(
        b =>
          b.code ===
          selectedBranchCode
      );

  }

  if(!branch){

    branch =
      BRANCHES.find(
        b =>
          b.name.toLowerCase() ===
          String(
            selectedBranchName || ""
          ).toLowerCase()
      );

  }

  return branch ||
  {
    id:
      "b7b2ff8c-0be4-4678-a6d3-63c05cdf144c",
    name:"Gulele",
    code:"GUL"
  };

}


/* =====================================================
   CURRENT BRANCH
===================================================== */

const currentBranchData =
  findBranch();

const branchUuid =
  currentBranchData.id;

const branchName =
  currentBranchData.name;

const branchCode =
  currentBranchData.code;


/* =====================================================
   SHOW BRANCH
===================================================== */

function showBranch(){

  document.getElementById(
    "currentBranch"
  ).textContent =

  document.getElementById(
    "currentCode"

    );

  if(isMain){

    modeBadge.textContent =
      t("mainUser");

  }else{

  }

){

    document.getElementById(

    );

  bar.className =

      menu,

      "⚙︎",
      t("settings"),
      "settings.html"
    );

    addMenu(
      menu,
      "menu",
      "←",
      t("menu"),
      "index.html"
    );

    return;

  }


  addMenu(
    menu,
    "items",
    "📦",
    t("items"),
    "items.html"
  );


  addMenu(
    menu,
    "stock",
    "⇅",
    t("stock"),
    "stock.html"
  );


  addMenu(
    menu,
    "report",
    "▤",
    t("report"),
    "reports.html"
  );


  addMenu(
    menu,
    "relief",
    "🚑",
    t("relief"),
    "emergency-relief.html"
  );


  addMenu(
    menu,
    "settings",
    "⚙︎",
    t("settings"),
    "settings.html"
  );


  addMenu(
    menu,
    "menu",
    "←",
    t("menu"),
    "index.html"
  );

}


/* =====================================================
   ADD MENU
===================================================== */

function addMenu(
  container,
  className,
  icon,
  label,
  href
){

  const link =
    document.createElement(
      "a"
    );

  link.className =
    "menu-button " +
    className;

  link.href =
    href;


  link.innerHTML = `

    <span class="menu-icon">
      ${icon}
    </span>

    <span class="menu-label">
      ${label}
    </span>

  `;


  container.appendChild(
    link
  );

}


/* =====================================================
   MAIN BRANCH SECTION
===================================================== */

function showMainBranches(){

  const section =
    document.getElementById(
      "mainBranchSection"
    );

  if(!isMain){

    section.classList.add(
      "hidden"
    );

    return;

  }


  section.classList.remove(
    "hidden"
  );


  const grid =
    document.getElementById(
      "branchGrid"
    );

  grid.innerHTML = "";


  BRANCHES.forEach(
    branch => {

      const card =
        document.createElement(
          "div"
        );

      card.className =
        "branch-card";


      card.innerHTML = `

        <h3>
          ${escapeHtml(branch.name)}
        </h3>

        <p>
          ${escapeHtml(branch.code)}
        </p>

        <button
          class="branch-open"
          onclick="
            openBranch(
              '${branch.id}',
              '${escapeHtml(branch.code)}',
              '${escapeHtml(branch.name)}'
            )
          "
        >
          ◉ ${t("openBranch")}
        </button>

      `;


      grid.appendChild(
        card
      );

    }
  );

}


/* =====================================================
   OPEN BRANCH
===================================================== */

function openBranch(
  id,
  code,
  name
){

  localStorage.setItem(
    "selected_branch_uuid",
    id
  );

  localStorage.setItem(
    "selected_branch_code",
    code
  );

  localStorage.setItem(
    "selected_branch_name",
    name
  );

  localStorage.setItem(
    "selected_branch_id",
    id
  );

  localStorage.setItem(
    "branch_code",
    code
  );

  localStorage.setItem(
    "branch_name",
    name
  );

  window.location.href =
    "dashboard.html";

}

    if(isMain){

          "items",
          {
            select:"*"
          }
        );

    }else{

/* =====================================================
   CATEGORY DATA
===================================================== */

function prepareCategoryData(
  items,
  transactions
){

  const result = {};


  CATEGORIES.forEach(
    category => {

      result[category] = {
        items:[],
        stockIn:0,
        stockOut:0
      };

    }
  );


  items.forEach(
    item => {

      const category =
        item.category ||
        "Daily Food Items";


      if(
        !result[category]
      ){

        result[category] = {
          items:[],
          stockIn:0,
          stockOut:0
        };

      }


      result[category]
        .items
        .push(item);

    }
  );


  transactions.forEach(
    tx => {

      const category =
        tx.category ||
        "Daily Food Items";


      if(
        !result[category]
      ){

        result[category] = {
          items:[],
          stockIn:0,
          stockOut:0
        };

      }


      const quantity =
        Number(
          tx.quantity
        ) || 0;


      const type =
        String(
          tx.transaction_type ||
          tx.transaction ||
          ""
        ).toUpperCase();


      if(
        type.includes("IN") ||
        type.includes("RECEIVE")
      ){

        result[category]
          .stockIn += quantity;

      }


      if(
        type.includes("OUT") ||
        type.includes("ISSUE")
      ){

        result[category]
          .stockOut += quantity;

      }

    }
  );


  return result;

}

/* =====================================================
   SHOW ALL BRANCHES
===================================================== */

async function showAllBranches(){

  if(!isMain){

  }


  try{

    const items =
      await loadItems();

    const transactions =
      await loadTransactions();

    const categoryData =
      prepareCategoryData(
        items,

      );

    console.log(

      categoryData
    );

  }catch(error){

    console.error(
      error
    );

  }

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(
  value
){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


/* =====================================================
   REFRESH
===================================================== */

async function refreshDashboard(){

  setStatus(
    t("loading"),
    "loading"
  );


  try{

    await loadDashboard();

  }catch(error){

    console.error(
      error
    );

    setStatus(
      t("error"),
      "error"
    );

  }

}


/* =====================================================
   DASHBOARD
===================================================== */

async function loadDashboard(){

  setStatus(
    t("loading"),
    "loading"
  );


  showBranch();

  setupMenu();

  showMainBranches();


  try{

    const items =
      await loadItems();


    const transactions =
      await loadTransactions();


    prepareCategoryData(
      items,
      transactions
    );


    if(isMain){

      await showAllBranches();

    }


    setStatus(
      t("loaded"),
      "success"
    );


  }catch(error){

    console.error(
      "Dashboard error:",
      error
    );


    setStatus(
      t("error"),
      "error"
    );

  }

}

   GO DASHBOARD
===================================================== */

function goDashboard(){

}


/* =====================================================
   LOGOUT
===================================================== */

function logout(){

  const keys = [

    "is_logged_in",
    "user_role",
    "login_user",

    "selected_branch_uuid",
    "selected_branch_code",
    "selected_branch_name",

    "selected_branch_id",
    "branch_code",
    "branch_name"

  ];


  keys.forEach(
    key =>
      localStorage.removeItem(
        key
      )
  );


  window.location.href =
    "index.html";

}


/* =====================================================
   LANGUAGE APPLY
===================================================== */

function applyLanguage(){

  document.querySelectorAll(
    "[data-i18n]"
  ).forEach(
    element => {

      const key =
        element.getAttribute(
          "data-i18n"
        );


      element.textContent =
        t(key);

    }
  );


  document.querySelector(
    ".bottom-button:nth-child(1)"
  ).textContent =
    t("refresh");


  document.querySelector(
    ".bottom-button:nth-child(2)"
  ).textContent =
    t("dashboard");


  document.querySelector(
    ".bottom-button:nth-child(3)"
  ).textContent =
    t("logout");

}


/* =====================================================
   START
===================================================== */

document.addEventListener(
  "DOMContentLoaded",
  async function(){

    showBranch();

    setupMenu();

    applyLanguage();

    await loadDashboard();

  }
);
