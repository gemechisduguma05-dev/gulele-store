<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>AAFDRMC - Dashboard</title><style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f1f5f9;
}

header {
  background: #1e3a8a;
  color: white;
  padding: 20px;
  text-align: center;
}

header h1 {
  margin: 0;
}

header p {
  margin: 5px 0 0;
}

nav {
  background: white;
  padding: 12px;
  display: flex;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

nav a {
  text-decoration: none;
  padding: 10px 15px;
  border-radius: 7px;
  background: #e2e8f0;
  color: #1e293b;
  font-weight: bold;
}

nav a:hover {
  background: #cbd5e1;
}

.container {
  width: 95%;
  max-width: 1200px;
  margin: 25px auto;
}

.box {
  background: white;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.1);
}

.box h2 {
  margin-top: 0;
  text-align: center;
}

.dashboard {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 15px;
}

.card {
  padding: 20px;
  background: #f8fafc;
  border-radius: 10px;
  text-align: center;
  font-weight: bold;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.card strong {
  display: block;
  font-size: 25px;
  margin-top: 10px;
}

.logout {
  background: #dc2626 !important;
  color: white !important;
}

</style></head><body><header>  <h1>🏢 AAFDRMC</h1>  <p>Stock Management System</p></header><nav>  <a href="dashboard.html">
    🏠 Dashboard
  </a>  <a href="items.html">
    📦 Items
  </a>  <a href="stock.html">
    🔄 Stock In / Out
  </a>  <a href="reports.html">
    📊 Reports
  </a>  <a href="settings.html">
    ⚙️ Settings
  </a>  <a href="#" class="logout" onclick="logoutUser()">
    🚪 Logout
  </a></nav><div class="container">  <div class="box"><h2>📊 Dashboard</h2>

<div class="dashboard">

  <div class="card">

    Total Items

    <strong id="totalItems">
      0
    </strong>

  </div>


  <div class="card">

    📥 Total Stock In

    <strong id="totalStockIn">
      0
    </strong>

  </div>


  <div class="card">

    📦 Total Quantity

    <strong id="totalQuantity">
      0
    </strong>

  </div>


  <div class="card">

    💰 Stock Value

    <strong id="stockValue">
      0.00
    </strong>

  </div>


  <div class="card">

    📈 Expected Profit

    <strong id="expectedProfit">
      0.00
    </strong>

  </div>

</div>

  </div></div><script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://sslabegtsxlkafuygmar.supabase.co";

const SUPABASE_KEY =
"sb_publishable_M6oxZjm6xF5NbrXkSO9JqA_7JGSucXq";


/* =========================
   CHECK LOGIN
========================= */

const accessToken =
  localStorage.getItem("access_token");

if (!accessToken) {

  window.location.href =
    "index.html";

}


/* =========================
   UPDATE DASHBOARD
========================= */

async function updateDashboard() {

  const token =
    localStorage.getItem("access_token")
    || SUPABASE_KEY;


  /* =========================
     STOCK IN
  ========================= */

  const stockInResponse =
    await fetch(
      SUPABASE_URL +
      "/rest/v1/stock_transactions?transaction_type=eq.IN&select=quantity",
      {
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization":
            "Bearer " + token
        }
      }
    );


  let totalStockIn = 0;


  if (stockInResponse.ok) {

    const stockInData =
      await stockInResponse.json();

    totalStockIn =
      stockInData.reduce(
        (sum, row) =>
          sum + Number(row.quantity || 0),
        0
      );

  }


  document.getElementById(
    "totalStockIn"
  ).textContent =
    totalStockIn;


  /* =========================
     ITEMS
  ========================= */

  const response =
    await fetch(
      SUPABASE_URL +
      "/rest/v1/items?select=*",
      {
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization":
            "Bearer " + token
        }
      }
    );


  if (!response.ok) {

    console.log(
      "Dashboard Error:",
      await response.text()
    );

    return;

  }


  const data =
    await response.json();


  /* =========================
     TOTAL ITEMS
  ========================= */

  const totalItems =
    data.length;


  /* =========================
     TOTAL QUANTITY
  ========================= */

  const totalQuantity =
    data.reduce(
      (sum, item) =>
        sum +
        Number(item.quantity || 0),
      0
    );


  /* =========================
     STOCK VALUE
  ========================= */

  const stockValue =
    data.reduce(
      (sum, item) =>
        sum +
        Number(item.quantity || 0) *
        Number(item.cost_price || 0),
      0
    );


  /* =========================
     EXPECTED PROFIT
  ========================= */

  const expectedProfit =
    data.reduce(
      (sum, item) =>
        sum +
        Number(item.quantity || 0) *
        (
          Number(item.selling_price || 0) -
          Number(item.cost_price || 0)
        ),
      0
    );


  /* =========================
     SHOW
  ========================= */

  document.getElementById(
    "totalItems"
  ).textContent =
    totalItems;


  document.getElementById(
    "totalQuantity"
  ).textContent =
    totalQuantity;


  document.getElementById(
    "stockValue"
  ).textContent =
    stockValue.toFixed(2);


  document.getElementById(
    "expectedProfit"
  ).textContent =
    expectedProfit.toFixed(2);

}


/* =========================
   LOGOUT
========================= */

function logoutUser() {

  localStorage.removeItem(
    "access_token"
  );

  localStorage.removeItem(
    "refresh_token"
  );

  window.location.href =
    "index.html";

}


/* =========================
   START
========================= */

updateDashboard();

</script></body>
</html>
