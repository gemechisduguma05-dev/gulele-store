<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AAFDRMC - Dashboard</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f1f5f9;
  color:#1e293b;
}

header{
  background:#1e3a8a;
  color:white;
  padding:22px 15px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:25px;
}

.branch{
  margin-top:10px;
  font-size:18px;
  font-weight:bold;
}

.container{
  width:94%;
  max-width:1200px;
  margin:22px auto;
}

.card{
  background:white;
  border-radius:14px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.title{
  font-size:24px;
  font-weight:bold;
  color:#1e3a8a;
  margin-bottom:18px;
}

.menu-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.btn{
  border:0;
  border-radius:10px;
  padding:17px 12px;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
  text-decoration:none;
  text-align:center;
  display:block;
}

.items{
  background:#15803d;
}

.stock{
  background:#dc2626;
}

.report{
  background:#ea580c;
}

.category{
  background:#7c3aed;
}

.settings{
  background:#475569;
}

.refresh{
  background:#1e3a8a;
}

.menu{
  background:#64748b;
}

.logout{
  background:#991b1b;
}

.summary{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
}

.summary-card{
  background:white;
  border-radius:12px;
  padding:20px;
  box-shadow:0 3px 10px rgba(0,0,0,.07);
}

.summary-card span{
  display:block;
  color:#64748b;
  font-weight:bold;
  font-size:16px;
}

.summary-card strong{
  display:block;
  margin-top:8px;
  color:#1e3a8a;
  font-size:30px;
}

.message{
  padding:15px;
  border-radius:9px;
  margin-bottom:18px;
  display:none;
  font-weight:bold;
}

.message.show{
  display:block;
}

.error{
  background:#fee2e2;
  color:#991b1b;
}

.success{
  background:#dcfce7;
  color:#166534;
}

@media(max-width:700px){

  .menu-grid{
    grid-template-columns:1fr;
  }

  .summary{
    grid-template-columns:repeat(2,1fr);
  }

}

@media(max-width:450px){

  header h1{
    font-size:21px;
  }

  .branch{
    font-size:16px;
  }

  .summary{
    grid-template-columns:1fr;
  }

  .btn{
    font-size:16px;
  }

}

</style>
</head>

<body>

<header>

  <h1>
    AAFDRMC - STOCK MANAGEMENT
  </h1>

  <div
    id="branchName"
    class="branch">
    Loading Branch...
  </div>

</header>


<div class="container">


<!-- MESSAGE -->

<div
  id="message"
  class="message">
</div>


<!-- MAIN MENU -->

<div class="card">

  <div class="title">
    📊 Dashboard
  </div>

  <div class="menu-grid">

    <a
      href="items.html"
      class="btn items">
      📦 Items
    </a>

    <a
      href="stock.html"
      class="btn stock">
      📥 Stock IN / OUT
    </a>

    <a
      href="reports.html"
      class="btn report">
      📊 Stock Report
    </a>

    <a
      href="category.html"
      class="btn category">
      🗂️ Categories
    </a>

    <a
      href="settings.html"
      class="btn settings">
      ⚙️ Settings
    </a>

    <button
      class="btn refresh"
      onclick="loadDashboard()">
      🔄 Refresh
    </button>

    <a
      href="index.html"
      class="btn menu">
      ⬅️ Main Menu
    </a>

    <button
      class="btn logout"
      onclick="logout()">
      🚪 Logout
    </button>

  </div>

</div>


<!-- SUMMARY -->

<div class="summary">

  <div class="summary-card">

    <span>
      📦 Total Items
    </span>

    <strong id="totalItems">
      0
    </strong>

  </div>


  <div class="summary-card">

    <span>
      🟢 Stock IN
    </span>

    <strong id="totalIn">
      0
    </strong>

  </div>


  <div class="summary-card">

    <span>
      🔴 Stock OUT
    </span>

    <strong id="totalOut">
      0
    </strong>

  </div>


  <div class="summary-card">

    <span>
      📊 Current Balance
    </span>

    <strong id="balance">
      0
    </strong>

  </div>

</div>


</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://sslabegtsxlkafuygmar.supabase.co";

const SUPABASE_KEY =
"sb_publishable_M6oxZjm6xF5NbrXkSO9JqA_7JGSucXq";


/* =====================================================
   BRANCH
===================================================== */

const branchId =
localStorage.getItem(
  "selected_branch_id"
);

const branchName =
localStorage.getItem(
  "selected_branch_name"
);


/* =====================================================
   HEADERS
===================================================== */

function getHeaders(){

  const token =
    localStorage.getItem(
      "access_token"
    );

  return {

    "apikey":
      SUPABASE_KEY,

    "Authorization":
      "Bearer " +
      (token || SUPABASE_KEY),

    "Content-Type":
      "application/json"

  };

}


/* =====================================================
   BRANCH DISPLAY
===================================================== */

function showBranch(){

  const box =
    document.getElementById(
      "branchName"
    );

  if(
    branchId &&
    branchName
  ){

    box.textContent =
      "🏢 Branch: " +
      branchName;

    return true;

  }

  box.textContent =
    "⚠️ Branch hin filatamne";

  showMessage(
    "❌ Mee gara Main Menu deebi'ii Branch filadhu.",
    "error"
  );

  return false;

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
  text,
  type
){

  const box =
    document.getElementById(
      "message"
    );

  box.textContent =
    text;

  box.className =
    "message show " +
    type;

}


/* =====================================================
   LOAD ITEMS
===================================================== */

async function loadItems(){

  if(!branchId)
    return [];

  try{

    const url =
      SUPABASE_URL +
      "/rest/v1/items" +
      "?select=*" +
      "&branch_id=eq." +
      encodeURIComponent(branchId);

    const response =
      await fetch(
        url,
        {
          headers:
            getHeaders()
        }
      );

    if(!response.ok){

      console.error(
        await response.text()
      );

      return [];

    }

    return await response.json();

  }catch(error){

    console.error(error);

    return [];

  }

}


/* =====================================================
   LOAD TRANSACTIONS
===================================================== */

async function loadTransactions(){

  if(!branchId)
    return [];

  try{

    const url =
      SUPABASE_URL +
      "/rest/v1/stock_transactions" +
      "?select=*" +
      "&branch_id=eq." +
      encodeURIComponent(branchId);

    const response =
      await fetch(
        url,
        {
          headers:
            getHeaders()
        }
      );

    if(!response.ok){

      console.error(
        await response.text()
      );

      return [];

    }

    return await response.json();

  }catch(error){

    console.error(error);

    return [];

  }

}


/* =====================================================
   DASHBOARD
===================================================== */

async function loadDashboard(){

  if(!showBranch())
    return;

  document.getElementById(
    "totalItems"
  ).textContent =
    "...";

  document.getElementById(
    "totalIn"
  ).textContent =
    "...";

  document.getElementById(
    "totalOut"
  ).textContent =
    "...";

  document.getElementById(
    "balance"
  ).textContent =
    "...";


  const items =
    await loadItems();

  const transactions =
    await loadTransactions();


  let totalIn = 0;

  let totalOut = 0;


  transactions.forEach(
    t => {

      const quantity =
        Number(
          t.quantity || 0
        );

      const type =
        String(
          t.transaction_type ||
          t.transaction ||
          ""
        ).toUpperCase();


      if(type === "IN"){

        totalIn += quantity;

      }


      if(type === "OUT"){

        totalOut += quantity;

      }

    }
  );


  /*
    Items page irratti
    opening quantity yoo jiraate
    balance keessatti dabala.
  */

  let openingStock = 0;


  items.forEach(
    item => {

      openingStock +=
        Number(
          item.quantity || 0
        );

    }
  );


  const currentBalance =
    openingStock +
    totalIn -
    totalOut;


  document.getElementById(
    "totalItems"
  ).textContent =
    items.length;


  document.getElementById(
    "totalIn"
  ).textContent =
    totalIn.toLocaleString();


  document.getElementById(
    "totalOut"
  ).textContent =
    totalOut.toLocaleString();


  document.getElementById(
    "balance"
  ).textContent =
    currentBalance.toLocaleString();

}


/* =====================================================
   LOGOUT
===================================================== */

function logout(){

  localStorage.removeItem(
    "access_token"
  );

  localStorage.removeItem(
    "selected_branch_id"
  );

  localStorage.removeItem(
    "selected_branch_name"
  );

  window.location.href =
    "login.html";

}


/* =====================================================
   START
===================================================== */

loadDashboard();

</script>

</body>
</html>
