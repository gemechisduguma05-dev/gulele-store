<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>AAFDRMC - Stock In / Out</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f1f5f9;
  color: #1e293b;
}

header {
  background: #1e3a8a;
  color: white;
  padding: 20px;
  text-align: center;
}

header h1 {
  margin: 0;
}

header p {
  margin: 5px 0 0;
}

nav {
  background: white;
  padding: 12px;
  display: flex;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

nav a {
  text-decoration: none;
  padding: 10px 15px;
  border-radius: 7px;
  background: #e2e8f0;
  color: #1e293b;
  font-weight: bold;
}

.container {
  width: 95%;
  max-width: 1400px;
  margin: 25px auto;
}

.box {
  background: white;
  padding: 20px;
  margin-bottom: 20px;
  border-radius: 12px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.1);
}

.box h2 {
  text-align: center;
  margin-top: 0;
}

.stock-grid {
  display: grid;
  grid-template-columns:
    repeat(auto-fit, minmax(280px, 1fr));
  gap: 20px;
}

.stock-card {
  padding: 20px;
  border-radius: 12px;
  background: #f8fafc;
}

.stock-card.in {
  border-top: 5px solid #16a34a;
}

.stock-card.out {
  border-top: 5px solid #dc2626;
}

.stock-card h3 {
  text-align: center;
}

input,
select {
  width: 100%;
  padding: 12px;
  margin-bottom: 12px;
  border: 1px solid #cbd5e1;
  border-radius: 7px;
  font-size: 15px;
}

.stock-card button {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 7px;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

.stock-card.in button {
  background: #16a34a;
}

.stock-card.out button {
  background: #dc2626;
}

.table-container {
  width: 100%;
  overflow-x: auto;
}

table {
  width: 100%;
  min-width: 950px;
  border-collapse: collapse;
}

th {
  background: #1e3a8a;
  color: white;
  padding: 11px;
}

td {
  padding: 10px;
  text-align: center;
  border-bottom: 1px solid #ddd;
}

tbody tr:nth-child(even) {
  background: #f1f5f9;
}

.in-row {
  background: #dcfce7 !important;
}

.out-row {
  background: #fee2e2 !important;
}

.logout {
  background: #dc2626 !important;
  color: white !important;
}

</style>

</head>

<body>

<header>

<h1>🏢 AAFDRMC</h1>

<p>Stock Management System</p>

</header>


<nav>

<a href="dashboard.html">
🏠 Dashboard
</a>

<a href="items.html">
📦 Items
</a>

<a href="stock.html">
🔄 Stock In / Out
</a>

<a href="reports.html">
📊 Reports
</a>

<a href="settings.html">
⚙️ Settings
</a>

<a href="#"
   class="logout"
   onclick="logoutUser()">
🚪 Logout
</a>

</nav>


<div class="container">


<!-- STOCK FORM -->

<div class="box">

<h2>🔄 Stock Management</h2>

<div class="stock-grid">


<!-- STOCK IN -->

<div class="stock-card in">

<h3>📥 Stock In</h3>

<select id="inItem">

<option value="">
-- Select Item --
</option>

</select>

<input
  id="inQuantity"
  type="number"
  min="0.01"
  step="any"
  placeholder="Quantity"
>

<input
  id="inExpiry"
  type="date"
>

<input
  id="inEnteredBy"
  placeholder="Entered By"
>

<button onclick="stockIn()">
➕ Add Stock In
</button>

</div>


<!-- STOCK OUT -->

<div class="stock-card out">

<h3>📤 Stock Out</h3>

<select id="outItem">

<option value="">
-- Select Item --
</option>

</select>

<input
  id="outQuantity"
  type="number"
  min="0.01"
  step="any"
  placeholder="Quantity"
>

<input
  id="outEnteredBy"
  placeholder="Entered By"
>

<button onclick="stockOut()">
➖ Add Stock Out
</button>

</div>

</div>

</div>


<!-- TRANSACTIONS -->

<div class="box">

<h2>📋 Stock Transactions</h2>

<div class="table-container">

<table>

<thead>

<tr>

<th>Item</th>

<th>Category</th>

<th>Type</th>

<th>Quantity</th>

<th>EX Date</th>

<th>Entered By</th>

<th>Date</th>

</tr>

</thead>

<tbody id="transactionList">

<tr>

<td colspan="7">
Loading...
</td>

</tr>

</tbody>

</table>

</div>

</div>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://sslabegtsxlkafuygmar.supabase.co";

const SUPABASE_KEY =
"sb_publishable_M6oxZjm6xF5NbrXkSO9JqA_7JGSucXq";


/* =====================================================
   LOGIN
===================================================== */

const accessToken =
localStorage.getItem("access_token");

if (!accessToken) {

  window.location.href = "index.html";

}


const token =
localStorage.getItem("access_token")
|| SUPABASE_KEY;


/* =====================================================
   HEADERS
===================================================== */

function getHeaders() {

  return {

    "apikey": SUPABASE_KEY,

    "Authorization":
      "Bearer " + token

  };

}


/* =====================================================
   LOAD ITEMS
===================================================== */

async function loadItemsForStock() {

  try {

    const response =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/items" +
        "?select=id,name,unit,opening_quantity" +
        "&order=name.asc",

        {
          headers: getHeaders()
        }

      );


    if (!response.ok) {

      console.log(
        "Items Load Error:",
        await response.text()
      );

      return;

    }


    const data =
      await response.json();


    const inSelect =
      document.getElementById("inItem");

    const outSelect =
      document.getElementById("outItem");


    inSelect.innerHTML =
      '<option value="">-- Select Item --</option>';

    outSelect.innerHTML =
      '<option value="">-- Select Item --</option>';


    /*
      Calculate current balance for every item
    */

    const transactionResponse =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/stock_transactions" +
        "?select=item_id,transaction_type,quantity",

        {
          headers: getHeaders()
        }

      );


    let transactions = [];

    if (transactionResponse.ok) {

      transactions =
        await transactionResponse.json();

    }


    data.forEach(item => {

      const itemTransactions =
        transactions.filter(
          t =>
            String(t.item_id) ===
            String(item.id)
        );


      const stockIn =
        itemTransactions
        .filter(
          t =>
            String(
              t.transaction_type
            ).toUpperCase() === "IN"
        )
        .reduce(
          (sum, t) =>
            sum + Number(t.quantity || 0),
          0
        );


      const stockOut =
        itemTransactions
        .filter(
          t =>
            String(
              t.transaction_type
            ).toUpperCase() === "OUT"
        )
        .reduce(
          (sum, t) =>
            sum + Number(t.quantity || 0),
          0
        );


      const opening =
        Number(
          item.opening_quantity || 0
        );


      const balance =
        opening +
        stockIn -
        stockOut;


      const option1 =
        document.createElement("option");


      option1.value =
        item.id;


      option1.textContent =
        item.name +
        " | Stock: " +
        balance +
        (item.unit
          ? " " + item.unit
          : "");


      inSelect.appendChild(option1);


      const option2 =
        document.createElement("option");


      option2.value =
        item.id;


      option2.textContent =
        item.name +
        " | Stock: " +
        balance +
        (item.unit
          ? " " + item.unit
          : "");


      outSelect.appendChild(option2);

    });


  } catch (error) {

    console.log(
      "Load Items Error:",
      error
    );

  }

}


/* =====================================================
   STOCK IN
===================================================== */

async function stockIn() {

  const itemId =
    document.getElementById(
      "inItem"
    ).value;


  const quantity =
    Number(
      document.getElementById(
        "inQuantity"
      ).value
    );


  const expiryDate =
    document.getElementById(
      "inExpiry"
    ).value;


  const enteredBy =
    document.getElementById(
      "inEnteredBy"
    ).value.trim();


  if (
    !itemId ||
    !quantity ||
    quantity <= 0 ||
    !enteredBy
  ) {

    alert(
      "Item, Quantity fi Entered By guuti."
    );

    return;

  }


  /*
    EX DATE is required for STOCK IN
  */

  if (!expiryDate) {

    alert(
      "EX Date galchi."
    );

    return;

  }


  try {

    const response =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/stock_transactions",

        {

          method: "POST",

          headers: {

            ...getHeaders(),

            "Content-Type":
              "application/json",

            "Prefer":
              "return=minimal"

          },

          body:
            JSON.stringify({

              item_id:
                itemId,

              quantity:
                quantity,

              transaction_type:
                "IN",

              entered_by:
                enteredBy,

              expiry_date:
                expiryDate

            })

        }

      );


    if (!response.ok) {

      alert(
        "Stock In Error: " +
        await response.text()
      );

      return;

    }


    /*
      IMPORTANT:
      We DO NOT update items.quantity here.

      Opening remains Opening.
      Stock In remains Stock In.
      Balance is calculated from transactions.
    */


    alert(
      "✅ Stock In fi EX Date sirriitti galmaa'eera!"
    );


    document.getElementById(
      "inItem"
    ).value = "";


    document.getElementById(
      "inQuantity"
    ).value = "";


    document.getElementById(
      "inExpiry"
    ).value = "";


    document.getElementById(
      "inEnteredBy"
    ).value = "";


    await loadItemsForStock();

    await loadTransactions();


  } catch (error) {

    alert(
      "Stock In Error: " +
      error.message
    );

  }

}


/* =====================================================
   STOCK OUT
===================================================== */

async function stockOut() {

  const itemId =
    document.getElementById(
      "outItem"
    ).value;


  const quantity =
    Number(
      document.getElementById(
        "outQuantity"
      ).value
    );


  const enteredBy =
    document.getElementById(
      "outEnteredBy"
    ).value.trim();


  if (
    !itemId ||
    !quantity ||
    quantity <= 0 ||
    !enteredBy
  ) {

    alert(
      "Item, Quantity fi Entered By guuti."
    );

    return;

  }


  try {

    /*
      Get opening quantity
    */

    const itemResponse =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/items" +
        "?id=eq." +
        encodeURIComponent(itemId) +
        "&select=opening_quantity",

        {
          headers: getHeaders()
        }

      );


    if (!itemResponse.ok) {

      alert(
        "Item load error."
      );

      return;

    }


    const itemData =
      await itemResponse.json();


    if (!itemData.length) {

      alert(
        "Item hin argamne."
      );

      return;

    }


    const opening =
      Number(
        itemData[0].opening_quantity || 0
      );


    /*
      Get transactions for this item
    */

    const transactionResponse =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/stock_transactions" +
        "?item_id=eq." +
        encodeURIComponent(itemId) +
        "&select=transaction_type,quantity",

        {
          headers: getHeaders()
        }

      );


    if (!transactionResponse.ok) {

      alert(
        "Transaction load error."
      );

      return;

    }


    const transactions =
      await transactionResponse.json();


    let totalIn = 0;

    let totalOut = 0;


    transactions.forEach(t => {

      if (
        String(
          t.transaction_type
        ).toUpperCase() === "IN"
      ) {

        totalIn +=
          Number(t.quantity || 0);

      }


      if (
        String(
          t.transaction_type
        ).toUpperCase() === "OUT"
      ) {

        totalOut +=
          Number(t.quantity || 0);

      }

    });


    const balance =
      opening +
      totalIn -
      totalOut;


    if (quantity > balance) {

      alert(
        "❌ Stock gahaa hin qabu.\n\n" +
        "Available Stock: " +
        balance
      );

      return;

    }


    /*
      Stock OUT has no expiry date
    */

    const response =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/stock_transactions",

        {

          method: "POST",

          headers: {

            ...getHeaders(),

            "Content-Type":
              "application/json",

            "Prefer":
              "return=minimal"

          },

          body:
            JSON.stringify({

              item_id:
                itemId,

              quantity:
                quantity,

              transaction_type:
                "OUT",

              entered_by:
                enteredBy,

              expiry_date:
                null

            })

        }

      );


    if (!response.ok) {

      alert(
        "Stock Out Error: " +
        await response.text()
      );

      return;

    }


    alert(
      "✅ Stock Out galmaa'eera!"
    );


    document.getElementById(
      "outItem"
    ).value = "";


    document.getElementById(
      "outQuantity"
    ).value = "";


    document.getElementById(
      "outEnteredBy"
    ).value = "";


    await loadItemsForStock();

    await loadTransactions();


  } catch (error) {

    alert(
      "Stock Out Error: " +
      error.message
    );

  }

}


/* =====================================================
   LOAD TRANSACTIONS
===================================================== */

async function loadTransactions() {

  try {

    const response =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/stock_transactions" +
        "?select=*" +
        "&order=id.desc",

        {
          headers: getHeaders()
        }

      );


    if (!response.ok) {

      console.log(
        "Transaction Load Error:",
        await response.text()
      );

      return;

    }


    const data =
      await response.json();


    const list =
      document.getElementById(
        "transactionList"
      );


    list.innerHTML = "";


    if (!data.length) {

      list.innerHTML = `
        <tr>
          <td colspan="7">
            No transactions found
          </td>
        </tr>
      `;

      return;

    }


    /*
      Load all items once
    */

    const itemResponse =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/items" +
        "?select=id,name,category",

        {
          headers: getHeaders()
        }

      );


    let items = [];

    if (itemResponse.ok) {

      items =
        await itemResponse.json();

    }


    data.forEach(transaction => {

      const item =
        items.find(
          i =>
            String(i.id) ===
            String(transaction.item_id)
        );


      const itemName =
        item?.name || "Unknown";


      const category =
        item?.category || "";


      const rowClass =
        String(
          transaction.transaction_type
        ).toUpperCase() === "IN"
          ? "in-row"
          : "out-row";


      const type =
        String(
          transaction.transaction_type
        ).toUpperCase() === "IN"
          ? "📥 IN"
          : "📤 OUT";


      const expiry =
        transaction.expiry_date
          ? formatDate(
              transaction.expiry_date
            )
          : "-";


      const enteredBy =
        transaction.entered_by || "";


      const date =
        transaction.created_at
          ? formatDateTime(
              transaction.created_at
            )
          : "";


      list.innerHTML += `

        <tr class="${rowClass}">

          <td>
            ${escapeHTML(itemName)}
          </td>

          <td>
            ${escapeHTML(category)}
          </td>

          <td>
            ${type}
          </td>

          <td>
            ${Number(
              transaction.quantity || 0
            )}
          </td>

          <td>
            ${expiry}
          </td>

          <td>
            ${escapeHTML(enteredBy)}
          </td>

          <td>
            ${date}
          </td>

        </tr>

      `;

    });


  } catch (error) {

    console.log(
      "Transaction Error:",
      error
    );

  }

}


/* =====================================================
   DATE
===================================================== */

function formatDate(dateValue) {

  if (!dateValue) return "";

  const parts =
    String(dateValue).split("-");


  if (parts.length === 3) {

    return (
      parts[2] +
      "/" +
      parts[1] +
      "/" +
      parts[0]
    );

  }


  return dateValue;

}


function formatDateTime(dateValue) {

  const d =
    new Date(dateValue);


  if (isNaN(d.getTime())) {

    return "";

  }


  return d.toLocaleDateString();

}


/* =====================================================
   SECURITY
===================================================== */

function escapeHTML(value) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =====================================================
   LOGOUT
===================================================== */

function logoutUser() {

  localStorage.removeItem(
    "access_token"
  );

  localStorage.removeItem(
    "refresh_token"
  );

  window.location.href =
    "index.html";

}


/* =====================================================
   START
===================================================== */

loadItemsForStock();

loadTransactions();

</script>

</body>
</html>
