<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AAFDRMC - Stock</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f1f5f9;
  color: #1e293b;
}

header {
  background: #1e3a8a;
  color: white;
  padding: 18px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 22px;
}

.container {
  width: 96%;
  max-width: 1400px;
  margin: 20px auto;
}

.top-bar {
  background: white;
  padding: 16px;
  border-radius: 10px;
  margin-bottom: 15px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.category-title {
  font-size: 20px;
  font-weight: bold;
  color: #1e3a8a;
  line-height: 1.5;
}

.buttons {
  margin-top: 12px;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.btn {
  border: none;
  padding: 9px 15px;
  border-radius: 6px;
  cursor: pointer;
  text-decoration: none;
  color: white;
  background: #1e3a8a;
}

.btn.in {
  background: #15803d;
}

.btn.out {
  background: #dc2626;
}

.table-box {
  background: white;
  border-radius: 10px;
  overflow-x: auto;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 1200px;
}

th {
  background: #1e3a8a;
  color: white;
  padding: 11px;
  text-align: left;
  white-space: nowrap;
}

td {
  padding: 10px;
  border-bottom: 1px solid #e2e8f0;
  white-space: nowrap;
}

tr:hover {
  background: #f8fafc;
}

.in-row {
  border-left: 5px solid #15803d;
}

.out-row {
  border-left: 5px solid #dc2626;
}

.badge {
  padding: 5px 9px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: bold;
}

.badge-in {
  background: #dcfce7;
  color: #166534;
}

.badge-out {
  background: #fee2e2;
  color: #991b1b;
}

.signature {
  font-size: 20px;
}

.error {
  color: #dc2626;
  text-align: center;
  padding: 20px;
}

.loading {
  text-align: center;
  padding: 25px;
}

.summary {
  display: grid;
  grid-template-columns: repeat(
    auto-fit,
    minmax(180px, 1fr)
  );
  gap: 12px;
  margin-bottom: 18px;
}

.card {
  background: white;
  padding: 15px;
  border-radius: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.card strong {
  display: block;
  font-size: 25px;
  margin-top: 6px;
  color: #1e3a8a;
}

#unitTotals {
  display: grid;
  grid-template-columns: repeat(
    auto-fit,
    minmax(220px, 1fr)
  );
  gap: 15px;
  margin-top: 20px;
}

.total-card {
  background: white;
  padding: 18px;
  border-radius: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.total-card strong {
  display: block;
  font-size: 28px;
  margin: 8px 0;
  color: #1e3a8a;
}

.total-card small {
  line-height: 1.7;
  color: #475569;
}

</style>
</head>


<body>

<header>
  <h1>AAFDRMC - STOCK MANAGEMENT</h1>
</header>


<div class="container">


  <!-- CATEGORY -->

  <div class="top-bar">

    <div
      id="categoryTitle"
      class="category-title">
      📂 Stock Category
    </div>

    <div class="buttons">

      <a
        href="items.html"
        class="btn">
        ← Items
      </a>

      <button
        class="btn in"
        onclick="filterTransactions('IN')">
        Stock IN
      </button>

      <button
        class="btn out"
        onclick="filterTransactions('OUT')">
        Stock OUT
      </button>

      <button
        class="btn"
        onclick="filterTransactions('ALL')">
        All
      </button>

    </div>

  </div>


  <!-- SUMMARY -->

  <div class="summary">

    <div class="card">
      Total Opening
      <strong id="totalOpening">0</strong>
    </div>

    <div class="card">
      Total Stock IN
      <strong id="totalIn">0</strong>
    </div>

    <div class="card">
      Total Stock OUT
      <strong id="totalOut">0</strong>
    </div>

    <div class="card">
      Current Balance
      <strong id="totalBalance">0</strong>
    </div>

  </div>


  <!-- TRANSACTION TABLE -->

  <div class="table-box">

    <table>

      <thead>

        <tr>

          <th>No</th>
          <th>Item ID</th>
          <th>Item Name</th>
          <th>Quantity</th>
          <th>Unit</th>
          <th>Transaction</th>
          <th>Transaction Type</th>
          <th>Entered By</th>
          <th>Issued By</th>
          <th>Expiry Date</th>
          <th>Category</th>
          <th>Category ID</th>
          <th>Date / Time</th>
          <th>Signature</th>

        </tr>

      </thead>


      <tbody id="stockTable">

        <tr>

          <td
            colspan="14"
            class="loading">

            Loading stock transactions...

          </td>

        </tr>

      </tbody>

    </table>

  </div>


  <!-- UNIT TOTALS -->

  <div id="unitTotals"></div>


</div>



<script>


/* =====================================================
   SUPABASE CONFIGURATION
===================================================== */

const SUPABASE_URL =
  "https://sslabegtsxlkafuygmar.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_M6oxZjm6xF5NbrXkSO9JqA_7JGSucXq";


/* =====================================================
   HEADERS
===================================================== */

function getHeaders() {

  const accessToken =
    localStorage.getItem("access_token")
    || SUPABASE_KEY;

  return {

    "apikey":
      SUPABASE_KEY,

    "Authorization":
      "Bearer " + accessToken,

    "Content-Type":
      "application/json"

  };

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =====================================================
   CATEGORY ID
===================================================== */

const params =
  new URLSearchParams(
    window.location.search
  );

const categoryId =
  params.get("category_id")
  || params.get("categoryId")
  || params.get("id");


/* =====================================================
   CATEGORY INFORMATION
===================================================== */

const categories = {

  "1":
    "🥫 Meeshaalee Nyaataa Tarsiimawaa / Strategic Food Items / ስትራቴጂክ ምግብ ነክ",

  "2":
    "🍚 Meeshaalee Nyaataa Guyyaa Guyyaa / Daily Food Items / ምግብ ነክ የእለት ደሪሽ",

  "3":
    "📦 Meeshaalee Nyaataa Hin Taane Guyyaa Guyyaa / Daily Non-Food Items / ምግብ ነክ ያልሆነ የእለት ደሪሽ",

  "4":
    "🍳 Meeshaalee Nyaataa Hin Taane Ittiin Nyaata Qopheessan / Non-Food Kitchen Items / ምግብ ነክ ያልሆነ ምግብ እቃ",

  "5":
    "🧼 Meeshaalee Qulqullinaa / Non-Food Hygiene Items / ምግብ ነክ ያልሆነ የንጽሕና",

  "6":
    "🧱 Meeshaalee Ijaarsaa / Non-Food Construction Materials / ምግብ ነክ ያልሆነ የህንጻ መሳሪያ"

};


/* =====================================================
   CATEGORY TITLE
===================================================== */

document.getElementById(
  "categoryTitle"
).textContent =

  categories[categoryId]
  || "📂 Stock Category";


/* =====================================================
   GLOBAL DATA
===================================================== */

let allTransactions = [];

let allItems = [];


/* =====================================================
   LOAD ITEMS
===================================================== */

async function loadItems() {

  const response =
    await fetch(

      SUPABASE_URL +
      "/rest/v1/items?select=*",

      {
        headers:
          getHeaders()
      }

    );


  if (!response.ok) {

    console.log(
      "Items Error:",
      await response.text()
    );

    return [];

  }


  return await response.json();

}


/* =====================================================
   LOAD TRANSACTIONS
===================================================== */

async function loadTransactions() {

  const response =
    await fetch(

      SUPABASE_URL +
      "/rest/v1/stock_transactions?select=*&order=id.desc",

      {
        headers:
          getHeaders()
      }

    );


  if (!response.ok) {

    console.log(
      "Transaction Error:",
      await response.text()
    );

    return [];

  }


  return await response.json();

}


/* =====================================================
   LOAD STOCK
===================================================== */

async function loadStock() {

  const table =
    document.getElementById(
      "stockTable"
    );


  try {

    allItems =
      await loadItems();


    allTransactions =
      await loadTransactions();


    /* ===============================================
       FILTER BY CATEGORY
    =============================================== */

    let transactions =
      allTransactions;


    if (categoryId) {

      transactions =
        allTransactions.filter(

          t =>

            String(
              t.category_id
            ) ===
            String(categoryId)

        );

    }


    displayTransactions(
      transactions
    );


  }

  catch (error) {

    console.log(
      "Stock Error:",
      error
    );


    table.innerHTML = `

      <tr>

        <td
          colspan="14"
          class="error">

          Error loading stock.

        </td>

      </tr>

    `;

  }

}


/* =====================================================
   DISPLAY TRANSACTIONS
===================================================== */

function displayTransactions(
  transactions
) {

  const table =
    document.getElementById(
      "stockTable"
    );


  table.innerHTML = "";


  if (
    transactions.length === 0
  ) {

    table.innerHTML = `

      <tr>

        <td colspan="14">

          Transaction hin jiru.

        </td>

      </tr>

    `;

    updateSummary([]);

    return;

  }


  transactions.forEach(

    (t, index) => {


      /* =============================================
         FIND ITEM
      ============================================= */

      const item =
        allItems.find(

          i =>

            String(i.id) ===
            String(t.item_id)

        );


      const itemName =
        t.item_name
        || item?.name
        || "";


      const unit =
        t.unit
        || item?.unit
        || "";


      const category =
        t.category
        || item?.category
        || categories[
             String(
               t.category_id
             )
           ]
        || "";


      const transaction =
        String(
          t.transaction
          || t.transaction_type
          || ""
        ).toUpperCase();


      const transactionType =
        t.transaction_type
        || transaction;


      const enteredBy =
        t.entered_by
        || "";


      const issuedBy =
        t.issued_by
        || t.exited_by
        || "";


      const expiryDate =
        t.expiry_date
        || "";


      const signature =
        t.signature
        || t.sign
        || "";


      const dateTime =
        t.created_at
        || t.transaction_date
        || t.date
        || "";


      const row =
        document.createElement(
          "tr"
        );


      row.className =
        transaction === "OUT"
        ? "out-row"
        : "in-row";


      row.innerHTML = `

        <td>
          ${index + 1}
        </td>

        <td>
          ${escapeHTML(
            t.item_id || ""
          )}
        </td>

        <td>
          ${escapeHTML(
            itemName
          )}
        </td>

        <td>
          ${Number(
            t.quantity || 0
          )}
        </td>

        <td>
          ${escapeHTML(
            unit
          )}
        </td>

        <td>

          <span class="badge ${
            transaction === "OUT"
              ? "badge-out"
              : "badge-in"
          }">

            ${escapeHTML(
              transaction
            )}

          </span>

        </td>

        <td>
          ${escapeHTML(
            transactionType
          )}
        </td>

        <td>
          ${escapeHTML(
            enteredBy
          )}
        </td>

        <td>
          ${escapeHTML(
            issuedBy
          )}
        </td>

        <td>
          ${escapeHTML(
            expiryDate
          )}
        </td>

        <td>
          ${escapeHTML(
            category
          )}
        </td>

        <td>
          ${escapeHTML(
            t.category_id || ""
          )}
        </td>

        <td>
          ${escapeHTML(
            dateTime
          )}
        </td>

        <td class="signature">

          ${
            signature
              ? "✍️ " +
                escapeHTML(
                  signature
                )
              : "—"
          }

        </td>

      `;


      table.appendChild(
        row
      );

    }

  );


  updateSummary(
    transactions
  );


  updateUnitTotals(
    transactions
  );

}


/* =====================================================
   SUMMARY
===================================================== */

function updateSummary(
  transactions
) {

  let totalIn = 0;

  let totalOut = 0;


  transactions.forEach(

    t => {

      const type =
        String(
          t.transaction_type
          || t.transaction
          || ""
        ).toUpperCase();


      const quantity =
        Number(
          t.quantity || 0
        );


      if (
        type === "IN"
      ) {

        totalIn +=
          quantity;

      }


      if (
        type === "OUT"
      ) {

        totalOut +=
          quantity;

      }

    }

  );


  let opening = 0;


  allItems.forEach(

    item => {

      if (
        !categoryId ||
        String(
          item.category_id
        ) ===
        String(categoryId)
      ) {

        opening +=
          Number(
            item.opening_quantity
            || item.quantity
            || 0
          );

      }

    }

  );


  document.getElementById(
    "totalOpening"
  ).textContent =
    opening;


  document.getElementById(
    "totalIn"
  ).textContent =
    totalIn;


  document.getElementById(
    "totalOut"
  ).textContent =
    totalOut;


  document.getElementById(
    "totalBalance"
  ).textContent =
    opening +
    totalIn -
    totalOut;

}


/* =====================================================
   UNIT TOTALS
===================================================== */

function updateUnitTotals(
  transactions
) {

  const container =
    document.getElementById(
      "unitTotals"
    );


  container.innerHTML = "";


  const totals = {};


  transactions.forEach(

    t => {

      const item =
        allItems.find(

          i =>

            String(i.id) ===
            String(t.item_id)

        );


      const unit =
        t.unit
        || item?.unit
        || "Unknown";


      if (!totals[unit]) {

        totals[unit] = {

          in: 0,

          out: 0,

          balance: 0

        };

      }


      const quantity =
        Number(
          t.quantity || 0
        );


      const type =
        String(
          t.transaction_type
          || t.transaction
          || ""
        ).toUpperCase();


      if (
        type === "IN"
      ) {

        totals[unit].in +=
          quantity;

      }


      if (
        type === "OUT"
      ) {

        totals[unit].out +=
          quantity;

      }

    }

  );


  Object.keys(totals)
    .sort()
    .forEach(

      unit => {

        const total =
          totals[unit];


        const card =
          document.createElement(
            "div"
          );


        card.className =
          "total-card";


        card.innerHTML = `

          📏 ${escapeHTML(unit)}

          <strong>

            ${
              total.in -
              total.out
            }

          </strong>

          <small>

            Stock In:
            ${total.in}

            <br>

            Stock Out:
            ${total.out}

            <br>

            Net Movement:
            ${
              total.in -
              total.out
            }

          </small>

        `;


        container.appendChild(
          card
        );

      }

    );

}


/* =====================================================
   FILTER TRANSACTIONS
===================================================== */

function filterTransactions(
  type
) {

  let transactions =
    allTransactions;


  if (categoryId) {

    transactions =
      transactions.filter(

        t =>

          String(
            t.category_id
          ) ===
          String(categoryId)

      );

  }


  if (
    type !== "ALL"
  ) {

    transactions =
      transactions.filter(

        t =>

          String(
            t.transaction_type
            || t.transaction
            || ""
          ).toUpperCase() ===
          type

      );

  }


  displayTransactions(
    transactions
  );

}


/* =====================================================
   START
===================================================== */

loadStock();

</script>

</body>
</html>
