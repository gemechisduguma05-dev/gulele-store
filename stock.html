<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AAFDRMC - Stock Management</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f1f5f9;
  color:#1e293b;
}

.topbar{
  background:#0f172a;
  color:white;
  padding:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

.topbar h2{
  margin:0;
  font-size:20px;
}

.branch-badge{
  background:#2563eb;
  padding:8px 14px;
  border-radius:8px;
  font-size:14px;
}

.container{
  max-width:1200px;
  margin:20px auto;
  padding:0 15px;
}

.menu{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:20px;
}

button{
  border:0;
  border-radius:7px;
  padding:11px 16px;
  cursor:pointer;
  font-weight:bold;
}

.btn-blue{
  background:#2563eb;
  color:white;
}

.btn-green{
  background:#16a34a;
  color:white;
}

.btn-red{
  background:#dc2626;
  color:white;
}

.btn-gray{
  background:#475569;
  color:white;
}

.card{
  background:white;
  border-radius:12px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.card h3{
  margin-top:0;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:15px;
}

label{
  display:block;
  margin-bottom:6px;
  font-weight:bold;
}

input,
select{
  width:100%;
  padding:11px;
  border:1px solid #cbd5e1;
  border-radius:7px;
  background:white;
}

input[readonly]{
  background:#e2e8f0;
}

.form-actions{
  margin-top:18px;
}

.message{
  padding:12px;
  border-radius:7px;
  margin-bottom:15px;
  display:none;
}

.success{
  background:#dcfce7;
  color:#166534;
}

.error{
  background:#fee2e2;
  color:#991b1b;
}

.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:15px;
}

.stat{
  background:#f8fafc;
  border-radius:10px;
  padding:18px;
  border:1px solid #e2e8f0;
}

.stat strong{
  display:block;
  font-size:26px;
  margin-top:5px;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
}

th,
td{
  padding:10px;
  border-bottom:1px solid #e2e8f0;
  text-align:left;
}

th{
  background:#f8fafc;
}

.table-wrap{
  overflow-x:auto;
}

.model-box{
  margin-top:18px;
  padding:15px;
  border:1px solid #cbd5e1;
  border-radius:8px;
  background:#f8fafc;
}

.hidden{
  display:none;
}

@media(max-width:600px){
  .topbar{
    align-items:flex-start;
  }

  .topbar h2{
    font-size:17px;
  }

  button{
    width:100%;
  }

  .menu{
    flex-direction:column;
  }
}

</style>
</head>

<body>

<div class="topbar">

  <h2>AAFDRMC - Stock Management</h2>

  <div class="branch-badge" id="branchBadge">
    Branch
  </div>

</div>

<div class="container">

  <!-- MENU -->

  <div class="menu">

    <button class="btn-green" onclick="showStockIn()">
      Stock IN
    </button>

    <button class="btn-red" onclick="showStockOut()">
      Stock OUT
    </button>

    <button class="btn-blue" onclick="loadItems();loadTransactions();">

    </button>

    <button class="btn-gray" onclick="location.href='reports.html'">

    <button class="btn-gray" onclick="location.href='dashboard.html'">

    <button class="btn-gray" onclick="location.href='dashboard.html'">

  <div id="message" class="message"></div>


  <!-- STOCK IN -->

  <div class="card" id="stockInCard">

    <div class="form-grid">

      <div>
        <label>Item</label>

        <select id="inItem" onchange="setInUnit()">

        </select>

      </div>

      <div>

        <div>

  <!-- STOCK OUT -->

  <div class="card hidden" id="stockOutCard">

    <h3>Stock OUT</h3>

    <div class="form-grid">

      <div>

        <label>Item</label>

        <select id="outItem" onchange="setOutUnit()">

      </div>

        <label>Unit</label>

      <div>

        <label>Quantity</label>

        <input
          type="number"

          min="0"

      <div>

        <label>Guyyaa itti bahe</label>

      </div>

      <div>

      <div>

    </div>


    <!-- MODEL 22 -->

    <div class="model-box">

      <h4>Model 22</h4>

      <div class="form-grid">

        <div>

          <label>Model 22</label>

          <select id="model22Type">
            <option value="none">Hin jiru</option>
            <option value="number">Model 22 qaba</option>

  <!-- STATISTICS -->

        Total Stock OUT

    </div>

    <h3>Recent Transactions</h3>

      <table>

            <th>Type</th>
            <th>Quantity</th>
            <th>Unit</th>

            <th>Entered By</th>
            <th>Issued By</th>

            <th>Model 19</th>
            <th>Model 22</th>

        </thead>

        <tbody id="transactionBody">

</div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://sslabegtsxlkafuygmar.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_M6oxZjm6xF5NbrXkSO9JqA_7JGSucXq";


/* =========================================================
   LOGIN / BRANCH
========================================================= */

let CURRENT_BRANCH_CODE =
  localStorage.getItem("selected_branch_code") || "";

let CURRENT_BRANCH_NAME =
  localStorage.getItem("selected_branch_name") || "";

let CURRENT_BRANCH_UUID =
  localStorage.getItem("selected_branch_uuid") || "";

let USER_ROLE =
  localStorage.getItem("user_role") || "";

let allItems = [];
let allTransactions = [];


/* =========================================================
   HEADERS
========================================================= */

function getHeaders(){

  const token =
    localStorage.getItem("access_token") ||
    SUPABASE_KEY;

  return {
    "apikey": SUPABASE_KEY,
    "Authorization": "Bearer " + token,
    "Content-Type": "application/json"
  };

}


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(text,type="success"){

  const box =
    document.getElementById("message");

  box.textContent = text;

  box.className =
    "message " + type;

  box.style.display = "block";

  setTimeout(()=>{
    box.style.display = "none";
  },5000);

}


/* =========================================================
   LOGIN CHECK
========================================================= */

function checkLogin(){

  if(
    localStorage.getItem("is_logged_in")
    !== "true"
  ){

    location.href = "index.html";
    return false;

  }

  return true;

}


/* =========================================================
   MAIN USER
========================================================= */

function isMainUser(){

  return USER_ROLE.toLowerCase() === "main";

}


/* =========================================================
   BRANCH UUID RESOLVER
   IMPORTANT:
   Uses the SAME branch matching logic as items.html.
========================================================= */

async function resolveBranchUUID(){

  try{

    /*
      Always verify the branch from branches table.
      This prevents stale/wrong selected_branch_uuid
      from making the Item dropdown empty.
    */

    const url =
      SUPABASE_URL +
      "/rest/v1/branches?select=*";

    const response =
      await fetch(url,{
        method:"GET",
        headers:getHeaders()
      });

    if(!response.ok){

      const txt =
        await response.text();

      console.error(
        "Branch loading error:",
        txt
      );

      return CURRENT_BRANCH_UUID;

    }

    const branches =
      await response.json();


    let found = null;


    /* ---------- MATCH BY CODE ---------- */

    if(CURRENT_BRANCH_CODE){

      found =
        branches.find(b => {

          const possibleCodes = [

            b.code,
            b.branch_code,
            b.branchCode,
            b.branchcode,
            b.branch_id_code,
            b.short_code

          ];

          return possibleCodes.some(x =>
            String(x || "")
              .trim()
              .toLowerCase()
            ===
            String(CURRENT_BRANCH_CODE)
              .trim()
              .toLowerCase()
          );

        });

    }


    /* ---------- MATCH BY NAME ---------- */

    if(!found && CURRENT_BRANCH_NAME){

      found =
        branches.find(b => {

          const possibleNames = [

            b.name,
            b.branch_name,
            b.branch,
            b.branchName,
            b.title,
            b.branch_title,
            b.office_name,
            b.office

          ];

          return possibleNames.some(x =>
            String(x || "")
              .trim()
              .toLowerCase()
            ===
            String(CURRENT_BRANCH_NAME)
              .trim()
              .toLowerCase()
          );

        });

    }


    if(found){

      const uuid =
        found.id ||
        found.uuid ||
        found.branch_id;

      if(uuid){

        CURRENT_BRANCH_UUID =
          String(uuid);

        localStorage.setItem(
          "selected_branch_uuid",
          CURRENT_BRANCH_UUID
        );

        console.log(
          "Correct Branch UUID:",
          CURRENT_BRANCH_UUID
        );

        return CURRENT_BRANCH_UUID;

      }

    }


    /*
      Main user does not need branch UUID.
    */

    if(isMainUser()){

      return "";

    }


    console.error(
      "Branch UUID not found.",
      {
        code:CURRENT_BRANCH_CODE,
        name:CURRENT_BRANCH_NAME
      }
    );

    return "";

  }catch(error){

    console.error(
      "resolveBranchUUID error:",
      error
    );

    return CURRENT_BRANCH_UUID;

  }

}


/* =========================================================
   LOAD ITEMS
   THIS IS THE IMPORTANT DROPDOWN FIX.
========================================================= */

async function loadItems(){

  try{

    /*
      For operational branches:
      find the real UUID from branches table.
    */

    if(!isMainUser()){

      CURRENT_BRANCH_UUID =
        await resolveBranchUUID();

    }


    if(
      !CURRENT_BRANCH_UUID &&
      !isMainUser()
    ){

      console.error(
        "Cannot load items: branch UUID missing."
      );

      fillItemLists([]);

      showMessage(
        "Branch UUID hin argamne. Item hin fe'amu.",
        "error"
      );

      return;

    }


    /*
      Exact same fields used by items.html.
    */

    let url =
      SUPABASE_URL +
      "/rest/v1/items" +
      "?select=id,name,category,unit,branch_id";


    /*
      Main can see all items.
      Branch sees only its own items.
    */

    if(!isMainUser()){

      url +=
        "&branch_id=eq." +
        encodeURIComponent(
          CURRENT_BRANCH_UUID
        );

    }


    url += "&order=name.asc";


    console.log(
      "Loading Items URL:",
      url
    );


    const response =
      await fetch(url,{
        method:"GET",
        headers:getHeaders()
      });


    if(!response.ok){

      const errorText =
        await response.text();

      console.error(
        "Items loading error:",
        errorText
      );

      fillItemLists([]);

      showMessage(
        "Items fe'uun hin danda'amne.",
        "error"
      );

      return;

    }


    const data =
      await response.json();


    allItems =
      Array.isArray(data)
        ? data
        : [];


    console.log(
      "Items loaded:",
      allItems.length,
      allItems
    );


    /*
      Fill BOTH:
      Stock IN Item
      Stock OUT Item
    */

    fillItemLists(allItems);


    document.getElementById(
      "totalItems"
    ).textContent =
      allItems.length;


  }catch(error){

    console.error(
      "loadItems error:",
      error
    );

    fillItemLists([]);

    showMessage(
      "Rakkoo Item loading: " +
      error.message,
      "error"
    );

  }

}


/* =========================================================
   FILL ITEM DROPDOWNS
========================================================= */

function fillItemLists(items = allItems){

  const inSelect =
    document.getElementById("inItem");

  const outSelect =
    document.getElementById("outItem");


  if(!inSelect || !outSelect){

    return;

  }


  /*
    Clear old options.
  */

  inSelect.innerHTML =
    '<option value="">Select Item</option>';

  outSelect.innerHTML =
    '<option value="">Select Item</option>';


  /*
    Add every item to BOTH dropdowns.
  */

  items.forEach(item => {

    const itemId =
      item.id;

    const itemName =
      item.name ||
      item.item_name ||
      item.item ||
      "";


    if(
      itemId === undefined ||
      itemId === null ||
      !itemName
    ){

      return;

    }


    const optionIn =
      document.createElement("option");

    optionIn.value =
      itemId;

    optionIn.textContent =
      itemName;

    inSelect.appendChild(
      optionIn
    );


    const optionOut =
      document.createElement("option");

    optionOut.value =
      itemId;

    optionOut.textContent =
      itemName;

    outSelect.appendChild(
      optionOut
    );

  });


  console.log(
    "IN dropdown:",
    inSelect.options.length - 1,
    "items"
  );

  console.log(
    "OUT dropdown:",
    outSelect.options.length - 1,
    "items"
  );

}


/* =========================================================
   FIND ITEM
========================================================= */

function findItem(id){

  return allItems.find(item =>
    String(item.id) === String(id)
  );

}


/* =========================================================
   IN UNIT
========================================================= */

function setInUnit(){

  const id =
    document.getElementById(
      "inItem"
    ).value;

  const item =
    findItem(id);


  document.getElementById(
    "inUnit"
  ).value =
    item
      ? (
          item.unit ||
          item.measurement ||
          item.safartuu ||
          ""
        )
      : "";

}


/* =========================================================
   OUT UNIT
========================================================= */

function setOutUnit(){

  const id =
    document.getElementById(
      "outItem"
    ).value;

  const item =
    findItem(id);


  document.getElementById(
    "outUnit"
  ).value =
    item
      ? (
          item.unit ||
          item.measurement ||
          item.safartuu ||
          ""
        )
      : "";

}


/* =========================================================
   SHOW STOCK IN
========================================================= */

function showStockIn(){

  document.getElementById(
    "stockInCard"
  ).classList.remove("hidden");

  document.getElementById(
    "stockOutCard"
  ).classList.add("hidden");

}


/* =========================================================
   SHOW STOCK OUT
========================================================= */

function showStockOut(){

  document.getElementById(
    "stockOutCard"
  ).classList.remove("hidden");

  document.getElementById(
    "stockInCard"
  ).classList.add("hidden");

}


/* =========================================================
   SAVE STOCK
   MODEL 19 / MODEL 22 PRESERVED.
========================================================= */

async function saveStock(type){

  try{

    if(!isMainUser() &&
       !CURRENT_BRANCH_UUID){

      await resolveBranchUUID();

    }


    if(
      !isMainUser() &&
      !CURRENT_BRANCH_UUID
    ){

      showMessage(
        "Branch hin argamne.",
        "error"
      );

      return;

    }


    let itemId;
    let quantity;
    let date;
    let enteredBy = "";
    let issuedBy = "";
    let expiryDate = null;
    let signature = "";
    let unit = "";
    let model19 = null;
    let model22 = null;


    /* =====================================================
       STOCK IN
    ===================================================== */

    if(type === "IN"){

      itemId =
        document.getElementById(
          "inItem"
        ).value;

      quantity =
        document.getElementById(
          "inQuantity"
        ).value;

      date =
        document.getElementById(
          "inDate"
        ).value;

      enteredBy =
        document.getElementById(
          "inEnteredBy"
        ).value.trim();

      expiryDate =
        document.getElementById(
          "inExpiry"
        ).value || null;

      signature =
        document.getElementById(
          "inSignature"
        ).value.trim();


      /* ---------- MODEL 19 ---------- */

      const model19Type =
        document.getElementById(
          "model19Type"
        ).value;

      const model19Value =
        document.getElementById(
          "inModel19"
        ).value.trim();


      if(model19Type === "number"){

        model19 =
          model19Value || null;

      }
      else if(model19Type === "verbal"){

        model19 =
          model19Value ||
          "Verbal";

      }
      else{

        model19 = null;

      }


    }


    /* =====================================================
       STOCK OUT
    ===================================================== */

    if(type === "OUT"){

      itemId =
        document.getElementById(
          "outItem"
        ).value;

      quantity =
        document.getElementById(
          "outQuantity"
        ).value;

      date =
        document.getElementById(
          "outDate"
        ).value;

      issuedBy =
        document.getElementById(
          "outIssuedBy"
        ).value.trim();

      signature =
        document.getElementById(
          "outSignature"
        ).value.trim();


      /* ---------- MODEL 22 ---------- */

      const model22Type =
        document.getElementById(
          "model22Type"
        ).value;

      const model22Value =
        document.getElementById(
          "outModel22"
        ).value.trim();


      if(model22Type === "number"){

        model22 =
          model22Value || null;

      }
      else if(model22Type === "verbal"){

        model22 =
          model22Value ||
          "Verbal";

      }
      else{

        model22 = null;

      }

    }


    /* =====================================================
       VALIDATION
    ===================================================== */

    if(!itemId){

      showMessage(
        "Item filadhu.",
        "error"
      );

      return;

    }


    if(
      quantity === "" ||
      Number(quantity) <= 0
    ){

      showMessage(
        "Quantity sirrii galchi.",
        "error"
      );

      return;

    }


    const item =
      findItem(itemId);


    if(!item){

      showMessage(
        "Item hin argamne.",
        "error"
      );

      return;

    }


    unit =
      item.unit ||
      item.measurement ||
      item.safartuu ||
      "";


    const itemName =
      item.name ||
      item.item_name ||
      item.item ||
      "";


    /* =====================================================
       PAYLOAD
    ===================================================== */

    const payload = {

      branch_id:
        CURRENT_BRANCH_UUID || null,

      branch_code:
        CURRENT_BRANCH_CODE || null,

      item_id:
        Number(item.id),

      transaction_type:
        type,

      quantity:
        Number(quantity),

      entered_by:
        enteredBy || null,

      entered_at:
        date
          ? date
          : null,

      expiry_date:
        expiryDate,

      category:
        item.category || null,

      issued_by:
        issuedBy || null,

      signature:
        signature || null,

      unit:
        unit || null,

      transaction:
        itemName,

      model_19:
        model19,

      model_22:
        model22

    };


    console.log(
      "Saving transaction:",
      payload
    );


    /* =====================================================
       INSERT
    ===================================================== */

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/stock_transactions",
        {
          method:"POST",

          headers:{
            ...getHeaders(),
            "Prefer":"return=representation"
          },

          body:
            JSON.stringify(payload)
        }
      );


    if(!response.ok){

      const errorText =
        await response.text();

      console.error(
        "Save error:",
        errorText
      );

      showMessage(
        "Save hin milko: " +
        errorText,
        "error"
      );

      return;

    }


    showMessage(
      "Stock " +
      type +
      " successfully saved.",
      "success"
    );


    /* =====================================================
       RESET
    ===================================================== */

    if(type === "IN"){

      document.getElementById(
        "inQuantity"
      ).value = "";

      document.getElementById(
        "inDate"
      ).value = "";

      document.getElementById(
        "inEnteredBy"
      ).value = "";

      document.getElementById(
        "inExpiry"
      ).value = "";

      document.getElementById(
        "inSignature"
      ).value = "";

      document.getElementById(
        "inModel19"
      ).value = "";

      document.getElementById(
        "model19Type"
      ).value = "none";

      document.getElementById(
        "inItem"
      ).value = "";

      setInUnit();

    }


    if(type === "OUT"){

      document.getElementById(
        "outQuantity"
      ).value = "";

      document.getElementById(
        "outDate"
      ).value = "";

      document.getElementById(
        "outIssuedBy"
      ).value = "";

      document.getElementById(
        "outSignature"
      ).value = "";

      document.getElementById(
        "outModel22"
      ).value = "";

      document.getElementById(
        "model22Type"
      ).value = "none";

      document.getElementById(
        "outItem"
      ).value = "";

      setOutUnit();

    }


    await loadTransactions();


  }catch(error){

    console.error(
      "saveStock error:",
      error
    );

    showMessage(
      "Rakkoo save: " +
      error.message,
      "error"
    );

  }

}


/* =========================================================
   LOAD TRANSACTIONS
========================================================= */

async function loadTransactions(){

  try{

    if(!isMainUser()){

      if(!CURRENT_BRANCH_UUID){

        await resolveBranchUUID();

      }

      if(!CURRENT_BRANCH_UUID){

        return;

      }

    }


    let url =
      SUPABASE_URL +
      "/rest/v1/stock_transactions" +
      "?select=*" +
      "&order=id.desc";


    if(
      !isMainUser() &&
      CURRENT_BRANCH_UUID
    ){

      url +=
        "&branch_id=eq." +
        encodeURIComponent(
          CURRENT_BRANCH_UUID
        );

    }


    const response =
      await fetch(url,{
        method:"GET",
        headers:getHeaders()
      });


    if(!response.ok){

      const text =
        await response.text();

      console.error(
        "Transaction loading error:",
        text
      );

      return;

    }


    allTransactions =
      await response.json();


    renderTransactions(
      allTransactions
    );


  }catch(error){

    console.error(
      "loadTransactions error:",
      error
    );

  }

}


/* =========================================================
   RENDER TRANSACTIONS
========================================================= */

function renderTransactions(data){

  const body =
    document.getElementById(
      "transactionBody"
    );


  body.innerHTML = "";


  if(!data.length){

    body.innerHTML =
      '<tr><td colspan="10">No transactions found.</td></tr>';

    updateSummary([]);

    return;

  }


  data.slice(0,50).forEach(row => {

    const tr =
      document.createElement("tr");


    const item =
      findItem(row.item_id);


    const itemName =
      item?.name ||
      row.transaction ||
      row.item_name ||
      "";


    tr.innerHTML = `

      <td>${escapeHtml(itemName)}</td>

      <td>${escapeHtml(
        row.transaction_type || ""
      )}</td>

      <td>${escapeHtml(
        row.quantity ?? ""
      )}</td>

      <td>${escapeHtml(
        row.unit || ""
      )}</td>

      <td>${escapeHtml(
        row.entered_at || ""
      )}</td>

      <td>${escapeHtml(
        row.entered_by || ""
      )}</td>

      <td>${escapeHtml(
        row.issued_by || ""
      )}</td>

      <td>${escapeHtml(
        row.expiry_date || ""
      )}</td>

      <td>${escapeHtml(
        row.model_19 || ""
      )}</td>

      <td>${escapeHtml(
        row.model_22 || ""
      )}</td>

    `;


    body.appendChild(tr);

  });


  updateSummary(data);

}


/* =========================================================
   SUMMARY
========================================================= */

function updateSummary(data){

  let totalIn = 0;
  let totalOut = 0;


  data.forEach(row => {

    const qty =
      Number(row.quantity) || 0;


    if(
      String(
        row.transaction_type || ""
      ).toUpperCase()
      === "IN"
    ){

      totalIn += qty;

    }


    if(
      String(
        row.transaction_type || ""
      ).toUpperCase()
      === "OUT"
    ){

      totalOut += qty;

    }

  });


  document.getElementById(
    "totalIn"
  ).textContent =
    totalIn;


  document.getElementById(
    "totalOut"
  ).textContent =
    totalOut;


  document.getElementById(
    "currentStock"
  ).textContent =
    totalIn - totalOut;

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================================
   INITIALIZE
========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  async function(){

    if(!checkLogin()){

      return;

    }


    CURRENT_BRANCH_CODE =
      localStorage.getItem(
        "selected_branch_code"
      ) || "";

    CURRENT_BRANCH_NAME =
      localStorage.getItem(
        "selected_branch_name"
      ) || "";

    USER_ROLE =
      localStorage.getItem(
        "user_role"
      ) || "";


    document.getElementById(
      "branchBadge"
    ).textContent =
      CURRENT_BRANCH_NAME ||
      CURRENT_BRANCH_CODE ||
      "Main";


    /*
      Default view = Stock IN
    */

    showStockIn();


    /*
      IMPORTANT:
      First resolve branch,
      then load items.
    */

    if(!isMainUser()){

      await resolveBranchUUID();

    }


    await loadItems();

    await loadTransactions();

  }
);
