<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>AAFDRMC - Stock Management</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f1f5f9;
  color: #1e293b;
}

header {
  background: #1e3a8a;
  color: white;
  padding: 18px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 22px;
}

.container {
  width: 96%;
  max-width: 1450px;
  margin: 20px auto;
}

.top-bar {
  background: white;
  padding: 16px;
  border-radius: 10px;
  margin-bottom: 15px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.title {
  font-size: 21px;
  font-weight: bold;
  color: #1e3a8a;
}

.buttons {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 12px;
}

.btn {
  border: none;
  padding: 10px 16px;
  border-radius: 7px;
  cursor: pointer;
  color: white;
  font-weight: bold;
}

.btn-in {
  background: #15803d;
}

.btn-out {
  background: #dc2626;
}

.btn-blue {
  background: #1e3a8a;
}

.btn-gray {
  background: #64748b;
}


/* ===============================
   FORM
================================ */

.form-box {
  display: none;
  background: white;
  padding: 20px;
  border-radius: 10px;
  margin-bottom: 18px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.form-box.show {
  display: block;
}

.form-title {
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 15px;
}

.form-title.in {
  color: #15803d;
}

.form-title.out {
  color: #dc2626;
}

.form-grid {
  display: grid;
  grid-template-columns:
    repeat(auto-fit, minmax(210px, 1fr));
  gap: 13px;
}

.form-group {
  display: flex;
  flex-direction: column;
}

.form-group label {
  font-weight: bold;
  margin-bottom: 6px;
}

.form-group input,
.form-group select {
  width: 100%;
  padding: 10px;
  border: 1px solid #cbd5e1;
  border-radius: 7px;
  font-size: 15px;
}

.form-group input:focus,
.form-group select:focus {
  outline: none;
  border-color: #1e3a8a;
}

.readonly {
  background: #f8fafc;
}

.submit-row {
  display: flex;
  gap: 10px;
  margin-top: 17px;
}

.save-btn {
  border: none;
  padding: 11px 20px;
  border-radius: 7px;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

.save-in {
  background: #15803d;
}

.save-out {
  background: #dc2626;
}

.cancel {
  background: #64748b;
}


/* ===============================
   MESSAGE
================================ */

.message {
  display: none;
  padding: 12px;
  border-radius: 7px;
  margin-bottom: 15px;
  font-weight: bold;
}

.message.success {
  display: block;
  background: #dcfce7;
  color: #166534;
}

.message.error {
  display: block;
  background: #fee2e2;
  color: #991b1b;
}


/* ===============================
   SUMMARY
================================ */

.summary {
  display: grid;
  grid-template-columns:
    repeat(auto-fit, minmax(180px, 1fr));
  gap: 12px;
  margin-bottom: 18px;
}

.card {
  background: white;
  padding: 16px;
  border-radius: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.card strong {
  display: block;
  font-size: 27px;
  margin-top: 7px;
  color: #1e3a8a;
}


/* ===============================
   TABLE
================================ */

.table-box {
  background: white;
  border-radius: 10px;
  overflow-x: auto;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 1200px;
}

th {
  background: #1e3a8a;
  color: white;
  padding: 11px;
  text-align: left;
  white-space: nowrap;
}

td {
  padding: 10px;
  border-bottom: 1px solid #e2e8f0;
  white-space: nowrap;
}

.in-row {
  border-left: 5px solid #15803d;
}

.out-row {
  border-left: 5px solid #dc2626;
}

.badge {
  padding: 5px 9px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: bold;
}

.badge-in {
  background: #dcfce7;
  color: #166534;
}

.badge-out {
  background: #fee2e2;
  color: #991b1b;
}


/* ===============================
   UNIT TOTAL
================================ */

#unitTotals {
  display: grid;
  grid-template-columns:
    repeat(auto-fit, minmax(220px, 1fr));
  gap: 15px;
  margin-top: 20px;
}

.total-card {
  background: white;
  padding: 18px;
  border-radius: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.total-card strong {
  display: block;
  font-size: 28px;
  margin: 8px 0;
  color: #1e3a8a;
}

.total-card small {
  line-height: 1.7;
  color: #475569;
}

</style>

</head>

<script>


/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://sslabegtsxlkafuygmar.supabase.co";


const SUPABASE_KEY =
"sb_publishable_M6oxZjm6xF5NbrXkSO9JqA_7JGSucXq";


/* =====================================================
   HEADERS
===================================================== */

function getHeaders() {

const accessToken =
localStorage.getItem("access_token")
|| SUPABASE_KEY;


return {

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer " + accessToken,

"Content-Type":
"application/json"

};

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHTML(value) {

return String(value ?? "")

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}


/* =====================================================
   GLOBAL
===================================================== */

let allItems = [];

let allTransactions = [];


/* =====================================================
   LOAD ITEMS
===================================================== */

async function loadItems() {

const response =
await fetch(

SUPABASE_URL +
"/rest/v1/items?select=*&order=id.asc",

{
headers:
getHeaders()
}

);


if(!response.ok) {

console.log(
"Items Error:",
await response.text()
);

return [];

}


return await response.json();

}


/* =====================================================
   LOAD TRANSACTIONS
===================================================== */

async function loadTransactions() {

const response =
await fetch(

SUPABASE_URL +
"/rest/v1/stock_transactions?select=*&order=id.desc",

{
headers:
getHeaders()
}

);


if(!response.ok) {

console.log(
"Transactions Error:",
await response.text()
);

return [];

}


return await response.json();

}


/* =====================================================
   FILL ITEM LIST
===================================================== */

function fillItemLists() {

const inSelect =
document.getElementById("inItem");


const outSelect =
document.getElementById("outItem");


inSelect.innerHTML = `
<option value="">
-- Select Item --
</option>
`;


outSelect.innerHTML = `
<option value="">
-- Select Item --
</option>
`;


allItems.forEach(

item => {

const option1 =
document.createElement("option");


option1.value =
item.id;


option1.textContent =
item.name;


option1.dataset.unit =
item.unit || "";


inSelect.appendChild(
option1
);


const option2 =
option1.cloneNode(true);


outSelect.appendChild(
option2
);

}

);

}


/* =====================================================
   ITEM UNIT
===================================================== */

document.getElementById(
"inItem"
).addEventListener(
"change",
function() {

const option =
this.options[
this.selectedIndex
];


document.getElementById(
"inUnit"
).value =
option?.dataset?.unit || "";

});


document.getElementById(
"outItem"
).addEventListener(
"change",
function() {

const option =
this.options[
this.selectedIndex
];


document.getElementById(
"outUnit"
).value =
option?.dataset?.unit || "";

});


/* =====================================================
   OPEN FORM
===================================================== */

function openStockForm(type) {

closeForms();


if(type === "IN") {

document.getElementById(
"stockInForm"
).classList.add("show");

}


if(type === "OUT") {

document.getElementById(
"stockOutForm"
).classList.add("show");

}

}


/* =====================================================
   CLOSE
===================================================== */

function closeForms() {

document.getElementById(
"stockInForm"
).classList.remove("show");


document.getElementById(
"stockOutForm"
).classList.remove("show");

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
text,
type
) {

const box =
document.getElementById(
"message"
);


box.textContent =
text;


box.className =
"message " + type;


setTimeout(
function() {

box.className =
"message";

},
4000
);

}


/* =====================================================
   SAVE STOCK
===================================================== */

async function saveStock(type) {

let itemId = "";

let quantity = 0;

let unit = "";

let enteredBy = "";

let issuedBy = "";

let expiryDate = "";

let signature = "";


/* ===============================================
   IN
================================================ */

if(type === "IN") {

itemId =
document.getElementById(
"inItem"
).value;


quantity =
Number(
document.getElementById(
"inQuantity"
).value
);


unit =
document.getElementById(
"inUnit"
).value;


enteredBy =
document.getElementById(
"inEnteredBy"
).value.trim();


expiryDate =
document.getElementById(
"inExpiryDate"
).value;


signature =
document.getElementById(
"inSignature"
).value.trim();

}


/* ===============================================
   OUT
================================================ */

if(type === "OUT") {

itemId =
document.getElementById(
"outItem"
).value;


quantity =
Number(
document.getElementById(
"outQuantity"
).value
);


unit =
document.getElementById(
"outUnit"
).value;


issuedBy =
document.getElementById(
"outIssuedBy"
).value.trim();


signature =
document.getElementById(
"outSignature"
).value.trim();

}


/* ===============================================
   VALIDATION
================================================ */

if(!itemId) {

showMessage(
"Item filadhu.",
"error"
);

return;

}


if(!quantity || quantity <= 0) {

showMessage(
"Quantity sirrii galchi.",
"error"
);

return;

}


if(type === "IN" && !enteredBy) {

showMessage(
"Nama galche galchi.",
"error"
);

return;

}


if(type === "OUT" && !issuedBy) {

showMessage(
"Nama baase galchi.",
"error"
);

return;

}


/* ===============================================
   ITEM
================================================ */

const item =
allItems.find(

i =>
String(i.id) ===
String(itemId)

);


if(!item) {

showMessage(
"Item hin argamne.",
"error"
);

return;

}


/* ===============================================
   OUT BALANCE CHECK
================================================ */

if(type === "OUT") {

const itemTransactions =
allTransactions.filter(

t =>
String(t.item_id) ===
String(itemId)

);


let totalIn = 0;

let totalOut = 0;


itemTransactions.forEach(

t => {

const q =
Number(
t.quantity || 0
);


const transactionType =
String(
t.transaction_type ||
t.transaction ||
""
).toUpperCase();


if(transactionType === "IN") {

totalIn += q;

}


if(transactionType === "OUT") {

totalOut += q;

}

});


const opening =
Number(
item.opening_quantity ||
item.quantity ||
0
);


const balance =
opening +
totalIn -
totalOut;


if(quantity > balance) {

showMessage(

`Stock hin gahu. Balance jiru: ${balance} ${unit}`,

"error"

);

return;

}

}


/* ===============================================
   CATEGORY FROM ITEM
================================================ */

const category =
item.category || null;


/* ===============================================
   DATA
================================================ */

const data = {

item_id:
itemId,

quantity:
quantity,

unit:
unit,

transaction:
type,

transaction_type:
type,

entered_by:
enteredBy,

issued_by:
issuedBy,

expiry_date:
expiryDate || null,

category:
category,

signature:
signature

};


/* ===============================================
   SAVE
================================================ */

try {

const response =
await fetch(

SUPABASE_URL +
"/rest/v1/stock_transactions",

{

method:
"POST",

headers: {

...getHeaders(),

"Prefer":
"return=representation"

},

body:
JSON.stringify(data)

}

);


if(!response.ok) {

const errorText =
await response.text();


console.log(
"Save Error:",
errorText
);


showMessage(
"Save hin milkoofne: " +
errorText,
"error"
);

return;

}


/* ===============================================
   SUCCESS
================================================ */

showMessage(

type === "IN"

? "✅ Stock IN milkaa'inaan galmaa'e."

: "✅ Stock OUT milkaa'inaan galmaa'e.",

"success"

);


clearForm(type);

closeForms();


await loadStock();

}

catch(error) {

console.log(
"Save Error:",
error
);


showMessage(
"Network error.",
"error"
);

}

}


/* =====================================================
   CLEAR FORM
===================================================== */

function clearForm(type) {

if(type === "IN") {

document.getElementById(
"inItem"
).value = "";

document.getElementById(
"inUnit"
).value = "";

document.getElementById(
"inQuantity"
).value = "";

document.getElementById(
"inExpiryDate"
).value = "";

document.getElementById(
"inEnteredBy"
).value = "";

document.getElementById(
"inSignature"
).value = "";

}


if(type === "OUT") {

document.getElementById(
"outItem"
).value = "";

document.getElementById(
"outUnit"
).value = "";

document.getElementById(
"outQuantity"
).value = "";

document.getElementById(
"outIssuedBy"
).value = "";

document.getElementById(
"outSignature"
).value = "";

}

}


/* =====================================================
   LOAD STOCK
===================================================== */

async function loadStock() {

allItems =
await loadItems();


allTransactions =
await loadTransactions();


fillItemLists();


displayTransactions(
allTransactions
);

}


/* =====================================================
   DISPLAY
===================================================== */

function displayTransactions(
transactions
) {

const table =
document.getElementById(
"stockTable"
);


table.innerHTML = "";


let totalIn = 0;

let totalOut = 0;

let opening = 0;


allItems.forEach(

item => {

opening +=
Number(
item.opening_quantity ||
item.quantity ||
0
);

});


if(transactions.length === 0) {

table.innerHTML = `

<tr>

<td
colspan="11"
style="
text-align:center;
padding:25px">

Transaction hin jiru.

</td>

</tr>

`;

}


transactions.forEach(

(t,index) => {


const item =
allItems.find(

i =>
String(i.id) ===
String(t.item_id)

);


const type =
String(
t.transaction_type ||
t.transaction ||
""
).toUpperCase();


const quantity =
Number(
t.quantity || 0
);


if(type === "IN")
totalIn += quantity;


if(type === "OUT")
totalOut += quantity;


const row =
document.createElement(
"tr"
);


row.className =
type === "OUT"
? "out-row"
: "in-row";


row.innerHTML = `

<td>
${index + 1}
</td>

<td>
${escapeHTML(
item?.name || ""
)}
</td>

<td>
${quantity}
</td>

<td>
${escapeHTML(
t.unit ||
item?.unit ||
""
)}
</td>

<td>

<span class="badge ${
type === "OUT"
? "badge-out"
: "badge-in"
}">

${
type === "OUT"
? "🔴 OUT"
: "🟢 IN"
}

</span>

</td>

<td>
${escapeHTML(
t.entered_by || ""
)}
</td>

<td>
${escapeHTML(
t.issued_by || ""
)}
</td>

<td>
${escapeHTML(
t.expiry_date || "—"
)}
</td>

<td>
${escapeHTML(
t.category ||
item?.category ||
""
)}
</td>

<td>
${escapeHTML(
t.created_at || ""
)}
</td>

<td>

${
t.signature

? "✍️ " +
escapeHTML(
t.signature
)

: "—"
}

</td>

`;


table.appendChild(
row
);

});


document.getElementById(
"totalOpening"
).textContent =
opening;


document.getElementById(
"totalIn"
).textContent =
totalIn;


document.getElementById(
"totalOut"
).textContent =
totalOut;


document.getElementById(
"totalBalance"
).textContent =
opening +
totalIn -
totalOut;


updateUnitTotals(
transactions
);

}


/* =====================================================
   UNIT TOTAL
===================================================== */

function updateUnitTotals(
transactions
) {

const container =
document.getElementById(
"unitTotals"
);


container.innerHTML = "";


const totals = {};


transactions.forEach(

t => {

const item =
allItems.find(

i =>
String(i.id) ===
String(t.item_id)

);


const unit =
t.unit ||
item?.unit ||
"Unknown";


if(!totals[unit]) {

totals[unit] = {
in: 0,
out: 0
};

}


const quantity =
Number(
t.quantity || 0
);


const type =
String(
t.transaction_type ||
t.transaction ||
""
).toUpperCase();


if(type === "IN")
totals[unit].in +=
quantity;


if(type === "OUT")
totals[unit].out +=
quantity;

});


Object.keys(totals)
.sort()
.forEach(

unit => {

const total =
totals[unit];


const card =
document.createElement(
"div"
);


card.className =
"total-card";


card.innerHTML = `

📏 ${escapeHTML(unit)}

<strong>

${
total.in -
total.out
}

</strong>

<small>

Stock IN:
${total.in}

<br>

Stock OUT:
${total.out}

<br>

Balance:
${
total.in -
total.out
}

</small>

`;


container.appendChild(
card
);

});

}


/* =====================================================
   FILTER
===================================================== */

function filterTransactions(
type
) {

let transactions =
allTransactions;


if(type !== "ALL") {

transactions =
transactions.filter(

t =>

String(
t.transaction_type ||
t.transaction ||
""
).toUpperCase() ===
type

);

}


displayTransactions(
transactions
);

}


/* =====================================================
   START
===================================================== */

loadStock();

</script>
