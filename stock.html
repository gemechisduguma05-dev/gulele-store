<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AADLM - Stock Management</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f1ed;
  color:#3e2723;
}

/* ================= HEADER ================= */

.header{
  background:linear-gradient(135deg,#5d4037,#795548);
  color:white;
  padding:16px 20px;
  display:flex;
  align-items:center;
  gap:14px;
  box-shadow:0 3px 10px rgba(0,0,0,.18);
}

.logo{
  width:52px;
  height:52px;
  border-radius:50%;
  object-fit:cover;
  background:white;
  border:2px solid rgba(255,255,255,.8);
}

.header h1{
  margin:0;
  font-size:22px;
}

.header small{
  opacity:.9;
}

/* ================= PAGE ================= */

.container{
  width:min(1400px,96%);
  margin:20px auto;
}

/* ================= TOP BUTTONS ================= */

.top-buttons{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:18px;
}

button{
  border:none;
  border-radius:8px;
  padding:11px 16px;
  font-size:14px;
  font-weight:bold;
  cursor:pointer;
  transition:.2s;
}

button:hover{
  transform:translateY(-1px);
  opacity:.93;
}

.btn-brown{
  background:#6d4c41;
  color:white;
}

.btn-green{
  background:#2e7d32;
  color:white;
}

.btn-red{
  background:#c62828;
  color:white;
}

.btn-blue{
  background:#1565c0;
  color:white;
}

.btn-gray{
  background:#607d8b;
  color:white;
}

.btn-orange{
  background:#ef6c00;
  color:white;
}

/* ================= MESSAGE ================= */

.message{
  display:none;
  padding:12px 15px;
  border-radius:8px;
  margin-bottom:15px;
  font-weight:bold;
}

.message.success{
  display:block;
  background:#e8f5e9;
  color:#2e7d32;
  border:1px solid #81c784;
}

.message.error{
  display:block;
  background:#ffebee;
  color:#c62828;
  border:1px solid #ef9a9a;
}

/* ================= SUMMARY ================= */

.summary{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:20px;
}

.summary-card{
  background:white;
  border-radius:12px;
  padding:18px;
  box-shadow:0 3px 10px rgba(0,0,0,.08);
  border-left:5px solid #795548;
}

.summary-card h3{
  margin:0 0 8px;
  font-size:14px;
  color:#795548;
}

.summary-card strong{
  font-size:26px;
}

/* ================= FORM GRID ================= */

.forms{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
  margin-bottom:25px;
}

.card{
  background:white;
  border-radius:12px;
  padding:20px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.card h2{
  margin-top:0;
  color:#5d4037;
  border-bottom:2px solid #efebe9;
  padding-bottom:10px;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.form-group{
  display:flex;
  flex-direction:column;
}

.form-group.full{
  grid-column:1/-1;
}

label{
  font-size:13px;
  font-weight:bold;
  margin-bottom:6px;
  color:#5d4037;
}

input,
select{
  width:100%;
  padding:11px;
  border:1px solid #d7ccc8;
  border-radius:7px;
  background:white;
  font-size:14px;
  outline:none;
}

input:focus,
select:focus{
  border-color:#795548;
  box-shadow:0 0 0 2px rgba(121,85,72,.12);
}

input[readonly]{
  background:#f5f5f5;
  color:#555;
}

.form-actions{
  margin-top:16px;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.model-box{
  background:#faf7f5;
  padding:12px;
  border-radius:8px;
  border:1px solid #eadfd9;
}

.model-number{
  display:none;
  margin-top:8px;
}

/* ================= PRICE ================= */

.price-box{
  background:#fff8e1;
  padding:12px;
  border-radius:8px;
  border:1px solid #ffe082;
}

.price-total{
  font-weight:bold;
  color:#2e7d32;
}

/* ================= SECTION ================= */

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  margin:20px 0 10px;
}

.section-title h2{
  margin:0;
  color:#5d4037;
}

/* ================= TABLE ================= */

.table-card{
  background:white;
  border-radius:12px;
  padding:15px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
  overflow:hidden;
}

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:950px;
}

th{
  background:#6d4c41;
  color:white;
  padding:11px 9px;
  text-align:left;
  font-size:13px;
  white-space:nowrap;
}

td{
  padding:10px 9px;
  border-bottom:1px solid #eee;
  font-size:13px;
  vertical-align:top;
}

tr:hover td{
  background:#faf7f5;
}

.badge{
  display:inline-block;
  padding:4px 8px;
  border-radius:20px;
  font-size:11px;
  font-weight:bold;
}

.badge-in{
  background:#e8f5e9;
  color:#2e7d32;
}

.badge-out{
  background:#ffebee;
  color:#c62828;
}

.balance-positive{
  color:#2e7d32;
  font-weight:bold;
}

.balance-zero{
  color:#c62828;
  font-weight:bold;
}

.details-btn{
  background:#795548;
  color:white;
  padding:7px 10px;
  border-radius:6px;
  font-size:12px;
}

.edit-btn{
  background:#ef6c00;
  color:white;
  padding:6px 9px;
  border-radius:6px;
  font-size:11px;
  margin-top:5px;
}

.price-cell{
  font-weight:bold;
  color:#2e7d32;
  white-space:nowrap;
}

/* ================= DETAILS ================= */

.details-row{
  display:none;
}

.details-box{
  background:#fafafa;
  padding:12px;
  border-radius:8px;
  margin:4px 0;
}

.details-box table{
  min-width:1400px;
}

.details-box th{
  background:#8d6e63;
  font-size:11px;
}

.details-box td{
  font-size:11px;
}

/* ================= EDIT BOX ================= */

.edit-box{
  display:none;
  background:white;
  border:2px solid #ffe0b2;
  border-radius:10px;
  padding:15px;
  margin-top:10px;
}

.edit-box h3{
  margin-top:0;
  color:#e65100;
}

.edit-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.edit-actions{
  margin-top:14px;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

/* ================= LOADING ================= */

.loading{
  text-align:center;
  padding:25px;
  color:#795548;
  font-weight:bold;
}

/* ================= MOBILE ================= */

@media(max-width:900px){

  .summary{
    grid-template-columns:repeat(2,1fr);
  }

  .forms{
    grid-template-columns:1fr;
  }

}

@media(max-width:600px){

  .container{
    width:94%;
    margin:12px auto;
  }

  .header{
    padding:12px;
  }

  .logo{
    width:44px;
    height:44px;
  }

  .header h1{
    font-size:17px;
  }

  .summary{
    grid-template-columns:1fr 1fr;
    gap:10px;
  }

  .summary-card{
    padding:13px;
  }

  .summary-card strong{
    font-size:21px;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .edit-grid{
    grid-template-columns:1fr;
  }

  .form-group.full{
    grid-column:auto;
  }

  .card{
    padding:15px;
  }

}

</style>
</head>

<body>

<header class="header">

  <img
    src="./1788633150526.jpg"
    class="logo"
    alt="AAFDRMC Logo"
  >

  <div>
    <h1>AADLM - STOCK MANAGEMENT</h1>

</header>


<div class="container">

  <div class="top-buttons">

    <button class="btn-green" onclick="showStockIn()">

    </button>

    <button class="btn-gray" onclick="window.location.href='dashboard.html'">

  <div id="message" class="message"></div>


  <div class="summary">

        <div class="form-group">

              -- Select Item --

        </div>


        <div class="form-group">

        <div class="form-group">

          <label>Unit</label>

          <input
            id="outUnit"
            type="text"
            readonly
          >

        </div>


        <div class="form-group">

          <label>Category</label>

          <input
            id="outCategory"
            type="text"
            readonly
          >

        </div>


        <div class="form-group">

          <label>Quantity *</label>

          <input
            id="outQuantity"
            type="number"
            min="0.01"
            step="any"
            placeholder="Enter quantity"

        </div>


        <div class="form-group">

          <label>Guyyaa fi Sa'aatii itti bahe *</label>

          <input
            id="outDateTime"

        </div>


        <div class="form-group">

          <label>Nama baase *</label>

          <input
            id="outIssuedBy"
            type="text"
            placeholder="Issued by"

        <div class="form-group">

          <label>Mallattoo / Signature</label>

          <input

        <div class="form-group full model-box">

      <div class="form-actions">

        <button

        <button

  </div>


  <!-- ================= REPORT ================= -->

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://sslabegtsxlkafuygmar.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_G3Nv_yg4LaCiMtJMiadMxQ_f2fNHg5x";


/* =========================================================
   BRANCHES
========================================================= */

const BRANCHES = {

  MAIN:{
    id:"bd1b10ec-43dc-4eb0-ad8c-53a78b80815d",
    name:"Main",
    code:"MAIN"
  },

  GUL:{
    id:"b7b2ff8c-0be4-4678-a6d3-63c05cdf144c",
    name:"Gulele",
    code:"GUL"
  },

  AKT:{
    id:"9ed31570-9cfb-4706-82ed-049addf493fd",
    name:"Addis Katama",

  },

  KLF:{
    id:"6d51f505-1e5f-4c47-b2a9-ff83029293d4",

  },

  NSL:{
    id:"ea8fcf0f-eb72-4b2c-a167-2ad7f380bade",
    name:"Nifas Silk Lafto",
    code:"NSL"
  },

  KIR:{
    id:"06cda455-02cb-4b4b-a84b-b01bf1c28b33",
    name:"Kirkos",
    code:"KIR"
  },

  LAM:{
    id:"6d9324f2-0120-455a-9161-ed46fbf06b61",

    code:"LAM"
  },

  ARA:{
    id:"b0d43ff1-ba2d-4b90-aa65-eab6acec4bdb",
    name:"Arada",
    code:"ARA"
  },

  LID:{
    id:"f26b2605-f4df-4a32-8c61-76131fe7e559",
    name:"Lideta",
    code:"LID"
  },

  BOL:{
    id:"d104e8ab-ed63-4d20-a314-6696abed839a",
    name:"Bole",
    code:"BOL"
  },

  EKA:{
    id:"015d6857-73a2-4b05-8555-4091387a305d",
    name:"Yekaa",
    code:"EKA"
  },

  AKA:{
    id:"ac4f8c9a-8855-42f4-b98f-35d454c8d89e",
    name:"Akaki Kality",
    code:"AKA"
  },

  CTR:{
    id:"96a20750-5ff6-4475-ae03-009cd7688c33",
    name:"Center",
    code:"CTR"
  }

};


let CURRENT_BRANCH_CODE =
  localStorage.getItem("selected_branch_code") || "MAIN";

let CURRENT_BRANCH_UUID =
  localStorage.getItem("selected_branch_uuid") || "";

let CURRENT_BRANCH_NAME =
  localStorage.getItem("selected_branch_name") || "Main";


if(BRANCHES[CURRENT_BRANCH_CODE]){

  CURRENT_BRANCH_UUID =
    BRANCHES[CURRENT_BRANCH_CODE].id;

  CURRENT_BRANCH_NAME =
    BRANCHES[CURRENT_BRANCH_CODE].name;

}


document.getElementById("branchInfo").textContent =
  "Branch: " +
  CURRENT_BRANCH_NAME +
  " (" +
  CURRENT_BRANCH_CODE +
  ")";


/* =========================================================
   DATA
========================================================= */

let ITEMS = [];
let TRANSACTIONS = [];


/* =========================================================
   API
========================================================= */

async function apiFetch(path,options={}){

  const response =
    await fetch(
      SUPABASE_URL + path,
      {
        ...options,

        headers:{
          apikey:SUPABASE_KEY,
          Authorization:"Bearer " + SUPABASE_KEY,
          "Content-Type":"application/json",
          ...(options.headers || {})
        }
      }
    );


  const text =
    await response.text();

  let data = null;

  try{
    data =
      text ? JSON.parse(text) : null;
  }
  catch(e){
    data = text;
  }


  if(!response.ok){

    throw new Error(
      data?.message ||
      data?.error_description ||
      data?.hint ||
      text ||
      "Request failed"
    );

  }


  return data;

}


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(message,type="success"){

  const box =
    document.getElementById("message");

  box.textContent = message;

  box.className =
    "message " + type;

  setTimeout(()=>{
    box.className = "message";
  },5000);

}


/* =========================================================
   DATE TIME
========================================================= */

function setDefaultDateTimes(){

  const now =
    new Date();

  const local =
    new Date(
      now.getTime() -
      now.getTimezoneOffset()*60000
    )
    .toISOString()
    .slice(0,16);


  document.getElementById(
    "inDateTime"
  ).value = local;

  document.getElementById(
    "outDateTime"
  ).value = local;

}


/* =========================================================
   PRICE CALCULATION
========================================================= */

function calculateInTotal(){

  const quantity =
    Number(
      document.getElementById(
        "inQuantity"
      ).value
    ) || 0;


  const unitPrice =
    Number(
      document.getElementById(
        "inUnitPrice"
      ).value
    ) || 0;


  const total =
    quantity * unitPrice;


  document.getElementById(
    "inTotalPrice"
  ).value =
    total > 0
      ? total.toFixed(2)
      : "";

}


/* =========================================================
   BRANCH
========================================================= */

function isMainBranch(){

  return CURRENT_BRANCH_CODE === "MAIN";

}


function branchMatches(row){

  if(isMainBranch()){
    return true;
  }


  const rowBranchId =
    String(row.branch_id || "").trim();


  const rowBranchCode =
    String(row.branch_code || "")
      .trim()
      .toUpperCase();


  const currentId =
    String(CURRENT_BRANCH_UUID || "").trim();


  const currentCode =
    String(CURRENT_BRANCH_CODE || "")
      .trim()
      .toUpperCase();


  return (
    (currentId && rowBranchId === currentId) ||
    (currentCode && rowBranchCode === currentCode)
  );

}


/* =========================================================
   LOAD ITEMS
========================================================= */

async function loadItems(){

  const data =
    await apiFetch(
      "/rest/v1/items?select=*&order=name.asc"
    );


  ITEMS =
    Array.isArray(data)
      ? data
      : [];


  if(!isMainBranch()){

    ITEMS =
      ITEMS.filter(
        item =>
          branchMatches(item)
      );

  }


  fillItemSelects();

}


/* =========================================================
   FILL ITEM SELECTS
========================================================= */

function fillItemSelects(){

  const inSelect =
    document.getElementById("inItem");

  const outSelect =
    document.getElementById("outItem");


  inSelect.innerHTML =
    `<option value="">-- Select Item --</option>`;

  outSelect.innerHTML =
    `<option value="">-- Select Item --</option>`;


  ITEMS.forEach(item => {

    const id =
      item.id;

    const name =
      item.name || "";

    const category =
      item.category || "";

    const unit =
      item.unit || "";


    const text =
      name +
      (
        category
          ? " — " + category
          : ""
      );


    const option1 =
      document.createElement("option");

    option1.value = id;

    option1.textContent = text;

    option1.dataset.unit = unit;

          row =>

/* =========================================================
   FIND ITEM
========================================================= */

function findItem(id){

  return ITEMS.find(
    item =>
      String(item.id) === String(id)
  );

}


/* =========================================================
   TRANSACTION TYPE
========================================================= */

function transactionIsIn(row){

  const type =
    String(
      row.transaction_type ||
      row.transaction ||
      ""
    )
    .toUpperCase();


  return (
    type === "IN" ||
    type === "STOCK IN" ||
    type === "STOCK_IN" ||
    type === "STOCK-IN" ||
    type.includes("IN")
  );

}


function transactionIsOut(row){

  const type =
    String(
      row.transaction_type ||
      row.transaction ||
      ""
    )
    .toUpperCase();


  return (
    type === "OUT" ||
    type === "STOCK OUT" ||
    type === "STOCK_OUT" ||
    type === "STOCK-OUT" ||
    type.includes("OUT") ||
    type.includes("RELIEF")
  );

}


/* =========================================================
   ITEM MATCH
========================================================= */

function transactionMatchesItem(row,item){

  if(
    row.item_id != null &&
    item.id != null
  ){

    if(
      String(row.item_id) ===
      String(item.id)
    ){

      return true;

    }

  }


  const rowName =
    String(
      row.transaction || ""
    )
    .trim()
    .toLowerCase();


  const itemName =
    String(
      item.name || ""
    )
    .trim()
    .toLowerCase();


  return (
    rowName !== "" &&
    itemName !== "" &&
    rowName === itemName
  );

}


/* =========================================================
   BALANCE
========================================================= */

function getItemTotals(item){

  let stockIn = 0;
  let stockOut = 0;


  TRANSACTIONS.forEach(row => {

    if(
      !transactionMatchesItem(
        row,
        item
      )
    ){

      return;

    }


    const qty =
      Number(row.quantity) || 0;


    if(transactionIsIn(row)){

      stockIn += qty;

    }
    else if(transactionIsOut(row)){

      stockOut += qty;

    }

  });


  return {

    stockIn,
    stockOut,

    balance:
      stockIn - stockOut

  };

}


/* =========================================================
   ITEM CHANGE
========================================================= */

function itemChanged(type){

  const select =
    document.getElementById(
      type === "in"
        ? "inItem"
        : "outItem"
    );


  const item =
    findItem(select.value);


  if(!item){

    if(type === "in"){

      document.getElementById(
        "inUnit"
      ).value = "";

      document.getElementById(
        "inCategory"
      ).value = "";

    }
    else{

      document.getElementById(
        "outUnit"
      ).value = "";

      document.getElementById(
        "outCategory"
      ).value = "";

      document.getElementById(
        "outCurrentStock"
      ).value = "";

    }

    return;

  }


  if(type === "in"){

    document.getElementById(
      "inUnit"
    ).value =
      item.unit || "";

    document.getElementById(
      "inCategory"
    ).value =
      item.category || "";

  }
  else{

    document.getElementById(
      "outUnit"
    ).value =
      item.unit || "";

    document.getElementById(
      "outCategory"
    ).value =
      item.category || "";


    const totals =
      getItemTotals(item);


    document.getElementById(
      "outCurrentStock"
    ).value =
      formatNumber(
        totals.balance
      );

  }

}


/* =========================================================
   SAVE STOCK
========================================================= */

async function saveStock(type){

  try{

    const isIN =
      type === "IN";


    const itemId =
      document.getElementById(
        isIN
          ? "inItem"
          : "outItem"
      ).value;


    if(!itemId){

      showMessage(
        "Item filadhu.",
        "error"
      );

      return;

    }


    const item =
      findItem(itemId);


    if(!item){

      showMessage(
        "Item hin argamne.",
        "error"
      );

      return;

    }


    const quantity =
      Number(
        document.getElementById(
          isIN
            ? "inQuantity"
            : "outQuantity"
        ).value
      );


    if(
      !quantity ||
      quantity <= 0
    ){

      showMessage(
        "Quantity sirriitti galchi.",
        "error"
      );

      return;

    }


    /* ================= PRICE ================= */

    let unitPrice = null;
    let totalPrice = null;


    if(isIN){

      unitPrice =
        Number(
          document.getElementById(
            "inUnitPrice"
          ).value
        );


      if(
        Number.isNaN(unitPrice) ||
        unitPrice < 0
      ){

        showMessage(
          "Unit Price sirriitti galchi.",
          "error"
        );

        return;

      }


      totalPrice =
        quantity * unitPrice;

    }


    /* ================= MODEL 19 ================= */

    let model19 = null;


    if(isIN){

      const modelType =
        document.getElementById(
          "inModel19"
        ).value;


      if(!modelType){

        showMessage(
          "Model 19 ykn Verbal keessaa tokko filadhu.",
          "error"
        );

        return;

      }


      if(modelType === "NUMBER"){

        const number =
          document.getElementById(
            "inModel19Number"
          ).value.trim();


        if(!number){

          showMessage(
            "Model 19 Number galchi.",
            "error"
          );

          return;

        }


        model19 =
          "Model 19: " +
          number;

      }
      else{

        model19 =
          "Verbal";

      }

    }


    /* ================= MODEL 22 ================= */

    let model22 = null;


    if(!isIN){

      const number =
        document.getElementById(
          "outModel22Number"
        ).value.trim();


      if(!number){

        showMessage(
          "Model 22 Number galchi. Stock OUT keessatti dirqama.",
          "error"
        );

        return;

      }


      model22 =
        "Model 22: " +
        number;


      const totals =
        getItemTotals(item);


      if(
        quantity >
        totals.balance
      ){

        showMessage(
          "Stock gahaa hin jiru. Current Stock: " +
          formatNumber(
            totals.balance
          ),
          "error"
        );

        return;

      }

    }


    /* ================= COMMON ================= */

    const enteredBy =
      document.getElementById(
        "inEnteredBy"
      ).value.trim();


    const issuedBy =
      document.getElementById(
        "outIssuedBy"
      ).value.trim();


    const dateTime =
      document.getElementById(
        isIN
          ? "inDateTime"
          : "outDateTime"
      ).value;


    if(!dateTime){

      showMessage(
        "Guyyaa fi sa'aatii galchi.",
        "error"
      );

      return;

    }


    if(
      isIN &&
      !enteredBy
    ){

      showMessage(
        "Nama galche galchi.",
        "error"
      );

      return;

    }


    if(
      !isIN &&
      !issuedBy
    ){

      showMessage(
        "Nama baase galchi.",
        "error"
      );

      return;

    }


    const expiry =
      isIN
        ? document.getElementById(
            "inExpiry"
          ).value || null
        : null;


    const signature =
      document.getElementById(
        isIN
          ? "inSignature"
          : "outSignature"
      ).value.trim() || null;


    /* ================= PAYLOAD ================= */

    const payload = {

      transaction_type:
        isIN
          ? "IN"
          : "OUT",

      quantity:

        quantity,

      entered_by:
        isIN
          ? enteredBy
          : null,

      entered_at:
        new Date(dateTime)
          .toISOString(),

      expiry_date:
        expiry,

      category:
        item.category || null,

      issued_by:
        isIN
          ? null
          : issuedBy,

      signature:
        signature,

      unit:
        item.unit || null,

      transaction:
        item.name || null,

      branch_id:
        isMainBranch()
          ? null
          : CURRENT_BRANCH_UUID,

      branch_code:
        CURRENT_BRANCH_CODE,

      item_id:
        item.id,

      model_19:
        model19,

      model_22:
        model22,

      unit_price:
        unitPrice,

      total_price:
        totalPrice

    };


    await apiFetch(
      "/rest/v1/stock_transactions",
      {
        method:"POST",

        headers:{
          Prefer:
            "return=representation"
        },

        body:
          JSON.stringify(payload)
      }
    );


    showMessage(
      isIN
        ? "Stock IN successfully saved."
        : "Stock OUT successfully saved.",
      "success"
    );


    if(isIN){

      clearStockIn();

    }
    else{

      clearStockOut();

    }


    await loadAll();

  }
  catch(error){

    console.error(
      "Save stock error:",
      error
    );


    showMessage(
      "Save failed: " +
      error.message,
      "error"
    );

  }

}

      const enteredBy =
        document.getElementById(
          "edit-entered-by-" + id
        ).value.trim();


      if(!enteredBy){

        showMessage(
          "Nama galche galchi.",
          "error"
        );

        return;

      }


      const expiry =
        document.getElementById(
          "edit-expiry-" + id
        ).value || null;


      const signature =
        document.getElementById(
          "edit-signature-" + id
        ).value.trim() || null;


      const modelType =
        document.getElementById(
          "edit-model19-" + id
        ).value;


      if(!modelType){

        showMessage(
          "Model 19 ykn Verbal keessaa tokko filadhu.",
          "error"
        );

        return;

      }


      let model19 = null;


      if(modelType === "VERBAL"){

        model19 =
          "Verbal";

      }
      else{

        const number =
          document.getElementById(
            "edit-model19-number-" + id
          ).value.trim();


        if(!number){

          showMessage(
            "Model 19 Number galchi.",
            "error"
          );

          return;

        }


        model19 =
          "Model 19: " +
          number;

      }


      patch.entered_by =
        enteredBy;

      patch.issued_by =
        null;

      patch.expiry_date =
        expiry;

      patch.signature =
        signature;

      patch.model_19 =
        model19;

    }
    else{

      const issuedBy =
        document.getElementById(
          "edit-issued-by-" + id
        ).value.trim();


      if(!issuedBy){

        showMessage(
          "Nama baase galchi.",
          "error"
        );

        return;

      }


      const signature =
        document.getElementById(
          "edit-signature-" + id
        ).value.trim() || null;


      const model22Number =
        document.getElementById(
          "edit-model22-" + id
        ).value.trim();


      if(!model22Number){

        showMessage(
          "Model 22 Number galchi.",
          "error"
        );

        return;

      }


      /*
        Re-check OUT balance.

        Old quantity is removed from the calculation
        before checking the new quantity.
      */

      let availableBalance = 0;


      TRANSACTIONS.forEach(row => {

        if(
          String(row.id) === String(id)
        ){

          return;

        }


        if(
          !transactionMatchesItem(
            row,
            findItem(oldRow.item_id)
          )
        ){

          return;

        }


        const q =
          Number(row.quantity) || 0;


        if(transactionIsIn(row)){

          availableBalance += q;

        }
        else if(transactionIsOut(row)){

          availableBalance -= q;

        }

      });


      if(quantity > availableBalance){

        showMessage(
          "Stock gahaa hin jiru. Available Stock: " +
          formatNumber(
            availableBalance
          ),
          "error"
        );

        return;

      }


      patch.entered_by =
        null;

      patch.issued_by =
        issuedBy;

      patch.expiry_date =
        null;

      patch.signature =
        signature;

      patch.model_19 =
        null;

      patch.model_22 =
        "Model 22: " +
        model22Number;

      /*
        OUT does not receive a new price.
        Keep the existing price fields unchanged.
      */

      delete patch.unit_price;
      delete patch.total_price;

    }


    /* ================= UPDATE ================= */

    await apiFetch(
      "/rest/v1/stock_transactions?id=eq." +
      encodeURIComponent(id),
      {
        method:"PATCH",

        headers:{
          Prefer:
            "return=representation"
        },

        body:
          JSON.stringify(patch)
      }
    );


    showMessage(
      "Transaction successfully updated.",
      "success"
    );


    await loadAll();

  }
  catch(error){

    console.error(
      "Update transaction error:",
      error
    );


    showMessage(
      "Update failed: " +
      error.message,
      "error"
    );

  }

}

/* =========================================================
   SUMMARY
========================================================= */

function renderSummary(){

  let totalIn = 0;
  let totalOut = 0;


  TRANSACTIONS.forEach(
    row => {

      const quantity =
        Number(row.quantity) || 0;


      if(transactionIsIn(row)){

        totalIn += quantity;

      }
      else if(transactionIsOut(row)){

        totalOut += quantity;

      }

    }
  );


  document.getElementById(
    "totalItems"
  ).textContent =
    ITEMS.length;


  document.getElementById(
    "totalIn"
  ).textContent =
    formatNumber(totalIn);


  document.getElementById(
    "totalOut"
  ).textContent =
    formatNumber(totalOut);


  document.getElementById(
    "totalBalance"
  ).textContent =
    formatNumber(
      totalIn - totalOut
    );

}

/* =========================================================
   FORMAT NUMBER
========================================================= */

function formatNumber(value){

  const num =
    Number(value) || 0;


  if(
    Number.isInteger(num)
  ){

    return String(num);

  }


  return num.toFixed(2);

}


/* =========================================================
   FORMAT PRICE
========================================================= */

function formatPrice(value){

  const num =
    Number(value);


  if(
    Number.isNaN(num)
  ){

    return "-";

  }


  return num.toFixed(2);

}


/* =========================================================
   FORMAT DATE
========================================================= */

function formatDateTime(value){

  if(!value){
    return "";
  }


  const date =
    new Date(value);


  if(
    Number.isNaN(
      date.getTime()
    )
  ){

    return String(value);

  }


  return date.toLocaleString();

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value){

  return String(value ?? "")
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================================================
   ESCAPE ATTRIBUTE
========================================================= */

function escapeAttr(value){

  return String(value ?? "")
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    );

}
