<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>AADLM - Stock Report</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f1f5f9;
  color:#263238;
}

header{
  background:linear-gradient(135deg,#0d47a1,#1976d2,#42a5f5);
  color:#fff;
  padding:18px;
  text-align:center;
  box-shadow:0 3px 10px rgba(0,0,0,.18);
}

header h1{
  margin:0;
  font-size:24px;
}

header p{
  margin:7px 0 0;
  font-size:14px;
}

.nav{
  display:flex;
  gap:8px;
  justify-content:center;
  flex-wrap:wrap;
  padding:12px;
  background:#fff;
  box-shadow:0 2px 7px rgba(0,0,0,.08);
}

.nav button{
  border:0;
  padding:10px 15px;
  border-radius:8px;
  background:#1976d2;
  color:#fff;
  cursor:pointer;
  font-weight:bold;
}

.nav button:hover{
  background:#0d47a1;
}

.container{
  max-width:1500px;
  margin:auto;
  padding:15px;
}

.branch-box{
  background:#fff;
  padding:14px;
  border-radius:10px;
  margin-bottom:15px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.branch-box strong{
  color:#0d47a1;
}

.filters{
  background:#fff;
  padding:15px;
  border-radius:10px;
  margin-bottom:15px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.filters-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:10px;
}

.filters label{
  display:block;
  font-size:13px;
  font-weight:bold;
  margin-bottom:5px;
}

.filters input,
.filters select{
  width:100%;
  padding:10px;
  border:1px solid #cfd8dc;
  border-radius:7px;
  background:#fff;
}

.filter-buttons{
  margin-top:12px;
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.btn{
  border:0;
  padding:10px 16px;
  border-radius:7px;
  cursor:pointer;
  font-weight:bold;
}

.btn-primary{
  background:#1976d2;
  color:#fff;
}

.btn-secondary{
  background:#607d8b;
  color:#fff;
}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
  gap:12px;
  margin-bottom:15px;
}

.card{
  background:#fff;
  border-radius:10px;
  padding:16px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.card-title{
  font-size:13px;
  color:#607d8b;
  margin-bottom:7px;
}

.card-value{
  font-size:24px;
  font-weight:bold;
  color:#0d47a1;
}

.table-box{
  background:#fff;
  border-radius:10px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
  overflow:hidden;
  margin-bottom:20px;
}

.table-title{
  padding:14px;
  font-size:18px;
  font-weight:bold;
  color:#0d47a1;
  border-bottom:1px solid #eceff1;
}

.table-scroll{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:1400px;
}

th,
td{
  border:1px solid #e0e0e0;
  padding:9px;
  font-size:12px;
  text-align:left;
  vertical-align:top;
}

th{
  background:#e3f2fd;
  color:#0d47a1;
  font-weight:bold;
  white-space:nowrap;
}

tr:nth-child(even){
  background:#fafafa;
}

.detail-btn{
  border:0;
  background:#1976d2;
  color:#fff;
  padding:7px 12px;
  border-radius:6px;
  cursor:pointer;
  font-weight:bold;
}

.detail-btn:hover{
  background:#0d47a1;
}

.empty{
  padding:30px;
  text-align:center;
  color:#78909c;
}

.loading{
  padding:30px;
  text-align:center;
  color:#1976d2;
  font-weight:bold;
}

.error{
  padding:15px;
  background:#ffebee;
  color:#c62828;
  border-radius:8px;
  margin-bottom:15px;
}

.badge{
  display:inline-block;
  padding:4px 8px;
  border-radius:5px;
  font-size:11px;
  font-weight:bold;
}

.badge-in{
  background:#e8f5e9;
  color:#2e7d32;
}

.badge-out{
  background:#ffebee;
  color:#c62828;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:9999;
  padding:20px;
  overflow:auto;
}

.modal-content{
  max-width:1450px;
  margin:20px auto;
  background:#fff;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 5px 30px rgba(0,0,0,.3);
}

.modal-header{
  background:linear-gradient(135deg,#0d47a1,#1976d2);
  color:#fff;
  padding:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.modal-header h2{
  margin:0;
  font-size:19px;
}

.close-btn{
  border:0;
  background:#fff;
  color:#0d47a1;
  width:35px;
  height:35px;
  border-radius:50%;
  cursor:pointer;
  font-size:20px;
  font-weight:bold;
}

.modal-body{
  padding:15px;
}

.detail-info{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:10px;
  margin-bottom:15px;
}

.detail-info div{
  background:#f5f7fa;
  padding:10px;
  border-radius:7px;
}

.detail-info strong{
  display:block;
  font-size:12px;
  color:#607d8b;
  margin-bottom:4px;
}

.detail-info span{
  font-weight:bold;
}

@media(max-width:700px){

  header h1{
    font-size:20px;
  }

  .container{
    padding:8px;
  }

  .filters{
    padding:10px;
  }

  th,
  td{
    font-size:11px;
  }

}

</style>

</head>

<body>

<header>

  <h1>AADLM - Stock Report</h1>

  <p>
    Stock IN / Stock OUT / Emergency Relief Report
  </p>

</header>

<div class="nav">

  <button onclick="goDashboard()">
    Back to Menu
  </button>

</div>

<div class="container">

  <div class="branch-box">

    Branch:
    <strong id="branchName">Loading...</strong>

  </div>

  <div id="errorBox"></div>

  <div class="filters">

    <div class="filters-grid">

      <div>
        <label>From Date</label>
        <input
          type="date"
          id="fromDate"
        >
      </div>

      <div>
        <label>To Date</label>
        <input
          type="date"
          id="toDate"
        >
      </div>

      <div>
        <label>Entered / Issued By</label>
        <input
          type="text"
          id="personFilter"
          placeholder="Search name"
        >
      </div>

      <div>
        <label>Item Name</label>
        <input
          type="text"
          id="itemFilter"
          placeholder="Search item"
        >
      </div>

      <div>
        <label>Transaction Type</label>

        <select id="typeFilter">

          <option value="">
            All
          </option>

          <option value="IN">
            Stock IN
          </option>

          <option value="OUT">
            Stock OUT
          </option>

        </select>

      </div>

    </div>

    <div class="filter-buttons">

      <button
        class="btn btn-primary"
        onclick="applyFilters()"
      >
        Apply
      </button>

      <button
        class="btn btn-secondary"
        onclick="clearFilters()"
      >
        Clear
      </button>

    </div>

  </div>

  <div class="cards">

    <div class="card">

      <div class="card-title">
        Total Stock IN
      </div>

      <div
        class="card-value"
        id="totalIn"
      >
        0
      </div>

    </div>

    <div class="card">

      <div class="card-title">
        Total Stock OUT
      </div>

      <div
        class="card-value"
        id="totalOut"
      >
        0
      </div>

    </div>

    <div class="card">

      <div class="card-title">
        Transactions
      </div>

      <div
        class="card-value"
        id="totalTransactions"
      >
        0
      </div>

    </div>

    <div class="card">

      <div class="card-title">
        Items
      </div>

      <div
        class="card-value"
        id="totalItems"
      >
        0
      </div>

    </div>

    <div class="card">

      <div class="card-title">
        Current Balance
      </div>

      <div
        class="card-value"
        id="currentBalance"
      >
        0
      </div>

    </div>

  </div>

  <div class="table-box">

    <div class="table-title">
      Stock Summary
    </div>

    <div
      id="summaryArea"
      class="loading"
    >
      Loading...
    </div>

  </div>

</div>


<!-- DETAIL MODAL -->

<div
  id="detailModal"
  class="modal"
  onclick="closeModalOutside(event)"
>

  <div class="modal-content">

    <div class="modal-header">

      <h2 id="detailTitle">
        Transaction Details
      </h2>

      <button
        class="close-btn"
        onclick="closeDetail()"
      >
        ×
      </button>

    </div>

    <div
      id="detailBody"
      class="modal-body"
    ></div>

  </div>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://sslabegtsxlkafuygmar.supabase.co";

const SUPABASE_KEY =
  localStorage.getItem("supabase_anon_key") ||
  localStorage.getItem("SUPABASE_ANON_KEY") ||
  "";

const API =
  SUPABASE_URL + "/rest/v1";


/* =====================================================
   STATE
===================================================== */

let allTransactions = [];

let filteredTransactions = [];

let itemMap = {};

let branchMap = {};

let branchInfo = {

  uuid:
    localStorage.getItem("selected_branch_uuid") ||
    localStorage.getItem("selected_branch_id") ||
    "",

  code:
    localStorage.getItem("selected_branch_code") ||
    localStorage.getItem("branch_code") ||
    "",

  name:
    localStorage.getItem("selected_branch_name") ||
    localStorage.getItem("branch_name") ||
    "",

  role:
    localStorage.getItem("user_role") || ""

};


/* =====================================================
   HEADERS
===================================================== */

function headers(){

  return {

    "apikey":SUPABASE_KEY,

    "Authorization":
      "Bearer " + SUPABASE_KEY,

    "Content-Type":
      "application/json"

  };

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function esc(value){

  if(value === null ||
     value === undefined){

    return "";

  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =====================================================
   NUMBER
===================================================== */

function num(value){

  const n =
    Number(value);

  return Number.isFinite(n)
    ? n
    : 0;

}


/* =====================================================
   DATE
===================================================== */

function formatDate(value){

  if(!value){
    return "";
  }

  const d =
    new Date(value);

  if(Number.isNaN(d.getTime())){
    return value;
  }

  return d.toLocaleString();

}


/* =====================================================
   TRANSACTION TYPE
===================================================== */

function getType(row){

  const raw =
    String(
      row.transaction_type ||
      row.type ||
      ""
    )
    .trim()
    .toUpperCase();

  if(
    raw === "IN" ||
    raw === "STOCK IN" ||
    raw === "STOCK_IN" ||
    raw === "RECEIVE" ||
    raw === "RECEIVED"
  ){

    return "IN";

  }

  if(
    raw === "OUT" ||
    raw === "STOCK OUT" ||
    raw === "STOCK_OUT" ||
    raw === "ISSUE" ||
    raw === "ISSUED"
  ){

    return "OUT";

  }

  const transaction =
    String(
      row.transaction || ""
    ).toUpperCase();

  if(
    transaction.includes("STOCK IN") ||
    transaction.includes("STOCK_IN") ||
    transaction.includes("RECEIVE")
  ){

    return "IN";

  }

  if(
    transaction.includes("STOCK OUT") ||
    transaction.includes("STOCK_OUT") ||
    transaction.includes("ISSUE") ||
    transaction.includes("RELIEF")
  ){

    return "OUT";

  }

  return raw || "";

}


/* =====================================================
   ITEM
===================================================== */

function getItemInfo(row){

  const id =
    row.item_id;

  if(
    id !== null &&
    id !== undefined &&
    itemMap[String(id)]
  ){

    return itemMap[String(id)];

  }

  return {

    name:
      row.item_name ||
      row.item ||
      "Unknown Item",

    category:
      row.category ||
      "",

    unit:
      row.unit ||
      ""

  };

}


/* =====================================================
   BRANCH
===================================================== */

function getBranchInfo(row){

  const id =
    row.branch_id;

  if(
    id !== null &&
    id !== undefined &&
    branchMap[String(id)]
  ){

    return branchMap[String(id)];

  }

  return {

    name:
      row.branch_name ||
      row.branch_code ||
      "",

    code:
      row.branch_code ||
      ""

  };

}


/* =====================================================
   MODEL INFORMATION
   Supports:
   - model_19
   - model19
   - model_19_number
   - model22
   - model_22
   - Model 19 - ...
   - Model 22 - ...
===================================================== */

function getModelInfo(row){

  let model19 =
    row.model_19 ??
    row.model19 ??
    row.model_19_number ??
    row.model19_number ??
    "";

  let model22 =
    row.model_22 ??
    row.model22 ??
    row.model_22_number ??
    row.model22_number ??
    "";

  const text =
    String(
      row.transaction ||
      ""
    ).trim();

  if(!model19){

    const m19 =
      text.match(
        /model\s*19\s*(?:number|no\.?|#)?\s*[-:#]?\s*([A-Za-z0-9\/_.-]+)/i
      );

    if(m19){
      model19 =
        m19[1];
    }

  }

  if(!model22){

    const m22 =
      text.match(
        /model\s*22\s*(?:number|no\.?|#)?\s*[-:#]?\s*([A-Za-z0-9\/_.-]+)/i
      );

    if(m22){
      model22 =
        m22[1];
    }

  }

  /*
    Emergency Relief example:
    Emergency Relief - Model 22 - 12345
  */

  if(!model22){

    const relief =
      text.match(
        /emergency\s*relief\s*[-–—:]?\s*model\s*22\s*[-–—:#]?\s*([A-Za-z0-9\/_.-]+)/i
      );

    if(relief){
      model22 =
        relief[1];
    }

  }

  /*
    If transaction only says "Model 22"
    without a number, show Model 22
    but leave number empty.
  */

  const hasModel19 =
    /model\s*19/i.test(text);

  const hasModel22 =
    /model\s*22/i.test(text);

  return {

    model19:
      model19
        ? String(model19)
        : hasModel19
          ? "Model 19"
          : "",

    model22:
      model22
        ? String(model22)
        : hasModel22
          ? "Model 22"
          : ""

  };

}


/* =====================================================
   DESCRIPTION / TRANSACTION REASON

   IMPORTANT:
   Do NOT remove the reason.
   Model information is removed only when it is
   clearly model metadata.
===================================================== */

function getDescription(row){

  let text =
    String(
      row.description ||
      row.reason ||
      row.details ||
      row.transaction ||
      ""
    ).trim();

  if(!text){
    return "";
  }

  /*
    Keep meaningful transaction text.

    Remove only explicit model labels/numbers.
  */

  text =
    text.replace(
      /model\s*19\s*(?:number|no\.?|#)?\s*[-:#]?\s*[A-Za-z0-9\/_.-]+/gi,
      ""
    );

  text =
    text.replace(
      /model\s*22\s*(?:number|no\.?|#)?\s*[-:#]?\s*[A-Za-z0-9\/_.-]+/gi,
      ""
    );

  text =
    text.replace(
      /\s{2,}/g,
      " "
    )
    .replace(
      /\s*[-–—]\s*$/g,
      ""
    )
    .trim();

  /*
    If stripping model metadata leaves nothing,
    use a useful default based on transaction type.
  */

  if(!text){

    const type =
      getType(row);

    if(type === "IN"){
      return "Stock IN";
    }

    if(type === "OUT"){

      if(
        String(row.transaction || "")
          .toLowerCase()
          .includes("relief")
      ){

        return "Emergency Relief";

      }

      return "Stock OUT";

    }

  }

  return text;

}


/* =====================================================
   LOAD ITEMS
===================================================== */

async function loadItemMap(){

  itemMap = {};

  const isMain =
    String(branchInfo.role)
      .toLowerCase()
      .includes("main") ||
    String(branchInfo.code)
      .toUpperCase() === "MAIN";

  let url =
    API + "/items?select=*";

  if(
    !isMain &&
    branchInfo.uuid
  ){

    url +=
      "&branch_id=eq." +
      encodeURIComponent(
        branchInfo.uuid
      );

  }

  const res =
    await fetch(
      url,
      {
        headers:headers()
      }
    );

  if(!res.ok){

    throw new Error(
      "Items loading failed: " +
      await res.text()
    );

  }

  const data =
    await res.json();

  data.forEach(item=>{

    const key =
      item.id;

    itemMap[String(key)] = {

      name:
        item.item_name ||
        item.name ||
        item.item ||
        "Unknown Item",

      category:
        item.category ||
        "",

      unit:
        item.unit ||
        ""

    };

  });

}


/* =====================================================
   LOAD BRANCHES
===================================================== */

async function loadBranchMap(){

  branchMap = {};

  const res =
    await fetch(
      API +
      "/branches?select=*",
      {
        headers:headers()
      }
    );

  if(!res.ok){

    return;

  }

  const data =
    await res.json();

  data.forEach(branch=>{

    const id =
      branch.id ||
      branch.uuid;

    if(id === undefined ||
       id === null){

      return;

    }

    branchMap[String(id)] = {

      name:
        branch.branch_name ||
        branch.name ||
        branch.branch ||
        "",

      code:
        branch.branch_code ||
        branch.code ||
        ""

    };

  });

}


/* =====================================================
   LOAD TRANSACTIONS
===================================================== */

async function loadTransactions(){

  let url =
    API +
    "/stock_transactions?select=*&order=id.desc";

  const isMain =
    String(branchInfo.role)
      .toLowerCase()
      .includes("main") ||
    String(branchInfo.code)
      .toUpperCase() === "MAIN";

  /*
    Main:
    all branches

    Branch:
    only selected branch
  */

  if(
    !isMain &&
    branchInfo.uuid
  ){

    url +=
      "&branch_id=eq." +
      encodeURIComponent(
        branchInfo.uuid
      );

  }

  const res =
    await fetch(
      url,
      {
        headers:headers()
      }
    );

  if(!res.ok){

    throw new Error(
      "Stock transactions loading failed: " +
      await res.text()
    );

  }

  allTransactions =
    await res.json();

}


/* =====================================================
   FILTER
===================================================== */

function applyFilters(){

  const from =
    document
      .getElementById("fromDate")
      .value;

  const to =
    document
      .getElementById("toDate")
      .value;

  const person =
    document
      .getElementById("personFilter")
      .value
      .trim()
      .toLowerCase();

  const itemSearch =
    document
      .getElementById("itemFilter")
      .value
      .trim()
      .toLowerCase();

  const type =
    document
      .getElementById("typeFilter")
      .value
      .toUpperCase();

  filteredTransactions =
    allTransactions.filter(row=>{

      const transactionType =
        getType(row);

      const itemInfo =
        getItemInfo(row);

      const itemName =
        String(
          itemInfo.name || ""
        ).toLowerCase();

      const enteredBy =
        String(
          row.entered_by || ""
        ).toLowerCase();

      const issuedBy =
        String(
          row.issued_by || ""
        ).toLowerCase();

      const dateValue =
        row.entered_at ||
        row.created_at ||
        row.date ||
        "";

      let dateOK = true;

      if(dateValue){

        const d =
          new Date(dateValue);

        if(from){

          const f =
            new Date(
              from + "T00:00:00"
            );

          if(d < f){
            dateOK = false;
          }

        }

        if(to){

          const t =
            new Date(
              to + "T23:59:59"
            );

          if(d > t){
            dateOK = false;
          }

        }

      }

      const personOK =
        !person ||
        enteredBy.includes(person) ||
        issuedBy.includes(person);

      const itemOK =
        !itemSearch ||
        itemName.includes(itemSearch);

      const typeOK =
        !type ||
        transactionType === type;

      return (
        dateOK &&
        personOK &&
        itemOK &&
        typeOK
      );

    });

  renderReport();

}


/* =====================================================
   CLEAR FILTER
===================================================== */

function clearFilters(){

  document
    .getElementById("fromDate")
    .value = "";

  document
    .getElementById("toDate")
    .value = "";

  document
    .getElementById("personFilter")
    .value = "";

  document
    .getElementById("itemFilter")
    .value = "";

  document
    .getElementById("typeFilter")
    .value = "";

  filteredTransactions =
    [...allTransactions];

  renderReport();

}


/* =====================================================
   GROUP BY ITEM
===================================================== */

function groupByItem(rows){

  const groups = {};

  rows.forEach(row=>{

    const itemInfo =
      getItemInfo(row);

    /*
      Prefer item_id.
      This allows repeated Pasta transactions
      to be combined into ONE summary row.
    */

    const key =
      row.item_id !== null &&
      row.item_id !== undefined
        ? "id:" + row.item_id
        : "name:" +
          String(
            itemInfo.name || ""
          )
          .trim()
          .toLowerCase();

    if(!groups[key]){

      groups[key] = {

        itemId:
          row.item_id || "",

        itemName:
          itemInfo.name || "",

        category:
          itemInfo.category ||
          row.category ||
          "",

        unit:
          itemInfo.unit ||
          row.unit ||
          "",

        transactions:[],

        totalIn:0,

        totalOut:0

      };

    }

    const type =
      getType(row);

    const quantity =
      num(row.quantity);

    groups[key]
      .transactions
      .push(row);

    if(type === "IN"){

      groups[key].totalIn +=
        quantity;

    }

    if(type === "OUT"){

      groups[key].totalOut +=
        quantity;

    }

  });

  return Object.values(groups);

}


/* =====================================================
   RENDER REPORT
===================================================== */

function renderReport(){

  const rows =
    filteredTransactions;

  let totalIn = 0;

  let totalOut = 0;

  rows.forEach(row=>{

    const type =
      getType(row);

    const quantity =
      num(row.quantity);

    if(type === "IN"){
      totalIn += quantity;
    }

    if(type === "OUT"){
      totalOut += quantity;
    }

  });

  const groups =
    groupByItem(rows);

  document
    .getElementById("totalIn")
    .textContent =
      totalIn;

  document
    .getElementById("totalOut")
    .textContent =
      totalOut;

  document
    .getElementById("totalTransactions")
    .textContent =
      rows.length;

  document
    .getElementById("totalItems")
    .textContent =
      groups.length;

  document
    .getElementById("currentBalance")
    .textContent =
      totalIn - totalOut;

  if(!groups.length){

    document
      .getElementById("summaryArea")
      .innerHTML = `
        <div class="empty">
          No stock transactions found.
        </div>
      `;

    return;

  }

  let html = `

    <div class="table-scroll">

      <table>

        <thead>

          <tr>

            <th>Item Name</th>

            <th>Category</th>

            <th>Unit</th>

            <th>Current Balance</th>

            <th>Transaction Type</th>

            <th>Quantity</th>

            <th>Date & Time</th>

            <th>Entered By</th>

            <th>Issued By</th>

            <th>Expiry Date</th>

            <th>Signature</th>

            <th>Model 19</th>

            <th>Model 22</th>

            <th>Model 22 Number/Code</th>

            <th>Branch</th>

            <th>Transaction / Description</th>

            <th>Detail</th>

          </tr>

        </thead>

        <tbody>

  `;

  groups.forEach((group,index)=>{

    /*
      Latest transaction is used for the summary
      transaction columns.

      All transactions remain available through Detail.
    */

    const latest =
      group.transactions[0];

    const latestType =
      getType(latest);

    const latestModel =
      getModelInfo(latest);

    const latestItem =
      getItemInfo(latest);

    const latestBranch =
      getBranchInfo(latest);

    const latestDescription =
      getDescription(latest);

    const latestQuantity =
      num(latest.quantity);

    const balance =
      group.totalIn -
      group.totalOut;

    html += `

      <tr>

        <td>
          ${esc(group.itemName)}
        </td>

        <td>
          ${esc(group.category)}
        </td>

        <td>
          ${esc(group.unit)}
        </td>

        <td>
          ${group.totalIn}
        </td>

        <td>
          ${group.totalOut}
        </td>

        <td>
          <strong>
            ${balance}
          </strong>
        </td>

        <td>

          <span
            class="badge ${
              latestType === "IN"
                ? "badge-in"
                : "badge-out"
            }"
          >
            ${esc(latestType)}
          </span>

        </td>

        <td>
          ${latestQuantity}
        </td>

        <td>
          ${esc(
            formatDate(
              latest.entered_at ||
              latest.created_at ||
              latest.date
            )
          )}
        </td>

        <td>
          ${esc(
            latest.entered_by || ""
          )}
        </td>

        <td>
          ${esc(
            latest.issued_by || ""
          )}
        </td>

        <td>
          ${esc(
            latest.expiry_date || ""
          )}
        </td>

        <td>
          ${esc(
            latest.signature || ""
          )}
        </td>

        <td>
          ${
            latestType === "IN"
              ? esc(latestModel.model19)
              : ""
          }
        </td>

        <td>
          ${
            latestType === "OUT"
              ? esc(latestModel.model22)
              : ""
          }
        </td>

        <td>
          ${
            latestType === "OUT"
              ? esc(
                  latestModel.model22 &&
                  latestModel.model22 !==
                    "Model 22"
                    ? latestModel.model22
                    : ""
                )
              : ""
          }
        </td>

        <td>
          ${esc(
            latestBranch.name ||
            latestBranch.code ||
            ""
          )}
        </td>

        <td>
          ${esc(latestDescription)}
        </td>

        <td>

          <button
            class="detail-btn"
            onclick="showDetails(${index})"
          >
            Detail
          </button>

        </td>

      </tr>

    `;

  });

  html += `

        </tbody>

      </table>

    </div>

  `;

  document
    .getElementById("summaryArea")
    .innerHTML =
      html;

  /*
    Save current groups so Detail can access them.
  */

  window.reportGroups =
    groups;

}

/* =====================================================
   CLOSE DETAIL
===================================================== */

function closeDetail(){

  document
    .getElementById("detailModal")
    .style.display =
      "none";

}


/* =====================================================
   CLOSE OUTSIDE
===================================================== */

function closeModalOutside(event){

  if(
    event.target.id ===
    "detailModal"
  ){

    closeDetail();

  }

}


/* =====================================================
   DASHBOARD
===================================================== */

function goDashboard(){

  window.location.href =
    "./dashboard.html";

}


/* =====================================================
   LOAD EVERYTHING
===================================================== */

async function init(){

  try{

    document
      .getElementById("branchName")
      .textContent =
        branchInfo.name ||
        branchInfo.code ||
        "Main";

    await loadBranchMap();

    await loadItemMap();

    await loadTransactions();

    filteredTransactions =
      [...allTransactions];

    renderReport();

  }catch(error){

    console.error(error);

    document
      .getElementById("errorBox")
      .innerHTML = `

        <div class="error">

          ${esc(
            error.message ||
            "Report loading failed."
          )}

        </div>

      `;

    document
      .getElementById("summaryArea")
      .innerHTML = `

        <div class="empty">

          Report could not be loaded.

        </div>

      `;

  }

}


/* =====================================================
   START
===================================================== */

init();
