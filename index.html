<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AAFDRMC - Login</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f1f5f9;
}

.login-box {
  width: 90%;
  max-width: 400px;
  margin: 80px auto;
  padding: 30px;
  background: blue;
  border-radius: 15px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.15);
}

h1,
h2 {
  text-align: center;
  color: white;
}

input {
  width: 100%;
  padding: 13px;
  margin: 8px 0;
  border: 1px solid #cbd5e1;
  border-radius: 7px;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 13px;
  margin-top: 10px;
  border: none;
  border-radius: 7px;
  background: #1e3a8a;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

button:hover {
  background: #172554;
}

#loginMessage {
  text-align: center;
  margin-top: 15px;
  color: white;
}

</style>
</head>

<body>

<div class="login-box">

  <h1>🏢 AAFDRMC</h1>

  <h2>🔐 Login</h2>

  <input
    id="loginEmail"
    type="email"
    placeholder="Email"
    required
  >

  <input
    id="loginPassword"
    type="password"
    placeholder="Password"
    required
  >

  <button onclick="loginUser()">
    🔐 Login
  </button>

  <p id="loginMessage"></p>

</div>

<script>

const SUPABASE_URL =
"https://sslabegtsxlkafuygmar.supabase.co";

const SUPABASE_KEY =
"sb_publishable_M6oxZjm6xF5NbrXkSO9JqA_7JGSucXq";


async function loginUser() {

  const email =
    document.getElementById("loginEmail").value.trim();

  const password =
    document.getElementById("loginPassword").value;

  const message =
    document.getElementById("loginMessage");


  if (!email || !password) {

    message.textContent =
      "Email fi password guuti.";

    return;
  }


  message.textContent =
    "Login godhaa jira...";


  try {

    const response =
      await fetch(
        SUPABASE_URL +
        "/auth/v1/token?grant_type=password",
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json",
            "apikey": SUPABASE_KEY
          },

          body: JSON.stringify({
            email: email,
            password: password
          })
        }
      );


    const data =
      await response.json();


    if (response.ok) {

      localStorage.setItem(
        "access_token",
        data.access_token
      );

      localStorage.setItem(
        "refresh_token",
        data.refresh_token
      );

      window.location.href =
        "dashboard.html";

    } else {

      message.textContent =
        "Email ykn password sirrii miti.";

    }

  } catch (error) {

    message.textContent =
      "Internet ykn Supabase connection rakkoo qaba.";

    console.log(error);

  }

}

</script>

</body>
</html>
