<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AAFDRMC - Branch Selection</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f1f5f9;
  color:#1e293b;
}

.header{
  background:#1e3a8a;
  color:white;
  text-align:center;
  padding:35px 15px;
}

.header h1{
  margin:0;
  font-size:28px;
}

.header p{
  margin:10px 0 0;
  font-size:16px;
}

.container{
  width:92%;
  max-width:650px;
  margin:30px auto;
}

.card{
  background:white;
  border-radius:16px;
  padding:25px;
  box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.title{
  text-align:center;
  color:#1e3a8a;
  font-size:24px;
  font-weight:bold;
  margin-bottom:25px;
}

label{
  display:block;
  font-weight:bold;
  margin-bottom:8px;
}

select,
input{
  width:100%;
  padding:15px;
  border:1px solid #cbd5e1;
  border-radius:10px;
  font-size:16px;
  background:white;
}

select:focus,
input:focus{
  outline:none;
  border-color:#1e3a8a;
}

.group{
  margin-bottom:20px;
}

button{
  width:100%;
  padding:15px;
  border:0;
  border-radius:10px;
  background:#15803d;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#166534;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.message{
  display:none;
  padding:15px;
  border-radius:10px;
  margin-bottom:20px;
  font-weight:bold;
  line-height:1.5;
  white-space:pre-wrap;
  word-break:break-word;
}

.message.show{
  display:block;
}

.error{
  background:#fee2e2;
  color:#991b1b;
}

.success{
  background:#dcfce7;
  color:#166534;
}

.info{
  background:#eff6ff;
  color:#1e40af;
  border:1px solid #bfdbfe;
  padding:15px;
  border-radius:10px;
  margin-bottom:20px;
  line-height:1.6;
}

.branch-info{
  display:none;
  margin-top:20px;
  padding:15px;
  background:#f8fafc;
  border-radius:10px;
  border:1px solid #e2e8f0;
}

.branch-info.show{
  display:block;
}

.branch-name{
  color:#1e3a8a;
  font-size:20px;
  font-weight:bold;
}

.footer{
  text-align:center;
  margin-top:25px;
  color:#64748b;
  font-size:13px;
}

@media(max-width:600px){

  .header h1{
    font-size:23px;
  }

  .card{
    padding:18px;
  }

  .title{
    font-size:21px;
  }

}

</style>
</head>


<body>


<div class="header">

<h1>
AAFDRMC
</h1>

<p>
STORE MANAGEMENT SYSTEM
</p>

</div>


<div class="container">


<div class="card">


<div class="title">
🏢 Select Branch
</div>


<div id="message" class="message"></div>


<div class="info">

<strong>Branch kee filadhu.</strong>

<br>

Branch filattee booda Dashboard keessatti
Items, Stock In, Stock Out fi Reports fayyadamuu
dandeessa.

</div>


<div class="group">

<label>
Branch
</label>


<select id="branchSelect">

<option value="">
-- Select Branch --
</option>

<option value="Main" data-code="MAIN">
Main
</option>

<option value="Gulele" data-code="GUL">
Gulele
</option>

<option value="Addis Katama" data-code="AKT">
Addis Katama
</option>

<option value="Kolfee" data-code="KOL">
Kolfee
</option>

<option value="Nifas Silk Lafto" data-code="NSL">
Nifas Silk Lafto
</option>

<option value="Kirkos" data-code="KIR">
Kirkos
</option>

<option value="Lami Kura" data-code="LAM">
Lami Kura
</option>

<option value="Arada" data-code="ARA">
Arada
</option>

<option value="Lideta" data-code="LID">
Lideta
</option>

<option value="Bole" data-code="BOL">
Bole
</option>

<option value="Ekaa" data-code="EKA">
Ekaa
</option>

<option value="Akaki Kality" data-code="AKA">
Akaki Kality
</option>

<option value="Center" data-code="CTR">
Center
</option>

</select>

</div>


<div id="branchInfo" class="branch-info">

<div>
Selected Branch:
</div>

<div id="selectedBranchName" class="branch-name">
—
</div>

<div style="margin-top:8px;">
Branch Code:
<strong id="selectedBranchCode">
—
</strong>
</div>

</div>


<div style="margin-top:20px;">

<button
  id="continueButton"
  type="button">

➡️ Continue to Dashboard

</button>

</div>


<div class="footer">

AAFDRMC Store Management System

</div>


</div>

</div>


<script>


/* =====================================================
   BRANCH LIST
===================================================== */

const branches = [

  {
    name:"Main",
    code:"MAIN"
  },

  {
    name:"Gulele",
    code:"GUL"
  },

  {
    name:"Addis Katama",
    code:"AKT"
  },

  {
    name:"Kolfee",
    code:"KOL"
  },

  {
    name:"Nifas Silk Lafto",
    code:"NSL"
  },

  {
    name:"Kirkos",
    code:"KIR"
  },

  {
    name:"Lami Kura",
    code:"LAM"
  },

  {
    name:"Arada",
    code:"ARA"
  },

  {
    name:"Lideta",
    code:"LID"
  },

  {
    name:"Bole",
    code:"BOL"
  },

  {
    name:"Ekaa",
    code:"EKA"
  },

  {
    name:"Akaki Kality",
    code:"AKA"
  },

  {
    name:"Center",
    code:"CTR"
  }

];


/* =====================================================
   ELEMENTS
===================================================== */

const branchSelect =
  document.getElementById("branchSelect");

const continueButton =
  document.getElementById("continueButton");

const message =
  document.getElementById("message");

const branchInfo =
  document.getElementById("branchInfo");

const selectedBranchName =
  document.getElementById("selectedBranchName");

const selectedBranchCode =
  document.getElementById("selectedBranchCode");


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(text,type){

  message.textContent = text;

  message.className =
    "message show " + type;

}


/* =====================================================
   LOAD SAVED BRANCH
===================================================== */

function loadSavedBranch(){

  const savedName =
    localStorage.getItem(
      "selected_branch_name"
    );

  const savedCode =
    localStorage.getItem(
      "selected_branch_code"
    );


  if(!savedName){

    return;

  }


  const option =
    Array.from(
      branchSelect.options
    ).find(
      option =>
        option.value === savedName
    );


  if(option){

    branchSelect.value =
      savedName;

    selectedBranchName.textContent =
      savedName;

    selectedBranchCode.textContent =
      savedCode ||
      option.dataset.code ||
      "—";

    branchInfo.classList.add(
      "show"
    );

  }

}


/* =====================================================
   BRANCH SELECT
===================================================== */

branchSelect.addEventListener(
  "change",
  function(){

    const name =
      branchSelect.value;


    if(!name){

      branchInfo.classList.remove(
        "show"
      );

      return;

    }


    const option =
      branchSelect.options[
        branchSelect.selectedIndex
      ];


    const code =
      option.dataset.code ||
      "";


    selectedBranchName.textContent =
      name;

    selectedBranchCode.textContent =
      code;


    branchInfo.classList.add(
      "show"
    );


    showMessage(
      "✅ Branch " + name + " filatame.",
      "success"
    );

  }
);


/* =====================================================
   CONTINUE
===================================================== */

continueButton.addEventListener(
  "click",
  function(){

    const name =
      branchSelect.value;


    if(!name){

      showMessage(
        "❌ Mee Branch filadhu.",
        "error"
      );

      return;

    }


    const option =
      branchSelect.options[
        branchSelect.selectedIndex
      ];


    const code =
      option.dataset.code ||
      "";


    /*
    =====================================================
    IMPORTANT

    Branch maqaa fi code qofa asitti kuufna.

    branches.name hin barbaadnu.
    =====================================================
    */

    localStorage.setItem(
      "selected_branch_name",
      name
    );


    localStorage.setItem(
      "selected_branch_code",
      code
    );


    /*
    OLD WRONG UUID CLEAR
    */

    localStorage.removeItem(
      "selected_branch_id"
    );


    /*
    Dashboard keessatti branch maqaa
    sirriitti mul'ata.
    */

    showMessage(
      "✅ " +
      name +
      " filatameera.\n\n" +
      "Dashboardtti ce'aa...",
      "success"
    );


    continueButton.disabled =
      true;

    continueButton.textContent =
      "⏳ Opening Dashboard...";


    setTimeout(
      function(){

        window.location.href =
          "dashboard.html";

      },
      500
    );

  }
);


/* =====================================================
   START
===================================================== */

window.addEventListener(
  "DOMContentLoaded",
  function(){

    loadSavedBranch();

  }
);

</script>

</body>
</html>
