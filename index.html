<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AAFDRMC - Login</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,sans-serif;
  background:#f1f5f9;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.login-box{
  width:100%;
  max-width:430px;
  background:white;
  padding:28px;
  border-radius:18px;
  box-shadow:0 5px 25px rgba(0,0,0,.12);
}

.logo{
  text-align:center;
  font-size:42px;
  margin-bottom:8px;
}

h1{
  text-align:center;
  color:#1e3a8a;
  margin:0;
  font-size:25px;
}

.subtitle{
  text-align:center;
  color:#64748b;
  margin:8px 0 25px;
}

label{
  display:block;
  font-weight:bold;
  margin-bottom:8px;
}

input,select{
  width:100%;
  padding:14px;
  border:1px solid #cbd5e1;
  border-radius:9px;
  font-size:16px;
  margin-bottom:18px;
}

input:focus,select:focus{
  outline:none;
  border-color:#1e3a8a;
}

button{
  width:100%;
  padding:15px;
  border:0;
  border-radius:9px;
  background:#1e3a8a;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#172554;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.message{
  display:none;
  padding:14px;
  border-radius:9px;
  margin-bottom:18px;
  font-weight:bold;
  line-height:1.5;
  white-space:pre-wrap;
  word-break:break-word;
}

.message.show{
  display:block;
}

.error{
  background:#fee2e2;
  color:#991b1b;
}

.success{
  background:#dcfce7;
  color:#166534;
}

.loading{
  text-align:center;
  color:#64748b;
  margin-top:15px;
  display:none;
}

.footer{
  text-align:center;
  margin-top:20px;
  color:#64748b;
  font-size:13px;
}

@media(max-width:500px){
  .login-box{
    padding:22px;
  }

  h1{
    font-size:22px;
  }
}
</style>
</head>

<body>

<div class="login-box">

  <div class="logo">🏢</div>

  <h1>AAFDRMC</h1>

  <div class="subtitle">
    Store Management System
  </div>

  <div id="message" class="message"></div>

  <!-- BRANCH -->
  <label for="branch">
    Select Branch
  </label>

  <select id="branch">
    <option value="">
      -- Select Branch --
    </option>

    <option value="Main">
      Main
    </option>

    <option value="Gulele">
      Gulele
    </option>

    <option value="Addis Katama">
      Addis Katama
    </option>

    <option value="Kolfee">
      Kolfee
    </option>

    <option value="Nifas Silk Lafto">
      Nifas Silk Lafto
    </option>

    <option value="Kirkos">
      Kirkos
    </option>

    <option value="Lami Kura">
      Lami Kura
    </option>

    <option value="Arada">
      Arada
    </option>

    <option value="Lideta">
      Lideta
    </option>

    <option value="Bole">
      Bole
    </option>

    <option value="Ekaa">
      Ekaa
    </option>

    <option value="Akaki Kality">
      Akaki Kality
    </option>

    <option value="Center">
      Center
    </option>
  </select>


  <!-- EMAIL -->
  <label for="email">
    Email
  </label>

  <input
    id="email"
    type="email"
    placeholder="Enter your email"
    autocomplete="username"
  >


  <!-- PASSWORD -->
  <label for="password">
    Password
  </label>

  <input
    id="password"
    type="password"
    placeholder="Enter your password"
    autocomplete="current-password"
  >


  <button
    id="loginButton"
    type="button"
    onclick="login()">

    🔐 Login

  </button>


  <div
    id="loading"
    class="loading">

    ⏳ Logging in...

  </div>


  <div class="footer">
    AAFDRMC Store Management System
  </div>

</div>


<script>

/* =====================================================
   SUPABASE CONFIGURATION
===================================================== */

const SUPABASE_URL =
"https://sslabegtsxlkafuygmar.supabase.co";


/*
=====================================================
IMPORTANT

As keessatti SUPABASE Publishable/Anon Key kee galchi.

Service Role Key HIN GALCHIN.
=====================================================
*/

const SUPABASE_KEY =
"sb_publishable_M6oxZjm6xF5NbrXkSO9JqA_7JGSucXq";


/* =====================================================
   ELEMENTS
===================================================== */

const branchInput =
document.getElementById("branch");

const emailInput =
document.getElementById("email");

const passwordInput =
document.getElementById("password");

const loginButton =
document.getElementById("loginButton");

const loadingBox =
document.getElementById("loading");


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(text,type){

  const box =
    document.getElementById("message");

  box.textContent =
    text;

  box.className =
    "message show " + type;

}


/* =====================================================
   API KEY CHECK
===================================================== */

function checkAPIKey(){

  if(
    !SUPABASE_KEY ||
    SUPABASE_KEY === "YOUR_SUPABASE_KEY"
  ){

    showMessage(
      "❌ Supabase API Key hin galfamin.\n\n" +
      "SUPABASE_KEY keessatti Publishable/Anon Key kee galchi.",
      "error"
    );

    return false;
  }

  return true;
}


/* =====================================================
   LOGIN
===================================================== */

async function login(){

  if(!checkAPIKey()){
    return;
  }


  const branch =
    branchInput.value.trim();

  const email =
    emailInput.value.trim();

  const password =
    passwordInput.value;


  /* VALIDATION */

  if(!branch){

    showMessage(
      "❌ Mee Branch filadhu.",
      "error"
    );

    branchInput.focus();
    return;
  }


  if(!email){

    showMessage(
      "❌ Email galchi.",
      "error"
    );

    emailInput.focus();
    return;
  }


  if(!password){

    showMessage(
      "❌ Password galchi.",
      "error"
    );

    passwordInput.focus();
    return;
  }


  /* START LOADING */

  loginButton.disabled = true;
  loginButton.textContent = "⏳ Login...";
  loadingBox.style.display = "block";


  try{

    /*
    =================================================
    SUPABASE AUTH LOGIN
    =================================================
    */

    const response =
      await fetch(
        SUPABASE_URL +
        "/auth/v1/token?grant_type=password",
        {
          method:"POST",

          headers:{
            "apikey":
              SUPABASE_KEY,

            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              email:email,
              password:password
            })
        }
      );


    const result =
      await response.json();


    console.log(
      "LOGIN RESPONSE:",
      response.status,
      result
    );


    /*
    =================================================
    LOGIN ERROR
    =================================================
    */

    if(!response.ok){

      let errorMessage =
        result.error_description ||
        result.msg ||
        result.message ||
        "Login failed.";

      showMessage(
        "❌ Login hin milkoofne.\n\n" +
        errorMessage,
        "error"
      );

      return;
    }


    /*
    =================================================
    ACCESS TOKEN
    =================================================
    */

    if(!result.access_token){

      showMessage(
        "❌ Access token hin argamne.",
        "error"
      );

      return;
    }


    /*
    =================================================
    SAVE LOGIN DATA
    =================================================
    */

    localStorage.setItem(
      "access_token",
      result.access_token
    );


    if(result.refresh_token){

      localStorage.setItem(
        "refresh_token",
        result.refresh_token
      );

    }


    localStorage.setItem(
      "user_email",
      email
    );


    /*
    =================================================
    FIND BRANCH
    =================================================
    */

    const branchURL =
      SUPABASE_URL +
      "/rest/v1/branches" +
      "?select=*" +
      "&name=eq." +
      encodeURIComponent(branch) +
      "&limit=1";


    const branchResponse =
      await fetch(
        branchURL,
        {
          method:"GET",

          headers:{
            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              result.access_token,

            "Content-Type":
              "application/json",

            "Accept":
              "application/json"
          }
        }
      );


    const branchText =
      await branchResponse.text();


    console.log(
      "BRANCH RESPONSE:",
      branchResponse.status,
      branchText
    );


    /*
    =================================================
    BRANCH DATABASE ERROR
    =================================================
    */

    if(!branchResponse.ok){

      showMessage(
        "❌ Branch database irraa argachuu hin dandeenye.\n\n" +
        branchText,
        "error"
      );

      return;
    }


    let branchData = [];

    try{

      branchData =
        JSON.parse(branchText);

    }
    catch(error){

      showMessage(
        "❌ Branch response sirrii miti.",
        "error"
      );

      return;
    }


    /*
    =================================================
    BRANCH NOT FOUND
    =================================================
    */

    if(
      !Array.isArray(branchData) ||
      branchData.length === 0
    ){

      showMessage(
        "❌ Branch '" +
        branch +
        "' database keessatti hin argamne.",
        "error"
      );

      return;
    }


    /*
    =================================================
    REAL BRANCH
    =================================================
    */

    const branchRecord =
      branchData[0];


    if(!branchRecord.id){

      showMessage(
        "❌ Branch ID database irraa hin argamne.",
        "error"
      );

      return;
    }


    /*
    =================================================
    SAVE BRANCH DATA
    =================================================
    */

    localStorage.setItem(
      "selected_branch_id",
      String(branchRecord.id)
    );


    localStorage.setItem(
      "selected_branch_name",
      branch
    );


    if(branchRecord.code){

      localStorage.setItem(
        "selected_branch_code",
        String(branchRecord.code)
      );

    }
    else{

      localStorage.removeItem(
        "selected_branch_code"
      );

    }


    /*
    =================================================
    SUCCESS
    =================================================
    */

    showMessage(
      "✅ Login milkaa'e.\n\n" +
      "Branch: " +
      branch +
      "\n\n" +
      "Dashboard banamaa jira...",
      "success"
    );


    /*
    =================================================
    GO DASHBOARD
    =================================================
    */

    setTimeout(
      function(){

        window.location.href =
          "dashboard.html";

      },
      700
    );


  }
  catch(error){

    console.error(
      "LOGIN ERROR:",
      error
    );


    showMessage(
      "❌ Network error.\n\n" +
      "Internet kee ilaali.\n\n" +
      error.message,
      "error"
    );

  }
  finally{

    loginButton.disabled =
      false;

    loginButton.textContent =
      "🔐 Login";

    loadingBox.style.display =
      "none";

  }

}


/* =====================================================
   ENTER KEY LOGIN
===================================================== */

passwordInput.addEventListener(
  "keydown",
  function(event){

    if(event.key === "Enter"){

      login();

    }

  }
);


/* =====================================================
   CLEAR OLD WRONG BRANCH ID
   ONLY IF IT IS A BRANCH NAME
===================================================== */

(function(){

  const oldID =
    localStorage.getItem(
      "selected_branch_id"
    );

  const oldName =
    localStorage.getItem(
      "selected_branch_name"
    );


  /*
  Yoo ID duraan maqaa branch ta'e
  haqii. UUID sirrii login booda
  database irraa fudhatama.
  */

  if(
    oldID &&
    oldName &&
    oldID === oldName
  ){

    localStorage.removeItem(
      "selected_branch_id"
    );

  }

})();

</script>

</body>
</html>
