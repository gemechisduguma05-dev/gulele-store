<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gulele Store</title>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #f4f6f8;
}

header {
  background: #17324d;
  color: white;
  padding: 20px;
  text-align: center;
}

.container {
  max-width: 1000px;
  margin: auto;
  padding: 20px;
}

.box {
  background: white;
  padding: 20px;
  margin-bottom: 20px;
  border-radius: 10px;
}

input, button {
  width: 100%;
  padding: 12px;
  margin: 6px 0;
  box-sizing: border-box;
}

button {
  background: #1976d2;
  color: white;
  border: none;
  border-radius: 6px;
}

table {
  width: 100%;
  border-collapse: collapse;
}

th, td {
  padding: 10px;
  border-bottom: 1px solid #ddd;
  text-align: left;
}

th {
  background: #17324d;
  color: white;
}
</style>
</head>

<body>

<header>
  <h1>🏪 Gulele Store</h1>
  <p>Stock Management System</p>
</header>

<div class="container">

<div class="box">
  <h2>➕ Add Item</h2>

  <input id="name" placeholder="Item name">

  <input id="category" placeholder="Category">

  <input id="quantity" type="number" placeholder="Quantity">

  <input id="cost" type="number" step="0.01" placeholder="Cost Price">

  <input id="selling" type="number" step="0.01" placeholder="Selling Price">

  <button onclick="addItem()">Add Item</button>
</div>

<div class="box">
  <h2>📦 Items</h2>

  <table>
    <thead>
      <tr>
        <th>Item</th>
        <th>Category</th>
        <th>Quantity</th>
        <th>Cost</th>
        <th>Selling</th>
      </tr>
    </thead>

    <tbody id="items"></tbody>
  </table>
</div>

</div>

<script>

const SUPABASE_URL =
"https://sslabegtsxlkafuygmar.supabase.co";

const SUPABASE_KEY =
"sb_publishable_M6oxZjm6xF5NbrXkSO9JqA_7JGSucXq";

async function loadItems() {

  const response = await fetch(
    SUPABASE_URL + "/rest/v1/items?select=*",
    {
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY
      }
    }
  );

  const data = await response.json();

  const table = document.getElementById("items");

  table.innerHTML = "";

  data.forEach(item => {

    table.innerHTML += `
      <tr>
        <td>${item.name}</td>
        <td>${item.category}</td>
        <td>${item.quantity}</td>
        <td>${item.cost_price}</td>
        <td>${item.selling_price}</td>
      </tr>
    `;

  });
}

async function addItem() {

  const item = {
    name: document.getElementById("name").value,
    category: document.getElementById("category").value,
    quantity: Number(document.getElementById("quantity").value),
    cost_price: Number(document.getElementById("cost").value),
    selling_price: Number(document.getElementById("selling").value)
  };

  const response = await fetch(
    SUPABASE_URL + "/rest/v1/items",
    {
      method: "POST",

      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY,
        "Prefer": "return=minimal"
      },

      body: JSON.stringify(item)
    }
  );

  if (response.ok) {

    alert("Item added successfully!");

    loadItems();

  } else {

    const error = await response.text();

    alert("Error: " + error);
  }
}

loadItems();

</script>

</body>
</html>
