<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>AAFDRMC - Login</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,sans-serif;
    background:
        linear-gradient(
            rgba(62,39,35,.82),
            rgba(78,52,46,.88)
        ),
        url("./1788633150526.jpg") center/cover no-repeat fixed;

    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}


/* ================= LOGIN CONTAINER ================= */

.login-container{
    width:100%;
    max-width:440px;
}


/* ================= CARD ================= */

.login-card{
    background:rgba(255,255,255,.97);
    border-radius:20px;
    padding:30px;
    box-shadow:
        0 15px 45px rgba(0,0,0,.35);

    text-align:center;
}


/* ================= LOGO ================= */

.logo-box{
    width:105px;
    height:105px;
    margin:0 auto 15px;

    border-radius:50%;
    overflow:hidden;

    background:white;

    border:5px solid #795548;

    box-shadow:
        0 5px 18px rgba(0,0,0,.20);

    display:flex;
    align-items:center;
    justify-content:center;
}

.logo{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}


/* ================= TITLE ================= */

h1{
    margin:5px 0 5px;
    color:#4e342e;
    font-size:25px;
}

.subtitle{
    color:#795548;
    font-size:14px;
    margin-bottom:25px;
}


/* ================= LABEL ================= */

label{
    display:block;
    text-align:left;
    font-size:14px;
    font-weight:bold;
    color:#4e342e;
    margin-bottom:7px;
}


/* ================= INPUT ================= */

select,
input{
    width:100%;
    padding:13px 14px;

    border:1px solid #d7ccc8;
    border-radius:9px;

    background:#fff;

    font-size:15px;

    outline:none;

    margin-bottom:16px;
}

select:focus,
input:focus{
    border-color:#795548;

    box-shadow:
        0 0 0 3px
        rgba(121,85,72,.12);
}


/* ================= BUTTON ================= */

button{
    width:100%;

    padding:13px;

    border:none;
    border-radius:9px;

    font-size:15px;
    font-weight:bold;

    cursor:pointer;

    transition:.2s;
}

button:hover{
    transform:translateY(-1px);
}


/* LOGIN */

.login-btn{
    background:#6d4c41;
    color:white;

    margin-top:3px;
}

.login-btn:hover{
    background:#5d4037;
}


/* MAIN */

.main-btn{
    background:#efebe9;
    color:#4e342e;

    margin-top:10px;
}

.main-btn:hover{
    background:#d7ccc8;
}


/* ================= MESSAGE ================= */

.message{
    display:none;

    margin-top:15px;

    padding:12px;

    border-radius:8px;

    font-size:14px;
    font-weight:bold;

    word-break:break-word;
}

.message.error{
    display:block;

    background:#ffebee;
    color:#c62828;
}

.message.success{
    display:block;

    background:#e8f5e9;
    color:#2e7d32;
}


/* ================= FOOTER ================= */

.footer{
    margin-top:20px;

    color:#8d6e63;

    font-size:12px;
}


/* ================= MOBILE ================= */

@media(max-width:500px){

    body{
        padding:14px;
    }

    .login-card{
        padding:23px 18px;
        border-radius:16px;
    }

    .logo-box{
        width:90px;
        height:90px;
    }

    h1{
        font-size:21px;
    }

    .subtitle{
        font-size:13px;
    }

}

</style>

</head>


<body>


<div class="login-container">

    <div class="login-card">


        <!-- ================= LOGO ================= -->

        <div class="logo-box">

            <img
                src="./1788633150526.jpg"
                class="logo"
                alt="AAFDRMC Profile">

        </div>


        <!-- ================= TITLE ================= -->

        <h1>
            AAFDRMC
        </h1>

        <div class="subtitle">
            Stock Management System
        </div>


        <!-- ================= BRANCH ================= -->

        <label for="branch">
            Select Branch
        </label>

        <select id="branch">

            <option value="">
                -- Select Branch --
            </option>

        </select>


        <!-- ================= USER ================= -->

        <label for="username">
            Email or Branch Code
        </label>

        <input
            type="text"
            id="username"
            placeholder="Email ykn Branch Code"
            autocomplete="username">


        <!-- ================= PASSWORD ================= -->

        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Password"
            autocomplete="current-password">


        <!-- ================= LOGIN ================= -->

        <button
            class="login-btn"
            id="loginButton"
            onclick="login()">

            Login

        </button>


        <!-- ================= MAIN ================= -->

        <button
            class="main-btn"
            onclick="goMain()">

            Main Dashboard

        </button>


        <!-- ================= MESSAGE ================= -->

        <div
            id="message"
            class="message">
        </div>


        <div class="footer">
            AAFDRMC Stock Management System
        </div>

    </div>

</div>



<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://sslabegtsxlkafuygmar.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_M6oxZjm6xF5NbrXkSO9JqA_7JGSucXq";


/* =====================================================
   FIXED BRANCH LIST
===================================================== */

const BRANCHES = [

    {
        id:"MAIN",
        name:"Main",
        code:"MAIN"
    },

    {
        id:"GUL",
        name:"Gulele",
        code:"GUL"
    },

    {
        id:"AKT",
        name:"Addis Katama",
        code:"AKT"
    },

    {
        id:"KLF",
        name:"Kolfee",
        code:"KLF"
    },

    {
        id:"NSL",
        name:"Nifas Silk Lafto",
        code:"NSL"
    },

    {
        id:"KIR",
        name:"Kirkos",
        code:"KIR"
    },

    {
        id:"LAM",
        name:"Lami Kura",
        code:"LAM"
    },

    {
        id:"ARA",
        name:"Arada",
        code:"ARA"
    },

    {
        id:"LID",
        name:"Lideta",
        code:"LID"
    },

    {
        id:"BOL",
        name:"Bole",
        code:"BOL"
    },

    {
        id:"EKA",
        name:"Ekaa",
        code:"EKA"
    },

    {
        id:"AKA",
        name:"Akaki Kality",
        code:"AKA"
    },

    {
        id:"CTR",
        name:"Center",
        code:"CTR"
    }

];


/* =====================================================
   LOAD BRANCHES
===================================================== */

function loadBranches(){

    const select =
        document.getElementById("branch");


    select.innerHTML = `
        <option value="">
            -- Select Branch --
        </option>
    `;


    BRANCHES.forEach(
        branch => {

            const option =
                document.createElement("option");


            option.value =
                branch.id;


            option.textContent =
                branch.name +
                " (" +
                branch.code +
                ")";


            option.dataset.name =
                branch.name;


            option.dataset.code =
                branch.code;


            select.appendChild(option);

        }
    );

}


/* =====================================================
   BRANCH SELECT
===================================================== */

document
    .getElementById("branch")
    .addEventListener(
        "change",
        function(){

            const option =
                this.options[
                    this.selectedIndex
                ];


            if(
                !option ||
                !option.value
            ){
                return;
            }


            localStorage.setItem(
                "selected_branch_name",
                option.dataset.name
            );


            localStorage.setItem(
                "selected_branch_code",
                option.dataset.code
            );


            /*
               Main ID = MAIN
               Operational branches
               use their codes until
               real database ID is known.
            */

            localStorage.setItem(
                "selected_branch_id",
                option.value
            );

        }
    );


/* =====================================================
   SHOW MESSAGE
===================================================== */

function showMessage(
    text,
    type
){

    const message =
        document.getElementById(
            "message"
        );


    message.textContent =
        text;


    message.className =
        "message " + type;

}


/* =====================================================
   SAVE BRANCH
===================================================== */

function saveSelectedBranch(){

    const select =
        document.getElementById(
            "branch"
        );


    const option =
        select.options[
            select.selectedIndex
        ];


    if(
        !option ||
        !option.value
    ){

        return false;

    }


    localStorage.setItem(
        "selected_branch_id",
        option.value
    );


    localStorage.setItem(
        "selected_branch_name",
        option.dataset.name
    );


    localStorage.setItem(
        "selected_branch_code",
        option.dataset.code
    );


    return true;

}


/* =====================================================
   LOGIN
===================================================== */

async function login(){

    const select =
        document.getElementById(
            "branch"
        );


    const username =
        document
            .getElementById(
                "username"
            )
            .value
            .trim();


    const password =
        document
            .getElementById(
                "password"
            )
            .value;


    /* ================= VALIDATION ================= */

    if(!select.value){

        showMessage(
            "Mee Branch filadhu.",
            "error"
        );

        return;

    }


    if(!username){

        showMessage(
            "Email ykn Branch Code galchi.",
            "error"
        );

        return;

    }


    if(!password){

        showMessage(
            "Password galchi.",
            "error"
        );

        return;

    }


    if(
        !saveSelectedBranch()
    ){

        showMessage(
            "Branch filachuun hin milkoofne.",
            "error"
        );

        return;

    }


    const selectedBranch =
        BRANCHES.find(
            b =>
                b.id === select.value
        );


    if(!selectedBranch){

        showMessage(
            "Branch hin argamne.",
            "error"
        );

        return;

    }


    const loginButton =
        document.getElementById(
            "loginButton"
        );


    loginButton.disabled =
        true;


    loginButton.textContent =
        "Logging in...";


    /* =================================================
       MAIN LOGIN
    ================================================= */

    if(
        selectedBranch.id === "MAIN"
    ){

        /*
           Main dashboard access.
           Password must not be empty.
        */

        localStorage.setItem(
            "is_logged_in",
            "true"
        );


        localStorage.setItem(
            "user_role",
            "main"
        );


        localStorage.setItem(
            "login_user",
            username
        );


        window.location.href =
            "dashboard.html";


        return;

    }


    /* =================================================
       BRANCH CODE LOGIN
    ================================================= */

    if(
        username.toUpperCase()
        ===
        selectedBranch.code
    ){

        /*
           Branch code login.
           Password required.
        */

        localStorage.setItem(
            "is_logged_in",
            "true"
        );


        localStorage.setItem(
            "user_role",
            "branch"
        );


        localStorage.setItem(
            "login_user",
            username
        );


        window.location.href =
            "dashboard.html";


        return;

    }


    /* =================================================
       EMAIL LOGIN - SUPABASE AUTH
    ================================================= */

    try{

        const response =
            await fetch(

                SUPABASE_URL +
                "/auth/v1/token?grant_type=password",

                {
                    method:"POST",

                    headers:{
                        "apikey":
                            SUPABASE_KEY,

                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            email:username,

                            password:password

                        })
                }

            );


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data.error_description ||
                data.msg ||
                data.message ||
                "Login failed"
            );

        }


        /* ================= SESSION ================= */

        localStorage.setItem(
            "access_token",
            data.access_token || ""
        );


        localStorage.setItem(
            "refresh_token",
            data.refresh_token || ""
        );


        localStorage.setItem(
            "is_logged_in",
            "true"
        );


        localStorage.setItem(
            "user_role",
            "branch"
        );


        localStorage.setItem(
            "login_user",
            username
        );


        window.location.href =
            "dashboard.html";


    }
    catch(error){

        console.error(error);


        showMessage(
            "Login hin milkoofne: " +
            error.message,
            "error"
        );


        loginButton.disabled =
            false;


        loginButton.textContent =
            "Login";

    }

}


/* =====================================================
   MAIN DASHBOARD
===================================================== */

function goMain(){

    localStorage.setItem(
        "selected_branch_id",
        "MAIN"
    );


    localStorage.setItem(
        "selected_branch_name",
        "Main"
    );


    localStorage.setItem(
        "selected_branch_code",
        "MAIN"
    );


    localStorage.setItem(
        "is_logged_in",
        "true"
    );


    localStorage.setItem(
        "user_role",
        "main"
    );


    localStorage.setItem(
        "login_user",
        "MAIN"
    );


    window.location.href =
        "dashboard.html";

}


/* =====================================================
   ENTER KEY
===================================================== */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter"
        ){

            login();

        }

    }
);


/* =====================================================
   START
===================================================== */

loadBranches();

</script>

</body>

</html>
