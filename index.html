  </button>  <p id="loginMessage"></p></div><script>

const SUPABASE_URL =
"https://sslabegtsxlkafuygmar.supabase.co";

const SUPABASE_KEY =
"sb_publishable_M6oxZjm6xF5NbrXkSO9JqA_7JGSucXq";


async function loginUser() {

  const email =
    document.getElementById("loginEmail").value.trim();

  const password =
    document.getElementById("loginPassword").value;

  const message =
    document.getElementById("loginMessage");

  if (!email || !password) {

    message.textContent =
      "Email fi password guuti.";

    return;
  }

  const response = await fetch(
    SUPABASE_URL +
    "/auth/v1/token?grant_type=password",
    {
      method: "POST",

      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_KEY
      },

      body: JSON.stringify({
        email: email,
        password: password
      })
    }
  );

  const data = await response.json();

  if (response.ok) {

    localStorage.setItem(
      "access_token",
      data.access_token
    );

    window.location.href =
      "dashboard.html";

  } else {

    message.textContent =
      "Email ykn password sirrii miti.";

  }
}

</script></body>
