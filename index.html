<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>AAFDRMC - Branch Login</title><style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f1f5f9;
}

.login-box{
  width:90%;
  max-width:420px;
  margin:50px auto;
  padding:30px;
  background:#1e3a8a;
  border-radius:15px;
  box-shadow:0 4px 15px rgba(0,0,0,.15);
}

h1,h2{
  text-align:center;
  color:white;
}

label{
  display:block;
  color:white;
  font-weight:bold;
  margin-top:15px;
  margin-bottom:6px;
}

select,
input{
  width:100%;
  padding:13px;
  margin:5px 0;
  border:1px solid #cbd5e1;
  border-radius:7px;
  font-size:16px;
  background:white;
}

button{
  width:100%;
  padding:13px;
  margin-top:15px;
  border:none;
  border-radius:7px;
  background:#2563eb;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#172554;
}

.back-button{
  background:#64748b;
}

#loginMessage{
  text-align:center;
  margin-top:15px;
  color:white;
  font-weight:bold;
}

.branch-info{
  background:white;
  color:#1e3a8a;
  padding:12px;
  border-radius:8px;
  text-align:center;
  font-weight:bold;
  margin-top:15px;
}

</style></head><body><div class="login-box"><h1>🏢 AAFDRMC</h1><h2>🔐 User Login</h2><!-- =====================================================
     BRANCH SELECTION
===================================================== --><label for="branchSelect">
📍 Select Branch
</label><select id="branchSelect"
onchange="selectBranch()">

<option value="">
-- Select Branch --
</option><option value="branch1">
Branch 1
</option><option value="branch2">
Branch 2
</option><option value="branch3">
Branch 3
</option><option value="branch4">
Branch 4
</option><option value="branch5">
Branch 5
</option><option value="branch6">
Branch 6
</option><option value="branch7">
Branch 7
</option><option value="branch8">
Branch 8
</option><option value="branch9">
Branch 9
</option><option value="branch10">
Branch 10
</option><option value="branch11">
Branch 11
</option><option value="branch12">
Branch 12
</option></select><div
id="branchInfo"
class="branch-info">📍 Branch hin filatamne

</div><!-- =====================================================
     USER ID
===================================================== --><label for="loginUserId">
👤 User ID
</label><input
id="loginUserId"
type="text"
placeholder="User ID"
autocomplete="username">

<!-- =====================================================
     PASSWORD
===================================================== --><label for="loginPassword">
🔑 Password
</label><input
id="loginPassword"
type="password"
placeholder="Password"
autocomplete="current-password">

<!-- =====================================================
     LOGIN BUTTON
===================================================== --><button onclick="loginUser()">🔐 Login

</button><button
class="back-button"
onclick="changeBranch()">

↻ Change Branch

</button><p id="loginMessage"></p></div><script>


/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://sslabegtsxlkafuygmar.supabase.co";

const SUPABASE_KEY =
"sb_publishable_M6oxZjm6xF5NbrXkSO9JqA_7JGSucXK9Jq";


/* =====================================================
   BRANCH LIST
===================================================== */

const branches = {

branch1:"Branch 1",
branch2:"Branch 2",
branch3:"Branch 3",
branch4:"Branch 4",
branch5:"Branch 5",
branch6:"Branch 6",
branch7:"Branch 7",
branch8:"Branch 8",
branch9:"Branch 9",
branch10:"Branch 10",
branch11:"Branch 11",
branch12:"Branch 12"

};


/* =====================================================
   SELECT BRANCH
===================================================== */

function selectBranch(){

const select =
document.getElementById(
"branchSelect"
);

const branchId =
select.value;


if(!branchId){

localStorage.removeItem(
"selected_branch_id"
);

localStorage.removeItem(
"selected_branch_name"
);

document.getElementById(
"branchInfo"
).textContent =
"📍 Branch hin filatamne";

return;

}


const branchName =
branches[branchId];


localStorage.setItem(
"selected_branch_id",
branchId
);

localStorage.setItem(
"selected_branch_name",
branchName
);


document.getElementById(
"branchInfo"
).textContent =
"📍 " + branchName;

}


/* =====================================================
   SHOW SAVED BRANCH
===================================================== */

function showBranch(){

const branchId =
localStorage.getItem(
"selected_branch_id"
);

const branchName =
localStorage.getItem(
"selected_branch_name"
);


if(branchId && branchName){

document.getElementById(
"branchSelect"
).value =
branchId;

document.getElementById(
"branchInfo"
).textContent =
"📍 " + branchName;

}

}


/* =====================================================
   LOGIN
===================================================== */

async function loginUser(){

const userId =
document.getElementById(
"loginUserId"
).value.trim();

const password =
document.getElementById(
"loginPassword"
).value;

const message =
document.getElementById(
"loginMessage"
);


const selectedBranchId =
localStorage.getItem(
"selected_branch_id"
);


if(!selectedBranchId){

message.textContent =
"❌ Dura jalqaba Branch filadhu.";

return;

}


if(!userId){

message.textContent =
"❌ User ID galchi.";

return;

}


if(!password){

message.textContent =
"❌ Password galchi.";

return;

}


message.textContent =
"Login mirkaneessaa jira...";


try{


const response =
await fetch(

SUPABASE_URL +
"/rest/v1/users?select=*&user_id=eq." +
encodeURIComponent(userId) +
"&branch_id=eq." +
encodeURIComponent(selectedBranchId) +
"&limit=1",

{

headers:{

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer " +
SUPABASE_KEY

}

});


if(!response.ok){

const error =
await response.text();

console.log(
"User lookup error:",
error
);

message.textContent =
"❌ User database rakkoo qaba.";

return;

}


const users =
await response.json();


if(users.length === 0){

message.textContent =
"❌ User ID ykn Branch sirrii miti.";

return;

}


const user =
users[0];


/* =====================================================
   PASSWORD CHECK
===================================================== */

if(String(user.password) !==
String(password)){

message.textContent =
"❌ Password sirrii miti.";

return;

}


/* =====================================================
   SAVE LOGIN
===================================================== */

localStorage.setItem(
"user_id",
String(user.user_id)
);

localStorage.setItem(
"user_db_id",
String(user.id)
);

localStorage.setItem(
"branch_id",
String(user.branch_id)
);

localStorage.setItem(
"user_branch",
user.branch_name ||
branches[selectedBranchId] ||
""
);

localStorage.setItem(
"is_logged_in",
"true"
);


/* =====================================================
   SUCCESS
===================================================== */

message.textContent =
"✅ Login milkaa'e. Dashboard banamaa jira...";


setTimeout(function(){

window.location.href =
"dashboard.html";

},700);


}

catch(error){

console.log(
"Login error:",
error
);

message.textContent =
"❌ Internet ykn Supabase connection rakkoo qaba.";

}

}


/* =====================================================
   CHANGE BRANCH
===================================================== */

function changeBranch(){

localStorage.removeItem(
"selected_branch_id"
);

localStorage.removeItem(
"selected_branch_name"
);

document.getElementById(
"branchSelect"
).value =
"";

document.getElementById(
"branchInfo"
).textContent =
"📍 Branch hin filatamne";

document.getElementById(
"loginMessage"
).textContent =
"";

}


/* =====================================================
   START
===================================================== */

showBranch();

</script></body></html>
