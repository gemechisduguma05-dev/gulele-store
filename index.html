<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>AAFDRMC - Login</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,sans-serif;

    background:
        linear-gradient(
            rgba(62,39,35,.82),
            rgba(78,52,46,.88)
        ),
        url("./1788633150526.jpg") center/cover no-repeat fixed;

    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.login-container{
    width:100%;
    max-width:440px;
}

.login-card{
    background:rgba(255,255,255,.97);
    border-radius:20px;
    padding:30px;

    box-shadow:
        0 15px 45px rgba(0,0,0,.35);

    text-align:center;
}

.logo-box{
    width:105px;
    height:105px;
    margin:0 auto 15px;

    border-radius:50%;
    overflow:hidden;

    background:white;

    border:5px solid #795548;

    box-shadow:
        0 5px 18px rgba(0,0,0,.20);

    display:flex;
    align-items:center;
    justify-content:center;
}

.logo{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

h1{
    margin:5px 0 5px;
    color:#4e342e;
    font-size:25px;
}

.subtitle{
    color:#795548;
    font-size:14px;
    margin-bottom:25px;
}

label{
    display:block;
    text-align:left;
    font-size:14px;
    font-weight:bold;
    color:#4e342e;
    margin-bottom:7px;
}

select,
input{
    width:100%;
    padding:13px 14px;

    border:1px solid #d7ccc8;
    border-radius:9px;

    background:#fff;

    font-size:15px;

    outline:none;

    margin-bottom:16px;
}

select:focus,
input:focus{
    border-color:#795548;

    box-shadow:
        0 0 0 3px
        rgba(121,85,72,.12);
}

button{
    width:100%;

    padding:13px;

    border:none;
    border-radius:9px;

    font-size:15px;
    font-weight:bold;

    cursor:pointer;

    transition:.2s;
}

button:hover{
    transform:translateY(-1px);
}

button:disabled{
    opacity:.65;
    cursor:not-allowed;
    transform:none;
}

.login-btn{
    background:#6d4c41;
    color:white;

    margin-top:3px;
}

.login-btn:hover{
    background:#5d4037;
}

.main-btn{
    background:#efebe9;
    color:#4e342e;

    margin-top:10px;
}

.main-btn:hover{
    background:#d7ccc8;
}

.message{
    display:none;

    margin-top:15px;

    padding:12px;

    border-radius:8px;

    font-size:14px;
    font-weight:bold;

    word-break:break-word;
}

.message.error{
    display:block;

    background:#ffebee;
    color:#c62828;
}

.message.success{
    display:block;

    background:#e8f5e9;
    color:#2e7d32;
}

.footer{
    margin-top:20px;

    color:#8d6e63;

    font-size:12px;
}

@media(max-width:500px){

    body{
        padding:14px;
    }

    .login-card{
        padding:23px 18px;
        border-radius:16px;
    }

    .logo-box{
        width:90px;
        height:90px;
    }

    h1{
        font-size:21px;
    }

    .subtitle{
        font-size:13px;
    }

}

</style>

</head>


<body>

<div class="login-container">

    <div class="login-card">

        <div class="logo-box">

            <img
                src="./1788633150526.jpg"
                class="logo"
                alt="AAFDRMC Profile">

        </div>

        <h1>
            AAFDRMC
        </h1>

        <div class="subtitle">
            Stock Management System
        </div>

        <label for="branch">
            Select Branch
        </label>

        <select id="branch">

            <option value="">
                -- Select Branch --
            </option>

        </select>

        <label for="username">
            Email or Branch Code
        </label>

        <input
            type="text"
            id="username"
            placeholder="Email ykn Branch Code"
            autocomplete="username">

        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Password"
            autocomplete="current-password">

        <button
            class="login-btn"
            id="loginButton"
            onclick="login()">

            Login

        </button>

        <button
            class="main-btn"
            onclick="goMain()">

            Main Dashboard

        </button>

        <div
            id="message"
            class="message">
        </div>

        <div class="footer">
            AAFDRMC Stock Management System
        </div>

    </div>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://sslabegtsxlkafuygmar.supabase.co";

/*
 IMPORTANT:
 API KEY kee asuma keessatti hin jijjiirin.
 Key sirrii Supabase Project > Settings > API
 irraa fudhatamuu qaba.
*/

const SUPABASE_KEY =
    "sb_publishable_G3Nv_yg4LaCiMtJMiadMxQ_f2fNHg5x";


/* =====================================================
   MAIN + 12 OPERATIONAL BRANCHES
===================================================== */

const BRANCHES = [

    {
        id:"MAIN",
        name:"Main",
        code:"MAIN",
        db_id:""
    },

    {
        id:"GUL",
        name:"Gulele",
        code:"GUL",
        db_id:""
    },

    {
        id:"AKT",
        name:"Addis Katama",
        code:"AKT",
        db_id:""
    },

    {
        id:"KLF",
        name:"Kolfee",
        code:"KLF",
        db_id:""
    },

    {
        id:"NSL",
        name:"Nifas Silk Lafto",
        code:"NSL",
        db_id:""
    },

    {
        id:"KIR",
        name:"Kirkos",
        code:"KIR",
        db_id:""
    },

    {
        id:"LAM",
        name:"Lami Kura",
        code:"LAM",
        db_id:""
    },

    {
        id:"ARA",
        name:"Arada",
        code:"ARA",
        db_id:""
    },

    {
        id:"LID",
        name:"Lideta",
        code:"LID",
        db_id:""
    },

    {
        id:"BOL",
        name:"Bole",
        code:"BOL",
        db_id:""
    },

    {
        id:"EKA",
        name:"Ekaa",
        code:"EKA",
        db_id:""
    },

    {
        id:"AKA",
        name:"Akaki Kality",
        code:"AKA",
        db_id:""
    },

    {
        id:"CTR",
        name:"Center",
        code:"CTR",
        db_id:""
    }

];


/* =====================================================
   LOAD BRANCHES
===================================================== */

function loadBranches(){

    const select =
        document.getElementById("branch");

    select.innerHTML = `
        <option value="">
            -- Select Branch --
        </option>
    `;

    BRANCHES.forEach(branch => {

        const option =
            document.createElement("option");

        option.value =
            branch.id;

        option.textContent =
            branch.name +
            " (" +
            branch.code +
            ")";

        option.dataset.name =
            branch.name;

        option.dataset.code =
            branch.code;

        option.dataset.dbid =
            branch.db_id || "";

        select.appendChild(option);

    });

}


/* =====================================================
   SAVE SELECTED BRANCH
===================================================== */

function saveSelectedBranch(){

    const select =
        document.getElementById("branch");

    const option =
        select.options[
            select.selectedIndex
        ];

    if(
        !option ||
        !option.value
    ){
        return false;
    }

    const branch =
        BRANCHES.find(
            b => b.id === option.value
        );

    if(!branch){
        return false;
    }

    /*
       Local branch code
    */

    localStorage.setItem(
        "selected_branch_id",
        branch.id
    );

    localStorage.setItem(
        "selected_branch_name",
        branch.name
    );

    localStorage.setItem(
        "selected_branch_code",
        branch.code
    );

    /*
       Real Supabase UUID.
       Yeroo UUID hin jirre
       empty ta'a.
    */

    localStorage.setItem(
        "selected_branch_uuid",
        branch.db_id || ""
    );

    return true;

}


/* =====================================================
   BRANCH CHANGE
===================================================== */

document
    .getElementById("branch")
    .addEventListener(
        "change",
        function(){

            if(!this.value){
                return;
            }

            saveSelectedBranch();

        }
    );


/* =====================================================
   SHOW MESSAGE
===================================================== */

function showMessage(
    text,
    type
){

    const message =
        document.getElementById("message");

    message.textContent =
        text;

    message.className =
        "message " + type;

}


/* =====================================================
   LOGIN
===================================================== */

async function login(){

    const select =
        document.getElementById("branch");

    const username =
        document
            .getElementById("username")
            .value
            .trim();

    const password =
        document
            .getElementById("password")
            .value;

    if(!select.value){

        showMessage(
            "Mee Branch filadhu.",
            "error"
        );

        return;

    }

    if(!username){

        showMessage(
            "Email ykn Branch Code galchi.",
            "error"
        );

        return;

    }

    if(!password){

        showMessage(
            "Password galchi.",
            "error"
        );

        return;

    }

    if(!saveSelectedBranch()){

        showMessage(
            "Branch filachuun hin milkoofne.",
            "error"
        );

        return;

    }

    const selectedBranch =
        BRANCHES.find(
            b => b.id === select.value
        );

    if(!selectedBranch){

        showMessage(
            "Branch hin argamne.",
            "error"
        );

        return;

    }

    const loginButton =
        document.getElementById("loginButton");

    loginButton.disabled =
        true;

    loginButton.textContent =
        "Logging in...";


    /* =================================================
       MAIN
    ================================================= */

    if(selectedBranch.id === "MAIN"){

        localStorage.setItem(
            "is_logged_in",
            "true"
        );

        localStorage.setItem(
            "user_role",
            "main"
        );

        localStorage.setItem(
            "login_user",
            username
        );

        window.location.href =
            "dashboard.html";

        return;

    }


    /* =================================================
       BRANCH CODE LOGIN
    ================================================= */

    if(
        username.toUpperCase()
        ===
        selectedBranch.code
    ){

        localStorage.setItem(
            "is_logged_in",
            "true"
        );

        localStorage.setItem(
            "user_role",
            "branch"
        );

        localStorage.setItem(
            "login_user",
            username
        );

        window.location.href =
            "dashboard.html";

        return;

    }


    /* =================================================
       EMAIL LOGIN
    ================================================= */

    try{

        const response =
            await fetch(

                SUPABASE_URL +
                "/auth/v1/token?grant_type=password",

                {
                    method:"POST",

                    headers:{
                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            SUPABASE_KEY,

                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            email:username,

                            password:password

                        })
                }

            );


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data.error_description ||
                data.msg ||
                data.message ||
                "Login failed"
            );

        }


        /* ================= SESSION ================= */

        localStorage.setItem(
            "access_token",
            data.access_token || ""
        );

        localStorage.setItem(
            "refresh_token",
            data.refresh_token || ""
        );

        localStorage.setItem(
            "is_logged_in",
            "true"
        );

        localStorage.setItem(
            "user_role",
            "branch"
        );

        localStorage.setItem(
            "login_user",
            username
        );

        window.location.href =
            "dashboard.html";

    }
    catch(error){

        console.error(
            "LOGIN ERROR:",
            error
        );

        showMessage(
            "Login hin milkoofne: " +
            error.message,
            "error"
        );

        loginButton.disabled =
            false;

        loginButton.textContent =
            "Login";

    }

}


/* =====================================================
   MAIN DASHBOARD
===================================================== */

function goMain(){

    localStorage.setItem(
        "selected_branch_id",
        "MAIN"
    );

    localStorage.setItem(
        "selected_branch_name",
        "Main"
    );

    localStorage.setItem(
        "selected_branch_code",
        "MAIN"
    );

    localStorage.setItem(
        "selected_branch_uuid",
        ""
    );

    localStorage.setItem(
        "is_logged_in",
        "true"
    );

    localStorage.setItem(
        "user_role",
        "main"
    );

    localStorage.setItem(
        "login_user",
        "MAIN"
    );

    window.location.href =
        "dashboard.html";

}


/* =====================================================
   ENTER KEY
===================================================== */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter"
        ){

            login();

        }

    }
);


/* =====================================================
   START
===================================================== */

loadBranches();

</script>

</body>

</html>
