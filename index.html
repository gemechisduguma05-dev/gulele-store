<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AAFDRMC - Login</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f1f5f9;
}

.login-box {
  width: 90%;
  max-width: 400px;
  margin: 80px auto;
  padding: 30px;
  background: blue;
  border-radius: 15px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.15);
}

h1,
h2 {
  text-align: center;
  color: white;
}

select,
input {
  width: 100%;
  padding: 13px;
  margin: 8px 0;
  border: 1px solid #cbd5e1;
  border-radius: 7px;
  font-size: 16px;
}

select {
  background: white;
}

input {
  background: white;
}

button {
  width: 100%;
  padding: 13px;
  margin-top: 10px;
  border: none;
  border-radius: 7px;
  background: #1e3a8a;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

button:hover {
  background: #172554;
}

.back-button {
  background: #64748b;
}

#branchSection,
#loginSection {
  display: none;
}

#branchSection {
  display: block;
}

#loginMessage,
#branchMessage {
  text-align: center;
  margin-top: 15px;
  color: white;
  font-weight: bold;
}

</style>

</head>


<body>


<div class="login-box">

  <h1>🏢 AAFDRMC</h1>


  <!-- =================================
       STEP 1: SELECT BRANCH
  ================================== -->

  <div id="branchSection">

    <h2>📍 Select Branch</h2>

    <select id="branchSelect">

      <option value="">
        -- Select Branch --
      </option>

      <option value="Branch 1">Branch 1</option>
      <option value="Branch 2">Branch 2</option>
      <option value="Branch 3">Branch 3</option>
      <option value="Branch 4">Branch 4</option>
      <option value="Branch 5">Branch 5</option>
      <option value="Branch 6">Branch 6</option>
      <option value="Branch 7">Branch 7</option>
      <option value="Branch 8">Branch 8</option>
      <option value="Branch 9">Branch 9</option>
      <option value="Branch 10">Branch 10</option>
      <option value="Branch 11">Branch 11</option>
      <option value="Branch 12">Branch 12</option>

    </select>


    <button onclick="continueToLogin()">
      Continue →
    </button>


    <p id="branchMessage"></p>

  </div>


  <!-- =================================
       STEP 2: LOGIN
  ================================== -->

  <div id="loginSection">

    <h2>🔐 Login</h2>

    <p
      id="selectedBranch"
      style="
        text-align:center;
        color:white;
        font-weight:bold;
      "
    ></p>


    <input
      id="loginEmail"
      type="email"
      placeholder="Email"
      autocomplete="email"
    >


    <input
      id="loginPassword"
      type="password"
      placeholder="Password"
      autocomplete="current-password"
    >


    <button onclick="loginUser()">
      🔐 Login
    </button>


    <button
      class="back-button"
      onclick="backToBranch()"
    >
      ← Change Branch
    </button>


    <p id="loginMessage"></p>

  </div>

</div>


<script>


/* ==========================================
   SUPABASE
========================================== */

const SUPABASE_URL =
"https://sslabegtsxlkafuygmar.supabase.co";

const SUPABASE_KEY =
"sb_publishable_M6oxZjm6xF5NbrXkSO9JqA_7JGSucXq";


/* ==========================================
   STEP 1 → LOGIN
========================================== */

function continueToLogin() {

  const branch =
    document.getElementById(
      "branchSelect"
    ).value;

  const message =
    document.getElementById(
      "branchMessage"
    );


  if (!branch) {

    message.textContent =
      "Maaloo Branch kee filadhu.";

    return;
  }


  /* SAVE SELECTED BRANCH */

  localStorage.setItem(
    "selected_branch",
    branch
  );


  /* SHOW LOGIN */

  document.getElementById(
    "branchSection"
  ).style.display = "none";


  document.getElementById(
    "loginSection"
  ).style.display = "block";


  document.getElementById(
    "selectedBranch"
  ).textContent =
    "📍 " + branch;

}


/* ==========================================
   BACK TO BRANCH
========================================== */

function backToBranch() {

  document.getElementById(
    "loginSection"
  ).style.display = "none";


  document.getElementById(
    "branchSection"
  ).style.display = "block";


  document.getElementById(
    "loginMessage"
  ).textContent = "";

}


/* ==========================================
   STEP 2 → SUPABASE LOGIN
========================================== */

async function loginUser() {


  const branch =
    localStorage.getItem(
      "selected_branch"
    );


  const email =
    document.getElementById(
      "loginEmail"
    ).value.trim();


  const password =
    document.getElementById(
      "loginPassword"
    ).value;


  const message =
    document.getElementById(
      "loginMessage"
    );


  if (!branch) {

    message.textContent =
      "Branch filadhu.";

    return;
  }


  if (!email || !password) {

    message.textContent =
      "Email fi Password guuti.";

    return;
  }


  message.textContent =
    "Login godhaa jira...";


  try {


    const response =
      await fetch(

        SUPABASE_URL +
        "/auth/v1/token?grant_type=password",

        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json",

            "apikey":
              SUPABASE_KEY
          },

          body: JSON.stringify({

            email: email,

            password: password

          })

        }

      );


    const data =
      await response.json();


    /* ==============================
       SUCCESS
    ============================== */

    if (response.ok) {


      localStorage.setItem(
        "access_token",
        data.access_token
      );


      localStorage.setItem(
        "refresh_token",
        data.refresh_token
      );


      localStorage.setItem(
        "user_email",
        email
      );


      localStorage.setItem(
        "user_branch",
        branch
      );


      message.textContent =
        "Login milkaa'e. Dashboard banamaa jira...";


      setTimeout(function() {

        window.location.href =
          "dashboard.html";

      }, 700);


    } else {

      message.textContent =
        "Email ykn Password sirrii miti.";

      console.log(
        "Login error:",
        data
      );

    }


  } catch (error) {

    console.log(error);

    message.textContent =
      "Internet ykn Supabase connection rakkoo qaba.";

  }

}

</script>


</body>

</html>
