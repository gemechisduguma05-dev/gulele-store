<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AAFDRMC - Login</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#3b2417,#6f4e37,#c8a27a);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  color:#3b2417;
}

.login-wrapper{
  width:100%;
  max-width:460px;
}

.logo-box{
  text-align:center;
  color:white;
  margin-bottom:20px;
}

.logo{
  width:78px;
  height:78px;
  margin:auto;
  border-radius:50%;
  background:#f5e6d3;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:38px;
  box-shadow:0 8px 25px rgba(0,0,0,.25);
}

.logo-box h1{
  margin:14px 0 5px;
  font-size:27px;
}

.logo-box p{
  margin:0;
  font-size:14px;
  opacity:.9;
}

.card{
  background:#fffaf5;
  border-radius:20px;
  padding:28px;
  box-shadow:0 12px 35px rgba(0,0,0,.28);
}

.title{
  text-align:center;
  color:#5b3926;
  font-size:24px;
  font-weight:bold;
  margin-bottom:24px;
}

.form-group{
  margin-bottom:18px;
}

label{
  display:block;
  font-weight:bold;
  margin-bottom:8px;
  color:#4b2e1e;
}

select,
input{
  width:100%;
  padding:14px 15px;
  border:1px solid #d6c2ad;
  border-radius:11px;
  font-size:16px;
  background:white;
  color:#3b2417;
}

select:focus,
input:focus{
  outline:none;
  border-color:#795548;
  box-shadow:0 0 0 3px rgba(121,85,72,.12);
}

.login-btn{
  width:100%;
  border:0;
  border-radius:11px;
  padding:15px;
  background:#6f4e37;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
  margin-top:5px;
}

.login-btn:hover{
  background:#4e342e;
}

.login-btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.message{
  display:none;
  padding:14px;
  border-radius:10px;
  margin-bottom:18px;
  font-weight:bold;
  line-height:1.5;
  white-space:pre-wrap;
  word-break:break-word;
}

.message.show{
  display:block;
}

.error{
  background:#fee2e2;
  color:#991b1b;
}

.success{
  background:#dcfce7;
  color:#166534;
}

.branch-info{
  display:none;
  background:#f3e8dc;
  border:1px solid #d6c2ad;
  border-radius:10px;
  padding:13px;
  margin-top:-5px;
  margin-bottom:18px;
  color:#5b3926;
  font-weight:bold;
  line-height:1.5;
}

.branch-info.show{
  display:block;
}

.footer{
  text-align:center;
  margin-top:20px;
  color:#eadbc9;
  font-size:13px;
}

.loading{
  text-align:center;
  color:#795548;
  padding:10px;
}

@media(max-width:600px){

  body{
    padding:14px;
  }

  .card{
    padding:22px 18px;
    border-radius:17px;
  }

  .logo{
    width:68px;
    height:68px;
    font-size:32px;
  }

  .logo-box h1{
    font-size:23px;
  }

  .title{
    font-size:21px;
  }

}

@media(min-width:900px){

  .login-wrapper{
    max-width:480px;
  }

}

</style>

</head>


<body>


<div class="login-wrapper">


  <div class="logo-box">

    <div class="logo">
      ☕
    </div>

    <h1>
      AAFDRMC
    </h1>

    <p>
      STOCK MANAGEMENT SYSTEM
    </p>

  </div>


  <div class="card">


    <div class="title">
      🔐 Login
    </div>


    <div
      id="message"
      class="message">
    </div>


    <!-- BRANCH -->

    <div class="form-group">

      <label>
        🏢 Select Branch
      </label>

      <select id="branchSelect">

        <option value="">
          ⏳ Loading Branches...
        </option>

      </select>

    </div>


    <div
      id="branchInfo"
      class="branch-info">
    </div>


    <!-- EMAIL / CODE -->

    <div class="form-group">

      <label>
        👤 Email or Code
      </label>

      <input
        id="loginUser"
        type="text"
        placeholder="Email ykn Code galchi"
        autocomplete="username">

    </div>


    <!-- PASSWORD -->

    <div class="form-group">

      <label>
        🔑 Password
      </label>

      <input
        id="password"
        type="password"
        placeholder="Password galchi"
        autocomplete="current-password">

    </div>


    <button
      id="loginButton"
      class="login-btn"
      type="button"
      onclick="login()">

      🔐 Login

    </button>


  </div>


  <div class="footer">

    AAFDRMC © Stock Management System

  </div>


</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://sslabegtsxlkafuygmar.supabase.co";

const SUPABASE_KEY =
"sb_publishable_M6oxZjm6xF5NbrXkSO9JqA_7JGSucXq";


/* =====================================================
   BRANCH LIST
===================================================== */

const BRANCHES = [

  {
    name:"Main",
    code:"MAIN"
  },

  {
    name:"Gulele",
    code:"GUL"
  },

  {
    name:"Addis Katama",
    code:"AKT"
  },

  {
    name:"Kolfee",
    code:"KLF"
  },

  {
    name:"Nifas Silk Lafto",
    code:"NSL"
  },

  {
    name:"Kirkos",
    code:"KIR"
  },

  {
    name:"Lami Kura",
    code:"LAM"
  },

  {
    name:"Arada",
    code:"ARA"
  },

  {
    name:"Lideta",
    code:"LID"
  },

  {
    name:"Bole",
    code:"BOL"
  },

  {
    name:"Ekaa",
    code:"EKA"
  },

  {
    name:"Akaki Kality",
    code:"AKA"
  },

  {
    name:"Center",
    code:"CTR"
  }

];


/* =====================================================
   HEADERS
===================================================== */

function getHeaders(){

  return {

    "apikey":
      SUPABASE_KEY,

    "Authorization":
      "Bearer " + SUPABASE_KEY,

    "Content-Type":
      "application/json",

    "Accept":
      "application/json"

  };

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(text,type){

  const box =
    document.getElementById("message");

  box.textContent =
    text;

  box.className =
    "message show " + type;

}


/* =====================================================
   LOAD BRANCHES
===================================================== */

function loadBranches(){

  const select =
    document.getElementById("branchSelect");


  select.innerHTML =
    '<option value="">-- Branch filadhu --</option>';


  BRANCHES.forEach(function(branch){

    const option =
      document.createElement("option");

    option.value =
      branch.name;

    option.textContent =
      "🏢 " + branch.name;

    option.dataset.code =
      branch.code;

    select.appendChild(option);

  });

}


/* =====================================================
   BRANCH CHANGE
===================================================== */

document
.getElementById("branchSelect")
.addEventListener(
  "change",
  function(){

    const option =
      this.options[this.selectedIndex];

    const name =
      this.value;

    const code =
      option.dataset.code || "";

    const info =
      document.getElementById("branchInfo");


    if(!name){

      info.className =
        "branch-info";

      info.textContent =
        "";

      return;

    }


    info.className =
      "branch-info show";

    info.textContent =
      "🏢 Branch: " +
      name +
      "\n🔢 Code: " +
      code;


    /*
    SAVE BRANCH
    */

    localStorage.setItem(
      "selected_branch_name",
      name
    );

    localStorage.setItem(
      "selected_branch_code",
      code
    );


    /*
    Old ID haqi.
    ID dhugaa database irraa
    booda arganna.
    */

    localStorage.removeItem(
      "selected_branch_id"
    );

  }
);


/* =====================================================
   LOGIN
===================================================== */

async function login(){

  const branchSelect =
    document.getElementById(
      "branchSelect"
    );

  const username =
    document.getElementById(
      "loginUser"
    ).value.trim();

  const password =
    document.getElementById(
      "password"
    ).value;

  const button =
    document.getElementById(
      "loginButton"
    );


  const branchName =
    branchSelect.value;


  const option =
    branchSelect.options[
      branchSelect.selectedIndex
    ];


  const branchCode =
    option
    ? (option.dataset.code || "")
    : "";


  /* ===================================================
     VALIDATION
  =================================================== */

  if(!branchName){

    showMessage(
      "❌ Mee Branch filadhu.",
      "error"
    );

    return;

  }


  if(!username){

    showMessage(
      "❌ Email ykn Code galchi.",
      "error"
    );

    return;

  }


  if(!password){

    showMessage(
      "❌ Password galchi.",
      "error"
    );

    return;

  }


  button.disabled =
    true;

  button.textContent =
    "⏳ Login...";


  /*
  SAVE BRANCH
  */

  localStorage.setItem(
    "selected_branch_name",
    branchName
  );

  localStorage.setItem(
    "selected_branch_code",
    branchCode
  );


  try{

    /* ===============================================
       SUPABASE AUTH LOGIN
    =============================================== */

    const response =
      await fetch(

        SUPABASE_URL +
        "/auth/v1/token?grant_type=password",

        {

          method:"POST",

          headers:{

            "apikey":
              SUPABASE_KEY,

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify({

              email:
                username,

              password:
                password

            })

        }

      );


    const data =
      await response.json();


    if(!response.ok){

      showMessage(

        "❌ Login hin milkoofne.\n\n" +
        (
          data.error_description ||
          data.msg ||
          "Email ykn password sirrii miti."
        ),

        "error"

      );

      return;

    }


    /* ===============================================
       SAVE AUTH
    =============================================== */

    if(data.access_token){

      localStorage.setItem(
        "access_token",
        data.access_token
      );

    }


    if(data.refresh_token){

      localStorage.setItem(
        "refresh_token",
        data.refresh_token
      );

    }


    localStorage.setItem(
      "is_logged_in",
      "true"
    );


    localStorage.setItem(
      "login_user",
      username
    );


    localStorage.setItem(
      "user_role",
      branchName === "Main"
        ? "main"
        : "branch"
    );


    /* ===============================================
       SUCCESS
    =============================================== */

    showMessage(

      "✅ Login milkaa'e.\n\n" +
      "🏢 Branch: " +
      branchName +
      "\n\n" +
      "Dashboard banamaa jira...",

      "success"

    );


    setTimeout(function(){

      window.location.href =
        "dashboard.html";

    },700);


  }
  catch(error){

    console.error(
      "LOGIN ERROR:",
      error
    );


    showMessage(

      "❌ Network error.\n\n" +
      error.message,

      "error"

    );

  }
  finally{

    button.disabled =
      false;

    button.textContent =
      "🔐 Login";

  }

}


/* =====================================================
   START
===================================================== */

window.addEventListener(
  "DOMContentLoaded",
  function(){

    loadBranches();

    /*
    Previous branch yoo jiraate
    deebisee filadhu.
    */

    const oldBranch =
      localStorage.getItem(
        "selected_branch_name"
      );

    if(oldBranch){

      const select =
        document.getElementById(
          "branchSelect"
        );

      select.value =
        oldBranch;

      select.dispatchEvent(
        new Event("change")
      );

    }

  }
);

</script>

</body>
</html>
