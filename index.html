<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>AAFDRMC - Branch Login</title><style>

</style></head><body><div class="login-box"><h1>🏢 AAFDRMC</h1><h2>🔐 User Login</h2><label for="branchSelect">

</label><select id="branchSelect"
onchange="selectBranch()">

<option value="">
-- Select Branch --
</option><option value="main">
Main
</option><option value="gulele">
Gulele
</option><option value="addis_katama">

</option><option value="kolfee">

</option><option value="nifas_silk_lafto">
Nifas Silk Lafto
</option><option value="kirkos">
Kirkos
</option><option value="lami_kura">

</option><option value="arada">

</option><option value="akaki_kality">

</option><option value="center">

</option></select><div id="branchInfo"
     class="branch-info">📍 Branch hin filatamne

🔐 Login

onclick="changeBranch()">

🔄 Change Branch

</button><p id="loginMessage"></p><div class="footer">
AAFDRMC Stock Management System
</div></div><script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://sslabegtsxlkafuygmar.supabase.co";

const SUPABASE_KEY =
"sb_publishable_M6oxZjm6xF5NbrXkSO9JqA_7JGSucXK9Jq";


/* =====================================================
   BRANCH DATA
===================================================== */

const branches = {

  main:{
    id:"main",
    name:"Main"
  },

  gulele:{
    id:"gulele",
    name:"Gulele"
  },

  addis_katama:{
    id:"addis_katama",
    name:"Addis Katama"
  },

  kolfee:{
    id:"kolfee",
    name:"Kolfee"
  },

  nifas_silk_lafto:{
    id:"nifas_silk_lafto",
    name:"Nifas Silk Lafto"
  },

  kirkos:{
    id:"kirkos",
    name:"Kirkos"
  },

  lami_kura:{
    id:"lami_kura",
    name:"Lami Kura"
  },

  arada:{
    id:"arada",
    name:"Arada"
  },

  lideta:{
    id:"lideta",
    name:"Lideta"
  },

  bole:{
    id:"bole",
    name:"Bole"
  },

  ekaa:{
    id:"ekaa",
    name:"Ekaa"
  },

  akaki_kality:{
    id:"akaki_kality",
    name:"Akaki Kality"
  },

  center:{
    id:"center",
    name:"Center"
  }

};


/* =====================================================
   SELECT BRANCH
===================================================== */

function selectBranch(){

  const select =
    document.getElementById("branchSelect");

  const branchId =
    select.value;

  const branchInfo =
    document.getElementById("branchInfo");

  const message =
    document.getElementById("loginMessage");


  if(!branchId){

    localStorage.removeItem(
      "selected_branch_id"
    );

    localStorage.removeItem(
      "selected_branch_name"
    );

    branchInfo.textContent =
      "📍 Branch hin filatamne";

    message.textContent = "";

    return;
  }


  const branch =
    branches[branchId];


  if(!branch){

    branchInfo.textContent =
      "❌ Branch hin argamne.";

    return;
  }


  localStorage.setItem(
    "selected_branch_id",
    branch.id
  );

  localStorage.setItem(
    "selected_branch_name",
    branch.name
  );


  branchInfo.textContent =
    "📍 " + branch.name;


  message.textContent =
    "✅ " +
    branch.name +
    " filatameera.";

}


/* =====================================================
   SHOW SAVED BRANCH
===================================================== */

function showBranch(){

  const branchId =
    localStorage.getItem(
      "selected_branch_id"
    );

  const branchName =
    localStorage.getItem(
      "selected_branch_name"
    );


  if(
    branchId &&
    branches[branchId]
  ){

    document.getElementById(
      "branchSelect"
    ).value =
      branchId;


    document.getElementById(
      "branchInfo"
    ).textContent =
      "📍 " +
      (
        branchName ||
        branches[branchId].name
      );

  }

}


/* =====================================================
   LOGIN
===================================================== */

async function loginUser(){

  const userId =
    document.getElementById(
      "loginUserId"
    ).value.trim();

  const password =
    document.getElementById(
      "loginPassword"
    ).value;

  const message =
    document.getElementById(
      "loginMessage"
    );

  const branchId =
    localStorage.getItem(
      "selected_branch_id"
    );

  const branchName =
    localStorage.getItem(
      "selected_branch_name"
    );


  if(!branchId){

    message.textContent =
      "❌ Dura jalqaba Branch filadhu.";

    return;
  }


  if(!userId){

    message.textContent =
      "❌ User ID galchi.";

    return;
  }


  if(!password){

    message.textContent =
      "❌ Password galchi.";

    return;
  }


  message.textContent =
    "⏳ Login mirkaneessaa jira...";


  try{

    const query =
      SUPABASE_URL +
      "/rest/v1/users" +
      "?select=*" +
      "&user_id=eq." +
      encodeURIComponent(userId) +
      "&branch_id=eq." +
      encodeURIComponent(branchId) +
      "&limit=1";


    const response =
      await fetch(
        query,
        {
          method:"GET",

          headers:{
            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              SUPABASE_KEY,

            "Content-Type":
              "application/json"
          }
        }
      );


    if(!response.ok){

      const error =
        await response.text();

      console.log(
        "USER DATABASE ERROR:",
        error
      );

      message.textContent =
        "❌ User Database rakkoo qaba.";

      return;
    }


    const users =
      await response.json();


    if(
      !Array.isArray(users) ||
      users.length === 0
    ){

      message.textContent =
        "❌ User ID ykn Branch sirrii miti.";

      return;
    }


    const user =
      users[0];


    if(
      String(user.password) !==
      String(password)
    ){

      message.textContent =
        "❌ Password sirrii miti.";

      return;
    }


    /* SAVE LOGIN */

    localStorage.setItem(
      "user_id",
      String(user.user_id)
    );

    localStorage.setItem(
      "user_db_id",
      String(user.id)
    );

    localStorage.setItem(
      "branch_id",
      String(user.branch_id)
    );

    localStorage.setItem(
      "user_branch",
      user.branch_name ||
      branchName
    );

    localStorage.setItem(
      "selected_branch_id",
      branchId
    );

    localStorage.setItem(
      "selected_branch_name",
      branchName
    );

    localStorage.setItem(
      "is_logged_in",
      "true"
    );


    message.textContent =
      "✅ Login milkaa'e.";


    setTimeout(function(){

      window.location.href =
        "dashboard.html";

    },700);


  }

  catch(error){

    console.log(
      "LOGIN ERROR:",
      error
    );

    message.textContent =
      "❌ Internet ykn Supabase connection rakkoo qaba.";

  }

}


/* =====================================================
   CHANGE BRANCH
===================================================== */

function changeBranch(){

  localStorage.removeItem(
    "selected_branch_id"
  );

  localStorage.removeItem(
    "selected_branch_name"
  );


  document.getElementById(
    "branchSelect"
  ).value = "";


  document.getElementById(
    "branchInfo"
  ).textContent =
    "📍 Branch hin filatamne";


  document.getElementById(
    "loginMessage"
  ).textContent = "";

}


/* =====================================================
   START
===================================================== */

showBranch();

</script></body>
</html>
