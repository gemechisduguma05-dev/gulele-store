<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>AAFDRMC - Login</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,sans-serif;

    background:
        linear-gradient(
            rgba(62,39,35,.82),
            rgba(78,52,46,.88)
        ),
        url("./1788633150526.jpg") center/cover no-repeat fixed;

    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.login-container{
    width:100%;
    max-width:440px;
}

.login-card{
    background:rgba(255,255,255,.97);
    border-radius:20px;
    padding:30px;

    box-shadow:
        0 15px 45px rgba(0,0,0,.35);

    text-align:center;
}

.logo-box{
    width:105px;
    height:105px;
    margin:0 auto 15px;

    border-radius:50%;
    overflow:hidden;

    background:white;

    border:5px solid #795548;

    box-shadow:
        0 5px 18px rgba(0,0,0,.20);

    display:flex;
    align-items:center;
    justify-content:center;
}

.logo{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

h1{
    margin:5px 0 5px;
    color:#4e342e;
    font-size:25px;
}

.subtitle{
    color:#795548;
    font-size:14px;
    margin-bottom:25px;
}

label{
    display:block;
    text-align:left;
    font-size:14px;
    font-weight:bold;
    color:#4e342e;
    margin-bottom:7px;
}

select,
input{
    width:100%;
    padding:13px 14px;

    border:1px solid #d7ccc8;
    border-radius:9px;

    background:#fff;

    font-size:15px;

    outline:none;

    margin-bottom:16px;
}

select:focus,
input:focus{
    border-color:#795548;

    box-shadow:
        0 0 0 3px
        rgba(121,85,72,.12);
}

button{
    width:100%;

    padding:13px;

    border:none;
    border-radius:9px;

    font-size:15px;
    font-weight:bold;

    cursor:pointer;

    transition:.2s;
}

button:hover{
    transform:translateY(-1px);
}

button:disabled{
    opacity:.65;
    cursor:not-allowed;
    transform:none;
}

.login-btn{
    background:#6d4c41;
    color:white;

    margin-top:3px;
}

.login-btn:hover{
    background:#5d4037;
}

.main-btn{
    background:#efebe9;
    color:#4e342e;

    margin-top:10px;
}

.main-btn:hover{
    background:#d7ccc8;
}

/* ===============================
   CHANGE PASSWORD BUTTON
================================ */

.change-password-btn{
    background:#fff8e1;
    color:#6d4c41;

    border:1px solid #d7ccc8;

    margin-top:10px;
}

.change-password-btn:hover{
    background:#ffecb3;
}


/* ===============================
   CHANGE PASSWORD BOX
================================ */

.change-password-box{
    display:none;

    margin-top:15px;

    padding:18px;

    border-radius:12px;

    background:#faf7f5;

    border:1px solid #d7ccc8;

    text-align:left;
}

.change-password-box h3{
    margin:0 0 15px;

    text-align:center;

    color:#4e342e;

    font-size:17px;
}

.change-password-box label{
    margin-top:5px;
}

.change-password-box input{
    margin-bottom:12px;
}

.change-btn{
    background:#795548;
    color:white;
}

.change-btn:hover{
    background:#6d4c41;
}

.cancel-btn{
    background:#efebe9;
    color:#4e342e;

    margin-top:8px;
}

.cancel-btn:hover{
    background:#d7ccc8;
}


/* ===============================
   MESSAGE
================================ */

.message{
    display:none;

    margin-top:15px;

    padding:12px;

    border-radius:8px;

    font-size:14px;
    font-weight:bold;

    word-break:break-word;
}

.message.error{
    display:block;

    background:#ffebee;
    color:#c62828;
}

.message.success{
    display:block;

    background:#e8f5e9;
    color:#2e7d32;
}

.footer{
    margin-top:20px;

    color:#8d6e63;

    font-size:12px;
}

@media(max-width:500px){

    body{
        padding:14px;
    }

    .login-card{
        padding:23px 18px;
        border-radius:16px;
    }

    .logo-box{
        width:90px;
        height:90px;
    }

    h1{
        font-size:21px;
    }

    .subtitle{
        font-size:13px;
    }

}

</style>

</head>


<body>

<div class="login-container">

    <div class="login-card">

        <div class="logo-box">

            <img
                src="./1788633150526.jpg"
                class="logo"
                alt="AAFDRMC Profile">

        </div>

        <h1>
            AAFDRMC
        </h1>

        <div class="subtitle">
            Stock Management System
        </div>


        <!-- ===============================
             LOGIN
        ================================ -->

        <label for="branch">
            Select Branch
        </label>

        <select id="branch">

            <option value="">
                -- Select Branch --
            </option>

        </select>


        <label for="username">
            Email or Branch Code
        </label>

        <input
            type="text"
            id="username"
            placeholder="Email ykn Branch Code"
            autocomplete="username">


        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Password"
            autocomplete="current-password">


        <button
            class="login-btn"
            id="loginButton"
            onclick="login()">

            Login

        </button>


        <button
            class="main-btn"
            onclick="goMain()">

            Main Dashboard

        </button>


        <!-- ===============================
             CHANGE PASSWORD BUTTON
        ================================ -->

        <button
            class="change-password-btn"
            id="changePasswordToggle"
            onclick="toggleChangePassword()">

            Change Password

        </button>


        <!-- ===============================
             CHANGE PASSWORD FORM
        ================================ -->

        <div
            class="change-password-box"
            id="changePasswordBox">

            <h3>
                Change Password
            </h3>


            <label for="oldPassword">
                Current Password
            </label>

            <input
                type="password"
                id="oldPassword"
                placeholder="Current Password"
                autocomplete="current-password">


            <label for="newPassword">
                New Password
            </label>

            <input
                type="password"
                id="newPassword"
                placeholder="New Password"
                autocomplete="new-password">


            <label for="confirmPassword">
                Confirm New Password
            </label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm New Password"
                autocomplete="new-password">


            <button
                class="change-btn"
                id="changePasswordButton"
                onclick="changePassword()">

                Change Password

            </button>


            <button
                class="cancel-btn"
                onclick="toggleChangePassword(false)">

                Cancel

            </button>

        </div>


        <div
            id="message"
            class="message">
        </div>


        <div class="footer">
            AAFDRMC Stock Management System
        </div>

    </div>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://sslabegtsxlkafuygmar.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_G3Nv_yg4LaCiMtJMiadMxQ_f2fNHg5x";


/* =====================================================
   MAIN + 12 OPERATIONAL BRANCHES
===================================================== */

const BRANCHES = [

    {
        id:"MAIN",
        name:"Main",
        code:"MAIN",
        db_id:"bd1b10ec-43dc-4eb0-ad8c-53a78b80815d"
    },

    {
        id:"GUL",
        name:"Gulele",
        code:"GUL",
        db_id:"b7b2ff8c-0be4-4678-a6d3-63c05cdf144c"
    },

    {
        id:"AKT",
        name:"Addis Katama",
        code:"AKT",
        db_id:"9ed31570-9cfb-4706-82ed-049addf493fd"
    },

    {
        id:"KLF",
        name:"Kolfee",
        code:"KLF",
        db_id:"6d51f505-1e5f-4c47-b2a9-ff83029293d4"
    },

    {
        id:"NSL",
        name:"Nifas Silk Lafto",
        code:"NSL",
        db_id:"ea8fcf0f-eb72-4b2c-a167-2ad7f380bade"
    },

    {
        id:"KIR",
        name:"Kirkos",
        code:"KIR",
        db_id:"06cda455-02cb-4b4b-a84b-b01bf1c28b33"
    },

    {
        id:"LAM",
        name:"Lami Kura",
        code:"LAM",
        db_id:"6d9324f2-0120-455a-9161-ed46fbf06b61"
    },

    {
        id:"ARA",
        name:"Arada",
        code:"ARA",
        db_id:"b0d43ff1-ba2d-4b90-aa65-eab6acec4bdb"
    },

    {
        id:"LID",
        name:"Lideta",
        code:"LID",
        db_id:"f26b2605-f4df-4a32-8c61-76131fe7e559"
    },

    {
        id:"BOL",
        name:"Bole",
        code:"BOL",
        db_id:"d104e8ab-ed63-4d20-a314-6696abed839a"
    },

    {
        id:"EKA",
        name:"Yekaa",
        code:"EKA",
        db_id:"015d6857-73a2-4b05-8555-4091387a305d"
    },

    {
        id:"AKA",
        name:"Akaki Kality",
        code:"AKA",
        db_id:"ac4f8c9a-8855-42f4-b98f-35d454c8d89e"
    },

    {
        id:"CTR",
        name:"Center",
        code:"CTR",
        db_id:"96a20750-5ff6-4475-ae03-009cd7688c33"
    }

];


/* =====================================================
   LOAD BRANCHES
===================================================== */

function loadBranches(){

    const select =
        document.getElementById("branch");

    select.innerHTML = `
        <option value="">
            -- Select Branch --
        </option>
    `;

    BRANCHES.forEach(branch => {

        const option =
            document.createElement("option");

        option.value =
            branch.id;

        option.textContent =
            branch.name +
            " (" +
            branch.code +
            ")";

        option.dataset.name =
            branch.name;

        option.dataset.code =
            branch.code;

        option.dataset.dbid =
            branch.db_id;

        select.appendChild(option);

    });

}


/* =====================================================
   SAVE SELECTED BRANCH
===================================================== */

function saveSelectedBranch(){

    const select =
        document.getElementById("branch");

    const option =
        select.options[
            select.selectedIndex
        ];

    if(
        !option ||
        !option.value
    ){
        return false;
    }

    const branch =
        BRANCHES.find(
            b => b.id === option.value
        );

    if(!branch){
        return false;
    }

    localStorage.setItem(
        "selected_branch_id",
        branch.id
    );

    localStorage.setItem(
        "selected_branch_name",
        branch.name
    );

    localStorage.setItem(
        "selected_branch_code",
        branch.code
    );

    localStorage.setItem(
        "selected_branch_uuid",
        branch.db_id
    );

    return true;

}


/* =====================================================
   BRANCH CHANGE
===================================================== */

document
    .getElementById("branch")
    .addEventListener(
        "change",
        function(){

            if(!this.value){
                return;
            }

            saveSelectedBranch();

        }
    );


/* =====================================================
   SHOW MESSAGE
===================================================== */

function showMessage(
    text,
    type
){

    const message =
        document.getElementById("message");

    message.textContent =
        text;

    message.className =
        "message " + type;

}


/* =====================================================
   SUPABASE HEADERS
===================================================== */

function getHeaders(){

    return {

        "apikey":
            SUPABASE_KEY,

        "Authorization":
            "Bearer " +
            SUPABASE_KEY,

        "Content-Type":
            "application/json",

        "Accept":
            "application/json"

    };

}


/* =====================================================
   VERIFY BRANCH LOGIN
===================================================== */

async function verifyBranchLogin(
    username,
    password
){

    const response =
        await fetch(
            SUPABASE_URL +
            "/rest/v1/rpc/verify_branch_login",
            {
                method:"POST",

                headers:getHeaders(),

                body:
                    JSON.stringify({
                        p_username:
                            username,

                        p_password:
                            password
                    })
            }
        );

    const data =
        await response.json();

    if(!response.ok){

        throw new Error(
            data.message ||
            data.error ||
            "Password verification failed."
        );

    }

    return data;

}


/* =====================================================
   LOGIN
===================================================== */

async function login(){

    const select =
        document.getElementById("branch");

    const username =
        document
            .getElementById("username")
            .value
            .trim();

    const password =
        document
            .getElementById("password")
            .value;

    if(!select.value){

        showMessage(
            "Mee Branch filadhu.",
            "error"
        );

        return;
    }

    if(!username){

        showMessage(
            "Email ykn Branch Code galchi.",
            "error"
        );

        return;
    }

    if(!password){

        showMessage(
            "Password galchi.",
            "error"
        );

        return;
    }

    if(!saveSelectedBranch()){

        showMessage(
            "Branch filachuun hin milkoofne.",
            "error"
        );

        return;
    }

    const selectedBranch =
        BRANCHES.find(
            b => b.id === select.value
        );

    if(!selectedBranch){

        showMessage(
            "Branch hin argamne.",
            "error"
        );

        return;
    }

    const loginButton =
        document.getElementById(
            "loginButton"
        );

    loginButton.disabled = true;

    loginButton.textContent =
        "Logging in...";


    try{

        const result =
            await verifyBranchLogin(
                username,
                password
            );


        if(
            !Array.isArray(result) ||
            result.length === 0
        ){

            throw new Error(
                "Branch Code ykn Password sirrii miti."
            );

        }


        const user =
            result[0];


        if(
            user.branch_id !==
            selectedBranch.db_id
        ){

            throw new Error(
                "Branch filatame fi login branch wal hin simu."
            );

        }


        localStorage.setItem(
            "is_logged_in",
            "true"
        );

        localStorage.setItem(
            "user_role",
            user.ismain
                ? "main"
                : "branch"
        );

        localStorage.setItem(
            "login_user",
            user.username
        );

        localStorage.setItem(
            "selected_branch_uuid",
            user.branch_id
        );

        localStorage.setItem(
            "selected_branch_name",
            user.branch_name
        );

        localStorage.setItem(
            "selected_branch_code",
            user.username
        );


        showMessage(
            "Login successful. Gara Dashboard deemaa...",
            "success"
        );


        setTimeout(
            function(){

                window.location.href =
                    "dashboard.html";

            },
            500
        );


    }
    catch(error){

        console.error(
            "LOGIN ERROR:",
            error
        );

        showMessage(
            error.message ||
            "Login hin milkoofne.",
            "error"
        );

        loginButton.disabled =
            false;

        loginButton.textContent =
            "Login";

    }

}


/* =====================================================
   MAIN DASHBOARD
===================================================== */

async function goMain(){

    const password =
        document
            .getElementById("password")
            .value;

    if(!password){

        showMessage(
            "Main Dashboard seenuuf MAIN password galchi.",
            "error"
        );

        document
            .getElementById("password")
            .focus();

        return;

    }


    try{

        const result =
            await verifyBranchLogin(
                "MAIN",
                password
            );


        if(
            !Array.isArray(result) ||
            result.length === 0
        ){

            throw new Error(
                "MAIN password sirrii miti."
            );

        }


        const mainUser =
            result[0];


        if(
            !mainUser.ismain
        ){

            throw new Error(
                "User kun Main user miti."
            );

        }


        localStorage.setItem(
            "selected_branch_id",
            "MAIN"
        );

        localStorage.setItem(
            "selected_branch_name",
            mainUser.branch_name
        );

        localStorage.setItem(
            "selected_branch_code",
            "MAIN"
        );

        localStorage.setItem(
            "selected_branch_uuid",
            mainUser.branch_id
        );

        localStorage.setItem(
            "is_logged_in",
            "true"
        );

        localStorage.setItem(
            "user_role",
            "main"
        );

        localStorage.setItem(
            "login_user",
            "MAIN"
        );


        window.location.href =
            "dashboard.html";

    }
    catch(error){

        console.error(
            "MAIN LOGIN ERROR:",
            error
        );

        showMessage(
            error.message ||
            "Main login hin milkoofne.",
            "error"
        );

    }

}


/* =====================================================
   SHOW / HIDE CHANGE PASSWORD
===================================================== */

function toggleChangePassword(show){

    const box =
        document.getElementById(
            "changePasswordBox"
        );

    if(show === undefined){

        show =
            box.style.display !== "block";

    }

    if(show){

        box.style.display =
            "block";

        document
            .getElementById("oldPassword")
            .focus();

    }
    else{

        box.style.display =
            "none";

        document
            .getElementById("oldPassword")
            .value = "";

        document
            .getElementById("newPassword")
            .value = "";

        document
            .getElementById("confirmPassword")
            .value = "";

    }

}


/* =====================================================
   CHANGE PASSWORD
===================================================== */

async function changePassword(){

    const select =
        document.getElementById("branch");

    const username =
        document
            .getElementById("username")
            .value
            .trim();

    const oldPassword =
        document
            .getElementById("oldPassword")
            .value;

    const newPassword =
        document
            .getElementById("newPassword")
            .value;

    const confirmPassword =
        document
            .getElementById("confirmPassword")
            .value;


    /* ================================================
       VALIDATION
    ================================================ */

    if(!select.value){

        showMessage(
            "Mee Branch filadhu.",
            "error"
        );

        return;
    }


    if(!username){

        showMessage(
            "Branch Code ykn Username galchi.",
            "error"
        );

        return;
    }


    if(!oldPassword){

        showMessage(
            "Current Password galchi.",
            "error"
        );

        return;
    }


    if(!newPassword){

        showMessage(
            "New Password galchi.",
            "error"
        );

        return;
    }


    if(newPassword.length < 6){

        showMessage(
            "New Password yoo xiqqaate characters 6 qabaachuu qaba.",
            "error"
        );

        return;
    }


    if(!confirmPassword){

        showMessage(
            "New Password irra deebi'ii galchi.",
            "error"
        );

        return;
    }


    if(newPassword !== confirmPassword){

        showMessage(
            "New Password fi Confirm Password wal hin simne.",
            "error"
        );

        return;
    }


    if(oldPassword === newPassword){

        showMessage(
            "New Password kan durii irraa adda ta'uu qaba.",
            "error"
        );

        return;
    }


    const selectedBranch =
        BRANCHES.find(
            b => b.id === select.value
        );


    if(!selectedBranch){

        showMessage(
            "Branch hin argamne.",
            "error"
        );

        return;
    }


    const changeButton =
        document.getElementById(
            "changePasswordButton"
        );

    changeButton.disabled =
        true;

    changeButton.textContent =
        "Changing Password...";


    try{

        /* ============================================
           1. VERIFY OLD PASSWORD FIRST
        ============================================ */

        const loginResult =
            await verifyBranchLogin(
                username,
                oldPassword
            );


        if(
            !Array.isArray(loginResult) ||
            loginResult.length === 0
        ){

            throw new Error(
                "Current Password sirrii miti."
            );

        }


        const user =
            loginResult[0];


        /* ============================================
           2. CHECK SELECTED BRANCH
        ============================================ */

        if(
            user.branch_id !==
            selectedBranch.db_id
        ){

            throw new Error(
                "Username fi Branch filatame wal hin simu."
            );

        }


        /* ============================================
           3. CHANGE PASSWORD RPC
        ============================================ */

        const response =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/rpc/change_branch_password",
                {
                    method:"POST",

                    headers:getHeaders(),

                    body:
                        JSON.stringify({

                            p_username:
                                username,

                            p_old_password:
                                oldPassword,

                            p_new_password:
                                newPassword

                        })
                }
            );


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data.message ||
                data.error ||
                "Password jijjiiruun hin milkoofne."
            );

        }


        /* ============================================
           4. SUCCESS
        ============================================ */

        showMessage(
            "Password successfully changed. Amma password haaraa fayyadami.",
            "success"
        );


        toggleChangePassword(false);


        document
            .getElementById("password")
            .value =
            "";


        document
            .getElementById("username")
            .focus();


    }
    catch(error){

        console.error(
            "CHANGE PASSWORD ERROR:",
            error
        );

        showMessage(
            error.message ||
            "Password jijjiiruun hin milkoofne.",
            "error"
        );

    }
    finally{

        changeButton.disabled =
            false;

        changeButton.textContent =
            "Change Password";

    }

}


/* =====================================================
   ENTER KEY
===================================================== */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter"
        ){

            const changeBox =
                document.getElementById(
                    "changePasswordBox"
                );

            if(
                changeBox.style.display === "block"
            ){

                changePassword();

            }
            else{

                login();

            }

        }

    }
);


/* =====================================================
   START
===================================================== */

loadBranches();

</script>

</body>

</html>
