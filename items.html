<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>AAFDRMC - Items</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f1f5f9;
  color:#1e293b;
}

header{
  background:#1e3a8a;
  color:white;
  padding:25px 15px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:25px;
}

.branch{
  margin-top:10px;
  font-size:18px;
  font-weight:bold;
}

.container{
  width:95%;
  max-width:1200px;
  margin:20px auto;
}

.box{
  background:white;
  border-radius:14px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.title{
  color:#1e3a8a;
  font-size:23px;
  font-weight:bold;
  margin-bottom:18px;
}

.form-grid{
  display:grid;
  grid-template-columns:
  repeat(auto-fit,minmax(240px,1fr));
  gap:15px;
}

.form-group{
  display:flex;
  flex-direction:column;
}

label{
  font-weight:bold;
  margin-bottom:7px;
}

input,
select{
  padding:13px;
  border:1px solid #cbd5e1;
  border-radius:8px;
  font-size:15px;
  width:100%;
}

button{
  border:0;
  border-radius:8px;
  padding:13px 18px;
  color:white;
  font-weight:bold;
  font-size:15px;
  cursor:pointer;
}

.save{
  background:#15803d;
}

.back{
  background:#64748b;
}

.edit{
  background:#2563eb;
  padding:8px 12px;
}

.delete{
  background:#dc2626;
  padding:8px 12px;
}

.buttons{
  display:flex;
  gap:10px;
  margin-top:20px;
}

.message{
  display:none;
  padding:15px;
  border-radius:9px;
  margin-bottom:18px;
  font-weight:bold;
}

.message.show{
  display:block;
}

.success{
  background:#dcfce7;
  color:#166534;
}

.error{
  background:#fee2e2;
  color:#991b1b;
}

.info{
  background:#dbeafe;
  color:#1e40af;
}

.table-box{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:700px;
}

th{
  background:#1e3a8a;
  color:white;
  padding:12px;
  text-align:left;
}

td{
  padding:11px;
  border-bottom:1px solid #e2e8f0;
}

tr:hover{
  background:#f8fafc;
}

.empty{
  text-align:center;
  padding:30px;
  color:#64748b;
}

.branch-info{
  background:#eff6ff;
  border:1px solid #bfdbfe;
  color:#1e40af;
  padding:13px;
  border-radius:8px;
  margin-bottom:18px;
  font-weight:bold;
}

@media(max-width:600px){

  header h1{
    font-size:21px;
  }

  .branch{
    font-size:16px;
  }

  .buttons{
    flex-direction:column;
  }

  button{
    width:100%;
  }

}

</style>

</head>


<body>


<header>

<h1>
AAFDRMC - ITEM MANAGEMENT
</h1>

<div
id="branchName"
class="branch">
Loading Branch...
</div>

</header>


<div class="container">


<!-- MESSAGE -->

<div
id="message"
class="message">
</div>


<!-- ADD ITEM -->

<div class="box">

<div class="title">
📦 Add New Item
</div>


<div
id="branchInfo"
class="branch-info">
Branch: Loading...
</div>


<div class="form-grid">


<!-- ITEM NAME -->

<div class="form-group">

<label>
Item Name
</label>

<input
id="itemName"
type="text"
placeholder="Maqaa Item galchi"
autocomplete="off">

</div>


<!-- CATEGORY -->

<div class="form-group">

<label>
Category
</label>

<select id="category">

<option value="">
-- Category filadhu --
</option>

<option value="Strategic Food Items">
Meeshaalee Nyaataa Tarsiimawaa / Strategic Food Items / ስትራቴጂካ ምግብ ነክ
</option>

<option value="Daily Food Items">
Meeshaalee Nyaataa Guyyaa Guyyaa / Daily Food Items / ምግብ ነክ የእለት ደሪሽ
</option>

<option value="Daily Non-Food Items">
Meeshaalee Nyaataa Hin Taane Guyyaa Guyyaa / Daily Non-Food Items
</option>

<option value="Non-Food Hygiene Items">
Meeshaalee Qulqullinaa / Non-Food Hygiene Items
</option>

<option value="Non-Food Kitchen Items">
Meeshaalee Nyaataa Hin Taane Ittiin Nyaata Qopheessan / Non-Food Kitchen Items
</option>

<option value="Non-Food Building Construction Items">
Meeshaa Ijaarsa Manaaf Oolu / Non-Food Building Construction Items
</option>

</select>

</div>

</div>


<div class="buttons">

<button
class="save"
onclick="saveItem()">
💾 Save New Item
</button>

<button
class="back"
onclick="backToDashboard()">
⬅️ Back to Dashboard
</button>

</div>

</div>


<!-- ITEM LIST -->

<div class="box">

<div class="title">
📋 Items List
</div>


<div class="table-box">

<table>

<thead>

<tr>

<th>No</th>
<th>ID</th>
<th>Item Name</th>
<th>Category</th>
<th>Branch</th>
<th>Action</th>

</tr>

</thead>

<tbody id="itemsTable">

<tr>

<td
colspan="6"
class="empty">

Loading...

</td>

</tr>

</tbody>

</table>

</div>

</div>


</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://sslabegtsxlkafuygmar.supabase.co";

const SUPABASE_KEY =
"sb_publishable_M6oxZjm6xF5NbrXkSO9JqA_7JGSucXq";


/* =====================================================
   BRANCH
===================================================== */

const branchId =
localStorage.getItem(
"selected_branch_id"
);

const branchName =
localStorage.getItem(
"selected_branch_name"
);

const branchCode =
localStorage.getItem(
"selected_branch_code"
);


/* =====================================================
   HEADERS
===================================================== */

function getHeaders(){

const token =
localStorage.getItem(
"access_token"
);

return {

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer " +
(token || SUPABASE_KEY),

"Content-Type":
"application/json"

};

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
text,
type
){

const box =
document.getElementById(
"message"
);

box.textContent =
text;

box.className =
"message show " +
type;

window.scrollTo({
top:0,
behavior:"smooth"
});

setTimeout(
function(){

box.className =
"message";

},
5000
);

}


/* =====================================================
   CHECK BRANCH
===================================================== */

function checkBranch(){

const branchBox =
document.getElementById(
"branchName"
);

const branchInfo =
document.getElementById(
"branchInfo"
);


if(!branchId){

branchBox.textContent =
"⚠️ Branch hin filatamne";

branchInfo.textContent =
"⚠️ Mee gara Main Menu deebi'ii Branch filadhu.";

return false;

}


branchBox.textContent =
"🏢 Branch: " +
(branchName || "Unknown");


branchInfo.textContent =
"🏢 Item kun Branch: " +
(branchName || "Unknown") +
" keessatti galmaa'a";


return true;

}


/* =====================================================
   LOAD ITEMS
===================================================== */

async function loadItems(){

if(!branchId)
return;


const table =
document.getElementById(
"itemsTable"
);


table.innerHTML = `

<tr>

<td
colspan="6"
class="empty">

🔄 Items loading...

</td>

</tr>

`;


try{

const url =
SUPABASE_URL +
"/rest/v1/items" +
"?select=*" +
"&branch_id=eq." +
encodeURIComponent(branchId) +
"&order=id.asc";


const response =
await fetch(
url,
{
headers:getHeaders()
}
);


if(!response.ok){

const error =
await response.text();

console.error(
"LOAD ITEMS ERROR:",
error
);

table.innerHTML = `

<tr>

<td
colspan="6"
class="empty">

❌ Items loading failed.

</td>

</tr>

`;

return;

}


const data =
await response.json();


if(!Array.isArray(data) ||
data.length===0){

table.innerHTML = `

<tr>

<td
colspan="6"
class="empty">

📦 Item tokko illee hin jiru.

</td>

</tr>

`;

return;

}


table.innerHTML="";


data.forEach(
(item,index)=>{

const row =
document.createElement("tr");


row.innerHTML = `

<td>
${index+1}
</td>

<td>
${escapeHTML(item.id)}
</td>

<td>
<strong>
${escapeHTML(item.name)}
</strong>
</td>

<td>
${escapeHTML(
item.catagoiry ||
item.category ||
"—"
)}
</td>

<td>
${escapeHTML(
branchName || "—"
)}
</td>

<td>

<button
class="edit"
onclick="editItem(${item.id})">
✏️ Edit
</button>

<button
class="delete"
onclick="deleteItem(${item.id})">
🗑️ Delete
</button>

</td>

`;

table.appendChild(row);

});

}catch(error){

console.error(
error
);

table.innerHTML = `

<tr>

<td
colspan="6"
class="empty">

❌ Network error.

</td>

</tr>

`;

}

}


/* =====================================================
   SAVE NEW ITEM
===================================================== */

async function saveItem(){

if(!checkBranch())
return;


const name =
document.getElementById(
"itemName"
).value.trim();


const category =
document.getElementById(
"category"
).value;


if(!name){

showMessage(
"❌ Item Name galchi.",
"error"
);

return;

}


if(!category){

showMessage(
"❌ Category filadhu.",
"error"
);

return;

}


/* =====================================================
   CHECK DUPLICATE
===================================================== */

try{

const checkUrl =
SUPABASE_URL +
"/rest/v1/items" +
"?select=id,name" +
"&branch_id=eq." +
encodeURIComponent(branchId) +
"&name=ilike." +
encodeURIComponent(name);


const checkResponse =
await fetch(
checkUrl,
{
headers:getHeaders()
}
);


if(checkResponse.ok){

const existing =
await checkResponse.json();


if(
Array.isArray(existing) &&
existing.length>0
){

showMessage(
"❌ Item kun Branch kana keessatti duraan jira.",
"error"
);

return;

}

}


/* =====================================================
   INSERT
===================================================== */

const data = {

name:name,

catagoiry:category,

branch_id:branchId

};


/*
   branch_code yoo items table
   keessatti jiraate qofa itti daballa.
*/

if(branchCode){

data.branch_code =
branchCode;

}


const response =
await fetch(
SUPABASE_URL +
"/rest/v1/items",
{
method:"POST",

headers:{
...getHeaders(),
"Prefer":
"return=representation"
},

body:
JSON.stringify(data)

}
);


const result =
await response.text();


if(!response.ok){

console.error(
"SAVE ITEM ERROR:",
result
);

showMessage(
"❌ Item save hin milkoofne: " +
result,
"error"
);

return;

}


showMessage(
"✅ Item haaraan sirriitti galmaa'e.",
"success"
);


/* CLEAR */

document.getElementById(
"itemName"
).value="";

document.getElementById(
"category"
).value="";


await loadItems();

}catch(error){

console.error(
error
);

showMessage(
"❌ Network error. Internet kee ilaali.",
"error"
);

}

}


/* =====================================================
   EDIT ITEM
===================================================== */

async function editItem(id){

const newName =
prompt(
"Maqaa Item haaraa galchi:"
);


if(newName===null)
return;


const name =
newName.trim();


if(!name){

showMessage(
"❌ Maqaan Item duwwaa ta'uu hin danda'u.",
"error"
);

return;

}


const newCategory =
prompt(
"Category haaraa galchi:\n\n" +
"1. Strategic Food Items\n" +
"2. Daily Food Items\n" +
"3. Daily Non-Food Items\n" +
"4. Non-Food Hygiene Items\n" +
"5. Non-Food Kitchen Items\n" +
"6. Non-Food Building Construction Items"
);


if(newCategory===null)
return;


const categories = {

"1":"Strategic Food Items",
"2":"Daily Food Items",
"3":"Daily Non-Food Items",
"4":"Non-Food Hygiene Items",
"5":"Non-Food Kitchen Items",
"6":"Non-Food Building Construction Items"

};


const category =
categories[newCategory.trim()];


if(!category){

showMessage(
"❌ Category 1 hanga 6 qofa filadhu.",
"error"
);

return;

}


try{

const url =
SUPABASE_URL +
"/rest/v1/items" +
"?id=eq." +
encodeURIComponent(id);


const response =
await fetch(
url,
{
method:"PATCH",

headers:{
...getHeaders(),
"Prefer":
"return=representation"
},

body:
JSON.stringify({
name:name,
catagoiry:category
})

}
);


const result =
await response.text();


if(!response.ok){

showMessage(
"❌ Edit hin milkoofne: " +
result,
"error"
);

return;

}


showMessage(
"✅ Item sirreeffame.",
"success"
);


await loadItems();

}catch(error){

console.error(error);

showMessage(
"❌ Network error.",
"error"
);

}

}


/* =====================================================
   DELETE ITEM
===================================================== */

async function deleteItem(id){

const ok =
confirm(
"Item kana haquu barbaaddaa?"
);


if(!ok)
return;


try{

const url =
SUPABASE_URL +
"/rest/v1/items" +
"?id=eq." +
encodeURIComponent(id) +
"&branch_id=eq." +
encodeURIComponent(branchId);


const response =
await fetch(
url,
{
method:"DELETE",
headers:getHeaders()
}
);


const result =
await response.text();


if(!response.ok){

showMessage(
"❌ Delete hin milkoofne: " +
result,
"error"
);

return;

}


showMessage(
"✅ Item haqame.",
"success"
);


await loadItems();

}catch(error){

console.error(error);

showMessage(
"❌ Network error.",
"error"
);

}

}


/* =====================================================
   BACK
===================================================== */

function backToDashboard(){

window.location.href =
"dashboard.html";

}


/* =====================================================
   START
===================================================== */

window.addEventListener(
"DOMContentLoaded",
function(){

if(!checkBranch())
return;

loadItems();

});

</script>

</body>
</html>
