<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AAFDRMC - Items</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f1f5f9;
  color:#1e293b;
}

header{
  background:#1e3a8a;
  color:white;
  padding:18px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

header h1{
  margin:0;
  font-size:23px;
}

header p{
  margin:5px 0 0;
  font-size:14px;
}

.logout{
  border:0;
  background:#dc2626;
  color:white;
  padding:10px 16px;
  border-radius:7px;
  font-weight:bold;
  cursor:pointer;
}

nav{
  background:white;
  padding:12px;
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  box-shadow:0 2px 6px rgba(0,0,0,.1);
}

nav a{
  text-decoration:none;
  color:#1e3a8a;
  font-weight:bold;
  padding:10px 13px;
  border-radius:7px;
}

nav a:hover,
nav a.active{
  background:#1e3a8a;
  color:white;
}

.container{
  width:96%;
  max-width:1400px;
  margin:20px auto;
}

.branch-box{
  background:#eff6ff;
  border:2px solid #bfdbfe;
  color:#1e3a8a;
  padding:14px;
  border-radius:10px;
  margin-bottom:18px;
  font-weight:bold;
  text-align:center;
}

.form-box{
  background:white;
  padding:20px;
  border-radius:12px;
  box-shadow:0 3px 10px rgba(0,0,0,.08);
  margin-bottom:20px;
}

.form-title{
  color:#1e3a8a;
  font-size:21px;
  font-weight:bold;
  margin-bottom:17px;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:14px;
}

.form-group{
  display:flex;
  flex-direction:column;
}

.form-group label{
  font-weight:bold;
  margin-bottom:7px;
}

input,
select{
  width:100%;
  padding:11px;
  border:1px solid #cbd5e1;
  border-radius:7px;
  font-size:15px;
  background:white;
}

input:focus,
select:focus{
  outline:none;
  border-color:#2563eb;
}

.save-row{
  margin-top:18px;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.save-btn{
  border:0;
  background:#15803d;
  color:white;
  padding:11px 20px;
  border-radius:7px;
  font-weight:bold;
  cursor:pointer;
}

.clear-btn{
  border:0;
  background:#64748b;
  color:white;
  padding:11px 20px;
  border-radius:7px;
  font-weight:bold;
  cursor:pointer;
}

.message{
  display:none;
  padding:12px;
  border-radius:8px;
  margin-bottom:18px;
  font-weight:bold;
}

.message.success{
  display:block;
  background:#dcfce7;
  color:#166534;
}

.message.error{
  display:block;
  background:#fee2e2;
  color:#991b1b;
}

.section-title{
  background:white;
  color:#1e3a8a;
  padding:16px;
  border-radius:10px 10px 0 0;
  font-size:21px;
  font-weight:bold;
}

.table-box{
  background:white;
  overflow-x:auto;
  border-radius:0 0 10px 10px;
  box-shadow:0 3px 10px rgba(0,0,0,.08);
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:850px;
}

th{
  background:#1e3a8a;
  color:white;
  padding:12px;
  text-align:left;
  white-space:nowrap;
}

td{
  padding:11px;
  border-bottom:1px solid #e2e8f0;
  white-space:nowrap;
}

tr:hover{
  background:#f8fafc;
}

.empty{
  text-align:center;
  padding:25px;
  color:#64748b;
}

.category-badge{
  background:#eff6ff;
  color:#1e3a8a;
  padding:5px 8px;
  border-radius:6px;
  font-size:12px;
  font-weight:bold;
}

@media(max-width:600px){
  header{
    flex-direction:column;
    align-items:flex-start;
  }

  .container{
    width:94%;
  }
}
</style>
</head>

<body>

<header>

  <div>
    <h1>AAFDRMC</h1>
    <p>Stock Management System</p>
  </div>

  <button
    class="logout"
    onclick="logoutUser()">
    Logout
  </button>

</header>


<nav>

  <a href="dashboard.html">
    🏠 Main
  </a>

  <a href="branch.html">
    🏪 Branches
  </a>

  <a href="items.html" class="active">
    📦 Items
  </a>

  <a href="stock.html">
    📥📤 Stock In / Out
  </a>

  <a href="reports.html">
    📊 Reports
  </a>

  <a href="settings.html">
    ⚙️ Settings
  </a>

</nav>


<div class="container">


<!-- BRANCH -->

<div
  id="branchBox"
  class="branch-box">

  Loading Branch...

</div>


<!-- MESSAGE -->

<div
  id="message"
  class="message">
</div>


<!-- ADD ITEM -->

<div class="form-box">

  <div class="form-title">
    ➕ Add New Item
  </div>


  <div class="form-grid">


    <!-- CATEGORY -->

    <div class="form-group">

      <label>
        Category
      </label>

      <select id="category">

        <option value="">
          -- Select Category --
        </option>

        <option value="1">
          Strategic Food Items / ስትራቴጂካ ምግብ ነክ
        </option>

        <option value="2">
          Daily Food Items / ምግብ ነክ የእለት ደሪሽ
        </option>

        <option value="3">
          Daily Non-Food Items / ምግብ ነክ ያልሆነ የእለት ደሪሽ
        </option>

        <option value="4">
          Non-Food Hygiene Items / ምግብ ነክ ያልሆነ የንጽሕና
        </option>

        <option value="5">
          Non-Food Kitchen Items
        </option>

        <option value="6">
          Non-Food Building / Construction Items
        </option>

      </select>

    </div>


    <!-- ITEM NAME -->

    <div class="form-group">

      <label>
        Item Name
      </label>

      <input
        id="itemName"
        type="text"
        placeholder="Item name">

    </div>


    <!-- UNIT -->

    <div class="form-group">

      <label>
        Unit
      </label>

      <select id="unit">

        <option value="">
          -- Select Unit --
        </option>

        <option value="Piece">
          Piece
        </option>

        <option value="Kg">
          Kg
        </option>

        <option value="Quintal">
          Quintal
        </option>

        <option value="Carton">
          Carton
        </option>

        <option value="Bag">
          Bag
        </option>

        <option value="Liter">
          Liter
        </option>

        <option value="Meter">
          Meter
        </option>

        <option value="Set">
          Set
        </option>

      </select>

    </div>


    <!-- COST -->

    <div class="form-group">

      <label>
        Cost Price
      </label>

      <input
        id="costPrice"
        type="number"
        min="0"
        step="0.01"
        placeholder="0.00">

    </div>


    <!-- SELLING -->

    <div class="form-group">

      <label>
        Selling Price
      </label>

      <input
        id="sellingPrice"
        type="number"
        min="0"
        step="0.01"
        placeholder="0.00">

    </div>


  </div>


  <div class="save-row">

    <button
      class="save-btn"
      id="saveButton"
      onclick="saveItem()">

      💾 Save New Item

    </button>


    <button
      class="clear-btn"
      onclick="clearForm()">

      Clear

    </button>

  </div>

</div>


<!-- ITEM LIST -->

<div class="section-title">

  📦 Items —
  <span id="listBranch">
    Branch
  </span>

</div>


<div class="table-box">

<table>

<thead>

<tr>

<th>No</th>
<th>Item Name</th>
<th>Category</th>
<th>Unit</th>
<th>Cost Price</th>
<th>Selling Price</th>
<th>Created Date</th>

</tr>

</thead>


<tbody id="itemsTable">

<tr>

<td
colspan="7"
class="empty">

Loading items...

</td>

</tr>

</tbody>

</table>

</div>


</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://sslabegtsxlkafuygmar.supabase.co";

const SUPABASE_KEY =
"sb_publishable_M6oxZjm6xF5NbrXkSO9JqA_7JGSucXq";


/* =====================================================
   LOGIN CHECK
===================================================== */

if(
  localStorage.getItem("is_logged_in")
  !==
  "true"
){

  window.location.href =
    "index.html";

}


/* =====================================================
   CURRENT BRANCH
===================================================== */

const branchId =
localStorage.getItem(
  "selected_branch_id"
);

const branchName =
localStorage.getItem(
  "selected_branch_name"
)
||
"Unknown Branch";


/* =====================================================
   SHOW BRANCH
===================================================== */

document.getElementById(
  "branchBox"
).textContent =
"🏢 Current Branch: " +
branchName;

document.getElementById(
  "listBranch"
).textContent =
branchName;


/* =====================================================
   HEADERS
===================================================== */

function getHeaders(){

  return {

    "apikey":
      SUPABASE_KEY,

    "Authorization":
      "Bearer " +
      SUPABASE_KEY,

    "Content-Type":
      "application/json",

    "Prefer":
      "return=representation"

  };

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

  return String(
    value ?? ""
  )

  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}


/* =====================================================
   CATEGORY NAME
===================================================== */

function categoryName(id){

  const categories = {

    "1":
    "Strategic Food Items / ስትራቴጂካ ምግብ ነክ",

    "2":
    "Daily Food Items / ምግብ ነክ የእለት ደሪሽ",

    "3":
    "Daily Non-Food Items / ምግብ ነክ ያልሆነ የእለት ደሪሽ",

    "4":
    "Non-Food Hygiene Items / ምግብ ነክ ያልሆነ የንጽሕና",

    "5":
    "Non-Food Kitchen Items",

    "6":
    "Non-Food Building / Construction Items"

  };

  return categories[
    String(id)
  ]
  ||
  id
  ||
  "—";

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
  text,
  type
){

  const box =
    document.getElementById(
      "message"
    );

  box.textContent =
    text;

  box.className =
    "message " +
    type;

}


/* =====================================================
   SAVE ITEM
===================================================== */

async function saveItem(){

  /* CHECK BRANCH */

  if(!branchId){

    showMessage(
      "❌ Branch hin filatamne. Gara Main Menu deebi'ii Branch filadhu.",
      "error"
    );

    return;

  }


  const category =
    document.getElementById(
      "category"
    ).value;


  const name =
    document.getElementById(
      "itemName"
    ).value.trim();


  const unit =
    document.getElementById(
      "unit"
    ).value;


  const costPrice =
    Number(
      document.getElementById(
        "costPrice"
      ).value || 0
    );


  const sellingPrice =
    Number(
      document.getElementById(
        "sellingPrice"
      ).value || 0
    );


  /* VALIDATION */

  if(!category){

    showMessage(
      "❌ Category filadhu.",
      "error"
    );

    return;

  }


  if(!name){

    showMessage(
      "❌ Item Name galchi.",
      "error"
    );

    return;

  }


  if(!unit){

    showMessage(
      "❌ Unit filadhu.",
      "error"
    );

    return;

  }


  if(costPrice < 0){

    showMessage(
      "❌ Cost Price sirrii galchi.",
      "error"
    );

    return;

  }


  if(sellingPrice < 0){

    showMessage(
      "❌ Selling Price sirrii galchi.",
      "error"
    );

    return;

  }


  /* BUTTON */

  const button =
    document.getElementById(
      "saveButton"
    );

  button.disabled =
    true;

  button.textContent =
    "⏳ Saving...";


  /* =================================================
     CHECK DUPLICATE ITEM IN SAME BRANCH
  ================================================= */

  try{

    const checkUrl =
      SUPABASE_URL +
      "/rest/v1/items" +
      "?select=id" +
      "&branch_id=eq." +
      encodeURIComponent(
        branchId
      ) +
      "&name=ilike." +
      encodeURIComponent(
        name
      );


    const checkResponse =
      await fetch(
        checkUrl,
        {
          method:"GET",
          headers:getHeaders()
        }
      );


    if(checkResponse.ok){

      const existing =
        await checkResponse.json();

      if(existing.length > 0){

        showMessage(
          "❌ Item kun branch kana keessatti duraan jira.",
          "error"
        );

        button.disabled =
          false;

        button.textContent =
          "💾 Save New Item";

        return;

      }

    }


    /* =================================================
       INSERT ITEM
    ================================================= */

    const data = {

      branch_id:
        branchId,

      name:
        name,

      unit:
        unit,

      cost_price:
        costPrice,

      selling_price:
        sellingPrice,

      category:
        categoryName(category),

      category_id:
        Number(category)

    };


    const response =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/items",

        {

          method:"POST",

          headers:getHeaders(),

          body:
            JSON.stringify(
              data
            )

        }

      );


    const result =
      await response.text();


    if(!response.ok){

      console.error(
        "Save item error:",
        result
      );

      showMessage(
        "❌ Item save hin milkoofne: " +
        result,
        "error"
      );

      return;

    }


    /* SUCCESS */

    showMessage(
      "✅ Item haaraan branch " +
      branchName +
      " keessatti galmaa'e.",
      "success"
    );


    clearForm();

    await loadItems();


  }catch(error){

    console.error(
      "Save error:",
      error
    );

    showMessage(
      "❌ Network error. Mee connection kee ilaali.",
      "error"
    );

  }


  button.disabled =
    false;

  button.textContent =
    "💾 Save New Item";

}


/* =====================================================
   CLEAR FORM
===================================================== */

function clearForm(){

  document.getElementById(
    "category"
  ).value = "";

  document.getElementById(
    "itemName"
  ).value = "";

  document.getElementById(
    "unit"
  ).value = "";

  document.getElementById(
    "costPrice"
  ).value = "";

  document.getElementById(
    "sellingPrice"
  ).value = "";

}


/* =====================================================
   LOAD ITEMS
===================================================== */

async function loadItems(){

  const table =
    document.getElementById(
      "itemsTable"
    );


  if(!branchId){

    table.innerHTML = `

      <tr>

        <td
          colspan="7"
          class="empty">

          ❌ Branch hin filatamne.

        </td>

      </tr>

    `;

    return;

  }


  try{

    const url =
      SUPABASE_URL +
      "/rest/v1/items" +
      "?select=*" +
      "&branch_id=eq." +
      encodeURIComponent(
        branchId
      ) +
      "&order=id.asc";


    const response =
      await fetch(
        url,
        {
          method:"GET",
          headers:getHeaders()
        }
      );


    if(!response.ok){

      const error =
        await response.text();

      console.error(
        "Load items error:",
        error
      );

      table.innerHTML = `

        <tr>

          <td
            colspan="7"
            class="empty">

            ❌ Items loading error.

          </td>

        </tr>

      `;

      return;

    }


    const items =
      await response.json();


    table.innerHTML =
      "";


    if(items.length === 0){

      table.innerHTML = `

        <tr>

          <td
            colspan="7"
            class="empty">

            📦 Branch kana keessatti Item
            haaraan hin galmoofne.

          </td>

        </tr>

      `;

      return;

    }


    items.forEach(
      (item,index)=>{

        const row =
          document.createElement(
            "tr"
          );


        row.innerHTML = `

          <td>
            ${index + 1}
          </td>

          <td>
            <strong>
              ${escapeHtml(
                item.name
              )}
            </strong>
          </td>

          <td>

            <span
              class="category-badge">

              ${escapeHtml(
                item.category
                ||
                categoryName(
                  item.category_id
                )
              )}

            </span>

          </td>

          <td>
            ${escapeHtml(
              item.unit
            )}
          </td>

          <td>
            ${Number(
              item.cost_price || 0
            ).toLocaleString()}
          </td>

          <td>
            ${Number(
              item.selling_price || 0
            ).toLocaleString()}
          </td>

          <td>
            ${formatDate(
              item.created_at
            )}
          </td>

        `;


        table.appendChild(
          row
        );

      }
    );


  }catch(error){

    console.error(
      "Items error:",
      error
    );

    table.innerHTML = `

      <tr>

        <td
          colspan="7"
          class="empty">

          ❌ Network error.

        </td>

      </tr>

    `;

  }

}


/* =====================================================
   DATE
===================================================== */

function formatDate(value){

  if(!value)
    return "—";


  const date =
    new Date(value);


  if(
    isNaN(
      date.getTime()
    )
  ){

    return escapeHtml(
      value
    );

  }


  return date.toLocaleString();

}


/* =====================================================
   LOGOUT
===================================================== */

function logoutUser(){

  localStorage.removeItem(
    "access_token"
  );

  localStorage.removeItem(
    "refresh_token"
  );

  localStorage.removeItem(
    "user"
  );

  localStorage.removeItem(
    "user_id"
  );

  localStorage.removeItem(
    "user_branch"
  );

  localStorage.removeItem(
    "is_logged_in"
  );

  localStorage.removeItem(
    "selected_branch_name"
  );

  localStorage.removeItem(
    "selected_branch_id"
  );


  window.location.href =
    "index.html";

}


/* =====================================================
   START
===================================================== */

loadItems();

</script>

</body>
</html>
