<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>AAFDRMC - Items</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f1f5f9;
  color:#1e293b;
}

header{
  background:#1e3a8a;
  color:white;
  padding:18px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:22px;
}

.container{
  width:96%;
  max-width:1400px;
  margin:20px auto;
}

.top-bar{
  background:white;
  padding:18px;
  border-radius:10px;
  margin-bottom:18px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.title{
  font-size:22px;
  font-weight:bold;
  color:#1e3a8a;
}

.branch-box{
  background:#eff6ff;
  border:1px solid #bfdbfe;
  padding:12px;
  border-radius:8px;
  margin-top:12px;
  color:#1e3a8a;
  font-weight:bold;
}

.buttons{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:12px;
}

.btn{
  border:none;
  padding:10px 16px;
  border-radius:7px;
  cursor:pointer;
  color:white;
  font-weight:bold;
}

.btn-add{
  background:#15803d;
}

.btn-back{
  background:#64748b;
}

.form-box{
  display:none;
  background:white;
  padding:20px;
  border-radius:10px;
  margin-bottom:18px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.form-box.show{
  display:block;
}

.form-title{
  font-size:20px;
  font-weight:bold;
  color:#1e3a8a;
  margin-bottom:15px;
}

.form-grid{
  display:grid;
  grid-template-columns:
  repeat(auto-fit,minmax(230px,1fr));
  gap:14px;
}

.form-group{
  display:flex;
  flex-direction:column;
}

.form-group label{
  font-weight:bold;
  margin-bottom:6px;
}

.form-group input,
.form-group select{
  width:100%;
  padding:11px;
  border:1px solid #cbd5e1;
  border-radius:7px;
  font-size:15px;
}

.form-buttons{
  display:flex;
  gap:10px;
  margin-top:17px;
}

.save-btn,
.cancel-btn{
  border:none;
  padding:11px 20px;
  border-radius:7px;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.save-btn{
  background:#15803d;
}

.cancel-btn{
  background:#64748b;
}

.message{
  display:none;
  padding:12px;
  border-radius:7px;
  margin-bottom:15px;
  font-weight:bold;
}

.message.success{
  display:block;
  background:#dcfce7;
  color:#166534;
}

.message.error{
  display:block;
  background:#fee2e2;
  color:#991b1b;
}

.message.info{
  display:block;
  background:#dbeafe;
  color:#1e40af;
}

.table-box{
  background:white;
  border-radius:10px;
  overflow-x:auto;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:1000px;
}

th{
  background:#1e3a8a;
  color:white;
  padding:13px;
  text-align:left;
}

td{
  padding:12px;
  border-bottom:1px solid #e2e8f0;
}

tr:hover{
  background:#f8fafc;
}

.edit-btn{
  background:#2563eb;
  color:white;
  border:none;
  padding:7px 11px;
  border-radius:6px;
  cursor:pointer;
  margin-right:5px;
}

.delete-btn{
  background:#dc2626;
  color:white;
  border:none;
  padding:7px 11px;
  border-radius:6px;
  cursor:pointer;
}

.category-text{
  font-size:13px;
  line-height:1.5;
}

.empty,
.loading{
  text-align:center;
  padding:25px;
  color:#64748b;
}

.quantity-box{
  font-weight:bold;
  color:#1e3a8a;
}

@media(max-width:600px){

  .container{
    width:94%;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

}

</style>

</head>


<body>


<header>

<h1>
AAFDRMC - ITEM MANAGEMENT
</h1>

</header>


<div class="container">


<!-- =====================================================
     TOP BAR
===================================================== -->

<div class="top-bar">

<div class="title">
📦 Item Management
</div>

<div
id="branchBox"
class="branch-box">

📍 Branch: Loading...

</div>

<div class="buttons">

class="btn btn-add"
onclick="openAddForm()">

<button
class="btn btn-back"

<!-- =====================================================

<div
id="message"

<!-- =====================================================
     ADD / EDIT FORM
===================================================== -->

<div
id="itemForm"
class="form-box">


<div
id="formTitle"
class="form-title">

<!-- QUANTITY -->

<div class="form-group">

</label>

</label>

<!-- =====================================================
     ITEMS TABLE
===================================================== -->

<div class="table-box">

<table>

<thead>

<tr>

<th>No</th>

<th>Item Name</th>

<th>Unit</th>

<th>Category</th>

<th>Quantity</th>

<th>Cost Price</th>

<th>Selling Price</th>

<th>Expiry Date</th>

<th>Action</th>

</tr>

</thead>


<tbody id="itemsTable">

<tr>

<td
colspan="9"
class="loading">

⏳ Loading items...

</td>

</tr>

</tbody>

</table>

</div>


</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://sslabegtsxlkafuygmar.supabase.co";

const SUPABASE_KEY =
"sb_publishable_M6oxZjm6xF5NbrXkSO9JqA_7JGSucXq";


/* =====================================================
   GLOBAL
===================================================== */

let allItems = [];

let editItemId = null;

let realBranchId = null;


/* =====================================================
   LOGIN CHECK
===================================================== */

const isLoggedIn =
localStorage.getItem(
  "is_logged_in"
);

if(isLoggedIn !== "true"){

  window.location.href =
    "index.html";

}


/* =====================================================
   SELECTED BRANCH
===================================================== */

const selectedBranchName =
localStorage.getItem(
  "selected_branch_name"
);

const storedBranchId =
localStorage.getItem(
  "selected_branch_id"
);


if(!selectedBranchName){

  alert(
    "Branch hin filatamne."
  );

  window.location.href =
    "index.html";

}


document.getElementById(
  "branchBox"
).textContent =
"📍 Branch: " +
selectedBranchName;


/* =====================================================
   HEADERS
===================================================== */

function getHeaders(){

  const accessToken =
    localStorage.getItem(
      "access_token"
    );

  return {

    "apikey":
      SUPABASE_KEY,

    "Authorization":
      accessToken
        ? "Bearer " + accessToken
        : "Bearer " + SUPABASE_KEY,

    "Content-Type":
      "application/json"

  };

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

  return String(value ?? "")

    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
  text,
  type="info"
){

  const message =
    document.getElementById(
      "message"
    );

  message.textContent =
    text;

  message.className =
    "message " + type;

}


/* =====================================================
   FIND REAL BRANCH ID
===================================================== */

async function findBranchId(){

  try{

    /*
      Yoo storedBranchId dhugaa database ID
      fakkaate, isa fayyadamna.
    */

    if(
      storedBranchId &&
      storedBranchId !== selectedBranchName
    ){

      realBranchId =
        storedBranchId;

      return true;

    }


    /*
      Yoo index.html maqaa branch qofa
      kaa'e, branches table irraa ID barbaada.
    */

    const response =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/branches" +
        "?select=id,branch_name" +
        "&branch_name=eq." +
        encodeURIComponent(
          selectedBranchName
        ) +
        "&limit=1",

        {

          method:"GET",

          headers:
            getHeaders()

        }

      );


    if(!response.ok){

      const error =
        await response.text();

      console.error(
        "Branch ID error:",
        error
      );

      showMessage(
        "❌ Branch ID argachuu hin dandeenye: " +
        error,
        "error"
      );

      return false;

    }


    const branches =
      await response.json();


    if(
      !branches.length
    ){

      showMessage(
        "❌ Branch '" +
        selectedBranchName +
        "' database keessatti hin argamne.",
        "error"
      );

      return false;

    }


    realBranchId =
      branches[0].id;

    return true;

  }

  catch(error){

    console.error(
      "Branch lookup error:",
      error
    );

    showMessage(
      "❌ Network error branch ID barbaaduu keessatti.",
      "error"
    );

    return false;

  }

}


/* =====================================================
   LOAD ITEMS
===================================================== */

async function loadItems(){

  const table =
    document.getElementById(
      "itemsTable"
    );


  table.innerHTML = `

    <tr>

      <td
      colspan="9"
      class="loading">

      ⏳ Items loading...

      </td>

    </tr>

  `;


  if(!realBranchId){

    table.innerHTML = `

      <tr>

        <td
        colspan="9"
        class="empty">

        ❌ Branch ID hin jiru.

        </td>

      </tr>

    `;

    return;

  }


  try{

    const response =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/items" +
        "?select=id,name,unit,category,quantity,cost_price,selling_price,expiry_date,branch_id" +
        "&branch_id=eq." +
        encodeURIComponent(
          realBranchId
        ) +
        "&order=id.asc",

        {

          method:"GET",

          headers:
            getHeaders()

        }

      );


    if(!response.ok){

      const error =
        await response.text();

      console.error(
        "Load Items Error:",
        error
      );


      if(
        error.includes(
          "JWT expired"
        )
      ){

        handleExpiredSession();

        return;

      }


      table.innerHTML = `

        <tr>

          <td
          colspan="9"
          class="empty">

          ❌ Items load hin milkoofne.

          </td>

        </tr>

      `;


      showMessage(
        "❌ Items load hin milkoofne: " +
        error,
        "error"
      );

      return;

    }


    allItems =
      await response.json();


    displayItems();

  }

  catch(error){

    console.error(
      "Load Items Error:",
      error
    );


    table.innerHTML = `

      <tr>

        <td
        colspan="9"
        class="empty">

        ❌ Network error.

        </td>

      </tr>

    `;


    showMessage(
      "❌ Network error.",
      "error"
    );

  }

}


/* =====================================================
   DISPLAY ITEMS
===================================================== */

function displayItems(){

  const table =
    document.getElementById(
      "itemsTable"
    );


  table.innerHTML = "";


  if(
    allItems.length === 0
  ){

    table.innerHTML = `

      <tr>

        <td
        colspan="9"
        class="empty">

        📦 ${escapeHTML(
          selectedBranchName
        )}
        keessatti Item hin jiru.

        </td>

      </tr>

    `;

    return;

  }


  allItems.forEach(
    (item,index)=>{

      const row =
        document.createElement(
          "tr"
        );


      row.innerHTML = `

        <td>
          ${index + 1}
        </td>

        <td>
          <strong>
            ${escapeHTML(
              item.name
            )}
          </strong>
        </td>

        <td>
          ${escapeHTML(
            item.unit
          )}
        </td>

        <td class="category-text">
          ${escapeHTML(
            item.category || "—"
          )}
        </td>

        <td class="quantity-box">
          ${Number(
            item.quantity || 0
          ).toLocaleString()}
        </td>

        <td>
          ${Number(
            item.cost_price || 0
          ).toLocaleString()}
        </td>

        <td>
          ${Number(
            item.selling_price || 0
          ).toLocaleString()}
        </td>

        <td>
          ${escapeHTML(
            item.expiry_date || "—"
          )}
        </td>

        <td>

          <button
          class="edit-btn"
          onclick="editItem('${String(item.id)}')">

          ✏️ Edit

          </button>

          <button
          class="delete-btn"
          onclick="deleteItem('${String(item.id)}')">

          🗑️ Delete

          </button>

        </td>

      `;


      table.appendChild(
        row
      );

    }

  );

}


/* =====================================================
   OPEN ADD FORM
===================================================== */

function openAddForm(){

  editItemId = null;


  document.getElementById(
    "formTitle"
  ).textContent =
    "➕ Add New Item";


  document.getElementById(
    "saveButton"
  ).textContent =
    "💾 Save Item";


  document.getElementById(
    "itemName"
  ).value = "";


  document.getElementById(
    "itemUnit"
  ).value = "";


  document.getElementById(
    "itemCategory"
  ).value = "";


  document.getElementById(
    "itemQuantity"
  ).value = "0";


  document.getElementById(
    "costPrice"
  ).value = "0";


  document.getElementById(
    "sellingPrice"
  ).value = "0";


  document.getElementById(
    "expiryDate"
  ).value = "";


  document.getElementById(
    "itemForm"
  ).classList.add(
    "show"
  );


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =====================================================
   CLOSE FORM
===================================================== */

function closeForm(){

  editItemId = null;

  document.getElementById(
    "itemForm"
  ).classList.remove(
    "show"
  );

}


/* =====================================================
   SAVE ITEM
===================================================== */

async function saveItem(){

  const name =
    document.getElementById(
      "itemName"
    ).value.trim();


  const unit =
    document.getElementById(
      "itemUnit"
    ).value;


  const category =
    document.getElementById(
      "itemCategory"
    ).value;


  const quantity =
    Number(
      document.getElementById(
        "itemQuantity"
      ).value || 0
    );


  const costPrice =
    Number(
      document.getElementById(
        "costPrice"
      ).value || 0
    );


  const sellingPrice =
    Number(
      document.getElementById(
        "sellingPrice"
      ).value || 0
    );


  const expiryDate =
    document.getElementById(
      "expiryDate"
    ).value || null;


  /* VALIDATION */

  if(!name){

    showMessage(
      "❌ Item maqaa galchi.",
      "error"
    );

    return;

  }


  if(!unit){

    showMessage(
      "❌ Unit / Safartuu filadhu.",
      "error"
    );

    return;

  }


  if(!category){

    showMessage(
      "❌ Category filadhu.",
      "error"
    );

    return;

  }


  if(quantity < 0){

    showMessage(
      "❌ Quantity sirrii galchi.",
      "error"
    );

    return;

  }


  if(costPrice < 0){

    showMessage(
      "❌ Cost Price sirrii galchi.",
      "error"
    );

    return;

  }


  if(sellingPrice < 0){

    showMessage(
      "❌ Selling Price sirrii galchi.",
      "error"
    );

    return;

  }


  if(!realBranchId){

    const found =
      await findBranchId();

    if(!found){

      return;

    }

  }


  /* DATA */

  const data = {

    name:name,

    unit:unit,

    category:category,

    quantity:quantity,

    cost_price:costPrice,

    selling_price:sellingPrice,

    expiry_date:expiryDate,

    branch_id:realBranchId

  };


  const saveButton =
    document.getElementById(
      "saveButton"
    );


  saveButton.disabled =
    true;

  saveButton.textContent =
    "⏳ Saving...";


  /* =====================================================
     ADD
  ===================================================== */

  if(
    editItemId === null
  ){

    try{

      const response =
        await fetch(

          SUPABASE_URL +
          "/rest/v1/items",

          {

            method:"POST",

            headers:{

              ...getHeaders(),

              "Prefer":
                "return=representation"

            },

            body:
              JSON.stringify(
                data
              )

          }

        );


      if(!response.ok){

        const error =
          await response.text();


        console.error(
          "Insert Error:",
          error
        );


        if(
          error.includes(
            "JWT expired"
          )
        ){

          handleExpiredSession();

          return;

        }


        showMessage(
          "❌ Save hin milkoofne: " +
          error,
          "error"
        );

        return;

      }


      showMessage(
        "✅ Item haaraan " +
        selectedBranchName +
        " keessatti galmaa'e.",
        "success"
      );


      closeForm();


      await loadItems();

    }

    catch(error){

      console.error(
        "Save error:",
        error
      );


      showMessage(
        "❌ Network error.",
        "error"
      );

    }

    finally{

      saveButton.disabled =
        false;

      saveButton.textContent =
        "💾 Save Item";

    }


    return;

  }


  /* =====================================================
     EDIT
  ===================================================== */

  try{

    const response =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/items?id=eq." +
        encodeURIComponent(
          editItemId
        ) +
        "&branch_id=eq." +
        encodeURIComponent(
          realBranchId
        ),

        {

          method:"PATCH",

          headers:{

            ...getHeaders(),

            "Prefer":
              "return=representation"

          },

          body:
            JSON.stringify(
              data
            )

        }

      );


    if(!response.ok){

      const error =
        await response.text();


      console.error(
        "Update Error:",
        error
      );


      if(
        error.includes(
          "JWT expired"
        )
      ){

        handleExpiredSession();

        return;

      }


      showMessage(
        "❌ Edit hin milkoofne: " +
        error,
        "error"
      );

      return;

    }


    showMessage(
      "✅ Item sirreeffame.",
      "success"
    );


    closeForm();


    await loadItems();

  }

  catch(error){

    console.error(
      "Update error:",
      error
    );


    showMessage(
      "❌ Network error.",
      "error"
    );

  }

  finally{

    saveButton.disabled =
      false;

    saveButton.textContent =
      "💾 Update Item";

  }

}


/* =====================================================
   EDIT ITEM
===================================================== */

function editItem(id){

  const item =
    allItems.find(

      i =>
        String(i.id) ===
        String(id)

    );


  if(!item){

    showMessage(
      "❌ Item hin argamne.",
      "error"
    );

    return;

  }


  editItemId =
    id;


  document.getElementById(
    "formTitle"
  ).textContent =
    "✏️ Edit Item";


  document.getElementById(
    "saveButton"
  ).textContent =
    "💾 Update Item";


  document.getElementById(
    "itemName"
  ).value =
    item.name || "";


  document.getElementById(
    "itemUnit"
  ).value =
    item.unit || "";


  document.getElementById(
    "itemCategory"
  ).value =
    item.category || "";


  document.getElementById(
    "itemQuantity"
  ).value =
    item.quantity || 0;


  document.getElementById(
    "costPrice"
  ).value =
    item.cost_price || 0;


  document.getElementById(
    "sellingPrice"
  ).value =
    item.selling_price || 0;


  document.getElementById(
    "expiryDate"
  ).value =
    item.expiry_date || "";


  document.getElementById(
    "itemForm"
  ).classList.add(
    "show"
  );


  window.scrollTo({

    top:0,

    behavior:"smooth"

  });

}


/* =====================================================
   DELETE ITEM
===================================================== */

async function deleteItem(id){

  const item =
    allItems.find(

      i =>
        String(i.id) ===
        String(id)

    );


  if(!item){

    showMessage(
      "❌ Item hin argamne.",
      "error"
    );

    return;

  }


  const confirmed =
    confirm(
      "Item '" +
      item.name +
      "' haquu barbaaddaa?"
    );


  if(!confirmed){

    return;

  }


  try{

    const response =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/items?id=eq." +
        encodeURIComponent(
          id
        ) +
        "&branch_id=eq." +
        encodeURIComponent(
          realBranchId
        ),

        {

          method:"DELETE",

          headers:{

            ...getHeaders(),

            "Prefer":
              "return=minimal"

          }

        }

      );


    if(!response.ok){

      const error =
        await response.text();


      console.error(
        "Delete Error:",
        error
      );


      if(
        error.includes(
          "JWT expired"
        )
      ){

        handleExpiredSession();

        return;

      }


      showMessage(
        "❌ Delete hin milkoofne: " +
        error,
        "error"
      );

      return;

    }


    showMessage(
      "✅ Item haqameera.",
      "success"
    );


    await loadItems();

  }

  catch(error){

    console.error(
      "Delete error:",
      error
    );


    showMessage(
      "❌ Network error.",
      "error"
    );

  }

}


/* =====================================================
   EXPIRED SESSION
===================================================== */

function handleExpiredSession(){

  localStorage.removeItem(
    "access_token"
  );

  localStorage.removeItem(
    "refresh_token"
  );

  localStorage.removeItem(
    "is_logged_in"
  );

  showMessage(
    "🔐 Session xumurameera. Irra deebi'ii login godhi.",
    "error"
  );


  setTimeout(
    function(){

      window.location.href =
        "index.html";

    },
    1500
  );

}


/* =====================================================
   BACK
===================================================== */

function goBack(){

  window.location.href =
    "dashboard.html";

}


/* =====================================================
   ENTER KEY
===================================================== */

document.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Enter" &&
      document.getElementById(
        "itemForm"
      ).classList.contains(
        "show"
      )
    ){

    }

  }
);


/* =====================================================
   START
===================================================== */

async function startPage(){

  const found =
    await findBranchId();

  if(found){

    await loadItems();

  }

}


startPage();
