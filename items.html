<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>AAFDRMC - Item Management</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5efe8;
    color:#3e2723;
}

/* ================= HEADER ================= */

.header{
    background:#5d4037;
    color:white;
    padding:14px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    flex-wrap:wrap;
    box-shadow:0 3px 10px rgba(0,0,0,.18);
}

.header-left{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo-box{
    width:58px;
    height:58px;
    border-radius:50%;
    overflow:hidden;
    background:white;
    border:3px solid #d7ccc8;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
}

.logo{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.title{
    font-size:21px;
    font-weight:bold;
}

.branch-name{
    font-size:13px;
    margin-top:5px;
    opacity:.9;
}

.header-buttons{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

button{
    border:none;
    border-radius:8px;
    padding:10px 15px;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.btn-menu{
    background:#efebe9;
    color:#4e342e;
}

.btn-logout{
    background:#8d6e63;
    color:white;
}

/* ================= CONTAINER ================= */

.container{
    max-width:1100px;
    margin:25px auto;
    padding:0 15px;
}

/* ================= CARD ================= */

.card{
    background:white;
    border-radius:14px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 3px 12px rgba(62,39,35,.10);
}

.card h2{
    margin-top:0;
    color:#5d4037;
}

/* ================= INFO ================= */

.info{
    background:#fff8e1;
    border-left:4px solid #8d6e63;
    padding:12px;
    margin-bottom:18px;
    border-radius:6px;
    font-size:14px;
}

/* ================= FORM ================= */

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.field{
    display:flex;
    flex-direction:column;
}

.field label{
    font-weight:bold;
    margin-bottom:6px;
    font-size:14px;
}

input,
select{
    width:100%;
    padding:12px;
    border:1px solid #d7ccc8;
    border-radius:8px;
    font-size:15px;
    outline:none;
    background:white;
}

input:focus,
select:focus{
    border-color:#795548;
    box-shadow:0 0 0 2px rgba(121,85,72,.12);
}

/* ================= FORM BUTTONS ================= */

.form-buttons{
    margin-top:18px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.btn-save{
    background:#6d4c41;
    color:white;
}

.btn-clear{
    background:#d7ccc8;
    color:#3e2723;
}

/* ================= MESSAGE ================= */

.message{
    margin-top:15px;
    padding:12px;
    border-radius:8px;
    display:none;
    font-weight:bold;
    word-break:break-word;
}

.message.success{
    display:block;
    background:#e8f5e9;
    color:#2e7d32;
}

.message.error{
    display:block;
    background:#ffebee;
    color:#c62828;
}

/* ================= TABLE ================= */

.table-wrap{
    width:100%;
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:650px;
}

th{
    background:#6d4c41;
    color:white;
    padding:12px;
    text-align:left;
}

td{
    padding:11px;
    border-bottom:1px solid #eee;
}

tr:hover{
    background:#faf7f4;
}

.badge{
    display:inline-block;
    padding:6px 9px;
    border-radius:15px;
    background:#efebe9;
    color:#5d4037;
    font-size:12px;
    font-weight:bold;
}

/* ================= ACTION BUTTONS ================= */

.action-btn{
    padding:7px 10px;
    margin:2px;
    font-size:12px;
}

.edit{
    background:#ffe0b2;
    color:#e65100;
}

.delete{
    background:#ffcdd2;
    color:#b71c1c;
}

/* ================= STATUS ================= */

.loading{
    text-align:center;
    padding:20px;
    color:#795548;
}

.empty{
    text-align:center;
    padding:25px;
    color:#795548;
}

/* ================= MOBILE ================= */

@media(max-width:700px){

    .header{
        align-items:flex-start;
    }

    .title{
        font-size:17px;
    }

    .logo-box{
        width:48px;
        height:48px;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .container{
        margin-top:15px;
    }

    .card{
        padding:15px;
    }

    .header-buttons{
        width:100%;
    }

    .header-buttons button{
        flex:1;
    }

}

</style>

</head>

<body>


<!-- ================= HEADER ================= -->

<header class="header">

    <div class="header-left">

        <div class="logo-box">

            <img
                src="./1788633150526.jpg"
                class="logo"
                alt="AAFDRMC Profile"
            >

        </div>

        <div>

            <div class="title">
                AAFDRMC - Item Management
            </div>

            <div
                class="branch-name"
                id="branchDisplay">
                Branch: Loading...
            </div>

        </div>

    </div>


    <div class="header-buttons">

        <button

            onclick="goDashboard()">

            ← Dashboard

        </button>


        <button

            onclick="logout()">

</header>


<!-- ================= MAIN ================= -->

<main class="container">


    <!-- ================= ADD / EDIT ITEM ================= -->

    <section class="card">

        <h2 id="formTitle">
            Add New Item
        </h2>


        <div class="info">

            <strong>Item ID:</strong>

            ID harkaan hin galchinu.
            Database'n ofumaan ID uuma.

        <div class="form-grid">


            <!-- ITEM NAME -->

            <div class="field">

                </label>

                <input

                    id="itemName"
                    placeholder="Fakkeenya: Xaafii">

            <!-- CATEGORY -->

            <div class="field">

                <label>
                    Category / Ramaddii / ምድብ
                </label>

                <select id="category">

                    <option value="">
                        -- Category / Ramaddii / ምድብ ይምረጡ --
                    </option>


                    <option value="Meeshaalee Nyaataa Tarsiimawaa">
                        Meeshaalee Nyaataa Tarsiimawaa /
                        Strategic Food Items /
                        ስትራቴጂክ ምግብ ነክ
                    </option>


                    <option value="Meeshaalee Nyaataa Guyyaa Guyyaa">
                        Meeshaalee Nyaataa Guyyaa Guyyaa /
                        Daily Food Items /
                        የዕለት ምግብ ነክ
                    </option>


                    <option value="Meeshaalee Nyaataa Hin Taane Guyyaa Guyyaa">
                        Meeshaalee Nyaataa Hin Taane Guyyaa Guyyaa /
                        Daily Non-Food Items /
                        የዕለት ምግብ ነክ ያልሆኑ
                    </option>


                    <option value="Meeshaalee Nyaataa Hin Taane Ittiin Nyaata Qopheessan">
                        Meeshaalee Nyaataa Hin Taane
                        Ittiin Nyaata Qopheessan /
                        Non-Food Kitchen Items /
                        የምግብ ዝግጅት የማይሆኑ እቃዎች
                    </option>


                    <option value="Meeshaalee Qulqullinaa">
                        Meeshaalee Qulqullinaa /
                        Non-Food Hygiene Items /
                        የንጽህና እቃዎች

                    <option value="Meeshaa Ijaarsa Manaaf Oolu">

        <!-- BUTTONS -->

        <div class="form-buttons">

            <button

                id="saveButton"

                + Save Item

            </button>

                Clear

            </button>

        </div>


        <div
            id="message"
            class="message">

    </section>



    <!-- ================= ITEMS LIST ================= -->

    <section class="card">

        <h2>

        </h2>


        <div

        </div>


        <div class="table-wrap">

            <table
                id="itemsTable"
                style="display:none;">

                <thead>

                    <tr>

                        <th>ID</th>

                        <th>Category</th>

                        <th>Actions</th>

                    </tr>

                </thead>


                <tbody id="itemsBody"></tbody>

        </div>


        <div
            id="empty"
            class="empty"
            style="display:none;">

            No items found for this branch.

        </div>

    </section>

</main>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://sslabegtsxlkafuygmar.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_M6oxZjm6xF5NbrXkSO9JqA_7JGSucXq";


/* =====================================================
   BRANCH INFORMATION
===================================================== */

/*
   IMPORTANT:

   selected_branch_id = GUL

   GUL is NOT UUID.

   Kanaaf GUL akka UUIDtti
   hin fayyadamnu.

   UUID dhugaa branches table
   keessaa barbaanna.
*/

let branchCode =
    localStorage.getItem(
        "selected_branch_code"
    );

let branchName =
    localStorage.getItem(
        "selected_branch_name"
    );


/*
   Yoo branch code hin jirre,
   selected_branch_id irraa
   fallback godha.

   Fakkeenya:
   selected_branch_id = GUL
*/

if(!branchCode){

    branchCode =
        localStorage.getItem(
            "selected_branch_id"
        );

}


/*
   UUID DHUGAA QOFA
*/

let branchUUID =
    localStorage.getItem(
        "selected_branch_uuid"
    );


/* =====================================================
   EDITING
===================================================== */

let editingId = null;


/* =====================================================
   PAGE START
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    async function(){

        /* ================= LOGIN CHECK ================= */

        if(
            localStorage.getItem(
                "is_logged_in"
            ) !== "true"
        ){

            window.location.href =
                "index.html";

            return;

        }


        /* ================= SHOW BRANCH ================= */

        document
            .getElementById(
                "branchDisplay"
            )
            .textContent =
                "Branch: " +
                (
                    branchName ||
                    branchCode ||
                    "Unknown"
                );


        /* ================= LOAD ================= */

        await loadItems();

    }
);


/* =====================================================
   SUPABASE HEADERS
===================================================== */

function headers(extra = {}){

    return {

        "apikey":
            SUPABASE_KEY,

        "Authorization":
            "Bearer " + SUPABASE_KEY,

        "Content-Type":
            "application/json",

        ...extra

    };

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
    text,
    type
){

    const box =
        document.getElementById(
            "message"
        );

    box.textContent =
        text;

    box.className =
        "message " + type;

}


/* =====================================================
   CLEAR MESSAGE
===================================================== */

function clearMessage(){

    const box =
        document.getElementById(
            "message"
        );

    box.textContent =
        "";

    box.className =
        "message";

}


/* =====================================================
   RESOLVE REAL BRANCH UUID
===================================================== */

async function resolveBranchUUID(){

    /*
       Yoo UUID duraan dursee argame,
       isa fayyadamna.
    */

    if(
        branchUUID &&
        isUUID(branchUUID)
    ){

        return branchUUID;

    }


    /*
       Branch code/name irraa
       UUID barbaanna.
    */

    try{

        const response =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/branches?select=*",
                {
                    method:"GET",
                    headers:headers()
                }
            );


        const text =
            await response.text();


        if(!response.ok){

            throw new Error(
                text
            );

        }


        const branches =
            JSON.parse(text);


        if(
            !Array.isArray(branches)
        ){

            throw new Error(
                "Branches data sirrii miti."
            );

        }


        const wantedCode =
            String(
                branchCode || ""
            )
            .trim()
            .toLowerCase();


        const wantedName =
            String(
                branchName || ""
            )
            .trim()
            .toLowerCase();


        /*
           Columns adda addaa
           branches table keessatti
           jiraachuu danda'u.
        */

        const codeColumns = [

            "code",
            "branch_code",
            "branchCode",
            "branchcode",
            "branch_id_code",
            "short_code"

        ];


        const nameColumns = [

            "name",
            "branch_name",
            "branch",
            "branchName",
            "title",
            "branch_title",
            "office_name",
            "office"

        ];


        /*
           1. CODE irratti barbaadi
        */

        for(
            const b of branches
        ){

            let codeMatch =
                false;


            for(
                const col of codeColumns
            ){

                if(
                    b[col] !== undefined &&
                    b[col] !== null
                ){

                    const value =
                        String(
                            b[col]
                        )
                        .trim()
                        .toLowerCase();


                    if(
                        value === wantedCode
                    ){

                        codeMatch =
                            true;

                        break;

                    }

                }

            }


            if(
                codeMatch &&
                b.id &&
                isUUID(
                    String(b.id)
                )
            ){

                branchUUID =
                    String(b.id);


                /*
                   UUID addatti kaa'a.

                   selected_branch_id
                   hin tuqnu.
                */

                localStorage.setItem(
                    "selected_branch_uuid",
                    branchUUID
                );


                return branchUUID;

            }

        }


        /*
           2. NAME irratti barbaadi
        */

        for(
            const b of branches
        ){

            let nameMatch =
                false;


            for(
                const col of nameColumns
            ){

                if(
                    b[col] !== undefined &&
                    b[col] !== null
                ){

                    const value =
                        String(
                            b[col]
                        )
                        .trim()
                        .toLowerCase();


                    if(
                        value === wantedName
                    ){

                        nameMatch =
                            true;

                        break;

                    }

                }

            }


            if(
                nameMatch &&
                b.id &&
                isUUID(
                    String(b.id)
                )
            ){

                branchUUID =
                    String(b.id);


                localStorage.setItem(
                    "selected_branch_uuid",
                    branchUUID
                );


                return branchUUID;

            }

        }


        /*
           Yoo code/name hin argamne
        */

        throw new Error(
            "Branch '" +
            (
                branchName ||
                branchCode
            ) +
            "' branches table keessatti hin argamne."
        );

    }
    catch(error){

        console.error(
            "Branch UUID error:",
            error
        );

        return null;

    }

}


/* =====================================================
   UUID CHECK
===================================================== */

function isUUID(value){

    if(!value){

        return false;

    }


    return /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i
        .test(
            String(value)
        );

}


/* =====================================================
   LOAD ITEMS
===================================================== */

async function loadItems(){

    const loading =
        document.getElementById(
            "loading"
        );

    const table =
        document.getElementById(
            "itemsTable"
        );

    const empty =
        document.getElementById(
            "empty"
        );


    loading.style.display =
        "block";

    table.style.display =
        "none";

    empty.style.display =
        "none";


    clearMessage();


    try{

        /*
           REAL UUID barbaadi
        */

        const uuid =
            await resolveBranchUUID();


        if(
            !uuid
        ){

            throw new Error(
                "Branch UUID hin argamne. Branch filannoo/login kee mirkaneessi."
            );

        }


        /*
           IMPORTANT:

           Asitti GUL hin erginu.

           UUID dhugaa qofa:
           branch_id=eq.UUID
        */

        const url =
            SUPABASE_URL +
            "/rest/v1/items" +
            "?select=*" +
            "&branch_id=eq." +
            encodeURIComponent(uuid) +
            "&order=id.asc";


        console.log(
            "Items URL:",
            url
        );


        const response =
            await fetch(
                url,
                {
                    method:"GET",
                    headers:headers()
                }
            );


        const text =
            await response.text();


        if(!response.ok){

            throw new Error(
                text
            );

        }


        const items =
            JSON.parse(text);


        renderItems(
            items
        );

    }
    catch(error){

        console.error(error);


        loading.style.display =
            "none";


        showMessage(
            "Items loading hin milkoofne: " +
            error.message,
            "error"
        );

    }

}


/* =====================================================
   DISPLAY ITEMS
===================================================== */

function renderItems(items){

    const loading =
        document.getElementById(
            "loading"
        );

    const table =
        document.getElementById(
            "itemsTable"
        );

    const empty =
        document.getElementById(
            "empty"
        );

    const body =
        document.getElementById(
            "itemsBody"
        );


    loading.style.display =
        "none";


    body.innerHTML =
        "";


    if(
        !items ||
        items.length === 0
    ){

        table.style.display =
            "none";

        empty.style.display =
            "block";

        return;

    }


    table.style.display =
        "table";

    empty.style.display =
        "none";


    items.forEach(
        item => {

            const row =
                document.createElement(
                    "tr"
                );


            const id =
                item.id ?? "";


            const name =
                item.name ?? "";


            const category =
                item.category ?? "";


            row.innerHTML = `

                <td>
                    ${escapeHtml(
                        String(id)
                    )}
                </td>

                <td>
                    <strong>
                        ${escapeHtml(
                            String(name)
                        )}
                    </strong>
                </td>

                <td>
                    <span class="badge">
                        ${escapeHtml(
                            String(category)
                        )}
                    </span>
                </td>

                <td>

                    <button
                        class="action-btn edit"
                        onclick='editItem(
                            ${JSON.stringify(item)}
                        )'>

                        Edit

                    </button>


                    <button
                        class="action-btn delete"
                        onclick="deleteItem(
                            '${escapeJs(
                                String(id)
                            )}'
                        )">

                        Delete

                    </button>

                </td>

            `;


            body.appendChild(
                row
            );

        }
    );

}


/* =====================================================
   SAVE ITEM
===================================================== */

async function saveItem(){

    clearMessage();


    const name =
        document
        .getElementById(
            "itemName"
        )
        .value
        .trim();


    const category =
        document
        .getElementById(
            "category"
        )
        .value
        .trim();


    if(!name){

        showMessage(
            "Maqaa item galchi.",
            "error"
        );

        return;

    }


    if(!category){

        showMessage(
            "Category filadhu.",
            "error"
        );

        return;

    }


    /*
       Edit yoo ta'e branch UUID
       barbaachisaa miti.

       New item yoo ta'e UUID
       barbaachisa.
    */

    let uuid =
        branchUUID;


    if(
        editingId === null
    ){

        uuid =
            await resolveBranchUUID();


        if(!uuid){

            showMessage(
                "Branch UUID hin argamne. Mee Logout godhiitii Login irra deebi'i.",
                "error"
            );

            return;

        }

    }


    const saveButton =
        document.getElementById(
            "saveButton"
        );


    saveButton.disabled =
        true;


    saveButton.textContent =
        editingId !== null
        ? "Updating..."
        : "Saving...";


    try{

        /* =================================================
           EDIT
        ================================================= */

        if(
            editingId !== null
        ){

            const data = {

                name:
                    name,

                category:
                    category

            };


            const response =
                await fetch(

                    SUPABASE_URL +
                    "/rest/v1/items?id=eq." +
                    encodeURIComponent(
                        editingId
                    ),

                    {
                        method:"PATCH",

                        headers:headers({

                            "Prefer":
                                "return=representation"

                        }),

                        body:
                            JSON.stringify(
                                data
                            )

                    }

                );


            const text =
                await response.text();


            if(!response.ok){

                throw new Error(
                    text
                );

            }


            showMessage(
                "Item sirriitti fooyya'e.",
                "success"
            );


            clearForm();


            await loadItems();


            return;

        }


        /* =================================================
           NEW ITEM
        ================================================= */

        /*
           ID hin erginu.

           Database'n ofumaan ID uuma.

           branch_id keessatti
           UUID DHUGAA qofa ergina.
        */

        const data = {

            name:
                name,

            category:
                category,

            branch_id:
                uuid,

            branch_code:
                branchCode || null

        };


        console.log(
            "Saving item:",
            data
        );


        const response =
            await fetch(

                SUPABASE_URL +
                "/rest/v1/items",

                {
                    method:"POST",

                    headers:headers({

                        "Prefer":
                            "return=representation"

                    }),

                    body:
                        JSON.stringify(
                            data
                        )

                }

            );


        const text =
            await response.text();


        if(!response.ok){

            throw new Error(
                text
            );

        }


        showMessage(
            "Item haaraan sirriitti galmaa'e.",
            "success"
        );


        clearForm();


        await loadItems();

    }
    catch(error){

        console.error(error);


        showMessage(
            "Save hin milkoofne: " +
            error.message,
            "error"
        );

    }
    finally{

        saveButton.disabled =
            false;


        saveButton.textContent =
            editingId !== null
            ? "Update Item"
            : "+ Save Item";

    }

}


/* =====================================================
   EDIT ITEM
===================================================== */

function editItem(item){

    editingId =
        item.id;


    document
        .getElementById(
            "itemName"
        )
        .value =
            item.name || "";


    document
        .getElementById(
            "category"
        )
        .value =
            item.category || "";


    document
        .getElementById(
            "formTitle"
        )
        .textContent =
            "Edit Item";


    document
        .getElementById(
            "saveButton"
        )
        .textContent =
            "Update Item";


    window.scrollTo({

        top:0,

        behavior:"smooth"

    });

}


/* =====================================================
   DELETE ITEM
===================================================== */

async function deleteItem(id){

    if(!id){

        return;

    }


    const ok =
        confirm(
            "Item kana haqeeqaatti haquu barbaaddaa?"
        );


    if(!ok){

        return;

    }


    try{

        const response =
            await fetch(

                SUPABASE_URL +
                "/rest/v1/items?id=eq." +
                encodeURIComponent(
                    id
                ),

                {
                    method:"DELETE",

                    headers:headers({

                        "Prefer":
                            "return=minimal"

                    })

                }

            );


        const text =
            await response.text();


        if(!response.ok){

            throw new Error(
                text
            );

        }


        showMessage(
            "Item haqameera.",
            "success"
        );


        await loadItems();

    }
    catch(error){

        console.error(error);


        showMessage(
            "Delete hin milkoofne: " +
            error.message,
            "error"
        );

    }

}

/* =====================================================
   SECURITY
===================================================== */

function escapeHtml(value){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


function escapeJs(value){

    return String(value)

        .replace(
            /\\/g,
            "\\\\"
        )

        .replace(
            /'/g,
            "\\'"
        );

}

    }
);
