<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AAFDRMC - Items</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f1f5f9;
  color:#1e293b;
}

header{
  background:#1e3a8a;
  color:white;
  padding:18px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

header h1{
  margin:0;
  font-size:24px;
}

header p{
  margin:5px 0 0;
  font-size:14px;
}

.back{
  background:#64748b;
  color:white;
  border:0;
  padding:10px 15px;
  border-radius:7px;
  cursor:pointer;
  font-weight:bold;
}

.container{
  width:96%;
  max-width:1450px;
  margin:20px auto;
}

.branch-box{
  background:white;
  padding:18px;
  border-radius:10px;
  margin-bottom:18px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.branch-title{
  color:#1e3a8a;
  font-size:21px;
  font-weight:bold;
}

.branch-sub{
  margin-top:7px;
  color:#64748b;
}

.form-box{
  background:white;
  padding:20px;
  border-radius:10px;
  margin-bottom:18px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.form-title{
  color:#1e3a8a;
  font-size:20px;
  font-weight:bold;
  margin-bottom:16px;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:13px;
}

.form-group{
  display:flex;
  flex-direction:column;
}

.form-group label{
  font-weight:bold;
  margin-bottom:6px;
}

.form-group input,
.form-group select{
  width:100%;
  padding:11px;
  border:1px solid #cbd5e1;
  border-radius:7px;
  font-size:15px;
}

.save{
  margin-top:16px;
  background:#15803d;
  color:white;
  border:0;
  padding:11px 20px;
  border-radius:7px;
  cursor:pointer;
  font-weight:bold;
}

.cancel{
  margin-top:16px;
  background:#64748b;
  color:white;
  border:0;
  padding:11px 20px;
  border-radius:7px;
  cursor:pointer;
  font-weight:bold;
}

.message{
  display:none;
  padding:12px;
  border-radius:7px;
  margin-bottom:15px;
  font-weight:bold;
}

.message.success{
  display:block;
  background:#dcfce7;
  color:#166534;
}

.message.error{
  display:block;
  background:#fee2e2;
  color:#991b1b;
}

.summary{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:12px;
  margin-bottom:18px;
}

.card{
  background:white;
  padding:18px;
  border-radius:10px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.card h3{
  margin:0;
  color:#64748b;
  font-size:14px;
}

.card strong{
  display:block;
  color:#1e3a8a;
  font-size:28px;
  margin-top:8px;
}

.table-title{
  background:white;
  padding:16px;
  border-radius:10px 10px 0 0;
  color:#1e3a8a;
  font-size:20px;
  font-weight:bold;
}

.table-box{
  background:white;
  overflow-x:auto;
  border-radius:0 0 10px 10px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:1100px;
}

th{
  background:#1e3a8a;
  color:white;
  padding:12px;
  text-align:left;
  white-space:nowrap;
}

td{
  padding:11px;
  border-bottom:1px solid #e2e8f0;
  white-space:nowrap;
}

tr:hover{
  background:#eff6ff;
}

.edit-btn{
  background:#2563eb;
  color:white;
  border:0;
  padding:7px 10px;
  border-radius:5px;
  cursor:pointer;
  font-weight:bold;
}

.delete-btn{
  background:#dc2626;
  color:white;
  border:0;
  padding:7px 10px;
  border-radius:5px;
  cursor:pointer;
  font-weight:bold;
}

.badge{
  display:inline-block;
  padding:5px 8px;
  border-radius:15px;
  background:#eff6ff;
  color:#1e3a8a;
  font-weight:bold;
  font-size:12px;
}

.hidden{
  display:none;
}

@media(max-width:600px){
  header{
    flex-direction:column;
    align-items:flex-start;
  }
}
</style>
</head>

<body>

<header>

<div>
<h1>AAFDRMC</h1>
<p>Stock Management System</p>
</div>

<button class="back" onclick="goBack()">
⬅️ Back to Dashboard
</button>

</header>


<div class="container">


<!-- BRANCH -->

<div class="branch-box">

<div class="branch-title" id="branchTitle">
Loading Branch...
</div>

<div class="branch-sub">
Items galmeessuu fi bulchuu
</div>

</div>


<!-- MESSAGE -->

<div id="message" class="message"></div>


<!-- ADD / EDIT FORM -->

<div class="form-box">

<div class="form-title" id="formTitle">
➕ Add New Item
</div>


<div class="form-grid">


<div class="form-group">

<label>
Item Name
</label>

<input
type="text"
id="itemName"
placeholder="Maqaa Item">

</div>


<div class="form-group">

<label>
Unit
</label>

<select id="itemUnit">

<option value="">
-- Select Unit --
</option>

<option value="Quintal">
Quintal
</option>

<option value="Kg">
Kg
</option>

<option value="Carton">
Carton
</option>

<option value="Bag">
Bag
</option>

<option value="Piece">
Piece
</option>

<option value="Liter">
Liter
</option>

<option value="Box">
Box
</option>

<option value="Packet">
Packet
</option>

<option value="Other">
Other
</option>

</select>

</div>


<div class="form-group">

<label>
Category
</label>

<select id="itemCategory">

<option value="">
-- Select Category --
</option>

<option value="Strategic Food Items">
Meeshaalee Nyaataa Tarsiimawaa / Strategic Food Items
</option>

<option value="Daily Food Items">
Meeshaalee Nyaataa Guyyaa Guyyaa / Daily Food Items
</option>

<option value="Daily Non-Food Items">
Meeshaalee Nyaataa Hin Taane Guyyaa Guyyaa / Daily Non-Food Items
</option>

<option value="Non-Food Hygiene Items">
Meeshaalee Qulqullinaa / Non-Food Hygiene Items
</option>

<option value="Non-Food Kitchen Items">
Meeshaalee Nyaataa Hin Taane Ittiin Nyaata Qopheessan / Non-Food Kitchen Items
</option>

<option value="Non-Food Building/Construction Items">
Meeshaa Ijaarsa Manaaf Oolu / Non-Food Building/Construction Items
</option>

</select>

</div>


<div class="form-group">

<label>
Cost Price
</label>

<input
type="number"
id="costPrice"
min="0"
step="0.01"
placeholder="0">

</div>


<div class="form-group">

<label>
Selling Price
</label>

<input
type="number"
id="sellingPrice"
min="0"
step="0.01"
placeholder="0">

</div>


<div class="form-group">

<label>
Expiry Date
</label>

<input
type="date"
id="expiryDate">

</div>


</div>


<button
id="saveButton"
class="save"
onclick="saveItem()">

💾 Save New Item

</button>


<button
id="cancelButton"
class="cancel hidden"
onclick="cancelEdit()">

Cancel Edit

</button>

</div>


<!-- SUMMARY -->

<div class="summary">

<div class="card">
<h3>Total Items</h3>
<strong id="totalItems">0</strong>
</div>

<div class="card">
<h3>Total Quantity</h3>
<strong id="totalQuantity">0</strong>
</div>

<div class="card">
<h3>Total Stock Value</h3>
<strong id="totalValue">0</strong>
</div>

</div>


<!-- TABLE -->

<div class="table-title">

📦 Item Register

<span id="tableBranch"></span>

</div>


<div class="table-box">

<table>

<thead>

<tr>

<th>No</th>
<th>ID</th>
<th>Item Name</th>
<th>Unit</th>
<th>Category</th>
<th>Quantity</th>
<th>Cost Price</th>
<th>Selling Price</th>
<th>Expiry Date</th>
<th>Branch</th>
<th>Created</th>
<th>Action</th>

</tr>

</thead>


<tbody id="itemsTable">

<tr>

<td colspan="12"
style="text-align:center;padding:25px">

Loading...

</td>

</tr>

</tbody>

</table>

</div>


</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://sslabegtsxlkafuygmar.supabase.co";

const SUPABASE_KEY =
"sb_publishable_M6oxZjm6xF5NbrXkSO9JqA_7JGSucXq";


/* =====================================================
   BRANCH
===================================================== */

const branchId =
localStorage.getItem("selected_branch_id");

const branchName =
localStorage.getItem("selected_branch_name") ||
"Main";


/* =====================================================
   GLOBAL
===================================================== */

let allItems = [];

let editingId = null;


/* =====================================================
   ELEMENTS
===================================================== */

const branchTitle =
document.getElementById("branchTitle");

const tableBranch =
document.getElementById("tableBranch");

const itemsTable =
document.getElementById("itemsTable");


/* =====================================================
   SECURITY
===================================================== */

function escapeHTML(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =====================================================
   HEADERS
===================================================== */

function getHeaders(){

return {

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer " + SUPABASE_KEY,

"Content-Type":
"application/json"

};

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(text,type){

const box =
document.getElementById("message");

box.textContent = text;

box.className =
"message " + type;

setTimeout(()=>{

box.className = "message";

},5000);

}


/* =====================================================
   BRANCH DISPLAY
===================================================== */

function showBranch(){

branchTitle.textContent =
"🏢 Branch: " + branchName;

tableBranch.textContent =
" — " + branchName;

}


/* =====================================================
   LOAD ITEMS
===================================================== */

async function loadItems(){

itemsTable.innerHTML = `

<tr>
<td colspan="12"
style="text-align:center;padding:25px">
⏳ Items loading...
</td>
</tr>

`;


try{

let url =
SUPABASE_URL +
"/rest/v1/items?select=*";


/*
  Main:
  branch 12 hundaa

  Branch:
  branch sana qofa
*/

if(
branchId &&
branchName !== "Main"
){

url +=
"&branch_id=eq." +
encodeURIComponent(branchId);

}


url += "&order=id.asc";


const response =
await fetch(
url,
{
method:"GET",
headers:getHeaders()
}
);


if(!response.ok){

const error =
await response.text();

console.error(error);

itemsTable.innerHTML = `

<tr>
<td colspan="12"
style="text-align:center;padding:25px;color:#991b1b">

❌ Items loading error

</td>
</tr>

`;

showMessage(
"Items dubbisuun hin milkoofne.",
"error"
);

return;

}


allItems =
await response.json();


renderItems();


}catch(error){

console.error(error);

showMessage(
"❌ Network error.",
"error"
);

}

}


/* =====================================================
   RENDER ITEMS
===================================================== */

function renderItems(){

itemsTable.innerHTML = "";

let totalQuantity = 0;

let totalValue = 0;


if(allItems.length === 0){

itemsTable.innerHTML = `

<tr>

<td colspan="12"
style="text-align:center;padding:30px">

📦 Item haaraan hin galmoofne.

</td>

</tr>

`;

}


allItems.forEach(
(item,index)=>{

const quantity =
Number(item.quantity || 0);

const cost =
Number(item.cost_price || 0);

totalQuantity += quantity;

totalValue +=
quantity * cost;


const row =
document.createElement("tr");


row.innerHTML = `

<td>
${index + 1}
</td>

<td>
<span class="badge">
${escapeHTML(item.id)}
</span>
</td>

<td>
<strong>
${escapeHTML(item.name)}
</strong>
</td>

<td>
${escapeHTML(item.unit || "")}
</td>

<td>
${escapeHTML(item.category || "")}
</td>

<td>
${quantity}
</td>

<td>
${cost.toLocaleString()}
</td>

<td>
${Number(
item.selling_price || 0
).toLocaleString()}
</td>

<td>
${escapeHTML(
item.expiry_date || "—"
)}
</td>

<td>
${escapeHTML(
item.branch_name ||
branchName
)}
</td>

<td>
${escapeHTML(
formatDate(item.created_at)
)}
</td>

<td>

<button
class="edit-btn"
onclick="editItem('${escapeHTML(item.id)}')">

✏️ Edit

</button>

<button
class="delete-btn"
onclick="deleteItem('${escapeHTML(item.id)}')">

🗑️ Delete

</button>

</td>

`;

itemsTable.appendChild(row);

});


document.getElementById(
"totalItems"
).textContent =
allItems.length;


document.getElementById(
"totalQuantity"
).textContent =
totalQuantity.toLocaleString();


document.getElementById(
"totalValue"
).textContent =
totalValue.toLocaleString();

}


/* =====================================================
   SAVE ITEM
===================================================== */

async function saveItem(){

const name =
document.getElementById(
"itemName"
).value.trim();


const unit =
document.getElementById(
"itemUnit"
).value;


const category =
document.getElementById(
"itemCategory"
).value;


const costPrice =
Number(
document.getElementById(
"costPrice"
).value || 0
);


const sellingPrice =
Number(
document.getElementById(
"sellingPrice"
).value || 0
);


const expiryDate =
document.getElementById(
"expiryDate"
).value;


if(!name){

showMessage(
"❌ Item Name galchi.",
"error"
);

return;

}


if(!unit){

showMessage(
"❌ Unit filadhu.",
"error"
);

return;

}


if(!category){

showMessage(
"❌ Category filadhu.",
"error"
);

return;

}


/*
  Branch ID dirqama.
*/

if(!branchId){

showMessage(
"❌ Branch ID hin jiru. Gara Login deebi'ii Branch filadhu.",
"error"
);

return;

}


/* ===================================================
   NEW ITEM
=================================================== */

const data = {

name:name,

unit:unit,

category:category,

cost_price:costPrice,

selling_price:sellingPrice,

expiry_date:
expiryDate || null,

branch_id:branchId

};


/* ===================================================
   EDIT
=================================================== */

if(editingId){

try{

const response =
await fetch(

SUPABASE_URL +
"/rest/v1/items" +
"?id=eq." +
encodeURIComponent(editingId),

{

method:"PATCH",

headers:{
...getHeaders(),
"Prefer":
"return=representation"
},

body:
JSON.stringify(data)

}

);


if(!response.ok){

const error =
await response.text();

console.error(error);

showMessage(
"❌ Item sirreessuun hin milkoofne: " +
error,
"error"
);

return;

}


showMessage(
"✅ Item sirriitti sirreeffame.",
"success"
);


cancelEdit();

await loadItems();

return;


}catch(error){

console.error(error);

showMessage(
"❌ Network error.",
"error"
);

return;

}

}


/* ===================================================
   INSERT NEW ITEM
=================================================== */

try{

const response =
await fetch(

SUPABASE_URL +
"/rest/v1/items",

{

method:"POST",

headers:{
...getHeaders(),
"Prefer":
"return=representation"
},

body:
JSON.stringify(data)

}

);


if(!response.ok){

const error =
await response.text();

console.error(error);

showMessage(
"❌ Item galmeessuun hin milkoofne: " +
error,
"error"
);

return;

}


showMessage(
"✅ Item haaraan sirriitti galmaa'e.",
"success"
);


clearForm();

await loadItems();


}catch(error){

console.error(error);

showMessage(
"❌ Network error.",
"error"
);

}

}


/* =====================================================
   EDIT ITEM
===================================================== */

function editItem(id){

const item =
allItems.find(
x => String(x.id) === String(id)
);


if(!item){

showMessage(
"❌ Item hin argamne.",
"error"
);

return;

}


editingId =
item.id;


document.getElementById(
"formTitle"
).textContent =
"✏️ Edit Item";


document.getElementById(
"itemName"
).value =
item.name || "";


document.getElementById(
"itemUnit"
).value =
item.unit || "";


document.getElementById(
"itemCategory"
).value =
item.category || "";


document.getElementById(
"costPrice"
).value =
item.cost_price || 0;


document.getElementById(
"sellingPrice"
).value =
item.selling_price || 0;


document.getElementById(
"expiryDate"
).value =
item.expiry_date || "";


document.getElementById(
"saveButton"
).textContent =
"💾 Save Changes";


document.getElementById(
"cancelButton"
).classList.remove(
"hidden"
);


window.scrollTo({
top:0,
behavior:"smooth"
});

}


/* =====================================================
   CANCEL EDIT
===================================================== */

function cancelEdit(){

editingId = null;


document.getElementById(
"formTitle"
).textContent =
"➕ Add New Item";


document.getElementById(
"saveButton"
).textContent =
"💾 Save New Item";


document.getElementById(
"cancelButton"
).classList.add(
"hidden"
);


clearForm();

}


/* =====================================================
   CLEAR FORM
===================================================== */

function clearForm(){

document.getElementById(
"itemName"
).value = "";


document.getElementById(
"itemUnit"
).value = "";


document.getElementById(
"itemCategory"
).value = "";


document.getElementById(
"costPrice"
).value = "";


document.getElementById(
"sellingPrice"
).value = "";


document.getElementById(
"expiryDate"
).value = "";

}


/* =====================================================
   DELETE
===================================================== */

async function deleteItem(id){

const item =
allItems.find(
x => String(x.id) === String(id)
);


if(!item)
return;


const yes =
confirm(
"Item kana haquu? \n\n" +
item.name
);


if(!yes)
return;


try{

const response =
await fetch(

SUPABASE_URL +
"/rest/v1/items" +
"?id=eq." +
encodeURIComponent(id),

{

method:"DELETE",

headers:getHeaders()

}

);


if(!response.ok){

const error =
await response.text();

console.error(error);

showMessage(
"❌ Item haqamuu hin dandeenye: " +
error,
"error"
);

return;

}


showMessage(
"✅ Item haqameera.",
"success"
);


await loadItems();


}catch(error){

console.error(error);

showMessage(
"❌ Network error.",
"error"
);

}

}


/* =====================================================
   DATE
===================================================== */

function formatDate(value){

if(!value)
return "—";


const date =
new Date(value);


if(
isNaN(
date.getTime()
)
)
return value;


return date.toLocaleString();

}


/* =====================================================
   BACK
===================================================== */

function goBack(){

window.location.href =
"dashboard.html";

}


/* =====================================================
   START
===================================================== */

showBranch();

loadItems();

</script>

</body>
</html>
