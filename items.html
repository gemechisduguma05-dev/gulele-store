<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>AAFDRMC - Items</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f1f5f9;
}

header {
  background: #1e3a8a;
  color: white;
  padding: 20px;
  text-align: center;
}

header h1 {
  margin: 0;
}

header p {
  margin: 5px 0 0;
}

nav {
  background: white;
  padding: 12px;
  display: flex;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

nav a {
  text-decoration: none;
  padding: 10px 15px;
  border-radius: 7px;
  background: #e2e8f0;
  color: #1e293b;
  font-weight: bold;
}

nav a:hover {
  background: #cbd5e1;
}

.container {
  width: 95%;
  max-width: 1400px;
  margin: 25px auto;
}

.box {
  background: white;
  padding: 20px;
  margin-bottom: 20px;
  border-radius: 12px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.1);
}

.box h2 {
  margin-top: 0;
  text-align: center;
}

input,
select {
  width: 100%;
  padding: 12px;
  margin-bottom: 12px;
  border: 1px solid #cbd5e1;
  border-radius: 7px;
  font-size: 15px;
}

.box > button {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 7px;
  background: #16a34a;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

.box > button:hover {
  background: #15803d;
}

.table-container {
  width: 100%;
  overflow-x: auto;
}

table {
  width: 100%;
  min-width: 1200px;
  border-collapse: collapse;
}

th {
  background: #1e3a8a;
  color: white;
  padding: 11px;
  text-align: center;
}

td {
  padding: 10px;
  border-bottom: 1px solid #ddd;
  text-align: center;
}

tbody tr:nth-child(even) {
  background: #f1f5f9;
}

tbody tr:nth-child(odd) {
  background: white;
}

tbody tr:hover {
  background: #dbeafe;
}

.action {
  display: flex;
  gap: 5px;
  justify-content: center;
  flex-wrap: wrap;
}

.action button {
  border: none;
  padding: 7px 9px;
  border-radius: 5px;
  cursor: pointer;
}

.action .edit {
  background: #2563eb;
  color: white;
}

.action .del {
  background: #991b1b;
  color: white;
}

.logout {
  background: #dc2626 !important;
  color: white !important;
}

.success {
  color: #15803d;
  font-weight: bold;
}

</style>

</head>

<body>

<header>

<h1>🏢 AAFDRMC</h1>

<p>Stock Management System</p>

</header>


<nav>

<a href="dashboard.html">
🏠 Dashboard
</a>

<a href="items.html">
📦 Items
</a>

<a href="stock.html">
🔄 Stock In / Out
</a>

<a href="reports.html">
📊 Reports
</a>

<a href="settings.html">
⚙️ Settings
</a>

<a href="#"
class="logout"
onclick="logoutUser()">
🚪 Logout
</a>

</nav>


<div class="container">


<!-- =========================
     ADD ITEM
========================= -->

<div class="box">

<h2>➕ Add New Item</h2>


<input
id="name"
placeholder="Item name"
>


<select id="category">

<option value="">
-- Select Category --
</option>

</select>


<select id="unit">

<option value="">
-- Select Unit / Safartuu --
</option>

<option value="Qtl">
Quintal (Qtl)
</option>

<option value="Kg">
Kilogram (Kg)
</option>

<option value="Carton">
Carton
</option>

<option value="Bag">
Bag
</option>

<option value="Liter">
Liter
</option>

<option value="Piece">
Piece
</option>

<option value="Box">
Box
</option>

<option value="Set">
Set
</option>

</select>


<input
id="quantity"
type="number"
step="0.01"
min="0"
placeholder="Quantity"
>


<input
id="cost"
type="number"
step="0.01"
min="0"
placeholder="Cost Price"
>


<input
id="selling"
type="number"
step="0.01"
min="0"
placeholder="Selling Price"
>


<label>
<strong>EX Date</strong>
</label>

<input
id="expiryDate"
type="date"
>


<button onclick="addItem()">

➕ Add Item

</button>

</div>



<!-- =========================
     ITEMS TABLE
========================= -->

<div class="box">

<h2>📦 Stock Items</h2>


<input
id="search"
placeholder="🔎 Search item or category..."
oninput="loadItems()"
>


<div class="table-container">

<table>

<thead>

<tr>

<th>Item</th>

<th>Category</th>

<th>Unit</th>

<th>Quantity</th>

<th>Cost</th>

<th>Selling</th>

<th>EX Date</th>

<th>Entered By</th>

<th>Date Entered</th>

<th>Action</th>

</tr>

</thead>


<tbody id="itemList">

</tbody>

</table>

</div>

</div>

</div>



<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://sslabegtsxlkafuygmar.supabase.co";

const SUPABASE_KEY =
"sb_publishable_M6oxZjm6xF5NbrXkSO9JqA_7JGSucXq";


/* =========================
   LOGIN CHECK
========================= */

const accessToken =
localStorage.getItem("access_token");

if (!accessToken) {

  window.location.href =
  "index.html";

}


const token =
localStorage.getItem("access_token")
|| SUPABASE_KEY;


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value) {

  return String(value ?? "")

    .replace(/&/g, "&amp;")

    .replace(/</g, "&lt;")

    .replace(/>/g, "&gt;")

    .replace(/"/g, "&quot;")

    .replace(/'/g, "&#039;");

}


/* =========================
   LOAD CATEGORIES
========================= */

async function loadCategories() {

  const categorySelect =
    document.getElementById("category");


  try {

    const response =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/store_categories?select=id,name&order=name.asc",

        {
          headers: {

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " + token

          }

        }

      );


    if (!response.ok) {

      console.log(
        "Category load error:",
        await response.text()
      );

      return;

    }


    const categories =
      await response.json();


    categorySelect.innerHTML = `

      <option value="">
        -- Select Category --
      </option>

    `;


    categories.forEach(category => {

      const option =
        document.createElement("option");


      option.value =
        category.id;


      option.textContent =
        category.name;


      categorySelect.appendChild(
        option
      );

    });


  } catch (error) {

    console.log(
      "Category error:",
      error
    );

  }

}


/* =========================
   LOAD EXPIRY DATES
   FROM STOCK TRANSACTIONS
========================= */

async function loadExpiryDates() {

  try {

    const response =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/stock_transactions?select=id,item_id,expiry_date&order=id.desc",

        {

          headers: {

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " + token

          }

        }

      );


    if (!response.ok) {

      console.log(
        "Expiry load error:",
        await response.text()
      );

      return {};

    }


    const transactions =
      await response.json();


    const expiryMap = {};


    transactions.forEach(transaction => {

      if (
        transaction.item_id &&
        !(transaction.item_id in expiryMap)
      ) {

        expiryMap[
          transaction.item_id
        ] =
          transaction.expiry_date || "";

      }

    });


    return expiryMap;


  } catch (error) {

    console.log(
      "Expiry error:",
      error
    );

    return {};

  }

}


/* =========================
   LOAD ITEMS
========================= */

async function loadItems() {

  try {

    const response =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/items?select=*&order=id.desc",

        {

          headers: {

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " + token

          }

        }

      );


    if (!response.ok) {

      console.log(
        "Load error:",
        await response.text()
      );

      return;

    }


    const data =
      await response.json();


    const expiryMap =
      await loadExpiryDates();


    const search =
      document.getElementById(
        "search"
      )
      .value
      .toLowerCase()
      .trim();


    const list =
      document.getElementById(
        "itemList"
      );


    list.innerHTML = "";


    data

    .filter(item =>

      String(item.name || "")
      .toLowerCase()
      .includes(search)

      ||

      String(item.category || "")
      .toLowerCase()
      .includes(search)

    )

    .forEach(item => {


      const expiryDate =
        expiryMap[item.id] || "";


      list.innerHTML += `

        <tr>

          <td>
            ${escapeHTML(item.name || "")}
          </td>

          <td>
            ${escapeHTML(item.category || "")}
          </td>

          <td>
            ${escapeHTML(item.unit || "")}
          </td>

          <td>
            ${item.quantity ?? 0}
          </td>

          <td>
            ${item.cost_price ?? 0}
          </td>

          <td>
            ${item.selling_price ?? 0}
          </td>

          <td>
            ${escapeHTML(expiryDate)}
          </td>

          <td>
            ${escapeHTML(item.entered_by || "")}
          </td>

          <td>

            ${
              item.created_at
              ? new Date(
                  item.created_at
                ).toLocaleDateString()
              : ""
            }

          </td>

          <td>

            <div class="action">

              <button
                class="edit"
                onclick="editItem(${item.id})">

                ✏️ Edit

              </button>


              <button
                class="del"
                onclick="deleteItem(${item.id})">

                🗑️ Delete

              </button>

            </div>

          </td>

        </tr>

      `;

    });


  } catch (error) {

    console.log(
      "Items load error:",
      error
    );

  }

}


/* =========================
   ADD ITEM
========================= */

async function addItem() {


  const name =
    document.getElementById(
      "name"
    ).value.trim();


  const categorySelect =
    document.getElementById(
      "category"
    );


  const categoryId =
    categorySelect.value;


  const categoryName =
    categorySelect.options[
      categorySelect.selectedIndex
    ]?.text || "";


  const unit =
    document.getElementById(
      "unit"
    ).value;


  const quantity =
    Number(
      document.getElementById(
        "quantity"
      ).value
    );


  const cost =
    Number(
      document.getElementById(
        "cost"
      ).value
    );


  const selling =
    Number(
      document.getElementById(
        "selling"
      ).value
    );


  const expiryDate =
    document.getElementById(
      "expiryDate"
    ).value;


  /* =========================
     VALIDATION
  ========================= */

  if (!name) {

    alert(
      "Maqaa Item galchi."
    );

    return;

  }


  if (!categoryId) {

    alert(
      "Category tokko filadhu."
    );

    return;

  }


  if (!unit) {

    alert(
      "Safartuu / Unit filadhu."
    );

    return;

  }


  if (
    isNaN(quantity) ||
    quantity < 0
  ) {

    alert(
      "Quantity sirrii galchi."
    );

    return;

  }


  const enteredBy =
    prompt(
      "Maqaa nama galche:"
    );


  if (!enteredBy ||
      !enteredBy.trim()) {

    alert(
      "Maqaa nama galche galchi."
    );

    return;

  }


  /* =========================
     SAVE ITEM
     
     NOTE:
     expiry_date hin ergu.
     Sababni isaa items table
     keessatti column sun hin jiru.
  ========================= */

  const item = {

    name:
      name,

    category_id:
      categoryId,

    category:
      categoryName,

    unit:
      unit,

    quantity:
      quantity,

    cost_price:
      cost,

    selling_price:
      selling,

    entered_by:
      enteredBy.trim()

  };


  try {


    /* =========================
       1. SAVE ITEM
    ========================= */

    const itemResponse =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/items",

        {

          method: "POST",

          headers: {

            "Content-Type":
              "application/json",

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " + token,

            "Prefer":
              "return=representation"

          },

          body:
            JSON.stringify(item)

        }

      );


    if (!itemResponse.ok) {

      const error =
        await itemResponse.text();


      alert(
        "❌ Item Add Error:\n" +
        error
      );

      return;

    }


    const savedItems =
      await itemResponse.json();


    if (
      !savedItems ||
      !savedItems.length
    ) {

      alert(
        "❌ Item save ta'e, garuu ID hin argamne."
      );

      return;

    }


    const savedItem =
      savedItems[0];


    /* =========================
       2. SAVE STOCK IN
    ========================= */

    const stockTransaction = {

      item_id:
        savedItem.id,

      transaction_type:
        "IN",

      quantity:
        quantity,

      entered_by:
        enteredBy.trim(),

      expiry_date:
        expiryDate || null,

      category:
        categoryName

    };


    const stockResponse =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/stock_transactions",

        {

          method: "POST",

          headers: {

            "Content-Type":
              "application/json",

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " + token,

            "Prefer":
              "return=minimal"

          },

          body:
            JSON.stringify(
              stockTransaction
            )

        }

      );


    if (!stockResponse.ok) {

      const stockError =
        await stockResponse.text();


      /*
        Item duraan save ta'eera.
        Stock transaction qofa yoo
        fail ta'e, item hin haqnu.
      */

      alert(
        "⚠️ Item save ta'eera.\n\n" +
        "Garuu Stock IN save hin taane.\n\n" +
        stockError
      );

      loadItems();

      return;

    }


    /* =========================
       SUCCESS
    ========================= */

    alert(
      "✅ Item fi Stock IN sirriitti galmaa'aniiru!"
    );


    /* CLEAR FORM */

    document.getElementById(
      "name"
    ).value = "";


    document.getElementById(
      "category"
    ).value = "";


    document.getElementById(
      "unit"
    ).value = "";


    document.getElementById(
      "quantity"
    ).value = "";


    document.getElementById(
      "cost"
    ).value = "";


    document.getElementById(
      "selling"
    ).value = "";


    document.getElementById(
      "expiryDate"
    ).value = "";


    await loadItems();


  } catch (error) {

    console.log(
      "Add item error:",
      error
    );

    alert(
      "❌ Connection Error:\n" +
      error.message
    );

  }

}


/* =========================
   EDIT ITEM
========================= */

async function editItem(id) {


  try {


    const response =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/items?id=eq." +
        id +
        "&select=*",

        {

          headers: {

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " + token

          }

        }

      );


    if (!response.ok) {

      alert(
        "Item load failed."
      );

      return;

    }


    const items =
      await response.json();


    if (!items.length) {

      alert(
        "Item hin argamne."
      );

      return;

    }


    const item =
      items[0];


    const newName =
      prompt(
        "Item Name:",
        item.name || ""
      );


    if (newName === null)
      return;


    const newCategory =
      prompt(
        "Category:",
        item.category || ""
      );


    if (newCategory === null)
      return;


    const newUnit =
      prompt(
        "Unit / Safartuu:",
        item.unit || ""
      );


    if (newUnit === null)
      return;


    const newQuantity =
      prompt(
        "Quantity:",
        item.quantity ?? 0
      );


    if (newQuantity === null)
      return;


    const newCost =
      prompt(
        "Cost Price:",
        item.cost_price ?? 0
      );


    if (newCost === null)
      return;


    const newSelling =
      prompt(
        "Selling Price:",
        item.selling_price ?? 0
      );


    if (newSelling === null)
      return;


    const updateData = {

      name:
        newName.trim(),

      category:
        newCategory.trim(),

      unit:
        newUnit.trim(),

      quantity:
        Number(newQuantity),

      cost_price:
        Number(newCost),

      selling_price:
        Number(newSelling)

    };


    const updateResponse =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/items?id=eq." +
        id,

        {

          method: "PATCH",

          headers: {

            "Content-Type":
              "application/json",

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " + token,

            "Prefer":
              "return=minimal"

          },

          body:
            JSON.stringify(
              updateData
            )

        }

      );


    if (updateResponse.ok) {

      alert(
        "✅ Item updated successfully!"
      );

      loadItems();

    } else {

      alert(
        "❌ Edit Error:\n" +
        await updateResponse.text()
      );

    }


  } catch (error) {

    alert(
      "❌ Edit Error:\n" +
      error.message
    );

  }

}


/* =========================
   DELETE ITEM
========================= */

async function deleteItem(id) {


  if (
    !confirm(
      "Item kana fi Stock Transaction isaa hunda haquu barbaaddaa?"
    )
  ) {

    return;

  }


  try {


    /* =========================
       1. DELETE STOCK TRANSACTIONS
    ========================= */

    const stockResponse =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/stock_transactions?item_id=eq." +
        id,

        {

          method: "DELETE",

          headers: {

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " + token,

            "Prefer":
              "return=minimal"

          }

        }

      );


    if (!stockResponse.ok) {

      const error =
        await stockResponse.text();


      alert(
        "❌ Stock transaction haquu hin dandeenye:\n" +
        error
      );

      return;

    }


    /* =========================
       2. DELETE ITEM
    ========================= */

    const itemResponse =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/items?id=eq." +
        id,

        {

          method: "DELETE",

          headers: {

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " + token,

            "Prefer":
              "return=minimal"

          }

        }

      );


    if (!itemResponse.ok) {

      const error =
        await itemResponse.text();


      alert(
        "❌ Item Delete Error:\n" +
        error
      );

      return;

    }


    alert(
      "✅ Item fi Stock Transaction haqamanii jiru."
    );


    loadItems();


  } catch (error) {

    alert(
      "❌ Delete Error:\n" +
      error.message
    );

  }

}


/* =========================
   LOGOUT
========================= */

function logoutUser() {

  localStorage.removeItem(
    "access_token"
  );

  localStorage.removeItem(
    "refresh_token"
  );

  window.location.href =
    "index.html";

}


/* =========================
   START
========================= */

loadCategories();

loadItems();

</script>

</body>
</html>
