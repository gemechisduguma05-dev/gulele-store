<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>AAFDRMC - Items</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f1f5f9;
  color:#1e293b;
}

header{
  background:#1e3a8a;
  color:white;
  padding:18px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:23px;
}

.container{
  width:96%;
  max-width:1400px;
  margin:20px auto;
}

.top-bar{
  background:white;
  padding:18px;
  border-radius:12px;
  margin-bottom:18px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.title{
  font-size:23px;
  font-weight:bold;
  color:#1e3a8a;
}

.branch-box{
  margin-top:12px;
  padding:13px;
  border-radius:8px;
  background:#eff6ff;
  border:1px solid #bfdbfe;
  color:#1e3a8a;
  font-weight:bold;
}

.buttons{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:14px;
}

.btn{
  border:0;
  padding:11px 17px;
  border-radius:8px;
  cursor:pointer;
  color:white;
  font-weight:bold;
  font-size:15px;
}

.btn-add{
  background:#15803d;
}

.btn-back{
  background:#64748b;
}

.form-box{
  display:none;
  background:white;
  padding:20px;
  border-radius:12px;
  margin-bottom:18px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.form-box.show{
  display:block;
}

.form-title{
  color:#1e3a8a;
  font-size:20px;
  font-weight:bold;
  margin-bottom:15px;
}

.form-grid{
  display:grid;
  grid-template-columns:
  repeat(auto-fit,minmax(230px,1fr));
  gap:14px;
}

.form-group{
  display:flex;
  flex-direction:column;
}

.form-group label{
  font-weight:bold;
  margin-bottom:7px;
}

.form-group input,
.form-group select{
  padding:12px;
  border:1px solid #cbd5e1;
  border-radius:8px;
  font-size:15px;
}

.form-buttons{
  display:flex;
  gap:10px;
  margin-top:18px;
}

.save-btn,
.cancel-btn{
  border:0;
  padding:11px 20px;
  border-radius:8px;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.save-btn{
  background:#15803d;
}

.cancel-btn{
  background:#64748b;
}

.message{
  display:none;
  padding:13px;
  border-radius:8px;
  margin-bottom:15px;
  font-weight:bold;
}

.message.success{
  display:block;
  background:#dcfce7;
  color:#166534;
}

.message.error{
  display:block;
  background:#fee2e2;
  color:#991b1b;
}

.message.info{
  display:block;
  background:#dbeafe;
  color:#1e40af;
}

.table-box{
  background:white;
  border-radius:12px;
  overflow-x:auto;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:1000px;
}

th{
  background:#1e3a8a;
  color:white;
  padding:13px;
  text-align:left;
}

td{
  padding:12px;
  border-bottom:1px solid #e2e8f0;
}

tr:hover{
  background:#f8fafc;
}

.edit-btn{
  background:#2563eb;
  color:white;
  border:0;
  padding:7px 11px;
  border-radius:6px;
  cursor:pointer;
  margin-right:5px;
}

.delete-btn{
  background:#dc2626;
  color:white;
  border:0;
  padding:7px 11px;
  border-radius:6px;
  cursor:pointer;
}

.category-text{
  font-size:13px;
  line-height:1.5;
}

.empty,
.loading{
  text-align:center;
  padding:25px;
  color:#64748b;
}

.main-control{
  background:#fef3c7;
  border:1px solid #f59e0b;
  color:#92400e;
  padding:12px;
  border-radius:8px;
  margin-top:12px;
  font-weight:bold;
}

@media(max-width:600px){

  .buttons{
    flex-direction:column;
  }

  .btn{
    width:100%;
  }

  .form-buttons{
    flex-direction:column;
  }

  .save-btn,
  .cancel-btn{
    width:100%;
  }

}

</style>

</head>

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://sslabegtsxlkafuygmar.supabase.co";

const SUPABASE_KEY =
"sb_publishable_M6oxZjm6xF5NbrXkSO9JqA_7JGSucXq";


/* =====================================================
   BRANCH 12
===================================================== */

const BRANCHES = [

"Gulele",
"Addis Katama",
"Kolfee",
"Nifas Silk Lafto",
"Kirkos",
"Lami Kura",
"Arada",
"Lideta",
"Bole",
"Ekaa",
"Akaki Kality",
"Center"

];


/* =====================================================
   GLOBAL
===================================================== */

let allItems = [];

let allBranches = [];

let editItemId = null;


/* =====================================================
   CURRENT BRANCH
===================================================== */

const selectedBranch =
localStorage.getItem(
  "selected_branch_name"
) || "";


const isMain =
selectedBranch === "Main";


/* =====================================================
   SHOW BRANCH
===================================================== */

const branchBox =
document.getElementById(
  "branchBox"
);


if(isMain){

  branchBox.textContent =
    "👑 Branch: MAIN - Head Office";

  document.getElementById(
    "mainControl"
  ).style.display =
    "block";

}else if(selectedBranch){

  branchBox.textContent =
    "📍 Branch: " +
    selectedBranch;

}else{

  branchBox.textContent =
    "⚠️ Branch hin filatamne";

}


/* =====================================================
   HEADERS
===================================================== */

function getHeaders(){

  const accessToken =
    localStorage.getItem(
      "access_token"
    );


  const headers = {

    "apikey":
      SUPABASE_KEY,

    "Content-Type":
      "application/json"

  };


  /*
   IMPORTANT:

   Publishable key JWT miti.

   Kanaaf akka:
   Authorization:
   Bearer sb_publishable...

   hin erginu.

   Yoo access_token JWT dhugaa jiraate
   qofa fayyadamna.
  */

  if(accessToken){

    const parts =
      accessToken.split(".");

    if(parts.length === 3){

      headers[
        "Authorization"
      ] =
        "Bearer " +
        accessToken;

    }

  }


  return headers;

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

  return String(
    value ?? ""
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
  text,
  type
){

  const message =
    document.getElementById(
      "message"
    );


  message.textContent =
    text;


  message.className =
    "message " +
    type;

}


/* =====================================================
   LOAD BRANCHES
===================================================== */

async function loadBranches(){

  try{

    const response =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/branches" +
        "?select=id,branch_code,branch_name" +
        "&order=branch_code.asc",

        {

          method:"GET",

          headers:
            getHeaders()

        }

      );


    if(!response.ok){

      console.error(
        await response.text()
      );

      return;

    }


    allBranches =
      await response.json();


    const select =
      document.getElementById(
        "itemBranch"
      );


    select.innerHTML =
      '<option value="">-- Select Branch --</option>';


    /*
      Main irraa branch filachuu danda'a.
      Branch tokko yoo seene, branch isaa
      ofumaan filatama.
    */

    allBranches.forEach(
      branch => {

        const option =
          document.createElement(
            "option"
          );


        option.value =
          branch.id;


        option.textContent =
          (
            branch.branch_code
            ? branch.branch_code + " - "
            : ""
          ) +
          (
            branch.branch_name || ""
          );


        select.appendChild(
          option
        );

      }

    );

  }

  catch(error){

    console.error(
      "Branch loading error:",
      error
    );

  }

}


/* =====================================================
   FIND BRANCH ID
===================================================== */

function getSelectedBranchId(){

  if(!selectedBranch){
    return null;
  }


  const branch =
    allBranches.find(

      b =>
        String(
          b.branch_name
        ).trim().toLowerCase()
        ===
        String(
          selectedBranch
        ).trim().toLowerCase()

    );


  if(branch){

    return branch.id;

  }


  return null;

}


/* =====================================================
   LOAD ITEMS
===================================================== */

async function loadItems(){

  const table =
    document.getElementById(
      "itemsTable"
    );


  table.innerHTML = `

    <tr>

      <td
      colspan="6"
      class="loading">

      ⏳ Items loading...

      </td>

    </tr>

  `;


  try{

    let url =
      SUPABASE_URL +
      "/rest/v1/items" +
      "?select=id,name,unit,category,branch_id" +
      "&order=id.asc";


    /*
      MAIN = Branch 12 hunda

      Branch = kan ofii isaa qofa
    */

    if(!isMain){

      const branchId =
        getSelectedBranchId();


      if(!branchId){

        table.innerHTML = `

          <tr>

            <td
            colspan="6"
            class="empty">

            ❌ Branch ID argachuu hin dandeenye.

            </td>

          </tr>

        `;

        showMessage(
          "❌ Branch ID argachuu hin dandeenye. Supabase branches table ilaali.",
          "error"
        );

        return;

      }


      url +=
        "&branch_id=eq." +
        encodeURIComponent(
          branchId
        );

    }


    const response =
      await fetch(

        url,

        {

          method:"GET",

          headers:
            getHeaders()

        }

      );


    if(!response.ok){

      const error =
        await response.text();


      console.error(
        "Load Items Error:",
        error
      );


      if(
        error.includes(
          "JWT expired"
        )
      ){

        handleExpiredSession();

        return;

      }


      table.innerHTML = `

        <tr>

          <td
          colspan="6"
          class="empty">

          ❌ Items load hin milkoofne.

          </td>

        </tr>

      `;


      showMessage(
        "❌ Items load hin milkoofne: " +
        error,
        "error"
      );


      return;

    }


    allItems =
      await response.json();


    displayItems();

  }

  catch(error){

    console.error(
      error
    );


    table.innerHTML = `

      <tr>

        <td
        colspan="6"
        class="empty">

        ❌ Network error.

        </td>

      </tr>

    `;


    showMessage(
      "❌ Network error.",
      "error"
    );

  }

}


/* =====================================================
   GET BRANCH NAME
===================================================== */

function getBranchName(
  branchId
){

  const branch =
    allBranches.find(

      b =>
        String(b.id) ===
        String(branchId)

    );


  if(branch){

    return (
      branch.branch_name || ""
    );

  }


  return "Unknown";

}


/* =====================================================
   DISPLAY ITEMS
===================================================== */

function displayItems(){

  const table =
    document.getElementById(
      "itemsTable"
    );


  table.innerHTML = "";


  if(
    allItems.length === 0
  ){

    table.innerHTML = `

      <tr>

        <td
        colspan="6"
        class="empty">

        📦 Item hin jiru.

        </td>

      </tr>

    `;

    return;

  }


  allItems.forEach(
    (item,index)=>{

      const category =
        item.category ||
        "—";


      const branchName =
        getBranchName(
          item.branch_id
        );


      const row =
        document.createElement(
          "tr"
        );


      row.innerHTML = `

        <td>
          ${index + 1}
        </td>


        <td>

          <strong>

            ${escapeHTML(
              item.name
            )}

          </strong>

        </td>


        <td>

          ${escapeHTML(
            item.unit
          )}

        </td>


        <td
        class="category-text">

          ${escapeHTML(
            category
          )}

        </td>


        <td>

          ${escapeHTML(
            branchName
          )}

        </td>


        <td>

          <button
          class="edit-btn"
          onclick="editItem('${String(item.id)}')">

          ✏️ Edit

          </button>


          <button
          class="delete-btn"
          onclick="deleteItem('${String(item.id)}')">

          🗑️ Delete

          </button>

        </td>

      `;


      table.appendChild(
        row
      );

    }

  );

}


/* =====================================================
   OPEN ADD FORM
===================================================== */

function openAddForm(){

  editItemId = null;


  document.getElementById(
    "formTitle"
  ).textContent =
    "➕ Add New Item";


  document.getElementById(
    "saveButton"
  ).textContent =
    "💾 Save Item";


  document.getElementById(
    "itemName"
  ).value = "";


  document.getElementById(
    "itemUnit"
  ).value = "";


  document.getElementById(
    "itemCategory"
  ).value = "";


  const branchGroup =
    document.getElementById(
      "branchGroup"
    );


  const branchSelect =
    document.getElementById(
      "itemBranch"
    );


  if(isMain){

    branchGroup.style.display =
      "flex";

    branchSelect.value =
      "";

  }else{

    branchGroup.style.display =
      "none";

  }


  document.getElementById(
    "itemForm"
  ).classList.add(
    "show"
  );


  window.scrollTo({

    top:0,

    behavior:"smooth"

  });

}


/* =====================================================
   CLOSE FORM
===================================================== */

function closeForm(){

  editItemId = null;


  document.getElementById(
    "itemForm"
  ).classList.remove(
    "show"
  );

}


/* =====================================================
   SAVE ITEM
===================================================== */

async function saveItem(){

  const name =
    document.getElementById(
      "itemName"
    ).value.trim();


  const unit =
    document.getElementById(
      "itemUnit"
    ).value;


  const category =
    document.getElementById(
      "itemCategory"
    ).value;


  if(!name){

    showMessage(
      "❌ Item maqaa galchi.",
      "error"
    );

    return;

  }


  if(!unit){

    showMessage(
      "❌ Unit filadhu.",
      "error"
    );

    return;

  }


  if(!category){

    showMessage(
      "❌ Category filadhu.",
      "error"
    );

    return;

  }


  /* ===================================================
     BRANCH ID
  =================================================== */

  let branchId =
    null;


  if(isMain){

    branchId =
      document.getElementById(
        "itemBranch"
      ).value;


    if(!branchId){

      showMessage(
        "❌ Main irraa item galchuuf Branch filadhu.",
        "error"
      );

      return;

    }

  }else{

    branchId =
      getSelectedBranchId();


    if(!branchId){

      showMessage(
        "❌ Branch ID hin argamne.",
        "error"
      );

      return;

    }

  }


  const data = {

    name:name,

    unit:unit,

    category:category,

    branch_id:branchId

  };


  const saveButton =
    document.getElementById(
      "saveButton"
    );


  saveButton.disabled =
    true;


  saveButton.textContent =
    "⏳ Saving...";


  try{

    let response;


    /* =================================================
       ADD
    ================================================= */

    if(
      editItemId === null
    ){

      response =
        await fetch(

          SUPABASE_URL +
          "/rest/v1/items",

          {

            method:"POST",

            headers:{

              ...getHeaders(),

              "Prefer":
                "return=representation"

            },

            body:
              JSON.stringify(
                data
              )

          }

        );

    }


    /* =================================================
       EDIT
    ================================================= */

    else{

      response =
        await fetch(

          SUPABASE_URL +
          "/rest/v1/items?id=eq." +
          encodeURIComponent(
            editItemId
          ),

          {

            method:"PATCH",

            headers:{

              ...getHeaders(),

              "Prefer":
                "return=representation"

            },

            body:
              JSON.stringify(
                data
              )

          }

        );

    }


    if(!response.ok){

      const error =
        await response.text();


      console.error(
        "Save Error:",
        error
      );


      if(
        error.includes(
          "JWT expired"
        )
      ){

        handleExpiredSession();

        return;

      }


      showMessage(
        "❌ Save/Edit hin milkoofne: " +
        error,
        "error"
      );

      return;

    }


    if(
      editItemId === null
    ){

      showMessage(
        "✅ Item haaraan galmaa'e.",
        "success"
      );

    }else{

      showMessage(
        "✅ Item sirreeffame.",
        "success"
      );

    }


    closeForm();


    await loadItems();

  }

  catch(error){

    console.error(
      error
    );


    showMessage(
      "❌ Network error.",
      "error"
    );

  }

  finally{

    saveButton.disabled =
      false;


    saveButton.textContent =
      editItemId === null
        ? "💾 Save Item"
        : "💾 Update Item";

  }

}


/* =====================================================
   EDIT ITEM
===================================================== */

function editItem(id){

  const item =
    allItems.find(

      i =>
        String(i.id) ===
        String(id)

    );


  if(!item){

    showMessage(
      "❌ Item hin argamne.",
      "error"
    );

    return;

  }


  editItemId =
    id;


  document.getElementById(
    "formTitle"
  ).textContent =
    "✏️ Edit Item";


  document.getElementById(
    "saveButton"
  ).textContent =
    "💾 Update Item";


  document.getElementById(
    "itemName"
  ).value =
    item.name || "";


  document.getElementById(
    "itemUnit"
  ).value =
    item.unit || "";


  document.getElementById(
    "itemCategory"
  ).value =
    item.category || "";


  const branchGroup =
    document.getElementById(
      "branchGroup"
    );


  if(isMain){

    branchGroup.style.display =
      "flex";


    document.getElementById(
      "itemBranch"
    ).value =
      item.branch_id || "";

  }else{

    branchGroup.style.display =
      "none";

  }


  document.getElementById(
    "itemForm"
  ).classList.add(
    "show"
  );


  window.scrollTo({

    top:0,

    behavior:"smooth"

  });

}


/* =====================================================
   DELETE ITEM
===================================================== */

async function deleteItem(id){

  const item =
    allItems.find(

      i =>
        String(i.id) ===
        String(id)

    );


  if(!item){

    showMessage(
      "❌ Item hin argamne.",
      "error"
    );

    return;

  }


  const confirmDelete =
    confirm(

      "Item kana haquu barbaaddaa?\n\n" +
      item.name

    );


  if(!confirmDelete){

    return;

  }


  try{

    const response =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/items?id=eq." +
        encodeURIComponent(
          id
        ),

        {

          method:"DELETE",

          headers:
            getHeaders()

        }

      );


    if(!response.ok){

      const error =
        await response.text();


      console.error(
        error
      );


      if(
        error.includes(
          "JWT expired"
        )
      ){

        handleExpiredSession();

        return;

      }


      showMessage(
        "❌ Item haquun hin milkoofne: " +
        error,
        "error"
      );

      return;

    }


    showMessage(
      "✅ Item haqameera.",
      "success"
    );


    await loadItems();

  }

  catch(error){

    console.error(
      error
    );


    showMessage(
      "❌ Network error.",
      "error"
    );

  }

}


/* =====================================================
   EXPIRED SESSION
===================================================== */

function handleExpiredSession(){

  localStorage.removeItem(
    "access_token"
  );

  localStorage.removeItem(
    "refresh_token"
  );

  localStorage.removeItem(
    "is_logged_in"
  );

  showMessage(
    "🔐 Login session expired. Irra deebi'ii login godhi.",
    "error"
  );


  setTimeout(
    function(){

      window.location.href =
        "index.html";

    },
    1500
  );

}


/* =====================================================
   BACK
===================================================== */

function goBack(){

  window.location.href =
    "dashboard.html";

}


/* =====================================================
   START
===================================================== */

async function start(){

  /*
    Login check
  */

  if(
    localStorage.getItem(
      "is_logged_in"
    ) !== "true"
  ){

    window.location.href =
      "index.html";

    return;

  }


  await loadBranches();

  await loadItems();

}


start();

</script>
