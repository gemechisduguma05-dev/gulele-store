<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f1f5f9;
  color:#1e293b;
}

/* ================= HEADER ================= */

.header{
  background:#6b3f1d;
  color:white;
  padding:15px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:10px;
}

.header-left{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo{
  width:45px;
  height:45px;
  border-radius:50%;
  background:white;
  color:#6b3f1d;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  font-size:18px;
}

.title{
  font-size:21px;
  font-weight:bold;
}

.branch-badge{
  background:#8b5a2b;
  padding:8px 14px;
  border-radius:20px;
  font-size:14px;
}

.header-right{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

button{
  border:none;
  cursor:pointer;
  border-radius:6px;
  padding:10px 15px;
  font-size:14px;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.btn-dashboard{
  background:white;
  color:#6b3f1d;
}

.btn-refresh{
  background:#8b5a2b;
  color:white;
}

/* ================= CONTAINER ================= */

.container{
  max-width:1250px;
  margin:20px auto;
  padding:0 15px;
}

/* ================= MESSAGE ================= */

#message{
  margin-bottom:15px;
  padding:12px;
  border-radius:6px;
  display:none;
}

.success{
  background:#dcfce7;
  color:#166534;
}

.error{
  background:#fee2e2;
  color:#991b1b;
}

.info{
  background:#dbeafe;
  color:#1e40af;
}

/* ================= CARDS ================= */

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
  gap:15px;
  margin-bottom:20px;
}

.card{
  background:white;
  border-radius:10px;
  padding:20px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.card h3{
  margin:0 0 8px;
  color:#64748b;
  font-size:14px;
}

.card .number{
  font-size:28px;
  font-weight:bold;
  color:#6b3f1d;
}

/* ================= FORM CARD ================= */

.form-card{
  background:white;
  padding:20px;
  border-radius:10px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
  margin-bottom:20px;
}

.form-title{
  margin:0 0 18px;
  color:#6b3f1d;
  font-size:20px;
  border-bottom:2px solid #ead9ca;
  padding-bottom:10px;
}

.section-title{
  margin:25px 0 15px;
  color:#6b3f1d;
  font-size:18px;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:15px;
}

.form-group{
  display:flex;
  flex-direction:column;
}

.form-group.full{
  grid-column:1/-1;
}

.form-group label{
  margin-bottom:6px;
  font-weight:bold;
  font-size:14px;
}

.form-group input,
.form-group select,
.form-group textarea{
  padding:11px;
  border:1px solid #cbd5e1;
  border-radius:6px;
  font-size:14px;
  width:100%;
  background:white;
}

.form-group textarea{
  min-height:85px;
  resize:vertical;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus{
  outline:none;
  border-color:#8b5a2b;
}

/* ================= BUTTONS ================= */

.form-actions{
  margin-top:18px;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.btn-save{
  background:#6b3f1d;
  color:white;
}

.btn-add{
  background:#2563eb;
  color:white;
}

.btn-remove{
  background:#dc2626;
  color:white;
}

.btn-secondary{
  background:#64748b;
  color:white;
}

.btn-purple{

/* ================= MEMBERS ================= */

.member-box{

  padding:15px;
  margin-bottom:12px;
  background:#fffaf6;

}

.member-header{

  align-items:center;

}

.member-title{

/* ================= RELIEF ================= */

/* ================= DOCUMENTS ================= */

.search-grid{

.search-grid input,

/* ================= HOUSEHOLDS ================= */

.household-name{

.household-meta{

.household-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.btn-view{
  background:#7b1fa2;
  color:white;

/* ================= MODAL ================= */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:15px;
  z-index:9999;
}

.modal-content{
  background:white;
  width:100%;
  max-width:1000px;
  max-height:90vh;
  overflow:auto;
  border-radius:10px;
  padding:20px;
}

.modal-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:15px;
}

.modal-header h2{
  margin:0;
  color:#6b3f1d;

.close-btn{

/* ================= DETAIL ================= */

.detail-section{
  margin-top:18px;
  padding:15px;
  border:1px solid #e2e8f0;

.detail-section h3{

.detail-table{

.detail-table th,

.detail-table th{

.table-scroll{

/* ================= LOADING ================= */

.loading{

  padding:20px;
  color:#64748b;
}

.hidden{

/* ================= MOBILE ================= */

@media(max-width:600px){

  }

  .household-actions{

  }

}

/* =========================================================

let selectedBranchUUID = null;

const branchCode =

const userRole =

/* =========================================================
   HEADERS
========================================================= */

function getHeaders(){

  return {

    "apikey":SUPABASE_KEY,

    "Authorization":
      "Bearer " + SUPABASE_KEY,

    "Content-Type":
      "application/json",

    "Accept":
      "application/json"

  };

}


/* =========================================================
   FETCH TIMEOUT
========================================================= */

async function fetchWithTimeout(
  url,
  options = {},
  timeout = 20000
){

  const controller =
    new AbortController();

  const timer =
    setTimeout(
      () => controller.abort(),
      timeout
    );

  try{

    return await fetch(
      url,
      {
        ...options,
        signal:controller.signal
      }
    );

  }finally{

    clearTimeout(timer);

  }

}


/* =========================================================
   LOGIN
========================================================= */

function checkLogin(){

  if(!loggedIn){

    window.location.href =
      "index.html";

    return false;

  }

  return true;

}


/* =========================================================
   UUID
========================================================= */

function isValidUUID(value){

  if(!value){
    return false;
  }

  return /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(value);

}


/* =========================================================
   FIND BRANCH UUID
========================================================= */

function findBranchUUID(){

  if(
    userRole === "main" ||
    branchCode.toUpperCase() === "MAIN"
  ){

    selectedBranchUUID =
      BRANCHES[0].uuid;

    return selectedBranchUUID;

  }


  const cachedUUID =
    localStorage.getItem(
      "selected_branch_uuid"
    );


  if(isValidUUID(cachedUUID)){

    const found =
      BRANCHES.find(
        b =>
          b.uuid.toLowerCase()
          === cachedUUID.toLowerCase()
      );

    if(found){

      selectedBranchUUID =
        found.uuid;

      localStorage.setItem(
        "selected_branch_id",
        found.uuid
      );

      localStorage.setItem(
        "selected_branch_uuid",
        found.uuid
      );

      localStorage.setItem(
        "selected_branch_code",
        found.code
      );

      localStorage.setItem(
        "selected_branch_name",
        found.name
      );

      return selectedBranchUUID;

    }

  }


  if(branchCode){

    const found =
      BRANCHES.find(
        b =>
          b.code.toUpperCase()
          === branchCode.toUpperCase()
      );

    if(found){

      selectedBranchUUID =
        found.uuid;

      return selectedBranchUUID;

    }

  }


  if(branchName){

    const found =
      BRANCHES.find(
        b =>
          b.name.toLowerCase()
          === branchName.toLowerCase()
      );

    if(found){

      selectedBranchUUID =
        found.uuid;

      return selectedBranchUUID;

    }

  }


  return null;

}


/* =========================================================
   BRANCH BADGE
========================================================= */

function setBranchBadge(){

  const badge =
    document.getElementById(
      "branchBadge"
    );

  const uuid =
    findBranchUUID();

  if(
    userRole === "main" ||
    branchCode.toUpperCase() === "MAIN"
  ){

    badge.textContent =
      "Main - Headquarters";

    return;

  }

  if(uuid){

    const branch =
      BRANCHES.find(
        b => b.uuid === uuid
      );

    if(branch){

      badge.textContent =
        branch.name +
        " (" +
        branch.code +
        ")";

      return;

    }

  }

  badge.textContent =
    branchName ||
    "Branch";

}


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(
  text,
  type = "error"
){

  const box =
    document.getElementById(
      "message"
    );

  box.textContent =
    text;

  box.className =
    "";

  box.id =
    "message";

  box.classList.add(type);

  box.style.display =
    "block";

  setTimeout(

/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

/* =========================================================
   ITEM CHANGED
========================================================= */

function reliefItemChanged(select){

  const row =
    select.closest(
      ".relief-item"
    );

  const item =
    allItems.find(
      x =>
        String(x.id)
        === String(select.value)
    );


  if(!item){

    row.querySelector(
      ".relief-category"
    ).value = "";

    row.querySelector(
      ".relief-unit"
    ).value = "";

    row.querySelector(
      ".relief-current-stock"
    ).value = "";

    row.querySelector(
      ".stock-info"
    ).textContent =
      "Select an item to view current stock.";

    return;

  }


  row.querySelector(
    ".relief-category"
  ).value =
    getEnglishCategory(
      item.category
    );


  row.querySelector(
    ".relief-unit"
  ).value =
    item.unit || "";


  const stock =
    Number(
      stockMap[String(item.id)] || 0
    );


  row.querySelector(
    ".relief-current-stock"
  ).value =
    formatNumber(stock) +
    " " +
    (item.unit || "");


  row.querySelector(
    ".stock-info"
  ).textContent =
    stock > 0
      ? "Available stock: " +
        formatNumber(stock) +
        " " +
        (item.unit || "")
      : "Current stock is 0.";


  checkReliefQuantity(
    row.querySelector(
      ".relief-quantity"
    )
  );

}


/* =========================================================
   CHECK QUANTITY
========================================================= */

function checkReliefQuantity(input){

  const row =
    input.closest(
      ".relief-item"
    );

  if(!row){
    return true;
  }

  const itemId =
    row.querySelector(
      ".relief-item-select"
    ).value;

  const info =
    row.querySelector(
      ".stock-info"
    );

  if(!itemId){
    return false;
  }

  const requested =
    Number(input.value || 0);

  const available =
    Number(
      stockMap[String(itemId)] || 0
    );


  if(
    requested > available
  ){

    info.textContent =
      "Insufficient stock. Available: " +
      formatNumber(available);

    info.classList.add(
      "stock-warning"
    );

    return false;

  }


  info.textContent =
    "Available stock: " +
    formatNumber(available);

  info.classList.remove(
    "stock-warning"
  );

  return true;

}


/* =========================================================
   GET CURRENT DATETIME LOCAL
========================================================= */

function getCurrentDateTimeLocal(){

  const now =
    new Date();

  const offset =
    now.getTimezoneOffset();

  const local =
    new Date(
      now.getTime()
      - offset * 60000
    );

  return local
    .toISOString()
    .slice(0,16);

}

/* =========================================================
   LOAD ITEMS
========================================================= */

async function loadItems(){

  const branchUUID =
    findBranchUUID();


  if(
    userRole !== "main" &&
    !branchUUID
  ){

    throw new Error(
      "Branch UUID hin argamne. Login irra deebi'i."
    );

  }


  let url =
    SUPABASE_URL +
    "/rest/v1/items?select=id,name,category,unit,branch_id";


  if(userRole !== "main"){

    url +=
      "&branch_id=eq." +
      encodeURIComponent(
        branchUUID
      );

  }


  url +=
    "&order=name.asc";


  const response =
    await fetchWithTimeout(
      url,
      {
        method:"GET",
        headers:getHeaders()
      }
    );


  const text =
    await response.text();


  if(!response.ok){

    throw new Error(
      "Items loading failed: " +
      text
    );

  }


  allItems =
    text
      ? JSON.parse(text)
      : [];


  if(!Array.isArray(allItems)){
    allItems = [];
  }

}


/* =========================================================
   LOAD STOCK
========================================================= */

async function loadStock(){

  stockMap = {};


  const branchUUID =
    findBranchUUID();


  let url =
    SUPABASE_URL +
    "/rest/v1/stock_transactions" +
    "?select=item_id,transaction_type,quantity";


  if(userRole !== "main"){

    url +=
      "&branch_id=eq." +
      encodeURIComponent(
        branchUUID
      );

  }


  const response =
    await fetchWithTimeout(
      url,
      {
        method:"GET",
        headers:getHeaders()
      }
    );


  const text =
    await response.text();


  if(!response.ok){

    throw new Error(
      "Stock loading failed: " +
      text
    );

  }


  const rows =
    text
      ? JSON.parse(text)
      : [];


  if(!Array.isArray(rows)){
    return;
  }


  rows.forEach(row => {

    if(row.item_id == null){
      return;
    }

    const key =
      String(row.item_id);

    const quantity =
      Number(
        row.quantity || 0
      );


    if(!stockMap[key]){
      stockMap[key] = 0;
    }


    const type =
      String(
        row.transaction_type || ""
      )
      .toUpperCase();


    if(type === "IN"){

      stockMap[key] +=
        quantity;

    }else if(type === "OUT"){

      stockMap[key] -=
        quantity;

    }

  });


  Object.keys(stockMap).forEach(
    key => {

      if(stockMap[key] < 0){

        stockMap[key] = 0;

      }

    }
  );

}

/* =========================================================
   SAVE HOUSEHOLD
========================================================= */

async function saveHousehold(){

  if(
    userRole === "main" ||
    branchCode.toUpperCase() === "MAIN"
  ){

    showMessage(
      "Main is view-only. Household registration is not allowed.",
      "error"
    );

    return;

  }


  const branchUUID =
    findBranchUUID();


  if(!branchUUID){

    showMessage(
      "Branch UUID hin argamne. Login irra deebi'i.",
      "error"
    );

    return;

  }


  const householdName =
    document.getElementById(
      "householdName"
    ).value.trim();


  const disasterType =
    document.getElementById(
      "disasterType"
    ).value;


  if(!householdName){

    showMessage(
      "Household Representative / Household Name galchi.",
      "error"
    );

    return;

  }


  if(!disasterType){

    showMessage(
      "Disaster Type filadhu.",
      "error"
    );

    return;

  }


  const memberBoxes =
    [
      ...document.querySelectorAll(
        ".member-box"
      )
    ];


  if(!memberBoxes.length){

    showMessage(
      "At least one family member galchi.",
      "error"
    );

    return;

  }


  const members =
    [];


  for(
    const box of memberBoxes
  ){

    const fullName =
      box.querySelector(
        ".member-full-name"
      ).value.trim();

    const relationship =
      box.querySelector(
        ".member-relationship"
      ).value;

    const sex =
      box.querySelector(
        ".member-sex"
      ).value;

    const ageValue =
      box.querySelector(
        ".member-age"
      ).value;

    const otherInformation =
      box.querySelector(
        ".member-other"
      ).value.trim();


    if(!fullName){

      showMessage(
        "Every family member must have Full Name.",
        "error"
      );

      return;

    }


    if(!relationship){

      showMessage(
        "Relationship filadhu.",
        "error"
      );

      return;

    }


    members.push({

      full_name:
        fullName,

      relationship:
        relationship,

      sex:
        sex || null,

      age:
        ageValue === ""
          ? null
          : Number(ageValue),

      other_information:
        otherInformation || null,

      box:
        box

    });

  }


  const button =
    document.getElementById(
      "saveHouseholdButton"
    );


  button.disabled =
    true;

  button.textContent =
    "Saving...";


  try{

    /* ==========================================
       1. HOUSEHOLD
    ========================================== */

    const householdPayload = {

      branch_id:
        branchUUID,

      branch_code:
        branchCode,

      household_name:
        householdName,

      disaster_type:
        disasterType,

      disaster_date:
        document.getElementById(
          "disasterDate"
        ).value || null,

      city:
        document.getElementById(
          "city"
        ).value.trim() || null,

      sub_city:
        document.getElementById(
          "subCity"
        ).value.trim() || null,

      woreda:
        document.getElementById(
          "woreda"
        ).value.trim() || null,

      specific_location:
        document.getElementById(
          "specificLocation"
        ).value.trim() || null,

      house_number:
        document.getElementById(
          "houseNumber"
        ).value.trim() || null,

      fan_number:
        document.getElementById(
          "fanNumber"
        ).value.trim() || null,

      other_information:
        document.getElementById(
          "householdOther"
        ).value.trim() || null

    };


    const householdResponse =
      await fetchWithTimeout(

        SUPABASE_URL +
        "/rest/v1/emergency_households",

        {

          method:"POST",

          headers:{
            ...getHeaders(),
            "Prefer":
              "return=representation"
          },

          body:
            JSON.stringify(
              householdPayload
            )

        }

      );


    const householdText =
      await householdResponse.text();


    if(!householdResponse.ok){

      throw new Error(
        "Household save failed: " +
        householdText
      );

    }


    const householdRows =
      JSON.parse(
        householdText
      );


    const household =
      householdRows[0];


    if(!household || !household.id){

      throw new Error(
        "Household ID hin argamne."
      );

    }


    /* ==========================================
       2. MEMBERS
    ========================================== */

    const memberPayload =
      members.map(
        member => ({

          household_id:
            household.id,

          full_name:
            member.full_name,

          relationship:
            member.relationship,

          sex:
            member.sex,

          age:
            member.age,

          other_information:
            member.other_information

        })
      );


    const memberResponse =
      await fetchWithTimeout(

        SUPABASE_URL +
        "/rest/v1/emergency_members",

        {

          method:"POST",

          headers:{
            ...getHeaders(),
            "Prefer":
              "return=representation"
          },

          body:
            JSON.stringify(
              memberPayload
            )

        }

      );


    const memberText =
      await memberResponse.text();


    if(!memberResponse.ok){

      throw new Error(
        "Members save failed: " +
        memberText
      );

    }


    const savedMembers =
      JSON.parse(
        memberText
      );


    if(
      !Array.isArray(savedMembers) ||
      savedMembers.length !== members.length
    ){

      throw new Error(
        "Members save response sirrii miti."
      );

    }


    /* ==========================================
       3. RELIEF + STOCK OUT
    ========================================== */

    for(
      let i = 0;
      i < members.length;
      i++
    ){

      const member =
        members[i];

      const savedMember =
        savedMembers[i];


      const reliefBox =
        member.box.querySelector(
          ".relief-box"
        );


      /*
        Relief is optional at member level.
        If no relief was added, continue.
      */

      if(!reliefBox){
        continue;
      }


      const model22 =
        reliefBox.querySelector(
          ".relief-model-22"
        ).value;


      const model22Number =
        reliefBox.querySelector(
          ".relief-model-22-number"
        ).value.trim();


      if(!model22){

        throw new Error(
          "Model 22 filadhu for member: " +
          member.full_name
        );

      }


      if(
        model22 ===
        "Model 22 Available" &&
        !model22Number
      ){

        throw new Error(
          "Model 22 Number galchi for member: " +
          member.full_name
        );

      }


      const itemRows =
        [
          ...reliefBox.querySelectorAll(
            ".relief-item"
          )
        ];


      if(!itemRows.length){

        throw new Error(
          "At least one relief item galchi for member: " +
          member.full_name
        );

      }


      const reliefItems =
        [];


      for(
        const row of itemRows
      ){

        const itemId =
          row.querySelector(
            ".relief-item-select"
          ).value;


        const quantity =
          Number(
            row.querySelector(
              ".relief-quantity"
            ).value
          );


        if(!itemId){

          throw new Error(
            "Relief Item filadhu for member: " +
            member.full_name
          );

        }


        if(
          !quantity ||
          quantity <= 0
        ){

          throw new Error(
            "Relief quantity sirrii miti for member: " +
            member.full_name
          );

        }


        const available =
          Number(
            stockMap[
              String(itemId)
            ] || 0
          );


        if(
          quantity > available
        ){

          const item =
            allItems.find(
              x =>
                String(x.id)
                === String(itemId)
            );


          throw new Error(
            "Insufficient stock for " +
            (item?.name || "item") +
            ". Available: " +
            formatNumber(available)
          );

        }


        reliefItems.push({

          item_id:
            Number(itemId),

          quantity:
            quantity

        });

      }


      /* =====================================
         CALL DATABASE FUNCTION
      ===================================== */

      const rpcPayload = {

        p_household_id:
          household.id,

        p_member_id:
          savedMember.id,

        p_relief_date:
          reliefBox.querySelector(
            ".relief-date"
          ).value
            ? new Date(
                reliefBox.querySelector(
                  ".relief-date"
                ).value
              ).toISOString()
            : new Date().toISOString(),

        p_issued_by:
          reliefBox.querySelector(
            ".relief-issued-by"
          ).value.trim() || null,

        p_signature:
          reliefBox.querySelector(
            ".relief-signature"
          ).value.trim() || null,

        p_model_22:
          model22,

        p_model_22_number:
          model22Number || null,

        p_other_information:
          reliefBox.querySelector(
            ".relief-other"
          ).value.trim() || null,

        p_items:
          reliefItems

      };


      const rpcResponse =
        await fetchWithTimeout(

          SUPABASE_URL +
          "/rest/v1/rpc/save_emergency_relief",

          {

            method:"POST",

            headers:getHeaders(),

            body:
              JSON.stringify(
                rpcPayload
              )

          }

        );


      const rpcText =
        await rpcResponse.text();


      if(!rpcResponse.ok){

        throw new Error(
          "Relief / Stock OUT save failed: " +
          rpcText
        );

      }

    }


    /* ==========================================
       4. DOCUMENTS
    ========================================== */

    const documentBoxes =
      [
        ...document.querySelectorAll(
          ".document-box"
        )
      ];


    for(
      const box of documentBoxes
    ){

      const fileInput =
        box.querySelector(
          ".document-file"
        );


      /*
        Current database fields support
        document metadata and file URL.
        Actual Storage upload is handled
        separately after bucket setup.
      */

      const documentPayload = {

        household_id:
          household.id,

        document_number:
          box.querySelector(
            ".document-number"
          ).value.trim() || null,

        document_date:
          box.querySelector(
            ".document-date"
          ).value || null,

        document_name:
          box.querySelector(
            ".document-name"
          ).value.trim() || null,

        file_name:
          fileInput.files.length
            ? fileInput.files[0].name
            : null,

        file_url:
          null,

        other_information:
          box.querySelector(
            ".document-other"
          ).value.trim() || null

      };


      const documentResponse =
        await fetchWithTimeout(

          SUPABASE_URL +
          "/rest/v1/emergency_documents",

          {

            method:"POST",

            headers:{
              ...getHeaders(),
              "Prefer":
                "return=representation"
            },

            body:
              JSON.stringify(
                documentPayload
              )

          }

        );


      const documentText =
        await documentResponse.text();


      if(!documentResponse.ok){

        throw new Error(
          "Document save failed: " +
          documentText
        );

      }

    }


    showMessage(
      "Emergency Relief Household successfully saved. Relief Stock OUT was created automatically.",
      "success"
    );


    clearHouseholdForm();

    await loadHouseholds();

    await loadStock();


  }catch(error){

    console.error(
      "saveHousehold error:",
      error
    );


    showMessage(
      error.name === "AbortError"
        ? "Request yeroo dheeraa fudhate."
        : error.message,
      "error"
    );

  }finally{

    button.disabled =
      false;

    button.textContent =
      "Save Household";

  }

}


/* =========================================================
   LOAD HOUSEHOLDS
========================================================= */

async function loadHouseholds(){

  const loading =
    document.getElementById(
      "householdsLoading"
    );


  loading.classList.remove(
    "hidden"
  );


  try{

    const branchUUID =
      findBranchUUID();


    let url =
      SUPABASE_URL +
      "/rest/v1/emergency_households" +
      "?select=*" ;


    if(userRole !== "main"){

      url +=
        "&branch_id=eq." +
        encodeURIComponent(
          branchUUID
        );

    }


    url +=
      "&order=created_at.desc";


    const response =
      await fetchWithTimeout(

        url,

        {
          method:"GET",
          headers:getHeaders()
        }

      );


    const text =
      await response.text();


    if(!response.ok){

      throw new Error(
        "Households loading failed: " +
        text
      );

    }


    allHouseholds =
      text
        ? JSON.parse(text)
        : [];


    if(!Array.isArray(allHouseholds)){
      allHouseholds = [];
    }


    await attachHouseholdMembers();


    filteredHouseholds =
      [...allHouseholds];


    renderHouseholds();

    updateSummary();


  }catch(error){

    console.error(
      error
    );


    showMessage(
      error.message,
      "error"
    );


  }finally{

    loading.classList.add(
      "hidden"
    );

  }

}


/* =========================================================
   ATTACH MEMBERS
========================================================= */

async function attachHouseholdMembers(){

  if(!allHouseholds.length){
    return;
  }


  const ids =
    allHouseholds
      .map(h => h.id)
      .filter(Boolean);


  const inValue =
    ids.join(",");


  const response =
    await fetchWithTimeout(

      SUPABASE_URL +
      "/rest/v1/emergency_members" +
      "?select=*" +
      "&household_id=in.(" +
      encodeURIComponent(
        inValue
      ) +
      ")",

      {
        method:"GET",
        headers:getHeaders()
      }

    );


  const text =
    await response.text();


  if(!response.ok){

    throw new Error(
      "Members loading failed: " +
      text
    );

  }


  const members =
    text
      ? JSON.parse(text)
      : [];


  allHouseholds.forEach(
    household => {

      household.members =
        members.filter(
          member =>
            String(
              member.household_id
            )
            === String(
              household.id
            )
        );

    }
  );

}

/* =========================================================
   FILTER
========================================================= */

function filterHouseholds(){

  const search =
    document.getElementById(
      "searchInput"
    ).value
      .trim()
      .toLowerCase();


  const disaster =
    document.getElementById(
      "filterDisaster"
    ).value;


  const date =
    document.getElementById(
      "filterDate"
    ).value;


  filteredHouseholds =
    allHouseholds.filter(
      household => {

        const members =
          household.members || [];


        const memberMatch =
          members.some(
            member =>
              String(
                member.full_name || ""
              )
              .toLowerCase()
              .includes(search)
          );


        const householdMatch =
          String(
            household.household_name || ""
          )
          .toLowerCase()
          .includes(search);


        const fanMatch =
          String(
            household.fan_number || ""
          )
          .toLowerCase()
          .includes(search);


        const searchMatch =
          !search ||
          householdMatch ||
          memberMatch ||
          fanMatch;


        const disasterMatch =
          !disaster ||
          household.disaster_type
          === disaster;


        const dateMatch =
          !date ||
          household.disaster_date
          === date;


        return (
          searchMatch &&
          disasterMatch &&
          dateMatch
        );

      }
    );


  renderHouseholds();

}

/* =========================================================
   VIEW HOUSEHOLD FOLDER
========================================================= */

async function viewHousehold(id){

  const household =
    allHouseholds.find(
      h =>
        String(h.id)
        === String(id)
    );


  if(!household){
    return;
  }


  const modal =
    document.getElementById(
      "detailModal"
    );


  const content =
    document.getElementById(
      "detailContent"
    );


  document.getElementById(
    "detailTitle"
  ).textContent =
    household.household_name;


  content.innerHTML =
    `<div class="loading">
      Loading household folder...
    </div>`;


  modal.classList.remove(
    "hidden"
  );


  try{

    /* ========================================
       RELIEFS
    ======================================== */

    const reliefResponse =
      await fetchWithTimeout(

        SUPABASE_URL +
        "/rest/v1/emergency_reliefs" +
        "?select=*" +
        "&household_id=eq." +
        encodeURIComponent(id) +
        "&order=relief_date.desc",

        {
          method:"GET",
          headers:getHeaders()
        }

      );


    const reliefText =
      await reliefResponse.text();


    if(!reliefResponse.ok){

      throw new Error(
        "Relief loading failed: " +
        reliefText
      );

    }


    const reliefs =
      reliefText
        ? JSON.parse(reliefText)
        : [];


    /* ========================================
       RELIEF ITEMS
    ======================================== */

    let reliefItems =
      [];


    if(reliefs.length){

      const reliefIds =
        reliefs
          .map(r => r.id)
          .join(",");


      const itemsResponse =
        await fetchWithTimeout(

          SUPABASE_URL +
          "/rest/v1/emergency_relief_items" +
          "?select=*" +
          "&relief_id=in.(" +
          encodeURIComponent(
            reliefIds
          ) +
          ")",

          {
            method:"GET",
            headers:getHeaders()
          }

        );


      const itemsText =
        await itemsResponse.text();


      if(itemsResponse.ok){

        reliefItems =
          itemsText
            ? JSON.parse(itemsText)
            : [];

      }

    }


    /* ========================================
       DOCUMENTS
    ======================================== */

    const documentResponse =
      await fetchWithTimeout(

        SUPABASE_URL +
        "/rest/v1/emergency_documents" +
        "?select=*" +
        "&household_id=eq." +
        encodeURIComponent(id) +
        "&order=created_at.desc",

        {
          method:"GET",
          headers:getHeaders()
        }

      );


    const documentText =
      await documentResponse.text();


    const documents =
      documentResponse.ok
        ? (
            documentText
              ? JSON.parse(documentText)
              : []
          )
        : [];


    renderHouseholdDetail(
      household,
      reliefs,
      reliefItems,
      documents
    );


  }catch(error){

    content.innerHTML = `

      <div class="error"
           style="display:block;padding:12px;border-radius:6px;">

        ${escapeHtml(
          error.message
        )}

      </div>

    `;

  }

}

/* =========================================================
   FORMAT NUMBER
========================================================= */

function formatNumber(value){

  const number =
    Number(value || 0);

  if(
    Number.isInteger(number)
  ){

    return String(number);

  }

  return number.toFixed(2)
    .replace(/\.00$/,"")
    .replace(/(\.\d)0$/,"$1");

}

);
