<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AAFDRMC - Login</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f1f5f9;
  color:#1e293b;
}

header{
  background:#1e3a8a;
  color:white;
  padding:30px 15px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:28px;
}

header p{
  margin:10px 0 0;
  font-size:16px;
}

.container{
  width:94%;
  max-width:600px;
  margin:30px auto;
}

.card{
  background:white;
  border-radius:16px;
  padding:25px;
  box-shadow:0 4px 15px rgba(0,0,0,.08);
  margin-bottom:20px;
}

.title{
  color:#1e3a8a;
  font-size:23px;
  font-weight:bold;
  margin-bottom:20px;
  text-align:center;
}

.form-group{
  margin-bottom:18px;
}

label{
  display:block;
  font-weight:bold;
  margin-bottom:8px;
}

select,
input{
  width:100%;
  padding:14px;
  border:1px solid #cbd5e1;
  border-radius:9px;
  font-size:16px;
  background:white;
}

select:focus,
input:focus{
  outline:none;
  border-color:#1e3a8a;
}

button{
  width:100%;
  padding:15px;
  border:0;
  border-radius:9px;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.login{
  background:#15803d;
}

.login:hover{
  background:#166534;
}

.main{
  background:#1e3a8a;
  margin-top:12px;
}

.message{
  display:none;
  padding:15px;
  border-radius:10px;
  margin-bottom:18px;
  font-weight:bold;
  line-height:1.5;
  white-space:pre-wrap;
  word-break:break-word;
}

.message.show{
  display:block;
}

.error{
  background:#fee2e2;
  color:#991b1b;
}

.success{
  background:#dcfce7;
  color:#166534;
}

.info{
  background:#eff6ff;
  color:#1e40af;
}

.loading{
  text-align:center;
  color:#64748b;
  padding:15px;
}

.branch-info{
  background:#eff6ff;
  border:1px solid #bfdbfe;
  color:#1e40af;
  padding:15px;
  border-radius:10px;
  margin-top:15px;
  font-weight:bold;
  display:none;
}

.branch-info.show{
  display:block;
}

.small{
  text-align:center;
  color:#64748b;
  font-size:14px;
  margin-top:18px;
}

@media(max-width:500px){

  header h1{
    font-size:23px;
  }

  .card{
    padding:18px;
  }

}

</style>

</head>


<body>


<header>

<h1>
AAFDRMC
</h1>

<p>
STOCK MANAGEMENT SYSTEM
</p>

</header>


<div class="container">


<div class="card">

<div class="title">
🔐 Select Branch & Login
</div>


<div id="message" class="message"></div>


<div class="form-group">

<label>
🏢 Branch
</label>

<select id="branchSelect">

<option value="">
⏳ Loading Branches...
</option>

</select>

</div>


<div id="branchInfo" class="branch-info">
</div>


<div class="form-group">

<label>
👤 Email or Branch Code
</label>

<input
id="loginUser"
type="text"
placeholder="Email ykn Code galchi"
autocomplete="off">

</div>


<div class="form-group">

<label>
🔑 Password
</label>

<input
id="password"
type="password"
placeholder="Password galchi">

</div>


<button
id="loginButton"
class="login"
type="button"
onclick="login()">

🔐 Login

</button>


<button
class="main"
type="button"
onclick="goMain()">

🏢 Main Dashboard

</button>


<div class="small">

AAFDRMC - Stock Management System

</div>

</div>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://sslabegtsxlkafuygmar.supabase.co";

const SUPABASE_KEY =
"sb_publishable_M6oxZjm6xF5NbrXkSO9JqA_7JGSucXq";


/* =====================================================
   EXACT BRANCH LIST
===================================================== */

const BRANCHES = [

{
  name:"Main",
  code:"MAIN"
},

{
  name:"Gulele",
  code:"GUL"
},

{
  name:"Addis Katama",
  code:"AKT"
},

{
  name:"Kolfee",
  code:"KLF"
},

{
  name:"Nifas Silk Lafto",
  code:"NSL"
},

{
  name:"Kirkos",
  code:"KIR"
},

{
  name:"Lami Kura",
  code:"LAM"
},

{
  name:"Arada",
  code:"ARA"
},

{
  name:"Lideta",
  code:"LID"
},

{
  name:"Bole",
  code:"BOL"
},

{
  name:"Ekaa",
  code:"EKA"
},

{
  name:"Akaki Kality",
  code:"AKA"
},

{
  name:"Center",
  code:"CTR"
}

];


/* =====================================================
   HEADERS
===================================================== */

function getHeaders(){

return {

  "apikey":
    SUPABASE_KEY,

  "Authorization":
    "Bearer " + SUPABASE_KEY,

  "Content-Type":
    "application/json",

  "Accept":
    "application/json"

};

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(text,type){

const box =
document.getElementById("message");

box.textContent =
text;

box.className =
"message show " + type;

}


/* =====================================================
   LOAD BRANCHES
===================================================== */

async function loadBranches(){

const select =
document.getElementById("branchSelect");


select.innerHTML =
'<option value="">⏳ Loading Branches...</option>';


try{

/*
  IMPORTANT:

  ❌ Hin fayyadamnu:
  branches?name=eq.Gulele

  Sababni isaa:
  branches table keessatti
  "name" column hin jiru.

  Kanaaf:
  branches?select=*
  qofa fudhanna.
*/

const url =
SUPABASE_URL +
"/rest/v1/branches?select=*";


const response =
await fetch(
  url,
  {
    method:"GET",
    headers:getHeaders()
  }
);


const text =
await response.text();


console.log(
  "BRANCH TABLE RESPONSE:",
  response.status,
  text
);


if(!response.ok){

/*
  Yoo branches table irraa dubbisuu
  hin dandeenye, UI branch list
  fixed list irraa guutna.
*/

console.warn(
  "Branches table could not be loaded."
);

fillFixedBranches();

return;

}


let data=[];

try{

data =
JSON.parse(text);

}
catch(error){

console.warn(
  "Branches JSON parse error"
);

fillFixedBranches();

return;

}


/*
=====================================================
DATABASE BRANCHES FOUND
=====================================================
*/

if(
Array.isArray(data) &&
data.length > 0
){

select.innerHTML =
'<option value="">-- Branch filadhu --</option>';


/*
  Column maqaa branch adda addaa
  ta'uu danda'a.

  Fakkeenya:
  name
  branch_name
  branch
  branchName
  title
*/

data.forEach(function(row){

const branchName =
getBranchName(row);

const branchCode =
getBranchCode(row);

if(!branchName)
return;


/*
  Main yoo database keessatti jiraate
  dabaluu dandeenya.
*/

const option =
document.createElement("option");

option.value =
branchName;

option.textContent =
"🏢 " + branchName;

option.dataset.code =
branchCode || "";

option.dataset.id =
row.id || "";

select.appendChild(option);

});


/*
  Yoo database irraa maqaa tokko illee
  hin argamne, fixed list fayyadami.
*/

if(select.options.length <= 1){

fillFixedBranches();

}

return;

}


/*
  Empty database
*/

fillFixedBranches();


}
catch(error){

console.error(
  "LOAD BRANCH ERROR:",
  error
);

fillFixedBranches();

}

}


/* =====================================================
   GET BRANCH NAME FROM ANY POSSIBLE COLUMN
===================================================== */

function getBranchName(row){

const possible = [

row.name,
row.branch_name,
row.branch,
row.branchName,
row.title,
row.branch_title,
row.office_name,
row.office

];


for(let value of possible){

if(
value !== null &&
value !== undefined &&
String(value).trim() !== ""
){

return String(value).trim();

}

}

return "";

}


/* =====================================================
   GET BRANCH CODE
===================================================== */

function getBranchCode(row){

const possible = [

row.code,
row.branch_code,
row.branchCode,
row.office_code

];


for(let value of possible){

if(
value !== null &&
value !== undefined &&
String(value).trim() !== ""
){

return String(value).trim();

}

}

return "";

}


/* =====================================================
   FIXED BRANCH LIST
===================================================== */

function fillFixedBranches(){

const select =
document.getElementById("branchSelect");


select.innerHTML =
'<option value="">-- Branch filadhu --</option>';


BRANCHES.forEach(function(branch){

const option =
document.createElement("option");

option.value =
branch.name;

option.textContent =
"🏢 " + branch.name;

option.dataset.code =
branch.code;

option.dataset.id =
"";

select.appendChild(option);

});

}


/* =====================================================
   BRANCH SELECTED
===================================================== */

document
.getElementById("branchSelect")
.addEventListener(
"change",
function(){

const select =
this;

const option =
select.options[
select.selectedIndex
];


const name =
select.value;

const code =
option.dataset.code || "";

const id =
option.dataset.id || "";


const info =
document.getElementById(
"branchInfo"
);


if(!name){

info.className =
"branch-info";

info.textContent =
"";

return;

}


info.className =
"branch-info show";


info.textContent =
"🏢 Branch: " +
name +
"\n" +
"🔢 Code: " +
(code || "—");


/*
=====================================================
SAVE SELECTED BRANCH
=====================================================
*/

localStorage.setItem(
"selected_branch_name",
name
);


localStorage.setItem(
"selected_branch_code",
code
);


/*
  ID yoo database irraa argame qofa
  localStorage keessatti kaa'i.

  Fixed branch list irraa ID hin uumamu.
*/

if(id){

localStorage.setItem(
"selected_branch_id",
id
);

}
else{

localStorage.removeItem(
"selected_branch_id"
);

}

}
);


/* =====================================================
   LOGIN
===================================================== */

async function login(){

const branchSelect =
document.getElementById(
"branchSelect"
);

const username =
document.getElementById(
"loginUser"
).value.trim();

const password =
document.getElementById(
"password"
).value;


const branchName =
branchSelect.value;


const selectedOption =
branchSelect.options[
branchSelect.selectedIndex
];


const branchCode =
selectedOption
? (selectedOption.dataset.code || "")
: "";


const branchId =
selectedOption
? (selectedOption.dataset.id || "")
: "";


/*
=====================================================
VALIDATION
=====================================================
*/

if(!branchName){

showMessage(
"❌ Mee Branch filadhu.",
"error"
);

return;

}


if(!username){

showMessage(
"❌ Email ykn Branch Code galchi.",
"error"
);

return;

}


if(!password){

showMessage(
"❌ Password galchi.",
"error"
);

return;

}


/*
=====================================================
SAVE BRANCH
=====================================================
*/

localStorage.setItem(
"selected_branch_name",
branchName
);

localStorage.setItem(
"selected_branch_code",
branchCode
);


if(branchId){

localStorage.setItem(
"selected_branch_id",
branchId
);

}


/*
=====================================================
MAIN
=====================================================
*/

if(branchName === "Main"){

localStorage.setItem(
"is_logged_in",
"true"
);

localStorage.setItem(
"user_role",
"main"
);

showMessage(
"✅ Main filatameera. Dashboard keessa seenaa...",
"success"
);

setTimeout(function(){

window.location.href =
"dashboard.html";

},500);

return;

}


/*
=====================================================
BRANCH LOGIN
=====================================================

As keessatti yeroo ammaa:

Email ykn Code =
branch code yoo ta'e
branch login ni eega.

Password immoo
user password jedhamee
localStorage keessatti kaa'ama.

Kun login system kee akka
dashboarditti ce'uuf qophaa'e.

=====================================================
*/


/*
  CODE LOGIN

  Fakkeenya:
  GUL
  AKT
  KLF
  ...
*/

if(
username.toUpperCase() ===
branchCode.toUpperCase()
){

localStorage.setItem(
"is_logged_in",
"true"
);

localStorage.setItem(
"user_role",
"branch"
);

localStorage.setItem(
"login_user",
username
);

showMessage(
"✅ Login milkaa'e.\n🏢 Branch: " +
branchName +
"\n\nDashboard keessa seenaa...",
"success"
);


setTimeout(function(){

window.location.href =
"dashboard.html";

},500);

return;

}


/*
=====================================================
EMAIL LOGIN
=====================================================

Yoo email fayyadamuu barbaadde,
Supabase Auth itti fayyadamna.
=====================================================
*/

try{

const response =
await fetch(
SUPABASE_URL +
"/auth/v1/token?grant_type=password",
{

method:"POST",

headers:{

"apikey":
SUPABASE_KEY,

"Content-Type":
"application/json"

},

body:
JSON.stringify({

email:
username,

password:
password

})

});


const data =
await response.json();


if(!response.ok){

showMessage(

"❌ Login hin milkoofne.\n\n" +
(
data.error_description ||
data.msg ||
"Email ykn password sirrii miti."
),

"error"

);

return;

}


/*
=====================================================
AUTH SUCCESS
=====================================================
*/

if(data.access_token){

localStorage.setItem(
"access_token",
data.access_token
);

}


if(data.refresh_token){

localStorage.setItem(
"refresh_token",
data.refresh_token
);

}


localStorage.setItem(
"is_logged_in",
"true"
);

localStorage.setItem(
"user_role",
"branch"
);

localStorage.setItem(
"login_user",
username
);


showMessage(

"✅ Login milkaa'e.\n🏢 Branch: " +
branchName +
"\n\nDashboard keessa seenaa...",

"success"

);


setTimeout(function(){

window.location.href =
"dashboard.html";

},500);


}
catch(error){

console.error(
"LOGIN ERROR:",
error
);


showMessage(

"❌ Network error.\n\n" +
error.message,

"error"

);

}

}


/* =====================================================
   MAIN DASHBOARD
===================================================== */

function goMain(){

localStorage.setItem(
"selected_branch_name",
"Main"
);

localStorage.setItem(
"selected_branch_code",
"MAIN"
);

localStorage.removeItem(
"selected_branch_id"
);

localStorage.setItem(
"is_logged_in",
"true"
);

localStorage.setItem(
"user_role",
"main"
);


window.location.href =
"dashboard.html";

}


/* =====================================================
   START
===================================================== */

window.addEventListener(
"DOMContentLoaded",
function(){

loadBranches();

});

</script>

</body>
</html>
