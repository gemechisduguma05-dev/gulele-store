<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>AAFDRMC - Items</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f1f5f9;
}

header {
  background: #1e3a8a;
  color: white;
  padding: 20px;
  text-align: center;
}

header h1 {
  margin: 0;
}

header p {
  margin: 5px 0 0;
}

nav {
  background: white;
  padding: 12px;
  display: flex;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

nav a {
  text-decoration: none;
  padding: 10px 15px;
  border-radius: 7px;
  background: #e2e8f0;
  color: #1e293b;
  font-weight: bold;
}

nav a:hover {
  background: #cbd5e1;
}

.container {
  width: 95%;
  max-width: 1400px;
  margin: 25px auto;
}

.box {
  background: white;
  padding: 20px;
  margin-bottom: 20px;
  border-radius: 12px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.1);
}

.box h2 {
  margin-top: 0;
  text-align: center;
}

input,
select {
  width: 100%;
  padding: 12px;
  margin-bottom: 12px;
  border: 1px solid #cbd5e1;
  border-radius: 7px;
  font-size: 15px;
  background: white;
}

.box > button {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 7px;
  background: #16a34a;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

.box > button:hover {
  background: #15803d;
}

.table-container {
  width: 100%;
  overflow-x: auto;
}

table {
  width: 100%;
  min-width: 1100px;
  border-collapse: collapse;
}

th {
  background: #1e3a8a;
  color: white;
  padding: 11px;
  text-align: center;
}

td {
  padding: 10px;
  border-bottom: 1px solid #ddd;
  text-align: center;
}

tbody tr:nth-child(even) {
  background: #f1f5f9;
}

tbody tr:nth-child(odd) {
  background: white;
}

tbody tr:hover {
  background: #dbeafe;
}

.action {
  display: flex;
  gap: 5px;
  justify-content: center;
  flex-wrap: wrap;
}

.action button {
  border: none;
  padding: 7px 9px;
  border-radius: 5px;
  cursor: pointer;
}

.action .edit {
  background: #2563eb;
  color: white;
}

.action .del {
  background: #991b1b;
  color: white;
}

.logout {
  background: #dc2626 !important;
  color: white !important;
}

label {
  display: block;
  font-weight: bold;
  margin-bottom: 6px;
  color: #1e293b;
}

</style>

</head>

<body>


<header>

<h1>🏢 AAFDRMC</h1>

<p>Stock Management System</p>

</header>


<nav>

<a href="dashboard.html">
🏠 Dashboard
</a>

<a href="items.html">
📦 Items
</a>

<a href="stock.html">
🔄 Stock In / Out
</a>

<a href="reports.html">
📊 Reports
</a>

<a href="settings.html">
⚙️ Settings
</a>

<a href="#"
class="logout"
onclick="logoutUser()">
🚪 Logout
</a>

</nav>


<div class="container">


<!-- =========================
     ADD ITEM
========================= -->

<div class="box">

<h2>➕ Add New Item</h2>


<label>
Item Name
</label>

<input
id="name"
placeholder="Item name"
>


<label>
Category
</label>

<select id="category">

<option value="">
-- Select Category --
</option>

</select>


<label>
Unit / Safartuu
</label>

<select id="unit">

<option value="">
-- Select Unit / Safartuu --
</option>

<option value="Qtl">
Quintal (Qtl)
</option>

<option value="Kg">
Kilogram (Kg)
</option>

<option value="Carton">
Carton
</option>

<option value="Bag">
Bag
</option>

<option value="Liter">
Liter
</option>

<option value="Piece">
Piece
</option>

<option value="Box">
Box
</option>

<option value="Set">
Set
</option>

</select>


<label>
Quantity
</label>

<input
id="quantity"
type="number"
step="0.01"
min="0"
placeholder="Quantity"
>


<label>
Cost Price
</label>

<input
id="cost"
type="number"
step="0.01"
min="0"
placeholder="Cost Price"
>


<label>
Selling Price
</label>

<input
id="selling"
type="number"
step="0.01"
min="0"
placeholder="Selling Price"
>


<label>
EX Date
</label>

<input
id="expiryDate"
type="date"
required
>


<button onclick="addItem()">

➕ Add Item

</button>

</div>



<!-- =========================
     ITEMS TABLE
========================= -->

<div class="box">

<h2>📦 Stock Items</h2>


<input
id="search"
placeholder="🔎 Search item or category..."
oninput="loadItems()"
>


<div class="table-container">

<table>

<thead>

<tr>

<th>Item</th>

<th>Category</th>

<th>Unit</th>

<th>Quantity</th>

<th>Cost</th>

<th>Selling</th>

<th>EX Date</th>

<th>Entered By</th>

<th>Date Entered</th>

<th>Action</th>

</tr>

</thead>


<tbody id="itemList">

</tbody>

</table>

</div>

</div>

</div>



<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://sslabegtsxlkafuygmar.supabase.co";

const SUPABASE_KEY =
"sb_publishable_M6oxZjm6xF5NbrXkSO9JqA_7JGSucXq";


/* =========================
   LOGIN CHECK
========================= */

const accessToken =
localStorage.getItem("access_token");

if (!accessToken) {

  window.location.href =
  "index.html";

}


const token =
localStorage.getItem("access_token")
|| SUPABASE_KEY;



/* =========================
   LOAD CATEGORIES
========================= */

async function loadCategories() {

  const categorySelect =
  document.getElementById("category");


  try {

    const response =
    await fetch(

      SUPABASE_URL +
      "/rest/v1/store_categories?select=id,name&order=id.asc",

      {
        method: "GET",

        headers: {

          "apikey":
          SUPABASE_KEY,

          "Authorization":
          "Bearer " + token,

          "Content-Type":
          "application/json"

        }

      }

    );


    if (!response.ok) {

      console.log(
        "Category load error:",
        await response.text()
      );

      categorySelect.innerHTML = `

        <option value="">
          Category load failed
        </option>

      `;

      return;

    }


    const categories =
    await response.json();


    categorySelect.innerHTML = `

      <option value="">
        -- Select Category --
      </option>

    `;


    categories.forEach(category => {

      const option =
      document.createElement("option");


      option.value =
      category.id;


      option.textContent =
      category.name;


      categorySelect.appendChild(
        option
      );

    });


  } catch (error) {

    console.log(
      "Category error:",
      error
    );

  }

}



/* =========================
   LOAD ITEMS
========================= */

async function loadItems() {

  try {

    const response =
    await fetch(

      SUPABASE_URL +
      "/rest/v1/items?select=*&order=id.desc",

      {
        method: "GET",

        headers: {

          "apikey":
          SUPABASE_KEY,

          "Authorization":
          "Bearer " + token,

          "Content-Type":
          "application/json"

        }

      }

    );


    if (!response.ok) {

      console.log(
        "Load error:",
        await response.text()
      );

      return;

    }


    const data =
    await response.json();


    const search =
    document.getElementById(
      "search"
    )
    .value
    .toLowerCase()
    .trim();


    const list =
    document.getElementById(
      "itemList"
    );


    list.innerHTML = "";


    data

    .filter(item =>

      String(item.name || "")
      .toLowerCase()
      .includes(search)

      ||

      String(item.category || "")
      .toLowerCase()
      .includes(search)

    )

    .forEach(item => {


      list.innerHTML += `

        <tr>

          <td>
            ${escapeHTML(item.name || "")}
          </td>

          <td>
            ${escapeHTML(item.category || "")}
          </td>

          <td>
            ${escapeHTML(item.unit || "")}
          </td>

          <td>
            ${item.quantity ?? 0}
          </td>

          <td>
            ${item.cost_price ?? 0}
          </td>

          <td>
            ${item.selling_price ?? 0}
          </td>

          <td>
            ${
              item.expiry_date
              ? item.expiry_date
              : "-"
            }
          </td>

          <td>
            ${escapeHTML(item.entered_by || "")}
          </td>

          <td>

            ${
              item.created_at

              ? new Date(
                  item.created_at
                ).toLocaleDateString()

              : ""

            }

          </td>


          <td>

            <div class="action">

              <button
              class="edit"
              onclick="editItem('${item.id}')">

              ✏️ Edit

              </button>


              <button
              class="del"
              onclick="deleteItem('${item.id}')">

              🗑️ Delete

              </button>

            </div>

          </td>

        </tr>

      `;

    });


  } catch (error) {

    console.log(
      "Items error:",
      error
    );

  }

}



/* =========================
   ADD ITEM
========================= */

async function addItem() {


  const name =
  document.getElementById(
    "name"
  ).value.trim();


  const categorySelect =
  document.getElementById(
    "category"
  );


  const categoryId =
  categorySelect.value;


  const selectedOption =
  categorySelect.options[
    categorySelect.selectedIndex
  ];


  const categoryName =
  selectedOption
  ? selectedOption.text
  : "";


  const unit =
  document.getElementById(
    "unit"
  ).value;


  const quantityValue =
  document.getElementById(
    "quantity"
  ).value;


  const costValue =
  document.getElementById(
    "cost"
  ).value;


  const sellingValue =
  document.getElementById(
    "selling"
  ).value;


  const expiryDate =
  document.getElementById(
    "expiryDate"
  ).value;



  /* =========================
     VALIDATION
  ========================= */

  if (!name) {

    alert(
      "Maqaa Item galchi."
    );

    return;

  }


  if (!categoryId) {

    alert(
      "Category tokko filadhu."
    );

    return;

  }


  if (!unit) {

    alert(
      "Safartuu / Unit filadhu."
    );

    return;

  }


  if (
    quantityValue === "" ||
    Number(quantityValue) < 0
  ) {

    alert(
      "Quantity sirrii galchi."
    );

    return;

  }


  if (costValue === "") {

    alert(
      "Cost Price galchi."
    );

    return;

  }


  if (sellingValue === "") {

    alert(
      "Selling Price galchi."
    );

    return;

  }


  /* =========================
     EX DATE REQUIRED
  ========================= */

  if (!expiryDate) {

    alert(
      "EX Date galchi."
    );

    return;

  }



  /* =========================
     ENTERED BY
  ========================= */

  const enteredBy =
  prompt(
    "Maqaa nama galche:"
  );


  if (
    enteredBy === null ||
    enteredBy.trim() === ""
  ) {

    alert(
      "Maqaa nama galche galchi."
    );

    return;

  }



  /* =========================
     ITEM OBJECT
  ========================= */

  const item = {

    name:
    name,

    category_id:
    categoryId,

    category:
    categoryName,

    unit:
    unit,

    quantity:
    Number(quantityValue),

    cost_price:
    Number(costValue),

    selling_price:
    Number(sellingValue),

    expiry_date:
    expiryDate,

    entered_by:
    enteredBy.trim()

  };



  /* =========================
     SAVE TO SUPABASE
  ========================= */

  try {

    const response =
    await fetch(

      SUPABASE_URL +
      "/rest/v1/items",

      {

        method: "POST",

        headers: {

          "Content-Type":
          "application/json",

          "apikey":
          SUPABASE_KEY,

          "Authorization":
          "Bearer " + token,

          "Prefer":
          "return=minimal"

        },

        body:
        JSON.stringify(item)

      }

    );


    if (response.ok) {


      alert(
        "✅ Item successfully saved!"
      );


      /* CLEAR FORM */

      document.getElementById(
        "name"
      ).value = "";


      document.getElementById(
        "category"
      ).value = "";


      document.getElementById(
        "unit"
      ).value = "";


      document.getElementById(
        "quantity"
      ).value = "";


      document.getElementById(
        "cost"
      ).value = "";


      document.getElementById(
        "selling"
      ).value = "";


      document.getElementById(
        "expiryDate"
      ).value = "";


      loadItems();


    } else {


      const error =
      await response.text();


      alert(
        "❌ Add Error:\n" +
        error
      );

    }


  } catch (error) {

    alert(
      "❌ Connection Error:\n" +
      error
    );

  }

}



/* =========================
   EDIT ITEM
========================= */

async function editItem(id) {


  try {

    const response =
    await fetch(

      SUPABASE_URL +
      "/rest/v1/items?id=eq." +
      encodeURIComponent(id) +
      "&select=*",

      {

        headers: {

          "apikey":
          SUPABASE_KEY,

          "Authorization":
          "Bearer " + token

        }

      }

    );


    if (!response.ok) {

      alert(
        "Item load failed."
      );

      return;

    }


    const items =
    await response.json();


    if (!items.length) {

      alert(
        "Item hin argamne."
      );

      return;

    }


    const item =
    items[0];


    /* ITEM NAME */

    const newName =
    prompt(
      "Item Name:",
      item.name || ""
    );


    if (newName === null)
    return;


    if (!newName.trim()) {

      alert(
        "Item name duwwaa ta'uu hin qabu."
      );

      return;

    }



    /* CATEGORY */

    const categoriesResponse =
    await fetch(

      SUPABASE_URL +
      "/rest/v1/store_categories?select=id,name&order=id.asc",

      {

        headers: {

          "apikey":
          SUPABASE_KEY,

          "Authorization":
          "Bearer " + token

        }

      }

    );


    if (!categoriesResponse.ok) {

      alert(
        "Categories load failed."
      );

      return;

    }


    const categories =
    await categoriesResponse.json();


    let categoryText =
    categories
    .map(
      (c, index) =>
      `${index + 1}. ${c.name}`
    )
    .join("\n");


    const currentCategoryIndex =
    categories.findIndex(
      c =>
      String(c.id) ===
      String(item.category_id)
    );


    const categoryAnswer =
    prompt(

      "Category filadhu:\n\n" +
      categoryText +
      "\n\nLakkoofsa galchi:",
      
      currentCategoryIndex >= 0
      ? String(currentCategoryIndex + 1)
      : ""

    );


    if (categoryAnswer === null)
    return;


    const categoryNumber =
    Number(categoryAnswer);


    if (
      !Number.isInteger(categoryNumber) ||
      categoryNumber < 1 ||
      categoryNumber > categories.length
    ) {

      alert(
        "Category number sirrii miti."
      );

      return;

    }


    const selectedCategory =
    categories[
      categoryNumber - 1
    ];



    /* UNIT */

    const newUnit =
    prompt(
      "Unit / Safartuu:",
      item.unit || ""
    );


    if (newUnit === null)
    return;


    if (!newUnit.trim()) {

      alert(
        "Unit galchi."
      );

      return;

    }



    /* QUANTITY */

    const newQuantity =
    prompt(
      "Quantity:",
      item.quantity ?? 0
    );


    if (newQuantity === null)
    return;


    if (
      newQuantity === "" ||
      Number(newQuantity) < 0
    ) {

      alert(
        "Quantity sirrii galchi."
      );

      return;

    }



    /* COST */

    const newCost =
    prompt(
      "Cost Price:",
      item.cost_price ?? 0
    );


    if (newCost === null)
    return;


    if (
      newCost === "" ||
      Number(newCost) < 0
    ) {

      alert(
        "Cost Price sirrii galchi."
      );

      return;

    }



    /* SELLING */

    const newSelling =
    prompt(
      "Selling Price:",
      item.selling_price ?? 0
    );


    if (newSelling === null)
    return;


    if (
      newSelling === "" ||
      Number(newSelling) < 0
    ) {

      alert(
        "Selling Price sirrii galchi."
      );

      return;

    }



    /* EX DATE */

    const newExpiryDate =
    prompt(
      "EX Date (YYYY-MM-DD):",
      item.expiry_date || ""
    );


    if (newExpiryDate === null)
    return;


    if (!newExpiryDate.trim()) {

      alert(
        "EX Date galchi."
      );

      return;

    }



    /* =========================
       UPDATE DATA
    ========================= */

    const updateData = {

      name:
      newName.trim(),

      category_id:
      selectedCategory.id,

      category:
      selectedCategory.name,

      unit:
      newUnit.trim(),

      quantity:
      Number(newQuantity),

      cost_price:
      Number(newCost),

      selling_price:
      Number(newSelling),

      expiry_date:
      newExpiryDate

    };



    /* =========================
       UPDATE SUPABASE
    ========================= */

    const updateResponse =
    await fetch(

      SUPABASE_URL +
      "/rest/v1/items?id=eq." +
      encodeURIComponent(id),

      {

        method: "PATCH",

        headers: {

          "Content-Type":
          "application/json",

          "apikey":
          SUPABASE_KEY,

          "Authorization":
          "Bearer " + token,

          "Prefer":
          "return=minimal"

        },

        body:
        JSON.stringify(updateData)

      }

    );


    if (updateResponse.ok) {

      alert(
        "✅ Item updated successfully!"
      );

      loadItems();

    } else {

      alert(
        "❌ Edit Error:\n" +
        await updateResponse.text()
      );

    }


  } catch (error) {

    alert(
      "❌ Edit Connection Error:\n" +
      error
    );

  }

}



/* =========================
   DELETE ITEM
========================= */

async function deleteItem(id) {


  if (
    !confirm(
      "Item kana haquu barbaaddaa?"
    )
  ) {

    return;

  }


  try {

    const response =
    await fetch(

      SUPABASE_URL +
      "/rest/v1/items?id=eq." +
      encodeURIComponent(id),

      {

        method: "DELETE",

        headers: {

          "apikey":
          SUPABASE_KEY,

          "Authorization":
          "Bearer " + token

        }

      }

    );


    if (response.ok) {

      alert(
        "✅ Item deleted."
      );

      loadItems();

    } else {

      alert(
        "❌ Delete Error:\n" +
        await response.text()
      );

    }


  } catch (error) {

    alert(
      "❌ Delete Connection Error:\n" +
      error
    );

  }

}



/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}



/* =========================
   LOGOUT
========================= */

function logoutUser() {

  localStorage.removeItem(
    "access_token"
  );

  localStorage.removeItem(
    "refresh_token"
  );

  window.location.href =
  "index.html";

}



/* =========================
   START
========================= */

loadCategories();

loadItems();

</script>

</body>
</html>
