/* =========================================================

let allItems = [];

/* =========================================================
   UUID VALIDATION
========================================================= */

function isValidUUID(value){

  if(!value){
    return false;
  }

  return /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(value);

}


/* =========================================================
   SUPABASE HEADERS
========================================================= */

function getHeaders(){

  return {

    "apikey": SUPABASE_KEY,

    "Authorization":
      "Bearer " + SUPABASE_KEY,

    "Content-Type":
      "application/json",

    "Accept":
      "application/json",

    "Prefer":
      "return=representation"

  };

}


/* =========================================================
   FETCH WITH TIMEOUT
========================================================= */

async function fetchWithTimeout(
  url,
  options = {},
  timeout = 15000
){

  const controller =
    new AbortController();

  const timer =
    setTimeout(
      () => controller.abort(),
      timeout
    );

  try{

    return await fetch(
      url,
      {
        ...options,
        signal:controller.signal
      }
    );

  }finally{

    clearTimeout(timer);

  }

}

){

}

/* =========================================================
   FIND CURRENT BRANCH UUID
========================================================= */

function findBranchUUID(){

  if(userRole === "main" ||
     branchCode.toUpperCase() === "MAIN"){

    selectedBranchUUID =
      BRANCHES[0].uuid;

    return selectedBranchUUID;

  }


  const cachedUUID =
    localStorage.getItem(
      "selected_branch_uuid"
    );


  if(
    isValidUUID(cachedUUID)
  ){

    const found =
      BRANCHES.find(
        b => b.uuid.toLowerCase()
          === cachedUUID.toLowerCase()
      );

    if(found){

      selectedBranchUUID =
        found.uuid;

      localStorage.setItem(
        "selected_branch_id",
        found.uuid
      );

      localStorage.setItem(
        "selected_branch_uuid",
        found.uuid
      );

      localStorage.setItem(
        "selected_branch_code",
        found.code
      );

      localStorage.setItem(
        "selected_branch_name",
        found.name
      );

      return selectedBranchUUID;

    }

  }


  if(branchCode){

    const foundByCode =
      BRANCHES.find(
        b =>
          b.code.toUpperCase()
          === branchCode.toUpperCase()
      );

    if(foundByCode){

      selectedBranchUUID =
        foundByCode.uuid;

      localStorage.setItem(
        "selected_branch_id",
        foundByCode.uuid
      );

      localStorage.setItem(
        "selected_branch_uuid",
        foundByCode.uuid
      );

      localStorage.setItem(
        "selected_branch_code",
        foundByCode.code
      );

      localStorage.setItem(
        "selected_branch_name",
        foundByCode.name
      );

      return selectedBranchUUID;

    }

  }


  if(branchName){

    const foundByName =
      BRANCHES.find(
        b =>
          b.name.toLowerCase()
          === branchName.toLowerCase()
      );

    if(foundByName){

      selectedBranchUUID =
        foundByName.uuid;

      localStorage.setItem(
        "selected_branch_id",
        foundByName.uuid
      );

      localStorage.setItem(
        "selected_branch_uuid",
        foundByName.uuid
      );

      localStorage.setItem(
        "selected_branch_code",
        foundByName.code
      );

      localStorage.setItem(
        "selected_branch_name",
        foundByName.name
      );

      return selectedBranchUUID;

    }

  }


  return null;

}


/* =========================================================
   SET BRANCH BADGE
========================================================= */

function setBranchBadge(){

  const badge =
    document.getElementById(
      "branchBadge"
    );

  if(userRole === "main"){

    badge.textContent =
      "Main - Headquarters";

    return;

  }

  const uuid =
    findBranchUUID();

  if(uuid){

    const branch =
      BRANCHES.find(
        b => b.uuid === uuid
      );

    if(branch){

      badge.textContent =
        branch.name +
        " (" +
        branch.code +
        ")";

      return;

    }

  }


  badge.textContent =
    branchName ||
    "Branch";

}


/* =========================================================
   LOAD ITEMS
========================================================= */

async function loadItems(){

  const loading =
    document.getElementById(
      "loading"
    );

  const table =
    document.getElementById(
      "itemsTable"
    );

  try{

    loading.classList.remove(
      "hidden"
    );

    table.classList.add(
      "hidden"
    );


    const branchUUID =
      findBranchUUID();


    if(
      userRole !== "main" &&
      !branchUUID
    ){

      throw new Error(
        "Branch UUID hin argamne. Mee index.html irraa irra deebi'ii seeni."
      );

    }


    let url =
      SUPABASE_URL +
      "/rest/v1/items?select=*";


    if(userRole !== "main"){

      url +=
        "&branch_id=eq." +
        encodeURIComponent(
          branchUUID
        );

    }


    url +=
      "&order=name.asc";


    const response =
      await fetchWithTimeout(
        url,
        {
          method:"GET",
          headers:getHeaders()
        },
        15000
      );


    const text =
      await response.text();


    if(!response.ok){

      let errorMessage =
        text;

      try{

        const json =
          JSON.parse(text);

        errorMessage =
          json.message ||
          json.error ||
          text;

      }catch(e){}


      throw new Error(
        "Items loading error: " +
        errorMessage
      );

    }


    try{

      allItems =
        text
          ? JSON.parse(text)
          : [];

    }catch(e){

      throw new Error(
        "Items response sirrii miti."
      );

    }


    if(!Array.isArray(allItems)){

      allItems = [];

    }


    filteredItems =
      [...allItems];


    updateCards();

    renderItems();


  }catch(error){

    console.error(
      "loadItems error:",
      error
    );

    allItems = [];

    filteredItems = [];

    updateCards();

    renderItems();


    showMessage(
      error.name === "AbortError"
        ? "Supabase response dheeraa ture. Internet/API key kee ilaali."
        : error.message,
      "error"
    );


  }finally{

    loading.classList.add(
      "hidden"
    );

  }

}


/* =========================================================
   UPDATE CARDS
========================================================= */

function updateCards(){

  document.getElementById(
    "totalItems"
  ).textContent =
    allItems.length;


  const categories =
    new Set();

  const units =
    new Set();


  allItems.forEach(item => {

    if(item.category){

      categories.add(
        getEnglishCategory(
          item.category
        )
      );

    }

    if(item.unit){

      units.add(
        item.unit
      );

    }

  });


  document.getElementById(
    "totalCategories"
  ).textContent =
    categories.size;


  document.getElementById(
    "totalUnits"
  ).textContent =
    units.size;

}


/* =========================================================
   RENDER ITEMS
========================================================= */

function renderItems(){

  const body =
    document.getElementById(
      "itemsBody"
    );

  const table =
    document.getElementById(
      "itemsTable"
    );

  body.innerHTML = "";


  if(
    !filteredItems.length
  ){

    body.innerHTML = `

      <tr>

        <td
          colspan="5"
          style="text-align:center;padding:25px;color:#64748b;">

          No items found.

        </td>

      </tr>

    `;

  }else{

    filteredItems.forEach(
      (item,index) => {

        const row =
          document.createElement(
            "tr"
          );


        const number =
          index + 1;


        row.innerHTML = `

          <td>
            ${number}
          </td>

          <td>
            ${escapeHtml(
              item.name || ""
            )}
          </td>

          <td>
            ${escapeHtml(
              getEnglishCategory(
                item.category
              )
            )}
          </td>

          <td>
            ${escapeHtml(
              item.unit || ""
            )}
          </td>

          <td class="action-cell">

            <button
              class="action-btn edit-btn"
              onclick="editItem('${item.id}')">

              Edit

            </button>

            <button
              class="action-btn delete-btn"
              onclick="deleteItem('${item.id}')">

              Delete

            </button>

          </td>

        `;


        body.appendChild(row);

      }
    );

  }


  const isMain =
    userRole === "main" ||
    branchCode.toUpperCase()
      === "MAIN";


  document.getElementById(
    "formCard"
  ).classList.toggle(
    "hidden",
    isMain
  );


  document.getElementById(
    "actionHeader"
  ).classList.toggle(
    "hidden",
    isMain
  );


  document.querySelectorAll(
    ".action-cell"
  ).forEach(cell => {

    cell.classList.toggle(
      "hidden",
      isMain
    );

  });


  table.classList.remove(
    "hidden"
  );

}


/* =========================================================
   ENGLISH CATEGORY NORMALIZATION
========================================================= */

function getEnglishCategory(category){

  const value =
    String(category || "")
      .trim()
      .toLowerCase();

  const categories = {

    "meeshaalee nyaataa tarsiimawaa":
      "Strategic Food Items",

    "strategic food items":
      "Strategic Food Items",

    "meeshaalee nyaataa guyyaa guyyaa":
      "Daily Food Items",

    "daily food items":
      "Daily Food Items",

    "meeshaalee nyaataa hin taane guyyaa guyyaa":
      "Daily Non-Food Items",

    "daily non-food items":
      "Daily Non-Food Items",

    "meeshaalee nyaataa hin taane ittiin nyaata qopheessan":
      "Non-Food Kitchen Items",

    "non-food kitchen items":
      "Non-Food Kitchen Items",

    "meeshaalee qulqullinaa":
      "Non-Food Hygiene Items",

    "non-food hygiene items":
      "Non-Food Hygiene Items",

    "meeshaa ijaarsa manaaf oolu":
      "Building / Construction Items",

    "building / construction items":
      "Building / Construction Items",

    "building & construction items":
      "Building / Construction Items",

    "building items":
      "Building / Construction Items",

    "construction items":
      "Building / Construction Items"

  };

  return categories[value] || category || "";

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================================================
   FILTER ITEMS
========================================================= */

function filterItems(){

  const search =
    document.getElementById(
      "searchInput"
    ).value
      .trim()
      .toLowerCase();


  if(!search){

    filteredItems =
      [...allItems];

  }else{

    filteredItems =
      allItems.filter(item => {

        return (

          String(
            item.name || ""
          )
            .toLowerCase()
            .includes(search)

          ||

          String(
            getEnglishCategory(
              item.category
            )
          )
            .toLowerCase()
            .includes(search)

          ||

          String(
            item.unit || ""
          )
            .toLowerCase()
            .includes(search)

        );

      });

  }


  renderItems();

}


/* =========================================================
   SAVE ITEM
========================================================= */

async function saveItem(){

  if(userRole === "main"){

    showMessage(
      "Main irraa Item galchuun hin hayyamamu.",
      "error"
    );

    return;

  }


  const name =
    document.getElementById(
      "itemName"
    ).value.trim();


  const category =
    document.getElementById(
      "category"
    ).value;


  const unit =
    document.getElementById(
      "unit"
    ).value;


  if(!name){

    showMessage(
      "Item Name galchi.",
      "error"
    );

    return;

  }


  if(!category){

    showMessage(
      "Category filadhu.",
      "error"
    );

    return;

  }


  if(!unit){

    showMessage(
      "Unit / Measurement filadhu.",
      "error"
    );

    return;

  }


  const branchUUID =
    findBranchUUID();


  if(!branchUUID){

    showMessage(
      "Branch UUID hin argamne. Login irra deebi'i.",
      "error"
    );

    return;

  }


  const payload = {

    name:name,

    category:getEnglishCategory(
      category
    ),

    unit:unit,

    branch_id:branchUUID

  };


  const saveButton =
    document.getElementById(
      "saveButton"
    );


  saveButton.disabled =
    true;


  saveButton.textContent =
    editingId
      ? "Updating..."
      : "Saving...";


  try{

    let response;


    if(editingId){

      response =
        await fetchWithTimeout(

          SUPABASE_URL +
          "/rest/v1/items?id=eq." +
          encodeURIComponent(
            editingId
          ) +
          "&branch_id=eq." +
          encodeURIComponent(
            branchUUID
          ),

          {

            method:"PATCH",

            headers:getHeaders(),

            body:JSON.stringify(
              payload
            )

          },

          15000

        );

    }else{

      response =
        await fetchWithTimeout(

          SUPABASE_URL +
          "/rest/v1/items",

          {

            method:"POST",

            headers:getHeaders(),

            body:JSON.stringify(
              payload
            )

          },

          15000

        );

    }


    const text =
      await response.text();


    if(!response.ok){

      let errorMessage =
        text;

      try{

        const json =
          JSON.parse(text);

        errorMessage =
          json.message ||
          json.error ||
          json.details ||
          text;

      }catch(e){}


      throw new Error(
        errorMessage
      );

    }


    showMessage(
      editingId
        ? "Item successfully updated."
        : "Item successfully saved.",
      "success"
    );


    clearForm();


    await loadItems();


  }catch(error){

    console.error(
      "saveItem error:",
      error
    );


    showMessage(
      error.name === "AbortError"
        ? "Save request yeroo dheeraa fudhate."
        : "Save failed: " +
          error.message,
      "error"
    );


  }finally{

    saveButton.disabled =
      false;

    saveButton.textContent =
      editingId
        ? "Update Item"
        : "Save Item";

  }

}


/* =========================================================
   EDIT ITEM
========================================================= */

function editItem(id){

  const item =
    allItems.find(
      x =>
        String(x.id)
        === String(id)
    );


  if(!item){

    showMessage(
      "Item hin argamne.",
      "error"
    );

    return;

  }


  editingId =
    item.id;


  document.getElementById(
    "itemName"
  ).value =
    item.name || "";


  document.getElementById(
    "category"
  ).value =
    getEnglishCategory(
      item.category
    );


  document.getElementById(
    "unit"
  ).value =
    item.unit || "";


  document.getElementById(
    "formTitle"
  ).textContent =
    "Edit Item";


  document.getElementById(
    "saveButton"
  ).textContent =
    "Update Item";


  document.getElementById(
    "cancelButton"
  ).classList.remove(
    "hidden"
  );


  document.getElementById(
    "formCard"
  ).scrollIntoView({
    behavior:"smooth"
  });

}

function cancelEdit(){

/* =========================================================

function clearForm(){

  editingId = null;


  document.getElementById(
    "itemName"
  ).value = "";


  document.getElementById(
    "category"
  ).value = "";


  document.getElementById(
    "unit"
  ).value = "";


  document.getElementById(
    "formTitle"
  ).textContent =

  document.getElementById(
    "saveButton"
  ).textContent =
    "Save Item";


  document.getElementById(
    "cancelButton"
  ).classList.add(
    "hidden"
  );

}


/* =========================================================
   DELETE ITEM
========================================================= */

async function deleteItem(id){

  if(userRole === "main"){

    showMessage(
      "Main irraa Item delete gochuun hin hayyamamu.",
      "error"
    );

    return;

  }


  const item =
    allItems.find(
      x =>
        String(x.id)
        === String(id)
    );


  if(!item){

    showMessage(
      "Item hin argamne.",
      "error"
    );

    return;

  }


  const confirmed =
    confirm(
      "Delete this item?\n\n" +
      item.name
    );


  if(!confirmed){

    return;

  }


  const branchUUID =
    findBranchUUID();


  if(!branchUUID){

    showMessage(
      "Branch UUID hin argamne.",
      "error"
    );

    return;

  }


  try{

    const response =
      await fetchWithTimeout(

        SUPABASE_URL +
        "/rest/v1/items?id=eq." +
        encodeURIComponent(id) +
        "&branch_id=eq." +
        encodeURIComponent(
          branchUUID
        ),

        {

          method:"DELETE",

          headers:getHeaders()

        },

        15000

      );


    const text =
      await response.text();


    if(!response.ok){

      let errorMessage =
        text;

      try{

        const json =
          JSON.parse(text);

        errorMessage =
          json.message ||
          json.error ||
          text;

      }catch(e){}


      throw new Error(
        errorMessage
      );

    }


    showMessage(
      "Item successfully deleted.",
      "success"
    );


    if(
      editingId &&
      String(editingId)
      === String(id)
    ){

      clearForm();

    }


    await loadItems();


  }catch(error){

    console.error(
      "deleteItem error:",
      error
    );


    showMessage(
      error.name === "AbortError"
        ? "Delete request yeroo dheeraa fudhate."
        : "Delete failed: " +
          error.message,
      "error"
    );

  }

}
