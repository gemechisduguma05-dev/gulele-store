<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AAFDRMC - Item Management</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f1f5f9;
  color:#1e293b;
}

/* ================= HEADER ================= */

.header{
  background:#5b341c;
  color:white;
  padding:14px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  flex-wrap:wrap;
  box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.header-left{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo{
  width:52px;
  height:52px;
  border-radius:50%;
  object-fit:cover;
  background:white;
  border:2px solid #fff;
}

.title{
  font-size:20px;
  font-weight:bold;
}

.subtitle{
  font-size:13px;
  opacity:.9;
  margin-top:3px;
}

.header-right{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}

.branch-badge{
  background:#fff;
  color:#5b341c;
  padding:8px 12px;
  border-radius:8px;
  font-weight:bold;
}

/* ================= BUTTONS ================= */

button{
  border:none;
  border-radius:7px;
  padding:10px 14px;
  cursor:pointer;
  font-weight:bold;
  font-size:14px;
}

.btn-menu{
  background:#8b5e34;
  color:white;
}

.btn-refresh{
  background:#2563eb;
  color:white;
}

.btn-save{
  background:#166534;
  color:white;
  width:100%;
}

.btn-edit{
  background:#d97706;
  color:white;
  padding:7px 10px;
}

.btn-delete{
  background:#dc2626;
  color:white;
  padding:7px 10px;
}

button:hover{
  opacity:.9;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

/* ================= MAIN ================= */

.container{
  max-width:1200px;
  margin:20px auto;
  padding:0 15px;
}

/* ================= MESSAGE ================= */

.message{
  display:none;
  padding:12px 15px;
  border-radius:8px;
  margin-bottom:15px;
  font-weight:bold;
}

.message.success{
  display:block;
  background:#dcfce7;
  color:#166534;
  border:1px solid #86efac;
}

.message.error{
  display:block;
  background:#fee2e2;
  color:#991b1b;
  border:1px solid #fca5a5;
}

.message.info{
  display:block;
  background:#dbeafe;
  color:#1e40af;
  border:1px solid #93c5fd;
}

/* ================= VIEW ONLY ================= */

.view-only{
  background:#fff7ed;
  color:#9a3412;
  border:1px solid #fdba74;
  padding:12px 15px;
  border-radius:8px;
  margin-bottom:15px;
  font-weight:bold;
}

/* ================= CARD ================= */

.card{
  background:white;
  border-radius:12px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.card h2{
  margin-top:0;
  color:#5b341c;
  font-size:20px;
}

/* ================= FORM ================= */

.form-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
}

.form-group{
  display:flex;
  flex-direction:column;
}

.form-group label{
  font-weight:bold;
  margin-bottom:6px;
  font-size:14px;
}

.form-group input,
.form-group select{
  width:100%;
  padding:11px;
  border:1px solid #cbd5e1;
  border-radius:7px;
  font-size:14px;
  background:white;
}

.form-group input:focus,
.form-group select:focus{
  outline:none;
  border-color:#8b5e34;
  box-shadow:0 0 0 2px rgba(139,94,52,.12);
}

.full{
  grid-column:1/-1;
}

.form-actions{
  margin-top:15px;
  display:flex;
  gap:10px;
}

.btn-cancel{
  background:#64748b;
  color:white;
}

/* ================= SEARCH ================= */

.search-box{
  margin-bottom:15px;
}

.search-box input{
  width:100%;
  padding:12px;
  border:1px solid #cbd5e1;
  border-radius:8px;
  font-size:15px;
}

/* ================= TABLE ================= */

.table-wrap{
  width:100%;
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:750px;
}

th{
  background:#5b341c;
  color:white;
  padding:12px 10px;
  text-align:left;
  font-size:14px;
}

td{
  padding:11px 10px;
  border-bottom:1px solid #e2e8f0;
  font-size:14px;
}

tr:hover td{
  background:#faf7f4;
}

.actions{
  display:flex;
  gap:6px;
}

/* ================= LOADING ================= */

.loading{
  text-align:center;
  padding:20px;
  color:#64748b;
  font-weight:bold;
}

/* ================= RESPONSIVE ================= */

@media(max-width:800px){

  .form-grid{
    grid-template-columns:1fr 1fr;
  }

}

@media(max-width:600px){

  .header{
    align-items:flex-start;
  }

  .header-right{
    width:100%;
  }

  .header-right button{
    flex:1;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .container{
    padding:0 10px;
    margin-top:12px;
  }

  .card{
    padding:15px;
  }

  .title{
    font-size:17px;
  }

  .subtitle{
    font-size:12px;
  }

  .logo{
    width:45px;
    height:45px;
  }

}

</style>
</head>

<body>

<!-- ================= HEADER ================= -->

<header class="header">

  <div class="header-left">

    <img
      src="./1788633150526.jpg"
      class="logo"
      alt="AAFDRMC Logo"
      onerror="this.style.display='none'"
    >

    <div>
      <div class="title">AAFDRMC - Item Management</div>
      <div class="subtitle">Item / Category / Unit Management</div>
    </div>

  </div>

  <div class="header-right">

    <div class="branch-badge" id="branchBadge">
      Loading...
    </div>

    <button
      class="btn-menu"
      onclick="goDashboard()">
      Dashboard
    </button>

    <button
      class="btn-refresh"
      onclick="loadItems()">
      Refresh
    </button>

  </div>

</header>


<!-- ================= MAIN ================= -->

<main class="container">

  <div id="message" class="message"></div>


  <!-- MAIN VIEW ONLY MESSAGE -->

  <div
    id="viewOnlyMessage"
    class="view-only"
    style="display:none;">
    Main / HQ is VIEW ONLY. Items ilaaluu qofa dandeessa; Add, Edit fi Delete hin dandeessu.
  </div>


  <!-- ================= ADD / EDIT CARD ================= -->

  <section
    class="card"
    id="itemFormCard">

    <h2 id="formTitle">
      Add New Item
    </h2>

    <form id="itemForm">

      <div class="form-grid">

        <!-- ITEM NAME -->

        <div class="form-group">

          <label for="itemName">
            Item Name / Maqaa Meeshaa
          </label>

          <input
            type="text"
            id="itemName"
            placeholder="Enter item name"
            required>

        </div>


        <!-- CATEGORY -->

        <div class="form-group">

          <label for="category">
            Category / Ramaddii
          </label>

          <select
            id="category"
            required>

            <option value="">
              Select Category
            </option>

            <option value="Meeshaalee Nyaataa Tarsiimawaa">
              Meeshaalee Nyaataa Tarsiimawaa / Strategic Food Items / ስትራቴጂክ ምግብ ነክ
            </option>

            <option value="Meeshaalee Nyaataa Guyyaa Guyyaa">
              Meeshaalee Nyaataa Guyyaa Guyyaa / Daily Food Items / የዕለት ምግብ ነክ
            </option>

            <option value="Meeshaalee Nyaataa Hin Taane Guyyaa Guyyaa">
              Meeshaalee Nyaataa Hin Taane Guyyaa Guyyaa / Daily Non-Food Items / የዕለት ምግብ ነክ ያልሆኑ
            </option>

            <option value="Meeshaalee Nyaataa Hin Taane Ittiin Nyaata Qopheessan">
              Meeshaalee Nyaataa Hin Taane Ittiin Nyaata Qopheessan / Non-Food Kitchen Items / የምግብ ዝግጅት የማይሆኑ እቃዎች
            </option>

            <option value="Meeshaalee Qulqullinaa">
              Meeshaalee Qulqullinaa / Non-Food Hygiene Items / የንጽህና እቃዎች
            </option>

            <option value="Meeshaa Ijaarsa Manaaf Oolu">
              Meeshaa Ijaarsa Manaaf Oolu / Building & Construction Items / የግንባታ እቃዎች
            </option>

          </select>

        </div>


        <!-- UNIT -->

        <div class="form-group">

          <label for="unit">
            Unit / Safartuu
          </label>

          <select
            id="unit"
            required>

            <option value="">
              Select Unit
            </option>

            <option value="Kg">Kg</option>
            <option value="Quintal">Quintal</option>
            <option value="Litre">Litre</option>
            <option value="Piece">Piece</option>
            <option value="Box">Box</option>
            <option value="Bag">Bag</option>
            <option value="Carton">Carton</option>
            <option value="Packet">Packet</option>
            <option value="Bottle">Bottle</option>
            <option value="Set">Set</option>
            <option value="Meter">Meter</option>
            <option value="Roll">Roll</option>
            <option value="Other">Other</option>

          </select>

        </div>


        <!-- SAVE BUTTON -->

        <div class="form-actions full">

          <button
            type="submit"
            class="btn-save"
            id="saveButton">
            Save Item
          </button>

          <button
            type="button"
            class="btn-cancel"
            id="cancelButton"
            onclick="cancelEdit()"
            style="display:none;">
            Cancel
          </button>

        </div>

      </div>

    </form>

  </section>


  <!-- ================= ITEMS LIST ================= -->

  <section class="card">

    <h2>
      Items List
    </h2>

    <div class="search-box">

      <input
        type="text"
        id="searchInput"
        placeholder="Search item name, category or unit..."
        oninput="filterItems()">

    </div>


    <div
      id="loading"
      class="loading">
      Loading items...
    </div>


    <div class="table-wrap">

      <table>

        <thead>

          <tr>
            <th>Item ID</th>
            <th>Item Name</th>
            <th>Category</th>
            <th>Unit</th>
            <th id="actionHeader">Actions</th>
          </tr>

        </thead>

        <tbody id="itemsBody"></tbody>

      </table>

    </div>

  </section>

</main>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://sslabegtsxlkafuygmar.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_G3Nv_yg4LaCiMtJMiadMxQ_f2fNHg5x";


/* =========================================================
   GLOBAL VARIABLES
========================================================= */

let allItems = [];

let editingId = null;

let branchUUID = null;

let branchCode =
  localStorage.getItem("selected_branch_code") || "";

let branchName =
  localStorage.getItem("selected_branch_name") || "";

let userRole =
  localStorage.getItem("user_role") || "";

let loggedIn =
  localStorage.getItem("is_logged_in") === "true";


/* =========================================================
   PAGE START
========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  async function(){

    if(!loggedIn){

      window.location.href = "index.html";

      return;

    }


    branchCode =
      localStorage.getItem("selected_branch_code") || "";


    branchName =
      localStorage.getItem("selected_branch_name") || "";


    /*
      IMPORTANT:
      index.html amma selected_branch_id
      fi selected_branch_uuid keessatti
      UUID dhugaa kaa'a.
    */

    const storedUUID =
      localStorage.getItem("selected_branch_uuid") ||
      localStorage.getItem("selected_branch_id") ||
      "";


    if(isUUID(storedUUID)){

      branchUUID =
        storedUUID;

    }


    if(!branchName){

      branchName =
        "Unknown Branch";

    }


    document.getElementById("branchBadge")
      .textContent =
      branchName;


    setupAccess();


    try{

      /*
        Main does not need a branch UUID.
        Operational branches need UUID.
      */

      if(!isMainUser()){

        branchUUID =
          await findBranchUUID();

      }


      await loadItems();


    }catch(error){

      console.error(error);

      showMessage(
        "Branch information loading failed: " +
        error.message,
        "error"
      );

      document.getElementById("loading")
        .style.display =
        "none";

    }

  });


/* =========================================================
   ACCESS CONTROL
========================================================= */

function isMainUser(){

  return String(userRole)
    .trim()
    .toLowerCase() === "main";

}


function setupAccess(){

  if(isMainUser()){

    document.getElementById("viewOnlyMessage")
      .style.display =
      "block";

    document.getElementById("itemFormCard")
      .style.display =
      "none";

    document.getElementById("actionHeader")
      .style.display =
      "none";

  }

}


/* =========================================================
   SUPABASE HEADERS
========================================================= */

function getHeaders(){

  const accessToken =
    localStorage.getItem("access_token");

  return {

    "apikey":
      SUPABASE_KEY,

    "Authorization":
      accessToken
        ? "Bearer " + accessToken
        : "Bearer " + SUPABASE_KEY,

    "Content-Type":
      "application/json",

    "Accept":
      "application/json",

    "Prefer":
      "return=representation"

  };

}


/* =========================================================
   UUID CHECK
========================================================= */

function isUUID(value){

  if(!value){

    return false;

  }


  return /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i
    .test(
      String(value).trim()
    );

}


/* =========================================================
   BRANCH UUID RESOLVER
========================================================= */

async function findBranchUUID(){

  /*
    STEP 1
    Index.html irraa UUID dhugaa yoo jiraate
    kallattiin fayyadami.

    Kun amma sirna haaraa keenya.
  */

  const cachedUUID =
    localStorage.getItem(
      "selected_branch_uuid"
    ) ||
    localStorage.getItem(
      "selected_branch_id"
    ) ||
    "";


  if(isUUID(cachedUUID)){

    branchUUID =
      cachedUUID;


    localStorage.setItem(
      "selected_branch_uuid",
      cachedUUID
    );

    localStorage.setItem(
      "selected_branch_id",
      cachedUUID
    );


    return cachedUUID;

  }


  /*
    STEP 2
    UUID cache keessa hin jirre yoo ta'e,
    branches table irraa barbaadi.
  */

  const url =
    SUPABASE_URL +
    "/rest/v1/branches?select=*";


  const response =
    await fetch(
      url,
      {
        method:"GET",
        headers:getHeaders()
      }
    );


  const text =
    await response.text();


  if(!response.ok){

    throw new Error(text);

  }


  let rows = [];

  try{

    rows =
      JSON.parse(text);

  }catch(e){

    throw new Error(
      "Branches response is not valid JSON."
    );

  }


  if(!Array.isArray(rows)){

    throw new Error(
      "Branches data not found."
    );

  }


  /*
    Possible code columns
  */

  const codeFields = [

    "code",
    "branch_code",
    "branchCode",
    "branchcode",
    "branch_id_code",
    "short_code"

  ];


  /*
    Possible name columns
  */

  const nameFields = [

    "name",
    "branch_name",
    "branch",
    "branchName",
    "title",
    "branch_title",
    "office_name",
    "office"

  ];


  const wantedCode =
    String(
      branchCode || ""
    )
    .trim()
    .toLowerCase();


  const wantedName =
    String(
      branchName || ""
    )
    .trim()
    .toLowerCase();


  let found = null;


  /*
    STEP 3
    Branch code irratti barbaadi.
  */

  if(wantedCode){

    found =
      rows.find(
        function(row){

          return codeFields.some(
            function(field){

              return String(
                row[field] || ""
              )
              .trim()
              .toLowerCase()
              === wantedCode;

            }
          );

        }
      );

  }


  /*
    STEP 4
    Branch name irratti barbaadi.
  */

  if(!found
