<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AAFDRMC - Items</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f1f5f9;
  color:#1e293b;
}

header{
  background:#1e3a8a;
  color:white;
  padding:18px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:24px;
}

header p{
  margin:6px 0 0;
}

.container{
  width:96%;
  max-width:1400px;
  margin:20px auto;
}

.top-bar,
.form-box,
.table-box{
  background:white;
  border-radius:12px;
  box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.top-bar{
  padding:16px;
  margin-bottom:18px;
}

.buttons{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.btn{
  border:0;
  padding:11px 16px;
  border-radius:7px;
  color:white;
  font-weight:bold;
  cursor:pointer;
  text-decoration:none;
}

.blue{background:#1e3a8a}
.green{background:#15803d}
.gray{background:#64748b}

.form-box{
  display:none;
  padding:20px;
  margin-bottom:18px;
}

.form-box.show{
  display:block;
}

.form-title{
  color:#1e3a8a;
  font-size:21px;
  font-weight:bold;
  margin-bottom:16px;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:14px;
}

.form-group{
  display:flex;
  flex-direction:column;
}

label{
  font-weight:bold;
  margin-bottom:6px;
}

input,
select{
  width:100%;
  padding:11px;
  border:1px solid #cbd5e1;
  border-radius:7px;
  font-size:15px;
}

input:focus,
select:focus{
  outline:none;
  border-color:#2563eb;
}

.save-row{
  display:flex;
  gap:10px;
  margin-top:18px;
}

.save-btn{
  border:0;
  padding:11px 20px;
  border-radius:7px;
  background:#15803d;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.cancel-btn{
  background:#64748b;
}

.message{
  display:none;
  padding:12px;
  border-radius:7px;
  margin-bottom:15px;
  font-weight:bold;
}

.message.success{
  display:block;
  background:#dcfce7;
  color:#166534;
}

.message.error{
  display:block;
  background:#fee2e2;
  color:#991b1b;
}

.section-title{
  padding:16px;
  background:white;
  color:#1e3a8a;
  font-size:21px;
  font-weight:bold;
  border-radius:12px 12px 0 0;
}

.table-box{
  overflow-x:auto;
  border-radius:0 0 12px 12px;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:1100px;
}

th{
  background:#1e3a8a;
  color:white;
  padding:12px;
  text-align:left;
  white-space:nowrap;
}

td{
  padding:11px;
  border-bottom:1px solid #e2e8f0;
  white-space:nowrap;
}

tr:hover{
  background:#f8fafc;
}

.action-btn{
  border:0;
  padding:7px 11px;
  border-radius:6px;
  color:white;
  cursor:pointer;
  font-weight:bold;
}

.edit{
  background:#2563eb;
}

.delete{
  background:#dc2626;
}

.branch-badge{
  background:#eff6ff;
  color:#1e3a8a;
  padding:5px 9px;
  border-radius:15px;
  font-weight:bold;
}

.category-badge{
  background:#f1f5f9;
  color:#475569;
  padding:5px 9px;
  border-radius:15px;
}

@media(max-width:600px){
  .container{
    width:94%;
  }

  .save-row{
    flex-direction:column;
  }

  .save-btn{
    width:100%;
  }
}
</style>
</head>

<body>

<header>
  <h1>AAFDRMC - ITEMS</h1>
  <p>Item Management System</p>
</header>

<div class="container">

  <div class="top-bar">

    <div class="buttons">

      <button
        class="btn green"
        onclick="openItemForm()">
        ➕ Add New Item
      </button>

      <a
        href="dashboard.html"
        class="btn blue">
        🏠 Main Dashboard
      </a>

      <a
        href="index.html"
        class="btn gray">
        ⬅️ Back
      </a>

    </div>

  </div>


  <div
    id="message"
    class="message">
  </div>


  <!-- ADD ITEM -->

  <div
    id="itemForm"
    class="form-box">

    <div class="form-title">
      📦 Add New Item
    </div>

    <div class="form-grid">


      <!-- ITEM ID -->

      <div class="form-group">

        <label>
          Item ID
        </label>

        <input
          id="itemId"
          type="text"
          placeholder="Item ID">

      </div>


      <!-- ITEM NAME -->

      <div class="form-group">

        <label>
          Item Name
        </label>

        <input
          id="itemName"
          type="text"
          placeholder="Item Name">

      </div>


      <!-- UNIT -->

      <div class="form-group">

        <label>
          Unit
        </label>

        <select id="itemUnit">

          <option value="">
            -- Select Unit --
          </option>

          <option value="Quintal">
            Quintal
          </option>

          <option value="Kg">
            Kg
          </option>

          <option value="Carton">
            Carton
          </option>

          <option value="Box">
            Box
          </option>

          <option value="Piece">
            Piece
          </option>

          <option value="Liter">
            Liter
          </option>

          <option value="Bag">
            Bag
          </option>

          <option value="Other">
            Other
          </option>

        </select>

      </div>


      <!-- COST -->

      <div class="form-group">

        <label>
          Cost Price
        </label>

        <input
          id="costPrice"
          type="number"
          min="0"
          step="any"
          placeholder="Cost Price">

      </div>


      <!-- SELLING -->

      <div class="form-group">

        <label>
          Selling Price
        </label>

        <input
          id="sellingPrice"
          type="number"
          min="0"
          step="any"
          placeholder="Selling Price">

      </div>


      <!-- CATEGORY -->

      <div class="form-group">

        <label>
          Category
        </label>

        <select id="itemCategory">

          <option value="">
            -- Select Category --
          </option>

          <option value="Strategic Food Items">
            Strategic Food Items
          </option>

          <option value="Daily Food Items">
            Daily Food Items
          </option>

          <option value="Daily Non-Food Items">
            Daily Non-Food Items
          </option>

          <option value="Non-Food Hygiene Items">
            Non-Food Hygiene Items
          </option>

          <option value="Non-Food Kitchen Items">
            Non-Food Kitchen Items
          </option>

          <option value="Non-Food Building/Construction Items">
            Non-Food Building/Construction Items
          </option>

        </select>

      </div>


      <!-- BRANCH -->

      <div class="form-group">

        <label>
          Branch
        </label>

        <select id="itemBranch">

          <option value="">
            -- Select Branch --
          </option>

          <option value="Main">
            Main
          </option>

          <option value="Gulele">
            Gulele
          </option>

          <option value="Addis Katama">
            Addis Katama
          </option>

          <option value="Kolfee">
            Kolfee
          </option>

          <option value="Nifas Silk Lafto">
            Nifas Silk Lafto
          </option>

          <option value="Kirkos">
            Kirkos
          </option>

          <option value="Lami Kura">
            Lami Kura
          </option>

          <option value="Arada">
            Arada
          </option>

          <option value="Lideta">
            Lideta
          </option>

          <option value="Bole">
            Bole
          </option>

          <option value="Ekaa">
            Ekaa
          </option>

          <option value="Akaki Kality">
            Akaki Kality
          </option>

          <option value="Center">
            Center
          </option>

        </select>

      </div>

    </div>


    <div class="save-row">

      <button
        class="save-btn"
        onclick="saveItem()">
        💾 Save New Item
      </button>

      <button
        class="save-btn cancel-btn"
        onclick="closeItemForm()">
        Cancel
      </button>

    </div>

  </div>


  <!-- ITEMS -->

  <div class="section-title">
    📋 Registered Items
  </div>

  <div class="table-box">

    <table>

      <thead>

        <tr>

          <th>No</th>
          <th>Item ID</th>
          <th>Item Name</th>
          <th>Unit</th>
          <th>Cost Price</th>
          <th>Selling Price</th>
          <th>Category</th>
          <th>Branch</th>
          <th>Quantity</th>
          <th>Action</th>

        </tr>

      </thead>

      <tbody id="itemsTable">

        <tr>

          <td
            colspan="10"
            style="text-align:center;padding:25px">

            Loading...

          </td>

        </tr>

      </tbody>

    </table>

  </div>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://sslabegtsxlkafuygmar.supabase.co";

const SUPABASE_KEY =
"sb_publishable_M6oxZjm6xF5NbrXkSO9JqA_7JGSucXq";


/* =====================================================
   BRANCHES
===================================================== */

const BRANCHES = {

  "Main":"Main",

  "Gulele":"Gulele",

  "Addis Katama":"Addis Katama",

  "Kolfee":"Kolfee",

  "Nifas Silk Lafto":"Nifas Silk Lafto",

  "Kirkos":"Kirkos",

  "Lami Kura":"Lami Kura",

  "Arada":"Arada",

  "Lideta":"Lideta",

  "Bole":"Bole",

  "Ekaa":"Ekaa",

  "Akaki Kality":"Akaki Kality",

  "Center":"Center"

};


/* =====================================================
   CATEGORIES — 6 ONLY
===================================================== */

const CATEGORIES = [

  "Strategic Food Items",

  "Daily Food Items",

  "Daily Non-Food Items",

  "Non-Food Hygiene Items",

  "Non-Food Kitchen Items",

  "Non-Food Building/Construction Items"

];


/* =====================================================
   GLOBAL
===================================================== */

let items = [];


/* =====================================================
   HEADERS
===================================================== */

function getHeaders(){

  return {

    "apikey":
      SUPABASE_KEY,

    "Authorization":
      "Bearer " + SUPABASE_KEY,

    "Content-Type":
      "application/json",

    "Prefer":
      "return=representation"

  };

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHTML(value){

  return String(value ?? "")

    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
  text,
  type
){

  const box =
    document.getElementById(
      "message"
    );

  box.textContent =
    text;

  box.className =
    "message " + type;

  setTimeout(
    ()=>{
      box.className =
        "message";
    },
    5000
  );

}


/* =====================================================
   FORM
===================================================== */

function openItemForm(){

  document.getElementById(
    "itemForm"
  ).classList.add("show");

}


function closeItemForm(){

  document.getElementById(
    "itemForm"
  ).classList.remove("show");

}


/* =====================================================
   SAVE ITEM
===================================================== */

async function saveItem(){

  const itemId =
    document.getElementById(
      "itemId"
    ).value.trim();

  const name =
    document.getElementById(
      "itemName"
    ).value.trim();

  const unit =
    document.getElementById(
      "itemUnit"
    ).value;

  const costPrice =
    Number(
      document.getElementById(
        "costPrice"
      ).value || 0
    );

  const sellingPrice =
    Number(
      document.getElementById(
        "sellingPrice"
      ).value || 0
    );

  const category =
    document.getElementById(
      "itemCategory"
    ).value;

  const branchName =
    document.getElementById(
      "itemBranch"
    ).value;


  /* VALIDATION */

  if(!itemId){

    showMessage(
      "❌ Item ID galchi.",
      "error"
    );

    return;

  }


  if(!name){

    showMessage(
      "❌ Item Name galchi.",
      "error"
    );

    return;

  }


  if(!unit){

    showMessage(
      "❌ Unit filadhu.",
      "error"
    );

    return;

  }


  if(!category){

    showMessage(
      "❌ Category filadhu.",
      "error"
    );

    return;

  }


  if(!branchName){

    showMessage(
      "❌ Branch filadhu.",
      "error"
    );

    return;

  }


  if(costPrice < 0){

    showMessage(
      "❌ Cost Price sirrii miti.",
      "error"
    );

    return;

  }


  if(sellingPrice < 0){

    showMessage(
      "❌ Selling Price sirrii miti.",
      "error"
    );

    return;

  }


  /* CHECK DUPLICATE ITEM ID */

  const duplicate =
    items.find(
      item =>
        String(item.id) ===
        String(itemId)
    );


  if(duplicate){

    showMessage(
      "❌ Item ID kun duraan jira.",
      "error"
    );

    return;

  }


  /* ===================================================
     BRANCH ID
     Maqaa branch akka branch_id
     fayyadama.
  =================================================== */

  const data = {

    id: itemId,

    name: name,

    unit: unit,

    quantity: 0,

    cost_price: costPrice,

    selling_price: sellingPrice,

    category: category,

    branch_id: branchName

  };


  try{

    const response =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/items",

        {

          method:"POST",

          headers:getHeaders(),

          body:
            JSON.stringify(data)

        }

      );


    const text =
      await response.text();


    if(!response.ok){

      console.error(
        "Save item error:",
        text
      );

      showMessage(
        "❌ Item save hin milkoofne: " +
        text,
        "error"
      );

      return;

    }


    showMessage(
      "✅ Item haaraan sirriitti galmaa'e.",
      "success"
    );


    clearForm();

    closeItemForm();

    await loadItems();

  }
  catch(error){

    console.error(
      error
    );

    showMessage(
      "❌ Network error.",
      "error"
    );

  }

}


/* =====================================================
   CLEAR FORM
===================================================== */

function clearForm(){

  document.getElementById(
    "itemId"
  ).value = "";

  document.getElementById(
    "itemName"
  ).value = "";

  document.getElementById(
    "itemUnit"
  ).value = "";

  document.getElementById(
    "costPrice"
  ).value = "";

  document.getElementById(
    "sellingPrice"
  ).value = "";

  document.getElementById(
    "itemCategory"
  ).value = "";

  document.getElementById(
    "itemBranch"
  ).value = "";

}


/* =====================================================
   LOAD ITEMS
===================================================== */

async function loadItems(){

  const table =
    document.getElementById(
      "itemsTable"
    );

  table.innerHTML = `

    <tr>

      <td
        colspan="10"
        style="text-align:center;padding:25px">

        ⏳ Loading items...

      </td>

    </tr>

  `;


  try{

    const response =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/items" +
        "?select=*" +
        "&order=id.asc",

        {

          method:"GET",

          headers:getHeaders()

        }

      );


    const text =
      await response.text();


    if(!response.ok){

      console.error(
        "Load items error:",
        text
      );

      table.innerHTML = `

        <tr>

          <td
            colspan="10"
            style="text-align:center;padding:25px">

            ❌ Items loading error.

          </td>

        </tr>

      `;

      return;

    }


    items =
      JSON.parse(text);


    renderItems();

  }
  catch(error){

    console.error(
      error
    );

    table.innerHTML = `

      <tr>

        <td
          colspan="10"
          style="text-align:center;padding:25px">

          ❌ Network error.

        </td>

      </tr>

    `;

  }

}


/* =====================================================
   RENDER
===================================================== */

function renderItems(){

  const table =
    document.getElementById(
      "itemsTable"
    );

  table.innerHTML = "";


  if(items.length === 0){

    table.innerHTML = `

      <tr>

        <td
          colspan="10"
          style="text-align:center;padding:25px">

          📦 Item tokko illee hin galmoofne.

        </td>

      </tr>

    `;

    return;

  }


  items.forEach(
    (item,index)=>{

      const row =
        document.createElement(
          "tr"
        );


      row.innerHTML = `

        <td>
          ${index + 1}
        </td>

        <td>
          <strong>
            ${escapeHTML(item.id)}
          </strong>
        </td>

        <td>
          ${escapeHTML(item.name)}
        </td>

        <td>
          ${escapeHTML(item.unit)}
        </td>

        <td>
          ${Number(
            item.cost_price || 0
          ).toLocaleString()}
        </td>

        <td>
          ${Number(
            item.selling_price || 0
          ).toLocaleString()}
        </td>

        <td>
          <span class="category-badge">
            ${escapeHTML(
              item.category || "—"
            )}
          </span>
        </td>

        <td>
          <span class="branch-badge">
            ${escapeHTML(
              item.branch_id || "—"
            )}
          </span>
        </td>

        <td>
          ${Number(
            item.quantity || 0
          ).toLocaleString()}
        </td>

        <td>

          <button
            class="action-btn delete"
            onclick="deleteItem('${escapeHTML(item.id)}')">

            🗑 Delete

          </button>

        </td>

      `;


      table.appendChild(
        row
      );

    }
  );

}


/* =====================================================
   DELETE ITEM
===================================================== */

async function deleteItem(
  id
){

  const item =
    items.find(
      i =>
        String(i.id) ===
        String(id)
    );


  if(!item)
    return;


  const confirmed =
    confirm(
      "Item kana haqeeqa galuu? " +
      item.name
    );


  if(!confirmed)
    return;


  try{

    const response =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/items" +
        "?id=eq." +
        encodeURIComponent(id),

        {

          method:"DELETE",

          headers:getHeaders()

        }

      );


    const text =
      await response.text();


    if(!response.ok){

      console.error(
        "Delete error:",
        text
      );

      showMessage(
        "❌ Item haqamuu hin dandeenye: " +
        text,
        "error"
      );

      return;

    }


    showMessage(
      "✅ Item haqame.",
      "success"
    );


    await loadItems();

  }
  catch(error){

    console.error(
      error
    );

    showMessage(
      "❌ Network error.",
      "error"
    );

  }

}


/* =====================================================
   START
===================================================== */

loadItems();

</script>

</body>
</html>
