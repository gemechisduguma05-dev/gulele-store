/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://sslabegtsxlkafuygmar.supabase.co";

const SUPABASE_KEY =
"sb_publishable_M6oxZjm6xF5NbrXkSO9JqA_7JGSucXq";


/* =========================
   CHECK LOGIN
========================= */

const accessToken =
  localStorage.getItem("access_token");

if (!accessToken) {

  window.location.href =
    "index.html";

}


/* =========================
   LOAD ITEMS
========================= */

async function loadItems() {

  const token =
    localStorage.getItem("access_token")
    || SUPABASE_KEY;


  const response =
    await fetch(
      SUPABASE_URL +
      "/rest/v1/items?select=*&order=id.desc",
      {
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization":
            "Bearer " + token
        }
      }
    );


  if (!response.ok) {

    console.log(
      "Load error:",
      await response.text()
    );

    return;

  }


  const data =
    await response.json();


  const searchElement =
    document.getElementById("search");


  const search =
    searchElement
      ? searchElement.value.toLowerCase()
      : "";


  const list =
    document.getElementById("itemList");


  list.innerHTML = "";


  data
    .filter(item =>

      String(item.name || "")
        .toLowerCase()
        .includes(search)

      ||

      String(item.category || "")
        .toLowerCase()
        .includes(search)

    )


    .forEach(item => {


      list.innerHTML += `

        <tr>

          <td>
            ${item.name || ""}
          </td>

          <td>
            ${item.category || ""}
          </td>

          <td>
            ${item.quantity || 0}
          </td>

          <td>
            ${item.cost_price || 0}
          </td>

          <td>
            ${item.selling_price || 0}
          </td>

          <td>
            ${item.expiry_date || ""}
          </td>

          <td>
            ${item.entered_by || ""}
          </td>

          <td>

            ${
              item.created_at

                ? new Date(
                    item.created_at
                  ).toLocaleDateString()

                : ""

            }

          </td>


          <td>

            <div class="action">

              <button
                class="edit"
                onclick="editItem(
                  ${item.id},
                  '${String(item.name || "").replace(/'/g, "\\'")}',
                  '${String(item.category || "").replace(/'/g, "\\'")}',
                  ${item.cost_price || 0},
                  ${item.selling_price || 0}
                )">

                ✏️ Edit

              </button>


              <button
                class="del"
                onclick="deleteItem(${item.id})">

                🗑️ Delete

              </button>

            </div>

          </td>

        </tr>

      `;

    });

}


/* =========================
   ADD ITEM
========================= */

async function addItem() {


  const name =
    document.getElementById(
      "name"
    ).value.trim();


  const category =
    document.getElementById(
      "category"
    ).value;


  const quantity =
    Number(
      document.getElementById(
        "quantity"
      ).value
    );


  const cost =
    Number(
      document.getElementById(
        "cost"
      ).value
    );


  const selling =
    Number(
      document.getElementById(
        "selling"
      ).value
    );


  const expiryDate =
    document.getElementById(
      "expiryDate"
    ).value;


  if (!name || !category) {

    alert(
      "Item name fi category guuti."
    );

    return;

  }


  const enteredBy =
    prompt(
      "Maqaa nama galche:"
    );


  if (!enteredBy) {

    alert(
      "Maqaa nama galche galchi."
    );

    return;

  }


  const item = {

    name: name,

    category: category,

    quantity: quantity,

    cost_price: cost,

    selling_price: selling,

    expiry_date:
      expiryDate || null,

    entered_by:
      enteredBy

  };


  const response =
    await fetch(
      SUPABASE_URL +
      "/rest/v1/items",
      {

        method: "POST",

        headers: {

          "Content-Type":
            "application/json",

          "apikey":
            SUPABASE_KEY,

          "Authorization":
            "Bearer " +
            (
              localStorage.getItem(
                "access_token"
              )
              || SUPABASE_KEY
            ),

          "Prefer":
            "return=minimal"

        },

        body:
          JSON.stringify(item)

      }
    );


  if (response.ok) {

    alert(
      "Item added successfully!"
    );


    document.getElementById(
      "name"
    ).value = "";


    document.getElementById(
      "category"
    ).value = "";


    document.getElementById(
      "quantity"
    ).value = "";


    document.getElementById(
      "cost"
    ).value = "";


    document.getElementById(
      "selling"
    ).value = "";


    document.getElementById(
      "expiryDate"
    ).value = "";


    loadItems();


  } else {

    alert(
      "Add Error: " +
      await response.text()
    );

  }

}


/* =========================
   EDIT ITEM
========================= */

async function editItem(
  id,
  oldName,
  oldCategory,
  oldCost,
  oldSelling
) {


  const newName =
    prompt(
      "Maqaa item:",
      oldName
    );


  if (newName === null)
    return;


  const newCategory =
    prompt(
      "Category:",
      oldCategory
    );


  if (newCategory === null)
    return;


  const newCost =
    prompt(
      "Cost Price:",
      oldCost
    );


  if (newCost === null)
    return;


  const newSelling =
    prompt(
      "Selling Price:",
      oldSelling
    );


  if (newSelling === null)
    return;


  const response =
    await fetch(
      SUPABASE_URL +
      "/rest/v1/items?id=eq." +
      id,
      {

        method: "PATCH",

        headers: {

          "Content-Type":
            "application/json",

          "apikey":
            SUPABASE_KEY,

          "Authorization":
            "Bearer " +
            (
              localStorage.getItem(
                "access_token"
              )
              || SUPABASE_KEY
            ),

          "Prefer":
            "return=minimal"

        },

        body:
          JSON.stringify({

            name:
              newName,

            category:
              newCategory,

            cost_price:
              Number(newCost),

            selling_price:
              Number(newSelling)

          })

      }
    );


  if (response.ok) {

    alert(
      "Item updated successfully!"
    );

    loadItems();

  } else {

    alert(
      "Edit Error: " +
      await response.text()
    );

  }

}


/* =========================
   DELETE ITEM
========================= */

async function deleteItem(id) {


  if (
    !confirm(
      "Item kana haquu barbaaddaa?"
    )
  ) {

    return;

  }


  const response =
    await fetch(
      SUPABASE_URL +
      "/rest/v1/items?id=eq." +
      id,
      {

        method: "DELETE",

        headers: {

          "apikey":
            SUPABASE_KEY,

          "Authorization":
            "Bearer " +
            (
              localStorage.getItem(
                "access_token"
              )
              || SUPABASE_KEY
            )

        }

      }
    );


  if (response.ok) {

    alert(
      "Item deleted."
    );

    loadItems();

  } else {

    alert(
      "Delete Error: " +
      await response.text()
    );

  }

}


/* =========================
   LOGOUT
========================= */

function logoutUser() {

  localStorage.removeItem(
    "access_token"
  );

  localStorage.removeItem(
    "refresh_token"
  );

  window.location.href =
    "index.html";

}


/* =========================
   START
========================= */

loadItems();
