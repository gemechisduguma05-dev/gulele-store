<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>AAFDRMC - Items</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f1f5f9;
  color:#1e293b;
}

header{
  background:#1e3a8a;
  color:white;
  padding:18px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:22px;
}

.container{
  width:96%;
  max-width:1400px;
  margin:20px auto;
}

.top-bar{
  background:white;
  padding:18px;
  border-radius:10px;
  margin-bottom:18px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.title{
  font-size:22px;
  font-weight:bold;
  color:#1e3a8a;
}

.buttons{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:12px;
}

.btn{
  border:none;
  padding:10px 16px;
  border-radius:7px;
  cursor:pointer;
  color:white;
  font-weight:bold;
  text-decoration:none;
}

.btn-add{
  background:#15803d;
}

.btn-stock{
  background:#1e3a8a;
}

.form-box{
  display:none;
  background:white;
  padding:20px;
  border-radius:10px;
  margin-bottom:18px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.form-box.show{
  display:block;
}

.form-title{
  font-size:20px;
  font-weight:bold;
  color:#1e3a8a;
  margin-bottom:15px;
}

.form-grid{
  display:grid;
  grid-template-columns:
  repeat(auto-fit,minmax(230px,1fr));
  gap:14px;
}

.form-group{
  display:flex;
  flex-direction:column;
}

.form-group label{
  font-weight:bold;
  margin-bottom:6px;
}

.form-group input,
.form-group select{
  width:100%;
  padding:11px;
  border:1px solid #cbd5e1;
  border-radius:7px;
  font-size:15px;
}

.form-buttons{
  display:flex;
  gap:10px;
  margin-top:17px;
}

.save-btn,
.cancel-btn{
  border:none;
  padding:11px 20px;
  border-radius:7px;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.save-btn{
  background:#15803d;
}

.cancel-btn{
  background:#64748b;
}

.message{
  display:none;
  padding:12px;
  border-radius:7px;
  margin-bottom:15px;
  font-weight:bold;
}

.message.success{
  display:block;
  background:#dcfce7;
  color:#166534;
}

.message.error{
  display:block;
  background:#fee2e2;
  color:#991b1b;
}

.table-box{
  background:white;
  border-radius:10px;
  overflow-x:auto;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:900px;
}

th{
  background:#1e3a8a;
  color:white;
  padding:13px;
  text-align:left;
}

td{
  padding:12px;
  border-bottom:1px solid #e2e8f0;
}

tr:hover{
  background:#f8fafc;
}

.edit-btn{
  background:#2563eb;
  color:white;
  border:none;
  padding:7px 11px;
  border-radius:6px;
  cursor:pointer;
  margin-right:5px;
}

.delete-btn{
  background:#dc2626;
  color:white;
  border:none;
  padding:7px 11px;
  border-radius:6px;
  cursor:pointer;
}

.category-text{
  font-size:13px;
  line-height:1.5;
}

</style>

</head>


<body>


<header>

<h1>
AAFDRMC - ITEM MANAGEMENT
</h1>

</header>


<div class="container">


<div class="top-bar">

<div class="title">
📦 Item Management
</div>

<div class="buttons">

<button
class="btn btn-add"
onclick="openAddForm()">

➕ Add New Item

</button>

<a
href="stock.html"
class="btn btn-stock">

📊 Stock Management

</a>

</div>

</div>


<div
id="message"
class="message">
</div>


<!-- =================================================
     ADD / EDIT
================================================= -->

<div
id="itemForm"
class="form-box">

<div
id="formTitle"
class="form-title">

➕ Add New Item

</div>


<div class="form-grid">


<div class="form-group">

<label>
Item Name
</label>

<input
type="text"
id="itemName"
placeholder="Item maqaa galchi">

</div>


<div class="form-group">

<label>
Unit
</label>

<select id="itemUnit">

<option value="">
-- Select Unit --
</option>

<option value="Quintal">
Quintal
</option>

<option value="Kg">
Kg
</option>

<option value="Ton">
Ton
</option>

<option value="Liter">
Liter
</option>

<option value="Piece">
Piece
</option>

<option value="Carton">
Carton
</option>

<option value="Bag">
Bag
</option>

<option value="Packet">
Packet
</option>

<option value="Set">
Set
</option>

<option value="Pair">
Pair
</option>

<option value="Other">
Other
</option>

</select>

</div>


<div class="form-group">

<label>
Category
</label>

<select id="itemCategory">

<option value="">
-- Select Category --
</option>

<option value="Meeshaalee Nyaataa Tarsiimawaa / Strategic Food Items / ስትራቴጂክ ምግብ ነክ">

🥫 Meeshaalee Nyaataa Tarsiimawaa /
Strategic Food Items /
ስትራቴጂክ ምግብ ነክ

</option>

<option value="Meeshaalee Nyaataa Guyyaa Guyyaa / Daily Food Items / ምግብ ነክ የእለት ደሪሽ">

🍚 Meeshaalee Nyaataa Guyyaa Guyyaa /
Daily Food Items /
ምግብ ነክ የእለት ደሪሽ

</option>

<option value="Meeshaalee Nyaataa Hin Taane Guyyaa Guyyaa / Daily Non-Food Items / ምግብ ነክ ያልሆነ የእለት ደሪሽ">

📦 Meeshaalee Nyaataa Hin Taane Guyyaa Guyyaa /
Daily Non-Food Items /
ምግብ ነክ ያልሆነ የእለት ደሪሽ

</option>

<option value="Meeshaalee Nyaataa Hin Taane Ittiin Nyaata Qopheessan / Non-Food Kitchen Items / ምግብ ነክ ያልሆነ የምግብ እቃ">

🍳 Meeshaalee Nyaataa Hin Taane Ittiin Nyaata Qopheessan /
Non-Food Kitchen Items /
ምግብ ነክ ያልሆነ የምግብ እቃ

</option>

<option value="Meeshaalee Qulqullinaa / Non-Food Hygiene Items / ምግብ ነክ ያልሆነ የንጽሕና">

🧼 Meeshaalee Qulqullinaa /
Non-Food Hygiene Items /
ምግብ ነክ ያልሆነ የንጽሕና

</option>

<option value="Meeshaalee Ijaarsaa / Non-Food Construction Materials / ምግብ ነክ ያልሆነ የግንባታ እቃዎች">

🧱 Meeshaalee Ijaarsaa /
Non-Food Construction Materials /
ምግብ ነክ ያልሆነ የግንባታ እቃዎች

</option>

</select>

</div>

</div>


<div class="form-buttons">

<button
id="saveButton"
class="save-btn"
onclick="saveItem()">

💾 Save Item

</button>

<button
class="cancel-btn"
onclick="closeForm()">

Cancel

</button>

</div>

</div>


<!-- =================================================
     TABLE
================================================= -->

<div class="table-box">

<table>

<thead>

<tr>

<th>No</th>

<th>Item Name</th>

<th>Unit</th>

<th>Category</th>

<th>Action</th>

</tr>

</thead>


<tbody id="itemsTable">

<tr>

<td
colspan="5"
style="text-align:center;padding:25px">

Loading...

</td>

</tr>

</tbody>

</table>

</div>


</div>


<script>


/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://sslabegtsxlkafuygmar.supabase.co";


const SUPABASE_KEY =
"sb_publishable_M6oxZjm6xF5NbrXkSO9JqA_7JGSucXq";


/* =====================================================
   HEADERS
===================================================== */

function getHeaders(){

const accessToken =
localStorage.getItem("access_token")
|| SUPABASE_KEY;

return{

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer " + accessToken,

"Content-Type":
"application/json"

};

}


/* =====================================================
   GLOBAL
===================================================== */

let allItems = [];

let editItemId = null;


/* =====================================================
   ESCAPE
===================================================== */

function escapeHTML(value){

return String(value ?? "")

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}


/* =====================================================
   LOAD ITEMS
===================================================== */

async function loadItems(){

const table =
document.getElementById(
"itemsTable"
);

try{

const response =
await fetch(

SUPABASE_URL +
"/rest/v1/items?select=*&order=id.asc",

{
headers:
getHeaders()
}

);

if(!response.ok){

const error =
await response.text();

console.log(
"Load Error:",
error
);

table.innerHTML = `

<tr>

<td
colspan="5"
style="text-align:center">

Items load hin milkoofne.

</td>

</tr>

`;

return;

}

allItems =
await response.json();

displayItems();

}

catch(error){

console.log(
"Load Error:",
error
);

table.innerHTML = `

<tr>

<td
colspan="5"
style="text-align:center">

Network error.

</td>

</tr>

`;

}

}


/* =====================================================
   DISPLAY
===================================================== */

function displayItems(){

const table =
document.getElementById(
"itemsTable"
);

table.innerHTML = "";


if(allItems.length === 0){

table.innerHTML = `

<tr>

<td
colspan="5"
style="
text-align:center;
padding:25px">

Item hin jiru.

</td>

</tr>

`;

return;

}


allItems.forEach(
(item,index)=>{

const category =
item.category || "—";


const row =
document.createElement("tr");


row.innerHTML = `

<td>
${index + 1}
</td>

<td>
<strong>
${escapeHTML(item.name || "")}
</strong>
</td>

<td>
${escapeHTML(item.unit || "")}
</td>

<td class="category-text">
${escapeHTML(category)}
</td>

<td>

<button
class="edit-btn"
onclick="editItem(${item.id})">

✏️ Edit

</button>

<button
class="delete-btn"
onclick="deleteItem(${item.id})">

🗑️ Delete

</button>

</td>

`;

table.appendChild(row);

});

}


/* =====================================================
   ADD FORM
===================================================== */

function openAddForm(){

editItemId = null;

document.getElementById(
"formTitle"
).textContent =
"➕ Add New Item";

document.getElementById(
"saveButton"
).textContent =
"💾 Save Item";

document.getElementById(
"itemName"
).value = "";

document.getElementById(
"itemUnit"
).value = "";

document.getElementById(
"itemCategory"
).value = "";

document.getElementById(
"itemForm"
).classList.add("show");

}


/* =====================================================
   CLOSE FORM
===================================================== */

function closeForm(){

editItemId = null;

document.getElementById(
"itemForm"
).classList.remove("show");

}


/* =====================================================
   SAVE ITEM
===================================================== */

async function saveItem(){

const name =
document.getElementById(
"itemName"
).value.trim();


const unit =
document.getElementById(
"itemUnit"
).value;


const category =
document.getElementById(
"itemCategory"
).value;


if(!name){

showMessage(
"Item maqaa galchi.",
"error"
);

return;

}


if(!unit){

showMessage(
"Unit filadhu.",
"error"
);

return;

}


if(!category){

showMessage(
"Category filadhu.",
"error"
);

return;

}


/*
=======================================================
IMPORTANT

category_id HIN ERGINU.

Sababni:
category_id database kee keessatti UUID dha.

Category maqaa guutuu category column keessatti
galmeessina.
=======================================================
*/

const data = {

name:
name,

unit:
unit,

category:
category

};


/* =====================================================
   ADD
===================================================== */

if(editItemId === null){

try{

const response =
await fetch(

SUPABASE_URL +
"/rest/v1/items",

{

method:"POST",

headers:{

...getHeaders(),

"Prefer":
"return=representation"

},

body:
JSON.stringify(data)

}

);


if(!response.ok){

const error =
await response.text();

console.log(
"Insert Error:",
error
);

showMessage(
"Save hin milkoofne: " +
error,
"error"
);

return;

}


showMessage(
"✅ Item haaraan galmaa'e.",
"success"
);

closeForm();

await loadItems();

}

catch(error){

console.log(error);

showMessage(
"Network error.",
"error"
);

}

return;

}


/* =====================================================
   EDIT
===================================================== */

try{

const response =
await fetch(

SUPABASE_URL +
"/rest/v1/items?id=eq." +
editItemId,

{

method:"PATCH",

headers:{

...getHeaders(),

"Prefer":
"return=representation"

},

body:
JSON.stringify(data)

}

);


if(!response.ok){

const error =
await response.text();

console.log(
"Update Error:",
error
);

showMessage(
"Edit hin milkoofne: " +
error,
"error"
);

return;

}


showMessage(
"✅ Item sirreeffame.",
"success"
);

closeForm();

await loadItems();

}

catch(error){

console.log(error);

showMessage(
"Network error.",
"error"
);

}

}


/* =====================================================
   EDIT ITEM
===================================================== */

function editItem(id){

const item =
allItems.find(

i =>
String(i.id) ===
String(id)

);


if(!item){

showMessage(
"Item hin argamne.",
"error"
);

return;

}


editItemId =
id;


document.getElementById(
"formTitle"
).textContent =
"✏️ Edit Item";


document.getElementById(
"saveButton"
).textContent =
"💾 Update Item";


document.getElementById(
"itemName"
).value =
item.name || "";


document.getElementById(
"itemUnit"
).value =
item.unit || "";


document.getElementById(
"itemCategory"
).value =
item.category || "";


document.getElementById(
"itemForm"
).classList.add("show");


window.scrollTo({

top:0,

behavior:"smooth"

});

}


/* =====================================================
   DELETE
===================================================== */

async function deleteItem(id){

const item =
allItems.find(

i =>
String(i.id) ===
String(id)

);


if(!item)
return;


const confirmed =
confirm(

`"${item.name}" haqachuu mirkaneessitaa?`

);


if(!confirmed)
return;


try{

const response =
await fetch(

SUPABASE_URL +
"/rest/v1/items?id=eq." +
id,

{

method:"DELETE",

headers:
getHeaders()

}

);


if(!response.ok){

const error =
await response.text();

console.log(
"Delete Error:",
error
);

showMessage(
"Delete hin milkoofne: " +
error,
"error"
);

return;

}


showMessage(
"🗑️ Item haqame.",
"success"
);

await loadItems();

}

catch(error){

console.log(error);

showMessage(
"Network error.",
"error"
);

}

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(text,type){

const box =
document.getElementById(
"message"
);

box.textContent =
text;

box.className =
"message " + type;


setTimeout(()=>{

box.className =
"message";

},5000);

}


/* =====================================================
   START
===================================================== */

loadItems();

</script>

</body>

</html>
