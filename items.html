<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>AAFDRMC - Item Management</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5efe8;
    color:#3e2723;
}

/* ================= HEADER ================= */

.header{
    background:#5d4037;
    color:white;
    padding:14px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    flex-wrap:wrap;
    box-shadow:0 3px 10px rgba(0,0,0,.18);
}

.header-left{
    display:flex;
    align-items:center;
    gap:12px;
}

/* PROFILE / LOGO */

.logo-box{
    width:58px;
    height:58px;
    border-radius:50%;
    overflow:hidden;
    background:white;
    border:3px solid #d7ccc8;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
}

.logo{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.title{
    font-size:21px;
    font-weight:bold;
}

.branch-name{
    font-size:13px;
    margin-top:5px;
    opacity:.9;
}

/* ================= HEADER BUTTONS ================= */

.header-buttons{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

button{
    border:none;
    border-radius:8px;
    padding:10px 15px;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.btn-menu{
    background:#efebe9;
    color:#4e342e;
}

.btn-logout{
    background:#8d6e63;
    color:white;
}

/* ================= CONTAINER ================= */

.container{
    max-width:1100px;
    margin:25px auto;
    padding:0 15px;
}

/* ================= CARD ================= */

.card{
    background:white;
    border-radius:14px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 3px 12px rgba(62,39,35,.10);
}

.card h2{
    margin-top:0;
    color:#5d4037;
}

/* ================= INFO ================= */

.info{
    background:#fff8e1;
    border-left:4px solid #8d6e63;
    padding:12px;
    margin-bottom:18px;
    border-radius:6px;
    font-size:14px;
}

/* ================= FORM ================= */

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.field{
    display:flex;
    flex-direction:column;
}

.field label{
    font-weight:bold;
    margin-bottom:6px;
    font-size:14px;
}

input,
select{
    width:100%;
    padding:12px;
    border:1px solid #d7ccc8;
    border-radius:8px;
    font-size:15px;
    outline:none;
    background:white;
}

input:focus,
select:focus{
    border-color:#795548;
    box-shadow:0 0 0 2px rgba(121,85,72,.12);
}

/* ================= FORM BUTTONS ================= */

.form-buttons{
    margin-top:18px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.btn-save{
    background:#6d4c41;
    color:white;
}

.btn-clear{
    background:#d7ccc8;
    color:#3e2723;
}

/* ================= MESSAGE ================= */

.message{
    margin-top:15px;
    padding:12px;
    border-radius:8px;
    display:none;
    font-weight:bold;
    word-break:break-word;
}

.message.success{
    display:block;
    background:#e8f5e9;
    color:#2e7d32;
}

.message.error{
    display:block;
    background:#ffebee;
    color:#c62828;
}

/* ================= TABLE ================= */

.table-wrap{
    width:100%;
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:650px;
}

th{
    background:#6d4c41;
    color:white;
    padding:12px;
    text-align:left;
}

td{
    padding:11px;
    border-bottom:1px solid #eee;
}

tr:hover{
    background:#faf7f4;
}

.badge{
    display:inline-block;
    padding:6px 9px;
    border-radius:15px;
    background:#efebe9;
    color:#5d4037;
    font-size:12px;
    font-weight:bold;
}

/* ================= ACTION BUTTONS ================= */

.action-btn{
    padding:7px 10px;
    margin:2px;
    font-size:12px;
}

.edit{
    background:#ffe0b2;
    color:#e65100;
}

.delete{
    background:#ffcdd2;
    color:#b71c1c;
}

/* ================= STATUS ================= */

.loading{
    text-align:center;
    padding:20px;
    color:#795548;
}

.empty{
    text-align:center;
    padding:25px;
    color:#795548;
}

/* ================= MOBILE ================= */

@media(max-width:700px){

    .header{
        align-items:flex-start;
    }

    .title{
        font-size:17px;
    }

    .logo-box{
        width:48px;
        height:48px;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .container{
        margin-top:15px;
    }

    .card{
        padding:15px;
    }

    .header-buttons{
        width:100%;
    }

    .header-buttons button{
        flex:1;
    }

}

</style>

</head>


<body>


<!-- ================= HEADER ================= -->

<header class="header">

    <div class="header-left">

        <div class="logo-box">

            <!-- SUURAA KEE KAN JALQABA IRRA JIRU -->

            <img
                src="./1788633150526.jpg"
                class="logo"
                alt="AAFDRMC Profile"
            >

        </div>


        <div>

            <div class="title">
                AAFDRMC - Item Management
            </div>

            <div
                class="branch-name"
                id="branchDisplay">
                Branch: Loading...
            </div>

        </div>

    </div>


    <div class="header-buttons">

        <button
            class="btn-menu"
            onclick="goDashboard()">
            ← Dashboard
        </button>


        <button
            class="btn-logout"
            onclick="logout()">
            Logout
        </button>

    </div>

</header>



<!-- ================= MAIN ================= -->

<main class="container">


    <!-- ================= ADD ITEM ================= -->

    <section class="card">

        <h2 id="formTitle">
            Add New Item
        </h2>


        <div class="info">

            <strong>Item ID:</strong>

            ID harkaan hin galchinu.
            Database'n ofumaan ID uuma.

        </div>


        <div class="form-grid">


            <!-- ITEM NAME -->

            <div class="field">

                <label>
                    Item Name / Maqaa Meeshaa
                </label>

                <input
                    type="text"
                    id="itemName"
                    placeholder="Fakkeenya: Xaafii">

            </div>


            <!-- CATEGORY -->

            <div class="field">

                <label>
                    Category / Ramaddii / ምድብ
                </label>


                <select id="category">

                    <option value="">
                        -- Category / Ramaddii / ምድብ ይምረጡ --
                    </option>


                    <option value="Meeshaalee Nyaataa Tarsiimawaa">
                        Meeshaalee Nyaataa Tarsiimawaa /
                        Strategic Food Items /
                        ስትራቴጂክ ምግብ ነክ
                    </option>


                    <option value="Meeshaalee Nyaataa Guyyaa Guyyaa">
                        Meeshaalee Nyaataa Guyyaa Guyyaa /
                        Daily Food Items /
                        የዕለት ምግብ ነክ

                    <option value="Meeshaalee Nyaataa Hin Taane Guyyaa Guyyaa">
                        Meeshaalee Nyaataa Hin Taane Guyyaa Guyyaa /
                        Daily Non-Food Items /
                        የዕለት ምግብ ነክ ያልሆኑ
                    </option>


                    <option value="Meeshaalee Nyaataa Hin Taane Ittiin Nyaata Qopheessan">
                        Meeshaalee Nyaataa Hin Taane
                        Ittiin Nyaata Qopheessan /
                        Non-Food Kitchen Items /
                        የምግብ ዝግጅት የማይሆኑ እቃዎች
                    </option>


                    <option value="Meeshaalee Qulqullinaa">
                        Meeshaalee Qulqullinaa /
                        Non-Food Hygiene Items /
                        የንጽህና እቃዎች
                    </option>


                    <option value="Meeshaa Ijaarsa Manaaf Oolu">
                        Meeshaa Ijaarsa Manaaf Oolu /
                        Building & Construction Items /
                        የግንባታ እቃዎች
                    </option>

                </select>

            </div>

        </div>


        <!-- BUTTONS -->

        <div class="form-buttons">

            <button
                class="btn-save"
                id="saveButton"
                onclick="saveItem()">

                + Save Item

            </button>


            <button
                class="btn-clear"
                onclick="clearForm()">

                Clear

            </button>

        </div>


        <div
            id="message"
            class="message">
        </div>

    </section>



    <!-- ================= ITEMS LIST ================= -->

    <section class="card">

        <h2>
            Items
        </h2>


        <div
            id="loading"
            class="loading">

            Loading items...

        </div>


        <div class="table-wrap">

            <table
                id="itemsTable"
                style="display:none;">

                <thead>

                    <tr>

                        <th>
                            ID
                        </th>

                        <th>
                            Item Name
                        </th>

                        <th>
                            Category
                        </th>

                        <th>
                            Actions
                        </th>

                    </tr>

                </thead>


                <tbody
                    id="itemsBody">
                </tbody>

            </table>

        </div>


        <div
            id="empty"
            class="empty"
            style="display:none;">

            No items found for this branch.

        </div>

    </section>

</main>



<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://sslabegtsxlkafuygmar.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_M6oxZjm6xF5NbrXkSO9JqA_7JGSucXq";


/* =====================================================
   BRANCH DATA
===================================================== */

let branchId =
    localStorage.getItem("selected_branch_id");

let branchName =
    localStorage.getItem("selected_branch_name");

let branchCode =
    localStorage.getItem("selected_branch_code");


/* =====================================================
   EDITING
===================================================== */

let editingId = null;


/* =====================================================
   PAGE START
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        /* Login check */

        if(
            localStorage.getItem("is_logged_in")
            !== "true"
        ){

            window.location.href =
                "index.html";

            return;
        }


        /* Show branch */

        document
            .getElementById("branchDisplay")
            .textContent =
                "Branch: " +
                (branchName || "Main");


        /* Load items */

        loadItems();

    }
);


/* =====================================================
   SUPABASE HEADERS
===================================================== */

function headers(extra = {}){

    return {

        "apikey":
            SUPABASE_KEY,

        "Authorization":
            "Bearer " + SUPABASE_KEY,

        "Content-Type":
            "application/json",

        ...extra

    };

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
    text,
    type
){

    const box =
        document.getElementById("message");

    box.textContent =
        text;

    box.className =
        "message " + type;

}


/* =====================================================
   CLEAR MESSAGE
===================================================== */

function clearMessage(){

    const box =
        document.getElementById("message");

    box.textContent =
        "";

    box.className =
        "message";

}


/* =====================================================
   FIND BRANCH
===================================================== */

async function findBranchId(){

    if(branchId){

        return branchId;

    }


    try{

        const response =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/branches?select=*",
                {
                    method:"GET",
                    headers:headers()
                }
            );


        if(!response.ok){

            console.log(
                await response.text()
            );

            return null;

        }


        const branches =
            await response.json();


        if(!Array.isArray(branches)){

            return null;

        }


        const wantedName =
            String(
                branchName || ""
            )
            .trim()
            .toLowerCase();


        const wantedCode =
            String(
                branchCode || ""
            )
            .trim()
            .toLowerCase();


        for(
            const b of branches
        ){

            const names = [

                b.name,
                b.branch_name,
                b.branch,
                b.branchName,
                b.title,
                b.branch_title,
                b.office_name,
                b.office

            ];


            const codes = [

                b.code,
                b.branch_code,
                b.branchCode

            ];


            const foundName =
                names.some(
                    value =>

                    value !== undefined &&
                    value !== null &&
                    String(value)
                        .trim()
                        .toLowerCase()
                    === wantedName
                );


            const foundCode =
                codes.some(
                    value =>

                    value !== undefined &&
                    value !== null &&
                    String(value)
                        .trim()
                        .toLowerCase()
                    === wantedCode
                );


            if(
                foundName ||
                foundCode
            ){

                if(
                    b.id !== undefined &&
                    b.id !== null
                ){

                    branchId =
                        String(b.id);


                    localStorage.setItem(
                        "selected_branch_id",
                        branchId
                    );


                    return branchId;

                }

            }

        }

    }
    catch(error){

        console.error(error);

    }


    return null;

}


/* =====================================================
   LOAD ITEMS
===================================================== */

async function loadItems(){

    const loading =
        document.getElementById("loading");

    const table =
        document.getElementById("itemsTable");

    const empty =
        document.getElementById("empty");


    loading.style.display =
        "block";

    table.style.display =
        "none";

    empty.style.display =
        "none";


    try{

        const id =
            await findBranchId();


        let url =
            SUPABASE_URL +
            "/rest/v1/items?select=*";


        /*
           Branch ID yoo jiraate
        */

        if(id){

            url +=
                "&branch_id=eq." +
                encodeURIComponent(id);

        }

        /*
           Yoo branch ID hin jirre
           branch code fayyadami
        */

        else if(branchCode){

            url +=
                "&branch_code=eq." +
                encodeURIComponent(
                    branchCode
                );

        }

        else{

            showMessage(
                "Branch hin beekamne. Mee Login irra deebi'i.",
                "error"
            );

            loading.style.display =
                "none";

            return;

        }


        url +=
            "&order=id.asc";


        const response =
            await fetch(
                url,
                {
                    method:"GET",
                    headers:headers()
                }
            );


        const text =
            await response.text();


        if(!response.ok){

            console.error(text);

            showMessage(
                "Items loading hin milkoofne: " +
                text,
                "error"
            );

            loading.style.display =
                "none";

            return;

        }


        const items =
            JSON.parse(text);


        renderItems(items);

    }
    catch(error){

        console.error(error);

        showMessage(
            "Rakkoo connection: " +
            error.message,
            "error"
        );

        loading.style.display =
            "none";

    }

}


/* =====================================================
   DISPLAY ITEMS
===================================================== */

function renderItems(items){

    const loading =
        document.getElementById("loading");

    const table =
        document.getElementById("itemsTable");

    const empty =
        document.getElementById("empty");

    const body =
        document.getElementById("itemsBody");


    loading.style.display =
        "none";


    body.innerHTML =
        "";


    if(
        !items ||
        items.length === 0
    ){

        table.style.display =
            "none";

        empty.style.display =
            "block";

        return;

    }


    table.style.display =
        "table";

    empty.style.display =
        "none";


    items.forEach(
        item => {

            const row =
                document.createElement("tr");


            const id =
                item.id ?? "";


            const name =
                item.name ?? "";


            const category =
                item.category ?? "";


            row.innerHTML = `

                <td>
                    ${escapeHtml(
                        String(id)
                    )}
                </td>

                <td>
                    <strong>
                        ${escapeHtml(
                            String(name)
                        )}
                    </strong>
                </td>

                <td>
                    <span class="badge">
                        ${escapeHtml(
                            String(category)
                        )}
                    </span>
                </td>

                <td>

                    <button
                        class="action-btn edit"
                        onclick='editItem(
                            ${JSON.stringify(item)}
                        )'>

                        Edit

                    </button>


                    <button
                        class="action-btn delete"
                        onclick="deleteItem(
                            '${escapeJs(
                                String(id)
                            )}'
                        )">

                        Delete

                    </button>

                </td>

            `;


            body.appendChild(row);

        }
    );

}


/* =====================================================
   SAVE ITEM
===================================================== */

async function saveItem(){

    clearMessage();


    const name =
        document
        .getElementById("itemName")
        .value
        .trim();


    const category =
        document
        .getElementById("category")
        .value
        .trim();


    if(!name){

        showMessage(
            "Maqaa item galchi.",
            "error"
        );

        return;

    }


    if(!category){

        showMessage(
            "Category filadhu.",
            "error"
        );

        return;

    }


    const id =
        await findBranchId();


    if(
        !id &&
        !branchCode
    ){

        showMessage(
            "Branch ID ykn Branch Code hin argamne. Login irra deebi'i.",
            "error"
        );

        return;

    }


    const saveButton =
        document.getElementById(
            "saveButton"
        );


    saveButton.disabled =
        true;


    saveButton.textContent =
        editingId !== null
        ? "Updating..."
        : "Saving...";


    try{

        /* =================================================
           EDIT
        ================================================= */

        if(
            editingId !== null
        ){

            const data = {

                name:name,

                category:category

            };


            const response =
                await fetch(

                    SUPABASE_URL +
                    "/rest/v1/items?id=eq." +
                    encodeURIComponent(
                        editingId
                    ),

                    {
                        method:"PATCH",

                        headers:headers({

                            "Prefer":
                                "return=representation"

                        }),

                        body:
                            JSON.stringify(
                                data
                            )
                    }

                );


            const text =
                await response.text();


            if(!response.ok){

                throw new Error(text);

            }


            showMessage(
                "Item sirriitti fooyya'e.",
                "success"
            );


            clearForm();

            await loadItems();

            return;

        }


        /* =================================================
           NEW ITEM
        ================================================= */


        /*
           ID hin erginu.
           Database'n ofumaan uuma.
        */

        const data = {

            name:name,

            category:category,

            branch_id:
                id || null,

            branch_code:
                branchCode || null

        };


        const response =
            await fetch(

                SUPABASE_URL +
                "/rest/v1/items",

                {
                    method:"POST",

                    headers:headers({

                        "Prefer":
                            "return=representation"

                    }),

                    body:
                        JSON.stringify(
                            data
                        )
                }

            );


        const text =
            await response.text();


        if(!response.ok){

            throw new Error(text);

        }


        showMessage(
            "Item haaraan sirriitti galmaa'e.",
            "success"
        );


        clearForm();

        await loadItems();

    }
    catch(error){

        console.error(error);

        showMessage(
            "Save hin milkoofne: " +
            error.message,
            "error"
        );

    }
    finally{

        saveButton.disabled =
            false;


        saveButton.textContent =
            editingId !== null
            ? "Update Item"
            : "+ Save Item";

    }

}


/* =====================================================
   EDIT ITEM
===================================================== */

function editItem(item){

    editingId =
        item.id;


    document
        .getElementById("itemName")
        .value =
            item.name || "";


    document
        .getElementById("category")
        .value =
            item.category || "";


    document
        .getElementById("formTitle")
        .textContent =
            "Edit Item";


    document
        .getElementById("saveButton")
        .textContent =
            "Update Item";


    window.scrollTo({

        top:0,

        behavior:"smooth"

    });

}


/* =====================================================
   DELETE ITEM
===================================================== */

async function deleteItem(id){

    if(!id){

        return;

    }


    const ok =
        confirm(
            "Item kana haqeeqaatti haquu barbaaddaa?"
        );


    if(!ok){

        return;

    }


    try{

        const response =
            await fetch(

                SUPABASE_URL +
                "/rest/v1/items?id=eq." +
                encodeURIComponent(id),

                {
                    method:"DELETE",

                    headers:headers({

                        "Prefer":
                            "return=minimal"

                    })
                }

            );


        const text =
            await response.text();


        if(!response.ok){

            throw new Error(text);

        }


        showMessage(
            "Item haqameera.",
            "success"
        );


        await loadItems();

    }
    catch(error){

        console.error(error);

        showMessage(
            "Delete hin milkoofne: " +
            error.message,
            "error"
        );

    }

}


/* =====================================================
   CLEAR FORM
===================================================== */

function clearForm(){

    editingId =
        null;


    document
        .getElementById("itemName")
        .value =
            "";


    document
        .getElementById("category")
        .value =
            "";


    document
        .getElementById("formTitle")
        .textContent =
            "Add New Item";


    document
        .getElementById("saveButton")
        .textContent =
            "+ Save Item";


    clearMessage();

}


/* =====================================================
   DASHBOARD
===================================================== */

function goDashboard(){

    window.location.href =
        "dashboard.html";

}


/* =====================================================
   LOGOUT
===================================================== */

function logout(){

    localStorage.removeItem(
        "is_logged_in"
    );

    localStorage.removeItem(
        "user_role"
    );

    localStorage.removeItem(
        "login_user"
    );

    localStorage.removeItem(
        "access_token"
    );

    localStorage.removeItem(
        "refresh_token"
    );


    window.location.href =
        "index.html";

}


/* =====================================================
   SECURITY
===================================================== */

function escapeHtml(value){

    return value

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


function escapeJs(value){

    return value
        .replace(
            /\\/g,
            "\\\\"
        )
        .replace(
            /'/g,
            "\\'"
        );

}


/* =====================================================
   ENTER KEY
===================================================== */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter" &&
            document.activeElement.tagName
            !== "BUTTON"
        ){

            saveItem();

        }

    }
);

</script>
