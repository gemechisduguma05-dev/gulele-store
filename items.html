<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AAFDRMC - Items</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5efe8;
    color:#3e2723;
}

.header{
    background:#5d4037;
    color:white;
    padding:16px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    flex-wrap:wrap;
    box-shadow:0 3px 10px rgba(0,0,0,.18);
}

.header-left{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo{
    width:52px;
    height:52px;
    border-radius:50%;
    object-fit:cover;
    background:white;
    border:3px solid #d7ccc8;
}

.title{
    font-size:21px;
    font-weight:bold;
}

.branch-name{
    font-size:13px;
    opacity:.9;
    margin-top:4px;
}

.header-buttons{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

button{
    border:none;
    border-radius:8px;
    padding:10px 15px;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
}

.btn-menu{
    background:#efebe9;
    color:#4e342e;
}

.btn-logout{
    background:#8d6e63;
    color:white;
}

.container{
    max-width:1100px;
    margin:25px auto;
    padding:0 15px;
}

.card{
    background:white;
    border-radius:14px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 3px 12px rgba(62,39,35,.10);
}

.card h2{
    margin-top:0;
    color:#5d4037;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.field{
    display:flex;
    flex-direction:column;
}

.field label{
    font-weight:bold;
    margin-bottom:6px;
    font-size:14px;
}

input,select{
    width:100%;
    padding:12px;
    border:1px solid #d7ccc8;
    border-radius:8px;
    font-size:15px;
    outline:none;
}

input:focus,select:focus{
    border-color:#795548;
    box-shadow:0 0 0 2px rgba(121,85,72,.12);
}

.form-buttons{
    margin-top:18px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.btn-save{
    background:#6d4c41;
    color:white;
}

.btn-clear{
    background:#d7ccc8;
    color:#3e2723;
}

.message{
    margin-top:15px;
    padding:12px;
    border-radius:8px;
    display:none;
    font-weight:bold;
}

.message.success{
    display:block;
    background:#e8f5e9;
    color:#2e7d32;
}

.message.error{
    display:block;
    background:#ffebee;
    color:#c62828;
}

.table-wrap{
    width:100%;
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:650px;
}

th{
    background:#6d4c41;
    color:white;
    padding:12px;
    text-align:left;
}

td{
    padding:11px;
    border-bottom:1px solid #eee;
}

tr:hover{
    background:#faf7f4;
}

.badge{
    display:inline-block;
    padding:5px 9px;
    border-radius:15px;
    background:#efebe9;
    color:#5d4037;
    font-size:12px;
    font-weight:bold;
}

.action-btn{
    padding:7px 10px;
    margin:2px;
    font-size:12px;
}

.edit{
    background:#ffe0b2;
    color:#e65100;
}

.delete{
    background:#ffcdd2;
    color:#b71c1c;
}

.empty{
    text-align:center;
    padding:25px;
    color:#795548;
}

.loading{
    text-align:center;
    padding:20px;
    color:#795548;
}

.info{
    background:#fff8e1;
    border-left:4px solid #8d6e63;
    padding:12px;
    margin-bottom:18px;
    border-radius:6px;
    font-size:14px;
}

@media(max-width:700px){
    .header{
        align-items:flex-start;
    }

    .title{
        font-size:17px;
    }

    .logo{
        width:45px;
        height:45px;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .container{
        margin-top:15px;
    }

    .card{
        padding:15px;
    }

    button{
        width:100%;
    }

    .header-buttons{
        width:100%;
    }

    .header-buttons button{
        width:auto;
        flex:1;
    }
}
</style>
</head>

<body>

<header class="header">

    <div class="header-left">

        <!-- Logo -->
        <img
            src="AAFDRMC-logo.jpg"
            class="logo"
            alt="AAFDRMC Logo"
            onerror="this.style.display='none';"
        >

        <div>
            <div class="title">AAFDRMC - Item Management</div>
            <div class="branch-name" id="branchDisplay">
                Branch: Loading...
            </div>
        </div>

    </div>

    <div class="header-buttons">
        <button class="btn-menu" onclick="goDashboard()">
            ← Dashboard
        </button>

        <button class="btn-logout" onclick="logout()">
            Logout
        </button>
    </div>

</header>


<main class="container">

    <!-- ADD / EDIT ITEM -->
    <section class="card">

        <h2 id="formTitle">Add New Item</h2>

        <div class="info">
            Item ID database'n ofumaan uuma. As keessatti ID harkaan hin galchinu.
        </div>

        <div class="form-grid">

            <div class="field">
                <label>Item Name / Maqaa Meeshaa</label>
                <input
                    type="text"
                    id="itemName"
                    placeholder="Fakkeenya: Xaafii"
                >
            </div>

            <div class="field">
                <label>Category / Ramaddii</label>

                <select id="category">

                    <option value="">
                        -- Select Category --
                    </option>

                    <option value="Meeshaalee Nyaataa Tarsiimawaa">
                        Meeshaalee Nyaataa Tarsiimawaa
                    </option>

                    <option value="Meeshaalee Nyaataa Guyyaa Guyyaa">
                        Meeshaalee Nyaataa Guyyaa Guyyaa
                    </option>

                    <option value="Meeshaalee Nyaataa Hin Taane Guyyaa Guyyaa">
                        Meeshaalee Nyaataa Hin Taane Guyyaa Guyyaa
                    </option>

                    <option value="Meeshaalee Nyaataa Hin Taane Ittiin Nyaata Qopheessan">
                        Meeshaalee Nyaataa Hin Taane Ittiin Nyaata Qopheessan
                    </option>

                    <option value="Meeshaalee Qulqullinaa">
                        Meeshaalee Qulqullinaa
                    </option>

                    <option value="Meeshaa Ijaarsa Manaaf Oolu">
                        Meeshaa Ijaarsa Manaaf Oolu
                    </option>

                </select>

            </div>

        </div>

        <div class="form-buttons">

            <button
                class="btn-save"
                id="saveButton"
                onclick="saveItem()"
            >
                + Save Item
            </button>

            <button
                class="btn-clear"
                onclick="clearForm()"
            >
                Clear
            </button>

        </div>

        <div id="message" class="message"></div>

    </section>


    <!-- ITEMS LIST -->
    <section class="card">

        <h2>Items</h2>

        <div id="loading" class="loading">
            Loading items...
        </div>

        <div class="table-wrap">

            <table id="itemsTable" style="display:none;">

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Item Name</th>
                        <th>Category</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="itemsBody"></tbody>

            </table>

        </div>

        <div id="empty" class="empty" style="display:none;">
            No items found for this branch.
        </div>

    </section>

</main>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://sslabegtsxlkafuygmar.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_M6oxZjm6xF5NbrXkSO9JqA_7JGSucXq";


/* =====================================================
   LOCAL STORAGE
===================================================== */

let branchId =
    localStorage.getItem("selected_branch_id");

let branchName =
    localStorage.getItem("selected_branch_name");

let branchCode =
    localStorage.getItem("selected_branch_code");

let editingId = null;


/* =====================================================
   START
===================================================== */

document.addEventListener("DOMContentLoaded", function(){

    /*
       Login booda qofaan page kana seena.
       selected_branch_id yoo hin jirre,
       maqaa/code irraa branch ID barbaaduu yaalla.
    */

    if(localStorage.getItem("is_logged_in") !== "true"){
        window.location.href = "index.html";
        return;
    }

    document.getElementById("branchDisplay").textContent =
        "Branch: " + (branchName || "Main");

    loadItems();

});


/* =====================================================
   SUPABASE HEADERS
===================================================== */

function headers(extra = {}){

    return {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY,
        "Content-Type": "application/json",
        ...extra
    };

}


/* =====================================================
   SHOW MESSAGE
===================================================== */

function showMessage(text, type){

    const box =
        document.getElementById("message");

    box.textContent = text;

    box.className =
        "message " + type;

}


/* =====================================================
   CLEAR MESSAGE
===================================================== */

function clearMessage(){

    const box =
        document.getElementById("message");

    box.textContent = "";

    box.className = "message";

}


/* =====================================================
   FIND BRANCH ID
===================================================== */

async function findBranchId(){

    if(branchId){
        return branchId;
    }

    try{

        const response =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/branches?select=*",
                {
                    headers:headers()
                }
            );

        if(!response.ok){

            console.log(
                "Branch fetch error:",
                await response.text()
            );

            return null;
        }

        const branches =
            await response.json();

        if(!Array.isArray(branches)){
            return null;
        }


        /* Search by possible branch name columns */

        const wantedName =
            String(branchName || "")
            .trim()
            .toLowerCase();

        const wantedCode =
            String(branchCode || "")
            .trim()
            .toLowerCase();


        for(const b of branches){

            const possibleNames = [
                b.name,
                b.branch_name,
                b.branch,
                b.branchName,
                b.title,
                b.branch_title,
                b.office_name,
                b.office
            ];

            const possibleCodes = [
                b.code,
                b.branch_code,
                b.branchCode
            ];


            const foundName =
                possibleNames.some(v =>
                    v !== undefined &&
                    v !== null &&
                    String(v).trim().toLowerCase()
                    === wantedName
                );


            const foundCode =
                possibleCodes.some(v =>
                    v !== undefined &&
                    v !== null &&
                    String(v).trim().toLowerCase()
                    === wantedCode
                );


            if(foundName || foundCode){

                if(b.id !== undefined){

                    branchId =
                        String(b.id);

                    localStorage.setItem(
                        "selected_branch_id",
                        branchId
                    );

                    return branchId;
                }
            }

        }

    }catch(error){

        console.error(error);

    }

    return null;

}


/* =====================================================
   LOAD ITEMS
===================================================== */

async function loadItems(){

    const loading =
        document.getElementById("loading");

    const table =
        document.getElementById("itemsTable");

    const empty =
        document.getElementById("empty");

    loading.style.display = "block";
    table.style.display = "none";
    empty.style.display = "none";


    try{

        const id =
            await findBranchId();


        /*
           Branch ID hin argamne yoo ta'e,
           branch_code waliin yaalla.
        */

        let url =
            SUPABASE_URL +
            "/rest/v1/items?select=*";


        if(id){

            url +=
                "&branch_id=eq." +
                encodeURIComponent(id);

        }else if(branchCode){

            url +=
                "&branch_code=eq." +
                encodeURIComponent(branchCode);

        }else{

            showMessage(
                "Branch hin beekamne. Mee Login irra deebi'i.",
                "error"
            );

            loading.style.display = "none";
            return;
        }


        url += "&order=id.asc";


        const response =
            await fetch(
                url,
                {
                    method:"GET",
                    headers:headers()
                }
            );


        const text =
            await response.text();


        if(!response.ok){

            console.error(text);

            showMessage(
                "Items loading hin milkoofne: " + text,
                "error"
            );

            loading.style.display = "none";
            return;
        }


        const items =
            JSON.parse(text);


        renderItems(items);


    }catch(error){

        console.error(error);

        showMessage(
            "Rakkoo connection: " + error.message,
            "error"
        );

        loading.style.display = "none";
    }

}


/* =====================================================
   RENDER ITEMS
===================================================== */

function renderItems(items){

    const loading =
        document.getElementById("loading");

    const table =
        document.getElementById("itemsTable");

    const empty =
        document.getElementById("empty");

    const body =
        document.getElementById("itemsBody");


    loading.style.display = "none";

    body.innerHTML = "";


    if(!items || items.length === 0){

        table.style.display = "none";
        empty.style.display = "block";

        return;
    }


    table.style.display = "table";
    empty.style.display = "none";


    items.forEach(item => {

        const row =
            document.createElement("tr");


        const id =
            item.id ?? "";


        const name =
            item.name ?? "";


        const category =
            item.category ?? "";


        row.innerHTML = `

            <td>
                ${escapeHtml(String(id))}
            </td>

            <td>
                <strong>
                    ${escapeHtml(String(name))}
                </strong>
            </td>

            <td>
                <span class="badge">
                    ${escapeHtml(String(category))}
                </span>
            </td>

            <td>

                <button
                    class="action-btn edit"
                    onclick='editItem(${JSON.stringify(item)})'
                >
                    Edit
                </button>

                <button
                    class="action-btn delete"
                    onclick="deleteItem('${escapeJs(String(id))}')"
                >
                    Delete
                </button>

            </td>

        `;

        body.appendChild(row);

    });

}


/* =====================================================
   SAVE ITEM
===================================================== */

async function saveItem(){

    clearMessage();


    const name =
        document
        .getElementById("itemName")
        .value
        .trim();


    const category =
        document
        .getElementById("category")
        .value
        .trim();


    if(!name){

        showMessage(
            "Maqaa item galchi.",
            "error"
        );

        return;
    }


    if(!category){

        showMessage(
            "Category filadhu.",
            "error"
        );

        return;
    }


    const id =
        await findBranchId();


    if(!id && !branchCode){

        showMessage(
            "Branch ID ykn Branch Code hin argamne. Login irra deebi'i.",
            "error"
        );

        return;
    }


    const saveButton =
        document.getElementById("saveButton");

    saveButton.disabled = true;
    saveButton.textContent = "Saving...";


    try{

        /* =========================================
           EDIT
        ========================================= */

        if(editingId !== null){

            const data = {
                name:name,
                category:category
            };


            const response =
                await fetch(
                    SUPABASE_URL +
                    "/rest/v1/items?id=eq." +
                    encodeURIComponent(editingId),
                    {
                        method:"PATCH",
                        headers:headers({
                            "Prefer":"return=representation"
                        }),
                        body:JSON.stringify(data)
                    }
                );


            const text =
                await response.text();


            if(!response.ok){

                throw new Error(text);
            }


            showMessage(
                "Item sirriitti fooyya'e.",
                "success"
            );


            clearForm();

            await loadItems();

            return;
        }


        /* =========================================
           NEW ITEM
        ========================================= */

        /*
           ID hin erginu.
           Database'n ofumaan ID uuma.
        */

        const data = {
            name:name,
            category:category,
            branch_id:id || null,
            branch_code:branchCode || null
        };


        const response =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/items",
                {
                    method:"POST",

                    headers:headers({
                        "Prefer":
                        "return=representation"
                    }),

                    body:JSON.stringify(data)
                }
            );


        const text =
            await response.text();


        if(!response.ok){

            throw new Error(text);
        }


        showMessage(
            "Item haaraan sirriitti galmaa'e.",
            "success"
        );


        clearForm();

        await loadItems();


    }catch(error){

        console.error(error);

        showMessage(
            "Save hin milkoofne: " +
            error.message,
            "error"
        );

    }finally{

        saveButton.disabled = false;

        saveButton.textContent =
            editingId !== null
            ? "Update Item"
            : "+ Save Item";
    }

}


/* =====================================================
   EDIT ITEM
===================================================== */

function editItem(item){

    editingId =
        item.id;


    document
    .getElementById("itemName")
    .value =
        item.name || "";


    document
    .getElementById("category")
    .value =
        item.category || "";


    document
    .getElementById("formTitle")
    .textContent =
        "Edit Item";


    document
    .getElementById("saveButton")
    .textContent =
        "Update Item";


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =====================================================
   DELETE ITEM
===================================================== */

async function deleteItem(id){

    if(!id){
        return;
    }


    const ok =
        confirm(
            "Item kana haqeeqaatti haquu barbaaddaa?"
        );


    if(!ok){
        return;
    }


    try{

        const response =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/items?id=eq." +
                encodeURIComponent(id),
                {
                    method:"DELETE",
                    headers:headers({
                        "Prefer":"return=minimal"
                    })
                }
            );


        const text =
            await response.text();


        if(!response.ok){

            throw new Error(text);
        }


        showMessage(
            "Item haqameera.",
            "success"
        );


        await loadItems();


    }catch(error){

        console.error(error);

        showMessage(
            "Delete hin milkoofne: " +
            error.message,
            "error"
        );

    }

}


/* =====================================================
   CLEAR FORM
===================================================== */

function clearForm(){

    editingId = null;


    document
    .getElementById("itemName")
    .value = "";


    document
    .getElementById("category")
    .value = "";


    document
    .getElementById("formTitle")
    .textContent =
        "Add New Item";


    document
    .getElementById("saveButton")
    .textContent =
        "+ Save Item";


    clearMessage();

}


/* =====================================================
   DASHBOARD
===================================================== */

function goDashboard(){

    window.location.href =
        "dashboard.html";

}


/* =====================================================
   LOGOUT
===================================================== */

function logout(){

    localStorage.removeItem("is_logged_in");
    localStorage.removeItem("user_role");
    localStorage.removeItem("login_user");
    localStorage.removeItem("access_token");
    localStorage.removeItem("refresh_token");

    window.location.href =
        "index.html";

}


/* =====================================================
   HTML SECURITY
===================================================== */

function escapeHtml(value){

    return value
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function escapeJs(value){

    return value
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'");
}


/* =====================================================
   ENTER KEY
===================================================== */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter" &&
            document.activeElement.tagName !== "BUTTON"
        ){

            saveItem();

        }

    }
);

</script>

</body>
</html>
