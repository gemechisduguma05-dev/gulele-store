<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AAFDRMC - Emergency Relief Management</title>

<style>
*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  color:#263238;
  min-height:100vh;
  background:linear-gradient(135deg,#ffe4ec,#ffd1dc,#fff0f4);
}

header{
  background:linear-gradient(135deg,#ad1457,#d81b60,#ec407a);
  color:white;
  padding:18px 16px;
  box-shadow:0 4px 14px rgba(0,0,0,.18);
}

.header-inner{
  max-width:1200px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.brand h1{
  margin:0;
  font-size:23px;
}

.brand p{
  margin:5px 0 0;
  font-size:13px;
  opacity:.9;
}

.user-box{
  text-align:right;
  font-size:13px;
  line-height:1.5;
}

.user-name{
  font-weight:bold;
  font-size:14px;
}

main{
  max-width:1200px;
  margin:auto;
  padding:18px;
}

.status-bar{
  background:white;
  border-radius:12px;
  padding:12px 15px;
  margin-bottom:15px;
  box-shadow:0 3px 10px rgba(0,0,0,.08);
  display:flex;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
  font-size:13px;
}

.status-ok{
  color:#087f5b;
  font-weight:bold;
}

.status-error{
  color:#c62828;
  font-weight:bold;
}

.summary{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-bottom:18px;
}

.summary-card{
  background:white;
  border-radius:15px;
  padding:16px;
  text-align:center;
  box-shadow:0 3px 12px rgba(0,0,0,.09);
}

.summary-card strong{
  display:block;
  font-size:27px;
  color:#ad1457;
}

.summary-card span{
  font-size:13px;
  color:#607d8b;
}

.toolbar{
  background:white;
  border-radius:15px;
  padding:14px;
  margin-bottom:15px;
  box-shadow:0 3px 12px rgba(0,0,0,.09);
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.toolbar input{
  flex:1;
  min-width:220px;
}

button{
  border:0;
  border-radius:9px;
  padding:11px 15px;
  cursor:pointer;
  font-weight:bold;
}

.btn-primary{
  background:#ad1457;
  color:white;
}

.btn-secondary{
  background:#f8bbd0;
  color:#880e4f;
}

.btn-success{
  background:#2e7d32;
  color:white;
}

.btn-danger{
  background:#c62828;
  color:white;
}

.btn-dark{
  background:#37474f;
  color:white;
}

button:hover{
  opacity:.9;
}

.section{
  background:white;
  border-radius:16px;
  padding:18px;
  margin-bottom:18px;
  box-shadow:0 3px 12px rgba(0,0,0,.09);
}

.section h2{
  margin-top:0;
  color:#880e4f;
  font-size:19px;
}

.folder-list{
  display:flex;
  flex-direction:column;
  gap:9px;
}

.folder{
  background:#fff5f8;
  border:1px solid #f8bbd0;
  border-radius:11px;
  padding:14px;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:10px;
  transition:.2s;
}

.folder:hover{
  background:#fce4ec;
  transform:translateY(-1px);
}

.folder-icon{
  font-size:23px;
}

.folder-name{
  font-weight:bold;
  color:#880e4f;
}

.empty{
  text-align:center;
  padding:25px;
  color:#78909c;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:13px;
}

.form-group{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.form-group.full{
  grid-column:1/-1;
}

label{
  font-size:13px;
  font-weight:bold;
  color:#455a64;
}

input,
select,
textarea{
  width:100%;
  padding:11px;
  border:1px solid #cfd8dc;
  border-radius:8px;
  font:inherit;
  background:white;
}

textarea{
  min-height:80px;
  resize:vertical;
}

input:focus,
select:focus,
textarea:focus{
  outline:none;
  border-color:#ec407a;
  box-shadow:0 0 0 2px rgba(236,64,122,.12);
}

.member-row,
.document-row,
.relief-item-row{
  border:1px solid #f3c0d0;
  background:#fff8fa;
  border-radius:12px;
  padding:12px;
  margin-bottom:10px;
}

.row-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.row-grid.three{
  grid-template-columns:repeat(3,1fr);
}

.row-grid.four{
  grid-template-columns:repeat(4,1fr);
}

.row-actions{
  margin-top:10px;
  display:flex;
  justify-content:flex-end;
}

.readonly{
  background:#eceff1;
}

.stock-info{
  margin-top:7px;
  padding:8px;
  border-radius:7px;
  background:#e8f5e9;
  color:#2e7d32;
  font-size:12px;
  font-weight:bold;
}

.no-stock{
  background:#ffebee;
  color:#c62828;
}

.modal{
  display:none;
  position:fixed;
  z-index:1000;
  inset:0;
  background:rgba(0,0,0,.55);
  padding:15px;
  overflow:auto;
}

.modal-box{
  max-width:950px;
  margin:20px auto;
  background:white;
  border-radius:17px;
  overflow:hidden;
  box-shadow:0 10px 35px rgba(0,0,0,.3);
}

.modal-header{
  background:linear-gradient(135deg,#ad1457,#ec407a);
  color:white;
  padding:16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.modal-header h2{
  margin:0;
  font-size:19px;
}

.close{
  background:white;
  color:#ad1457;
  border-radius:50%;
  width:36px;
  height:36px;
  padding:0;
  font-size:20px;
}

.modal-body{
  padding:18px;
}

.info-card{
  border:1px solid #f3c0d0;
  background:#fff8fa;
  border-radius:12px;
  padding:13px;
  margin-bottom:14px;
}

.info-card h3{
  margin:0 0 10px;
  color:#880e4f;
  font-size:16px;
}

.info-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:9px;
}

.info-item{
  background:white;
  padding:9px;
  border-radius:7px;
}

.info-item small{
  display:block;
  color:#78909c;
  font-size:11px;
}

.info-item strong{
  display:block;
  margin-top:3px;
  word-break:break-word;
}

.member-card,
.relief-card,
.document-card{
  background:white;
  border:1px solid #eeeeee;
  border-radius:9px;
  padding:10px;
  margin-bottom:8px;
}

.relief-item{
  padding:7px 9px;
  background:#f5f5f5;
  border-radius:7px;
  margin-top:5px;
  font-size:13px;
}

.loading{
  text-align:center;
  padding:20px;
  color:#78909c;
}

.hidden{
  display:none!important;
}

@media(max-width:800px){
  .summary{
    grid-template-columns:repeat(2,1fr);
  }

  .form-grid,
  .info-grid,
  .row-grid,
  .row-grid.three,
  .row-grid.four{
    grid-template-columns:1fr;
  }

  .header-inner{
    align-items:flex-start;
    flex-direction:column;
  }

  .user-box{
    text-align:left;
  }
}

@media(max-width:480px){
  main{
    padding:10px;
  }

  .summary{
    gap:8px;
  }

  .summary-card{
    padding:12px 7px;
  }

  .summary-card strong{
    font-size:22px;
  }

  .toolbar{
    padding:10px;
  }

  .toolbar button{
    width:100%;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">

    <div class="brand">
      <h1>AAFDRMC</h1>
      <p>Emergency Relief Management</p>
    </div>

    <div class="user-box">
      <div class="user-name" id="userProfile">User loading...</div>
      <div id="branchInfo">Branch loading...</div>
    </div>

  </div>
</header>

<main>

  <div class="status-bar">
    <div id="statusText">Connecting...</div>
    <div id="lastUpdated"></div>
  </div>

  <div class="summary">

    <div class="summary-card">
      <strong id="householdCount">0</strong>
      <span>Households</span>
    </div>

    <div class="summary-card">
      <strong id="memberCount">0</strong>
      <span>Members</span>
    </div>

    <div class="summary-card">
      <strong id="reliefCount">0</strong>
      <span>Reliefs</span>
    </div>

    <div class="summary-card">
      <strong id="documentCount">0</strong>
      <span>Documents</span>
    </div>

  </div>

  <div class="toolbar">

    <input
      id="searchInput"
      type="search"
      placeholder="Household, member or 16-digit FAN"
      oninput="filterHouseholds()"
    >

    <button
      class="btn-primary"
      onclick="openHouseholdForm()"
    >
      + New Household
    </button>

    <button
      class="btn-success"
      onclick="openReliefForm()"
    >
      + Individual Relief
    </button>

    <button
      class="btn-secondary"
      onclick="refreshAll()"
    >
      ↻ Refresh
    </button>

  </div>

  <div class="section">

    <h2>Household Folders</h2>

    <div id="householdList" class="folder-list">
      <div class="loading">Loading households...</div>
    </div>

  </div>

  <!-- HOUSEHOLD FORM -->

  <div id="householdSection" class="section hidden">

    <h2>New Household</h2>

    <form id="householdForm" onsubmit="saveHousehold(event)">

      <div class="form-grid">

        <div class="form-group">
          <label>Representative / Household Name *</label>
          <input id="householdName" required>
        </div>

        <div class="form-group">
          <label>Disaster Type *</label>
          <select id="disasterType" required>
            <option value="">Select</option>
            <option>Flood</option>
            <option>Fire</option>
            <option>Drought</option>
            <option>Landslide</option>
            <option>Conflict</option>
            <option>Other</option>
          </select>
        </div>

        <div class="form-group">
          <label>Disaster Date *</label>
          <input id="disasterDate" type="date" required>
        </div>

        <div class="form-group">
          <label>City</label>
          <input id="city">
        </div>

        <div class="form-group">
          <label>Sub-City</label>
          <input id="subCity">
        </div>

        <div class="form-group">
          <label>Woreda</label>
          <input id="woreda">
        </div>

        <div class="form-group">
          <label>Specific Location</label>
          <input id="specificLocation">
        </div>

        <div class="form-group">
          <label>House Number</label>
          <input id="houseNumber">
        </div>

        <div class="form-group">
          <label>Household FAN Number</label>
          <input
            id="householdFan"
            inputmode="numeric"
            maxlength="16"
            minlength="16"
            placeholder="Optional - exactly 16 digits"
          >
        </div>

        <div class="form-group full">
          <label>Other Information</label>
          <textarea id="householdOther"></textarea>
        </div>

      </div>

      <hr>

      <h3>Members</h3>

      <div id="membersContainer"></div>

      <button
        type="button"
        class="btn-secondary"
        onclick="addMemberRow()"
      >
        + Add Member
      </button>

      <hr>

      <h3>Documents</h3>

      <div id="documentsContainer"></div>

      <button
        type="button"
        class="btn-secondary"
        onclick="addDocumentRow()"
      >
        + Add Document
      </button>

      <div style="margin-top:18px;display:flex;gap:10px;flex-wrap:wrap">

        <button
          type="submit"
          class="btn-primary"
        >
          Save Household
        </button>

        <button
          type="button"
          class="btn-dark"
          onclick="closeHouseholdForm()"
        >
          Cancel
        </button>

      </div>

    </form>

  </div>


  <!-- RELIEF FORM -->

  <div id="reliefSection" class="section hidden">

    <h2>Individual Emergency Relief</h2>

    <form id="reliefForm" onsubmit="saveRelief(event)">

      <div class="form-grid">

        <div class="form-group">
          <label>Household *</label>
          <select
            id="reliefHousehold"
            required
            onchange="loadReliefMembers()"
          >
            <option value="">Select Household</option>
          </select>
        </div>

        <div class="form-group">
          <label>Member *</label>
          <select id="reliefMember" required>
            <option value="">Select Member</option>
          </select>
        </div>

        <div class="form-group">
          <label>Relief Date *</label>
          <input id="reliefDate" type="date" required>
        </div>

        <div class="form-group">
          <label>Issued By *</label>
          <input id="issuedBy" required>
        </div>

        <div class="form-group">
          <label>Signature *</label>
          <input id="reliefSignature" required>
        </div>

        <div class="form-group">
          <label>Model 22 *</label>
          <select id="model22" required onchange="toggleModel22Number()">
            <option value="">Select</option>
            <option value="NUMBER">Model 22 Number</option>
          </select>
        </div>

        <div
          class="form-group"
          id="model22NumberGroup"
        >
          <label>Model 22 Number / Code *</label>
          <input id="model22Number">
        </div>

        <div class="form-group full">
          <label>Other Information</label>
          <textarea id="reliefOther"></textarea>
        </div>

      </div>

      <hr>

      <h3>Relief Items</h3>

      <div id="reliefItemsContainer"></div>

      <button
        type="button"
        class="btn-secondary"
        onclick="addReliefItem()"
      >
        + Add Item
      </button>

      <div style="margin-top:18px;display:flex;gap:10px;flex-wrap:wrap">

        <button
          type="submit"
          class="btn-success"
        >
          Save Relief & Stock OUT
        </button>

        <button
          type="button"
          class="btn-dark"
          onclick="closeReliefForm()"
        >
          Cancel
        </button>

      </div>

    </form>

  </div>

</main>


<!-- HOUSEHOLD PROFILE MODAL -->

<div
  id="householdModal"
  class="modal"
  onclick="closeModalOutside(event)"
>

  <div class="modal-box">

    <div class="modal-header">

      <h2 id="modalTitle">Household Profile</h2>

      <button
        class="close"
        onclick="closeHouseholdModal()"
      >
        ×
      </button>

    </div>

    <div
      id="modalBody"
      class="modal-body"
    >
      <div class="loading">Loading...</div>
    </div>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://sslabegtsxlkafuygmar.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_G3Nv_yg4LaCiMtJMiadMxQ_f2fNHg5x";

const REST_URL =
  SUPABASE_URL + "/rest/v1";


/* =========================================================
   USER PROFILE
========================================================= */

let currentUser = null;
let currentRole = null;
let branchId = null;
let branchCode = null;
let branchName = null;

function getStoredValue(keys){

  for(const key of keys){

    const value =
      localStorage.getItem(key);

    if(
      value !== null &&
      value !== undefined &&
      String(value).trim() !== ""
    ){
      return String(value).trim();
    }

  }

  return "";

}


function loadUserProfile(){

  /*
    IMPORTANT:
    User profile is restored from localStorage.
    Refreshing this page will NOT clear the profile.
  */

  currentUser =
    getStoredValue([
      "login_user",
      "username",
      "user_name",
      "email"
    ]);

  currentRole =
    getStoredValue([
      "user_role",
      "role"
    ]);

  branchId =
    getStoredValue([
      "selected_branch_uuid",
      "selected_branch_id"
    ]);

  branchCode =
    getStoredValue([
      "selected_branch_code",
      "branch_code"
    ]);

  branchName =
    getStoredValue([
      "selected_branch_name",
      "branch_name"
    ]);


  const profile =
    document.getElementById("userProfile");

  const branch =
    document.getElementById("branchInfo");


  if(currentUser){

    profile.textContent =
      currentUser +
      (currentRole
        ? " (" + currentRole + ")"
        : "");

  }else{

    profile.textContent =
      "User";

  }


  if(branchName || branchCode){

    branch.textContent =
      (branchName || "Branch") +
      (branchCode
        ? " • " + branchCode
        : "");

  }else{

    branch.textContent =
      "Branch not selected";

  }

}


function requireBranch(){

  if(!branchId){

    throw new Error(
      "Branch information is missing. Please return to Dashboard and select your branch."
    );

  }

}


/* =========================================================
   API
========================================================= */

async function apiRequest(
  table,
  options = {}
){

  const {
    method = "GET",
    query = "",
    body = null
  } = options;


  const headers = {

    "apikey":
      SUPABASE_KEY,

    "Authorization":
      "Bearer " + SUPABASE_KEY,

    "Content-Type":
      "application/json",

    "Prefer":
      method === "POST"
        ? "return=representation"
        : "return=minimal"

  };


  const response =
    await fetch(
      REST_URL +
      "/" +
      table +
      query,
      {
        method,
        headers,
        body:
          body === null
            ? undefined
            : JSON.stringify(body)
      }
    );


  const text =
    await response.text();


  let data = null;

  try{

    data =
      text
        ? JSON.parse(text)
        : null;

  }catch{

    data = text;

  }


  if(!response.ok){

    throw new Error(
      table +
      ": " +
      response.status +
      " " +
      (
        data?.message ||
        data?.error ||
        text ||
        "Request failed"
      )
    );

  }


  return data;

}


async function getTable(
  table,
  query = ""
){

  return await apiRequest(
    table,
    {
      method:"GET",
      query
    }
  );

}


async function insertTable(
  table,
  body
){

  return await apiRequest(
    table,
    {
      method:"POST",
      body
    }
  );

}


/* =========================================================
   DATA
========================================================= */

let householdsCache = [];
let itemsCache = [];
let stockBalanceCache = {};

let memberSearchCache = [];


/* =========================================================
   REFRESH
========================================================= */

async function refreshAll(){

  loadUserProfile();

  const status =
    document.getElementById("statusText");

  status.className = "";

  status.textContent =
    "Loading...";


  try{

    requireBranch();

    await Promise.all([
      loadHouseholds(),
      loadItems(),
      updateSummary()
    ]);


    status.textContent =
      "Connected • Data loaded";

    status.className =
      "status-ok";

    document.getElementById(
      "lastUpdated"
    ).textContent =
      "Updated: " +
      new Date().toLocaleString();


  }catch(error){

    console.error(error);

    status.textContent =
      error.message;

    status.className =
      "status-error";

  }

}


/* =========================================================
   HOUSEHOLDS
========================================================= */

async function loadHouseholds(){

  requireBranch();

  householdsCache =
    await getTable(
      "emergency_households",
      "?select=*" +
      "&branch_id=eq." +
      encodeURIComponent(branchId) +
      "&order=created_at.desc"
    );


  if(!Array.isArray(householdsCache)){

    householdsCache = [];

  }


  await loadMemberSearchCache();

  renderHouseholds(
    householdsCache
  );

}


async function loadMemberSearchCache(){

  try{

    memberSearchCache =
      await getTable(
        "emergency_members",
        "?select=household_id,full_name,fan_number"
      );

  }catch(error){

    console.warn(
      "Member search loading error:",
      error
    );

    memberSearchCache = [];

  }

}


function renderHouseholds(
  list
){

  const container =
    document.getElementById(
      "householdList"
    );


  if(!list.length){

    container.innerHTML =
      `
      <div class="empty">
        No household folders found.
      </div>
      `;

    return;

  }


  /*
    IMPORTANT:
    Initially only the folder name is displayed.
    Full profile opens only when the folder is clicked.
  */

  container.innerHTML =
    list.map(h => {

      const name =
        escapeHtml(
          h.household_name ||
          h.representative_name ||
          "Unnamed Household"
        );


      return `
        <div
          class="folder"
          onclick="openHousehold('${h.id}')"
        >

          <span class="folder-icon">📁</span>

          <span class="folder-name">
            ${name}
          </span>

          <span style="margin-left:auto">
            ›
          </span>

        </div>
      `;

    }).join("");

}


async function filterHouseholds(){

  const search =
    document
      .getElementById("searchInput")
      .value
      .trim()
      .toLowerCase();


  if(!search){

    renderHouseholds(
      householdsCache
    );

    return;

  }


  const matchingHouseholdIds =
    new Set();


  memberSearchCache.forEach(member => {

    const fullName =
      String(
        member.full_name || ""
      ).toLowerCase();

    const fan =
      String(
        member.fan_number || ""
      ).toLowerCase();


    if(
      fullName.includes(search) ||
      fan.includes(search)
    ){

      matchingHouseholdIds.add(
        String(member.household_id)
      );

    }

  });


  const filtered =
    householdsCache.filter(h => {

      const name =
        String(
          h.household_name ||
          h.representative_name ||
          ""
        ).toLowerCase();

      const fan =
        String(
          h.fan_number ||
          h.household_fan_number ||
          ""
        ).toLowerCase();

      return (
        name.includes(search) ||
        fan.includes(search) ||
        matchingHouseholdIds.has(
          String(h.id)
        )
      );

    });

async function saveHousehold(event){

  event.preventDefault();


  try{

    requireBranch();


    const householdFan =
      document
        .getElementById("householdFan")
        .value
        .trim();


    if(
      householdFan &&
      !/^[0-9]{16}$/.test(
        householdFan
      )
    ){

      throw new Error(
        "Household FAN Number must contain exactly 16 digits."
      );

    }


    const memberRows =
      Array.from(
        document.querySelectorAll(
          ".member-row"
        )
      );


    if(!memberRows.length){

      throw new Error(
        "At least one household member is required."
      );

    }


    const members =
      memberRows.map(row => {

        const fan =
          row
            .querySelector(".member-fan")
            .value
            .trim();


        if(
          !/^[0-9]{16}$/.test(fan)
        ){

          throw new Error(
            "Every member FAN Number must contain exactly 16 digits."
          );

        }


        return {

          full_name:
            row
              .querySelector(".member-name")
              .value
              .trim(),

          relationship:
            row
              .querySelector(".member-relationship")
              .value,

          sex:
            row
              .querySelector(".member-sex")
              .value,

          age:
            Number(
              row
                .querySelector(".member-age")
                .value
            ),

          fan_number:
            fan,

          other_information:
            row
              .querySelector(".member-other")
              .value
              .trim() ||
            null

        };

      });


    const householdPayload = {

      household_name:
        document
          .getElementById("householdName")
          .value
          .trim(),

      disaster_type:
        document
          .getElementById("disasterType")
          .value,

      disaster_date:
        document
          .getElementById("disasterDate")
          .value,

      city:
        document
          .getElementById("city")
          .value
          .trim() ||
        null,

      sub_city:
        document
          .getElementById("subCity")
          .value
          .trim() ||
        null,

      woreda:
        document
          .getElementById("woreda")
          .value
          .trim() ||
        null,

      specific_location:
        document
          .getElementById("specificLocation")
          .value
          .trim() ||
        null,

      house_number:
        document
          .getElementById("houseNumber")
          .value
          .trim() ||
        null,

      fan_number:
        householdFan ||
        null,

      other_information:
        document
          .getElementById("householdOther")
          .value
          .trim() ||
        null,

      branch_id:
        branchId,

      branch_code:
        branchCode || null

    };


    const saved =
      await insertTable(
        "emergency_households",
        householdPayload
      );


    const household =
      Array.isArray(saved)
        ? saved[0]
        : saved;


    if(
      !household ||
      !household.id
    ){

      throw new Error(
        "Household was not returned after saving."
      );

    }


    /*
      Save members.
      FAN NUMBER IS INCLUDED.
    */

    for(const member of members){

      await insertTable(
        "emergency_members",
        {
          ...member,
          household_id:
            household.id
        }
      );

    }


    /*
      Save document metadata.
      Actual file storage can later be connected
      to Supabase Storage. file_name is preserved.
    */

    const documentRows =
      Array.from(
        document.querySelectorAll(
          ".document-row"
        )
      );


    for(
      const row of documentRows
    ){

      const fileInput =
        row.querySelector(
          ".document-file"
        );


      const fileName =
        fileInput &&
        fileInput.files &&
        fileInput.files.length
          ? fileInput.files[0].name
          : null;


      const hasData =
        row
          .querySelector(".document-number")
          .value
          .trim() ||
        row
          .querySelector(".document-date")
          .value ||
        row
          .querySelector(".document-name")
          .value
          .trim() ||
        fileName ||
        row
          .querySelector(".document-other")
          .value
          .trim();


      if(!hasData) continue;


      await insertTable(
        "emergency_documents",
        {

          household_id:
            household.id,

          document_number:
            row
              .querySelector(".document-number")
              .value
              .trim() ||
            null,

          document_date:
            row
              .querySelector(".document-date")
              .value ||
            null,

          document_name:
            row
              .querySelector(".document-name")
              .value
              .trim() ||
            null,

          file_name:
            fileName,

          other_information:
            row
              .querySelector(".document-other")
              .value
              .trim() ||
            null

        }
      );

    }


    alert(
      "Household saved successfully."
    );


    document
      .getElementById("householdForm")
      .reset();


    document.getElementById(
      "membersContainer"
    ).innerHTML = "";


    document.getElementById(
      "documentsContainer"
    ).innerHTML = "";


    closeHouseholdForm();


    await refreshAll();


    await openHousehold(
      household.id
    );


  }catch(error){

    console.error(
      "Household save error:",
      error
    );

    alert(
      "Save failed:\n" +
      error.message
    );

  }

}

async function loadItems(){

  requireBranch();


  try{

    /*
      Load all items.
    */

    const allItems =
      await getTable(
        "items",
        "?select=*"
      );


    /*
      Load ONLY stock transactions
      belonging to current branch.
    */

    const transactions =
      await getTable(
        "stock_transactions",
        "?select=id,item_id,transaction_type,quantity,branch_id,unit" +
        "&branch_id=eq." +
        encodeURIComponent(branchId)
      );


    stockBalanceCache = {};


    for(
      const transaction
      of (transactions || [])
    ){

      const itemId =
        String(
          transaction.item_id || ""
        );


      if(!itemId) continue;


      if(
        !stockBalanceCache[itemId]
      ){

        stockBalanceCache[itemId] = 0;

      }


      const quantity =
        Number(
          transaction.quantity || 0
        );


      const type =
        String(
          transaction.transaction_type ||
          ""
        )
        .trim()
        .toUpperCase();


      const isIn =
        type === "IN" ||
        type.includes("STOCK IN") ||
        type.includes("RECEIPT") ||
        type.includes("ENTRY") ||
        type.includes("RECEIVED") ||
        type.includes("RECEIVE");


      const isOut =
        type === "OUT" ||
        type.includes("STOCK OUT") ||
        type.includes("ISSUE") ||
        type.includes("ISSUED");


      if(isIn){

        stockBalanceCache[itemId] +=
          quantity;

      }else if(isOut){

        stockBalanceCache[itemId] -=
          quantity;

      }

    }


    /*
      VERY IMPORTANT:
      Relief item selector contains only
      items whose CURRENT branch stock is > 0.
    */

    itemsCache =
      (allItems || [])
        .map(item => {

          const itemId =
            String(
              item.id || ""
            );


          const balance =
            Number(
              stockBalanceCache[itemId] || 0
            );


          return {
            ...item,
            current_stock:
              Math.max(
                0,
                balance
              )
          };

        })
        .filter(
          item =>
            Number(
              item.current_stock
            ) > 0
        );


  }catch(error){

    console.error(
      "Items loading error:",
      error
    );

    itemsCache = [];

    throw error;

  }

}


async function getItemStockBalance(
  itemId
){

  requireBranch();


  const key =
    String(itemId);


  if(
    Object.prototype.hasOwnProperty.call(
      stockBalanceCache,
      key
    )
  ){

    return Number(
      stockBalanceCache[key] || 0
    );

  }


  const transactions =
    await getTable(
      "stock_transactions",
      "?select=transaction_type,quantity,item_id,branch_id" +
      "&branch_id=eq." +
      encodeURIComponent(branchId) +
      "&item_id=eq." +
      encodeURIComponent(itemId)
    );


  let balance = 0;


  for(
    const transaction
    of (transactions || [])
  ){

    const type =
      String(
        transaction.transaction_type ||
        ""
      )
      .trim()
      .toUpperCase();


    const quantity =
      Number(
        transaction.quantity || 0
      );


    const isIn =
      type === "IN" ||
      type.includes("STOCK IN") ||
      type.includes("RECEIPT") ||
      type.includes("ENTRY") ||
      type.includes("RECEIVED") ||
      type.includes("RECEIVE");


    const isOut =
      type === "OUT" ||
      type.includes("STOCK OUT") ||
      type.includes("ISSUE") ||
      type.includes("ISSUED");


    if(isIn){

      balance += quantity;

    }else if(isOut){

      balance -= quantity;

    }

  }


  balance =
    Math.max(
      0,
      balance
    );


  stockBalanceCache[key] =
    balance;


  return balance;

}

function updateReliefItemInfo(
  select
){

  const row =
    select.closest(
      ".relief-item-row"
    );


  const option =
    select.options[
      select.selectedIndex
    ];


  const category =
    row.querySelector(
      ".relief-item-category"
    );


  const unit =
    row.querySelector(
      ".relief-item-unit"
    );


  const quantity =
    row.querySelector(
      ".relief-item-quantity"
    );


  const stockInfo =
    row.querySelector(
      ".stock-info"
    );


  if(
    !option ||
    !select.value
  ){

    category.value = "";
    unit.value = "";
    quantity.value = "";

    quantity.removeAttribute(
      "max"
    );


    stockInfo.textContent =
      "Select an item to see available stock.";

    stockInfo.className =
      "stock-info";

    return;

  }


  const stock =
    Number(
      option.dataset.stock || 0
    );


  category.value =
    option.dataset.category ||
    "";


  unit.value =
    option.dataset.unit ||
    "";


  quantity.max =
    stock;


  quantity.placeholder =
    "Max " + stock;


  stockInfo.textContent =
    "Available Stock: " +
    stock +
    (
      option.dataset.unit
        ? " " + option.dataset.unit
        : ""
    );


  stockInfo.className =
    stock > 0
      ? "stock-info"
      : "stock-info no-stock";

}


function validateReliefQuantity(
  input
){

  const row =
    input.closest(
      ".relief-item-row"
    );


  const select =
    row.querySelector(
      ".relief-item-select"
    );


  const option =
    select.options[
      select.selectedIndex
    ];


  if(
    !option ||
    !select.value
  ){

    return;

  }


  const stock =
    Number(
      option.dataset.stock || 0
    );


  const quantity =
    Number(
      input.value || 0
    );


  const stockInfo =
    row.querySelector(
      ".stock-info"
    );


  if(quantity > stock){

    stockInfo.textContent =
      "Quantity cannot exceed available stock: " +
      stock;


    stockInfo.className =
      "stock-info no-stock";


  }else{

    stockInfo.textContent =
      "Available Stock: " +
      stock;


    stockInfo.className =
      "stock-info";

  }

}

      );

    }


    if(!memberId){

      throw new Error(
        "Please select a member."
      );

    }


    if(!reliefDate){

      throw new Error(
        "Please enter relief date."
      );

    }


    if(!issuedBy){

      throw new Error(
        "Issued By is required."
      );

    }


    if(!signature){

      throw new Error(
        "Signature is required."
      );

    }


    if(model22 !== "NUMBER"){

      throw new Error(
        "Model 22 is required for Stock OUT."
      );

    }


    if(!model22Number){

      throw new Error(
        "Model 22 Number / Code is required."
      );

    }


    const rows =
      Array.from(
        document.querySelectorAll(
          ".relief-item-row"
        )
      );


    if(!rows.length){

      throw new Error(
        "At least one relief item is required."
      );

    }


    const reliefItems = [];


    for(
      const row of rows
    ){

      const select =
        row.querySelector(
          ".relief-item-select"
        );


      const quantityInput =
        row.querySelector(
          ".relief-item-quantity"
        );


      const itemId =
        select.value;


      const quantity =
        Number(
          quantityInput.value
        );


      if(!itemId){

        throw new Error(
          "Please select an item."
        );

      }


      if(
        !quantity ||
        quantity <= 0
      ){

        throw new Error(
          "Relief quantity must be greater than zero."
        );

      }


      const item =
        itemsCache.find(
          x =>
            String(x.id) ===
            String(itemId)
        );


      if(!item){

        throw new Error(
          "Selected item was not found in available stock."
        );

      }


      const currentBalance =
        await getItemStockBalance(
          itemId
        );


      if(currentBalance <= 0){

        throw new Error(
          (
            item.item_name ||
            item.name ||
            "Item"
          ) +
          " has no available stock."
        );

      }


      if(
        currentBalance <
        quantity
      ){

        throw new Error(
          (
            item.item_name ||
            item.name ||
            "Item"
          ) +
          " available stock is " +
          currentBalance +
          ", but requested quantity is " +
          quantity +
          "."
        );

      }


      reliefItems.push({

        item_id:
          item.id,

        item_name:
          item.item_name ||
          item.name ||
          item.item ||
          "Unnamed Item",

        category:
          item.category ||
          null,

        quantity:
          quantity,

        unit:
          item.unit ||
          null

      });

    }


    /*
      Create emergency relief master record.
      Model 22 is stored for compliance,
      but NOT displayed in household profile.
    */

    const reliefPayload = {

      household_id:
        householdId,

      member_id:
        memberId,

      relief_date:
        reliefDate,

      issued_by:
        issuedBy,

      signature:
        signature,

      model_22:
        model22,

      model_22_number:
        model22Number,

      created_at:
        new Date().toISOString(),

      other_information:
        document
          .getElementById(
            "reliefOther"
          )
          .value
          .trim() ||
        null

    };


    const savedRelief =
      await insertTable(
        "emergency_reliefs",
        reliefPayload
      );


    const relief =
      Array.isArray(savedRelief)
        ? savedRelief[0]
        : savedRelief;


    if(
      !relief ||
      !relief.id
    ){

      throw new Error(
        "Relief record was not returned after saving."
      );

    }


    /*
      Save relief item details.
    */

    for(
      const item of reliefItems
    ){

      await insertTable(
        "emergency_relief_items",
        {

          relief_id:
            relief.id,

          item_id:
            item.item_id,

          item_name:
            item.item_name,

          category:
            item.category,

          quantity:
            item.quantity,

          unit:
            item.unit,

          created_at:
            new Date().toISOString()

        }
      );

    }


    /*
      AUTOMATIC STOCK OUT
      Model 22 is recorded in transaction field
      so Stock Report can show it.
    */

    for(
      const item of reliefItems
    ){

      await insertTable(
        "stock_transactions",
        {

          transaction_type:
            "OUT",

          quantity:
            item.quantity,

          entered_by:
            null,

          entered_at:
            new Date().toISOString(),

          expiry_date:
            null,

          category:
            item.category,

          issued_by:
            issuedBy,

          signature:
            signature,

          unit:
            item.unit,

          transaction:
            "Emergency Relief - Model 22 - " +
            model22Number,

          branch_id:
            branchId,

          branch_code:
            branchCode || null,

          item_id:
            item.item_id

        }
      );

    }


    alert(
      "Emergency Relief saved successfully.\nStock OUT was also recorded using Model 22."
    );


    document
      .getElementById(
        "reliefForm"
      )
      .reset();


    document.getElementById(
      "reliefItemsContainer"
    ).innerHTML = "";


    document.getElementById(
      "reliefMember"
    ).innerHTML =
      `
      <option value="">
        Select Member
      </option>
      `;


    closeReliefForm();


    await refreshAll();


    /*
      Open household profile after save.
      Model 22 is intentionally NOT shown there.
    */

    await openHousehold(
      householdId
    );


  }catch(error){

    console.error(
      "Relief save error:",
      error
    );


    alert(
      "Relief save failed:\n" +
      error.message
    );

  }

}


/* =========================================================
   HOUSEHOLD PROFILE MODAL
========================================================= */

async function openHousehold(
  householdId
){

  const modal =
    document.getElementById(
      "householdModal"
    );


  const body =
    document.getElementById(
      "modalBody"
    );


  modal.style.display =
    "block";


  body.innerHTML =
    `
    <div class="loading">
      Loading household profile...
    </div>
    `;


  try{

    const household =
      householdsCache.find(
        h =>
          String(h.id) ===
          String(householdId)
      );


    if(!household){

      throw new Error(
        "Household not found."
      );

    }


    document.getElementById(
      "modalTitle"
    ).textContent =
      household.household_name ||
      household.representative_name ||
      "Household Profile";


    const members =
      await getTable(
        "emergency_members",
        "?select=*" +
        "&household_id=eq." +
        encodeURIComponent(
          householdId
        ) +
        "&order=full_name.asc"
      );


    const documents =
      await getTable(
        "emergency_documents",
        "?select=*" +
        "&household_id=eq." +
        encodeURIComponent(
          householdId
        ) +
        "&order=created_at.desc"
      );


    const reliefs =
      await getTable(
        "emergency_reliefs",
        "?select=*" +
        "&household_id=eq." +
        encodeURIComponent(
          householdId
        ) +
        "&order=created_at.desc"
      );


    let reliefItems = [];


    if(reliefs.length){

      const reliefIds =
        "(" +
        reliefs
          .map(r => `"${r.id}"`)
          .join(",") +
        ")";


      reliefItems =
        await getTable(
          "emergency_relief_items",
          "?select=*" +
          "&relief_id=in." +
          encodeURIComponent(
            reliefIds
          )
        );

    }


    let html = "";


    /* HOUSEHOLD INFORMATION */

    html += `

      <div class="info-card">

        <h3>Household Information</h3>

        <div class="info-grid">

          ${info(
            "Representative / Household",
            household.household_name ||
            household.representative_name
          )}

          ${info(
            "Disaster Type",
            household.disaster_type
          )}

          ${info(
            "Disaster Date",
            household.disaster_date
          )}

          ${info(
            "City",
            household.city
          )}

          ${info(
            "Sub-City",
            household.sub_city
          )}

          ${info(
            "Woreda",
            household.woreda
          )}

          ${info(
            "Specific Location",
            household.specific_location
          )}

          ${info(
            "House Number",
            household.house_number
          )}

          ${info(
            "Household FAN",
            household.fan_number ||
            household.household_fan_number
          )}

          ${info(
            "Other Information",
            household.other_information
          )}

        </div>

      </div>

    `;


    /* MEMBERS */

    html += `

      <div class="info-card">

        <h3>
          Members (${members.length})
        </h3>

    `;


    if(!members.length){

      html +=
        `<div class="empty">
          No members found.
        </div>`;

    }else{

      members.forEach(
        member => {

          html += `

            <div class="member-card">

              <div class="info-grid">

                ${info(
                  "Full Name",
                  member.full_name
                )}

                ${info(
                  "Relationship",
                  member.relationship
                )}

                ${info(
                  "Sex",
                  member.sex
                )}

                ${info(
                  "Age",
                  member.age
                )}

                ${info(
                  "FAN Number",
                  member.fan_number
                )}

                ${info(
                  "Other Information",
                  member.other_information
                )}

              </div>

            </div>

          `;

        }
      );

    }


    html +=
      `</div>`;


    /* RELIEFS */

    html += `

      <div class="info-card">

        <h3>
          Individual Relief (${reliefs.length})
        </h3>

    `;


    if(!reliefs.length){

      html +=
        `<div class="empty">
          No relief records found.
        </div>`;

    }else{

      reliefs.forEach(
        relief => {

          const member =
            members.find(
              m =>
                String(m.id) ===
                String(
                  relief.member_id
                )
            );


          const relatedItems =
            reliefItems.filter(
              item =>
                String(
                  item.relief_id
                ) ===
                String(relief.id)
            );


          html += `

            <div class="relief-card">

              <div class="info-grid">

                ${info(
                  "Member",
                  member
                    ? member.full_name
                    : relief.member_id
                )}

                ${info(
                  "Relief Date",
                  relief.relief_date
                )}

                ${info(
                  "Issued By",
                  relief.issued_by
                )}

                ${info(
                  "Signature",
                  relief.signature
                )}

                ${info(
                  "Other Information",
                  relief.other_information
                )}

              </div>

              ${
                relatedItems.length
                  ? `
                    <div style="margin-top:10px">
                      <strong>Relief Items</strong>

                      ${relatedItems.map(
                        item => `
                          <div class="relief-item">

                            ${escapeHtml(
                              item.item_name ||
                              "Item"
                            )}

                            —
                            ${Number(
                              item.quantity || 0
                            )}

                            ${
                              item.unit
                                ? escapeHtml(
                                    " " +
                                    item.unit
                                  )
                                : ""
                            }

                            ${
                              item.category
                                ? " • " +
                                  escapeHtml(
                                    item.category
                                  )
                                : ""
                            }

                          </div>
                        `
                      ).join("")}

                    </div>
                  `
                  : ""
              }

            </div>

          `;

        }
      );

    }


    html +=
      `</div>`;


    /* DOCUMENTS */

    html += `

      <div class="info-card">

        <h3>
          Documents (${documents.length})
        </h3>

    `;


    if(!documents.length){

      html +=
        `<div class="empty">
          No documents found.
        </div>`;

    }else{

      documents.forEach(
        documentRecord => {

          html += `

            <div class="document-card">

              <div class="info-grid">

                ${info(
                  "Document Number",
                  documentRecord.document_number
                )}

                ${info(
                  "Document Date",
                  documentRecord.document_date
                )}

                ${info(
                  "Document Name",
                  documentRecord.document_name
                )}

                ${info(
                  "File",
                  documentRecord.file_name
                )}

                ${info(
                  "Other Information",
                  documentRecord.other_information
                )}

              </div>

            </div>

          `;

        }
      );

    }


    html +=
      `</div>`;


    body.innerHTML =
      html;


  }catch(error){

    console.error(error);

    body.innerHTML =
      `
      <div class="empty">
        Could not load profile.<br><br>
        ${escapeHtml(
          error.message
        )}
      </div>
      `;

  }

}


/*
  Model 22 is deliberately NOT rendered
  in the household profile.
*/


function info(
  label,
  value
){

  const safeValue =
    value === null ||
    value === undefined ||
    value === ""
      ? "-"
      : escapeHtml(
          String(value)
        );


  return `
    <div class="info-item">

      <small>
        ${escapeHtml(label)}
      </small>

      <strong>
        ${safeValue}
      </strong>

    </div>
  `;

}


/* =========================================================
   MODAL
========================================================= */

function closeHouseholdModal(){

  document.getElementById(
    "householdModal"
  ).style.display =
    "none";

}


function closeModalOutside(
  event
){

  if(
    event.target ===
    document.getElementById(
      "householdModal"
    )
  ){

    closeHouseholdModal();

  }

}


/* =========================================================
   SECURITY / HTML ESCAPE
========================================================= */

function escapeHtml(
  value
){

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}

document.addEventListener(
  "DOMContentLoaded",
  async function(){

    /*
      Restore USER PROFILE FIRST.
      This is important so refresh does not
      make the page forget the logged-in user.
    */

    loadUserProfile();


    /*
      Set default relief date.
    */

    const reliefDate =
      document.getElementById(
        "reliefDate"
      );


    if(reliefDate){

      reliefDate.value =
        new Date()
          .toISOString()
          .split("T")[0];

    }


    /*
      Model 22 number starts hidden.
    */

    toggleModel22Number();


    /*
      Load application data.
    */

    try{

      await refreshAll();

    }catch(error){

      console.error(
        error
      );

    }

  }
);

</script>
