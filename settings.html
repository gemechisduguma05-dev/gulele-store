/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://sslabegtsxlkafuygmar.supabase.co";

const SUPABASE_KEY =
"sb_publishable_M6oxZjm6xF5NbrXkSO9JqA_7JGSucXq";


/* =========================
   CHECK LOGIN
========================= */

const accessToken =
  localStorage.getItem(
    "access_token"
  );


if (!accessToken) {

  window.location.href =
    "index.html";

}


/* =========================
   LOAD USER
========================= */

async function loadUser() {

  const token =
    localStorage.getItem(
      "access_token"
    );


  if (!token) {
    return;
  }


  const response =
    await fetch(
      SUPABASE_URL +
      "/auth/v1/user",
      {

        headers: {

          "apikey":
            SUPABASE_KEY,

          "Authorization":
            "Bearer " + token

        }

      }
    );


  if (!response.ok) {

    document.getElementById(
      "loginStatus"
    ).textContent =
      "Not verified";

    return;

  }


  const user =
    await response.json();


  document.getElementById(
    "loginStatus"
  ).textContent =
    "✅ Logged in";


  document.getElementById(
    "currentUser"
  ).textContent =
    user.email || "User";

}


/* =========================
   LOGOUT
========================= */

function logoutUser() {

  localStorage.removeItem(
    "access_token"
  );

  localStorage.removeItem(
    "refresh_token"
  );

  window.location.href =
    "index.html";

}


/* =========================
   START
========================= */

loadUser();

</script></body>
